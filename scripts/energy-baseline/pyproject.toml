[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-baseline"
version = "0.1.0"
description = "Reproducible energy measurement and baseline toolkit (ADR-0003)"
requires-python = ">=3.12"
dependencies = [
    "pyarrow",
    "duckdb",
    "scipy",
    "pyyaml",
    "httpx",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
energy-baseline = "energy_baseline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
