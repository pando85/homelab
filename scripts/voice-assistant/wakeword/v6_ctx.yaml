  "hoy vi": 1
  "y Kivi": 1
  "ve Kivi": 1
  "que Kivi": 1

# "Kivi" (or kiwi) in a sentence without a preceding "oye". `|` marks the split: head (ends at the word) | rest.
kivi_sentences:
