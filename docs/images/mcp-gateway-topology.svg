    <text x="470" y="856" font-size="23" font-weight="800" fill="#efecff">Admin agentgateway</text>
    <text x="470" y="884" font-size="17" fill="#bbb0e6">mcp.internal.grigri.cloud</text>
    <text x="470" y="907" font-size="14" fill="#e0bc85">Deployed · routes: [] · fail-closed</text>
    <path d="M850 872H943" stroke="#ba9c72" stroke-width="2.4" fill="none" stroke-dasharray="7 7"/>
    <circle cx="895" cy="872" r="13" fill="#302a2e" stroke="#d8a26c" stroke-width="1.5"/>
    <path d="M890 867l10 10m0-10l-10 10" stroke="#ffcb8d" stroke-width="2" stroke-linecap="round"/>
    <rect x="947" y="820" width="473" height="105" rx="17" fill="#262431" stroke="#a0805d" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="971" y="856" font-size="23" font-weight="800" fill="#f0e7dc">Vault MCP</text>
    <text x="971" y="886" font-size="16" fill="#d0b9a0">Deferred · no backend route or MCP pod</text>
    <rect x="1256" y="833" width="136" height="28" rx="14" fill="#4b3427" stroke="#a77a48"/>
    <text x="1324" y="852" text-anchor="middle" font-size="13" font-weight="750" fill="#ffce8c">NOT ENABLED</text>
    <text x="62" y="954" font-size="14" fill="#8293b1">Boundaries: Envoy ingress · OAuth2 scopes · network isolation · structured audit. Dashed links are not active traffic paths.</text>
  </g>
</svg>
