---
name: Readest Version Check

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
    paths:
      - 'apps/readest/values.yaml'
      - 'apps/readest/files/sql/**'
      - 'apps/readest/templates/**'
      - 'apps/readest/hack/**'
  pull_request:
    branches:
      - master
    paths:
      - 'apps/readest/values.yaml'
      - 'apps/readest/files/sql/**'
      - 'apps/readest/templates/**'
      - 'apps/readest/hack/**'

jobs:
  check-version:
    name: Check vendored SQL version matches image tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check version
        run: bash apps/readest/hack/check-sql-version.sh

  verify-upstream:
    name: Verify vendored SQL matches upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify checksum against upstream
        run: |
          set -euo pipefail
          SQL_DIR="apps/readest/files/sql"
          VERSION=$(tr -d '[:space:]' < "$SQL_DIR/VERSION")
          python3 apps/readest/hack/vendor-sql-migrations.py --check "$VERSION"
