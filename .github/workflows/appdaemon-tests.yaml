---
name: AppDaemon Tests

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
    paths:
      - 'apps/home-assistant/appdaemon/**'
      - '.github/workflows/appdaemon-tests.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'apps/home-assistant/appdaemon/**'
      - '.github/workflows/appdaemon-tests.yaml'

jobs:
  test:
    name: Run AppDaemon Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Python of the acockburn/appdaemon image; appdaemon needs < 3.14 (see renovate.json5).
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r apps/home-assistant/appdaemon/requirements_test.txt
          pip install pytz appdaemon

      - name: Run tests
        run: |
          cd apps/home-assistant/appdaemon/apps
          pytest tests/ -v
