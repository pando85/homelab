# NTP daemon selection lives in roles/ntp (see its defaults/main.yml). The
# ntp_daemon key that used to be here never took effect: geerlingguy.ntp sets it
# via include_vars, which outranks inventory host_vars.
ntp_config_file: /etc/ntpsec/ntp.conf
ntp_package: ntpsec
ntp_driftfile: /var/lib/ntpsec/ntp.drift

k3s_kubelet_extra_args:
  - kube-reserved=cpu=0.5,memory=1Gi,ephemeral-storage=1Gi
  - system-reserved=cpu=2,memory=10Gi,ephemeral-storage=1Gi
  - eviction-hard=memory.available<300Mi,nodefs.available<10%

zfs_arc_min_gb: 2
zfs_arc_max_gb: 5

l2arc_write_max_mb: 300
l2arc_write_boost_mb: 500

swap_file_size_mb: 16384

# Opt-in for the zfs-localpv node DaemonSet, which selects on this label instead of
# kubernetes.io/arch because k8s-amd64-1 is amd64 but has no ZFS pool. This label
# must exist before system/zfs-localpv/values.yaml is switched to it.
node_labels:
  storage.zfspv: "true"
