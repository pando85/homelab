- name: Remove k3s
  hosts: all
  tasks:
    - name: Refuse to run against the whole cluster without an explicit --limit
      assert:
        that:
          - ansible_limit is defined
        fail_msg: >-
          This playbook is destructive. Run it with --limit <host> (e.g.
          ANSIBLE_EXTRA_ARGS="--limit k8s-odroid-hc4-3" make uninstall-k3s)
          so it cannot accidentally wipe k3s from every node.
      run_once: true

    - name: Disable k3s
      systemd:
        name: k3s
        enabled: false
        state: stopped

    - name: Clean all running processes
      shell: |
        set -o pipefail
        if [ -e /sys/fs/cgroup/systemd/system.slice/k3s.service/cgroup.procs ]; then
          kill -9 `cat /sys/fs/cgroup/systemd/system.slice/k3s.service/cgroup.procs`
        fi
        umount `cat /proc/self/mounts | awk '{print $2}' | grep '^/run/k3s'`
        umount `cat /proc/self/mounts | awk '{print $2}' | grep '^/var/lib/rancher/k3s'`

    - name: Remove all directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/k3s.service
        - /usr/local/bin/k3s
        - /var/lib/rancher/k3s
        - /etc/rancher/k3s
        # cluster join token — leaving it behind lets a re-imaged host rejoin silently
        - /etc/rancher/node
