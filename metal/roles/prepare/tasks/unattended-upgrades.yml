---
- name: unattended-upgrades | Install basic packages
  apt:
    name: unattended-upgrades
    state: present
    force_apt_get: true
    update_cache: true

- name: unattended-upgrades | Config
  copy:
    src: "{{ item }}"
    dest: /etc/apt/apt.conf.d/{{ item }}
    mode: "0644"
  loop:
    - 20auto-upgrades
    - 50unattended-upgrades
    - 02-armbian-periodic
  notify:
    - unattended-upgrades | restart systemd service
    - unattended-upgrades | ignore armbian changes

- name: unattended-upgrades | Create apt daily upgrade timer override directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: unattended-upgrades | Configure apt daily upgrade window
  ansible.builtin.copy:
    src: apt-daily-upgrade-override.conf
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: unattended-upgrades | restart apt daily upgrade timer

- name: unattended-upgrades | Start systemd service
  systemd:
    name: unattended-upgrades
    enabled: true
    state: started
  notify: unattended-upgrades | restart systemd service
