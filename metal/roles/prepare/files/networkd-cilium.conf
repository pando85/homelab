# Managed by ansible: metal/roles/prepare/tasks/networkd.yml
#
# Cilium runs with routingMode: native and autoDirectNodeRoutes: true, so it
# installs routes to other nodes' pod CIDRs in the host routing table. By
# default systemd-networkd removes routes and routing policy rules it did
# not create whenever it (re)starts, which cuts the node's pod network.
[Network]
ManageForeignRoutes=no
ManageForeignRoutingPolicyRules=no
