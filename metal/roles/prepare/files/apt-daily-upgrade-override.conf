[Timer]
# Upgrade shortly before the kured reboot window (05:00-08:00 Europe/Madrid,
# system/kured/values.yaml) so kernel/libc updates and services deferred by
# needrestart are picked up by the kured reboot the same morning.
OnCalendar=
OnCalendar=Mon,Wed..Sun *-*-* 03:30:00
RandomizedDelaySec=30m
