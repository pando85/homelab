# Managed by ansible: metal/roles/prepare/tasks/unattended-upgrades.yml
#
# Defer (never auto-restart) services whose restart disrupts the node.
# Deferred services are listed under "Service restarts being deferred" and
# pick up new libraries at the next kured reboot.

# k3s: needrestart < 3.9 attributes outdated processes inside pods to
# k3s.service (their parent containerd-shim lives in its cgroup, see
# https://github.com/liske/needrestart/issues/317). KillMode=process keeps
# the shims alive across restarts, so the restart never clears the flag and
# unattended-upgrades restarted k3s after every package (22 times on
# 2026-10-02).
$nrconf{override_rc}->{qr(^k3s(-agent)?\.service$)} = 0;

# systemd-networkd: a restart flushes routes it did not create, including
# the Cilium native-routing routes to other nodes' pod CIDRs, cutting the
# node's pod network until Cilium reinstalls them.
$nrconf{override_rc}->{qr(^systemd-networkd\.service$)} = 0;

# systemd-resolved: a restart briefly drops node DNS.
$nrconf{override_rc}->{qr(^systemd-resolved\.service$)} = 0;
