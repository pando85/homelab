apiVersion: v1
data:
  calypso-observability.json: "{\n  \"annotations\": {\n    \"list\": [\n      {\n        \"builtIn\": 1,\n        \"datasource\": {\n          \"type\": \"grafana\",\n          \"uid\": \"-- Grafana --\"\n        },\n        \"enable\": true,\n        \"hide\": true,\n        \"iconColor\": \"rgba(0, 211, 255, 1)\",\n        \"name\": \"Annotations & Alerts\",\n        \"type\": \"dashboard\"\n      }\n    ]\n  },\n  \"description\": \"Calypso four-signals observability: metrics (RED from spanmetrics + app), traces, logs, and profiles. Cross-linked via datasource correlation config.\",\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"links\": [\n    {\n      \"title\": \"Pyroscope Profile Exploration\",\n      \"type\": \"link\",\n      \"url\": \"/d/pyroscope-profile-exploration\",\n      \"icon\": \"external link\",\n      \"tooltip\": \"Open the dedicated Pyroscope profile exploration dashboard\"\n    }\n  ],\n  \"panels\": [\n    {\n      \"collapsed\"\
    : false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"id\": 100,\n      \"title\": \"Metrics \\u2014 RED (Spanmetrics)\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"description\": \"Request rate (calls/sec) from Tempo spanmetrics. Exemplar dots (if present) link to the trace. Exemplars are emitted by the metrics-generator for histogram bucket series (traces_spanmetrics_latency_bucket), NOT for counter series (traces_spanmetrics_calls_total).\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisBorderShow\": false,\n            \"axisCenteredZero\": false,\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\"\
    : 5,\n            \"showPoints\": \"auto\",\n            \"spanNulls\": false\n          },\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 0,\n        \"y\": 1\n      },\n      \"id\": 1,\n      \"options\": {\n        \"exemplar\": {\n          \"color\": \"#FF9830\",\n          \"lineOpacity\": 0.3\n        },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (service) (rate(traces_spanmetrics_calls_total{service=~\\\"$service\\\"}[5m]))\",\n          \"legendFormat\": \"{{service}}\",\n          \"refId\": \"A\",\n          \"exemplar\"\
    : true\n        }\n      ],\n      \"title\": \"Request Rate\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"description\": \"Error rate (calls with STATUS_CODE_ERROR / total) from spanmetrics.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisBorderShow\": false,\n            \"axisCenteredZero\": false,\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\",\n            \"spanNulls\": false\n          },\n          \"unit\": \"percentunit\",\n          \"max\": 1\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 8,\n        \"y\": 1\n      },\n      \"id\"\
    : 2,\n      \"options\": {\n        \"exemplar\": {\n          \"color\": \"#FF9830\",\n          \"lineOpacity\": 0.3\n        },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (service) (rate(traces_spanmetrics_calls_total{service=~\\\"$service\\\",status_code=\\\"STATUS_CODE_ERROR\\\"}[5m])) / sum by (service) (rate(traces_spanmetrics_calls_total{service=~\\\"$service\\\"}[5m]))\",\n          \"legendFormat\": \"{{service}}\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        }\n      ],\n      \"title\": \"Error Rate\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\"\
    ,\n        \"uid\": \"prometheus\"\n      },\n      \"description\": \"Latency histogram (p50, p90, p99) from spanmetrics. Exemplar dots link to traces when available \\u2014 the metrics-generator emits exemplars for histogram bucket series (traces_spanmetrics_latency_bucket) but NOT for counter series.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisBorderShow\": false,\n            \"axisCenteredZero\": false,\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\",\n            \"spanNulls\": false\n          },\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 1\n      },\n      \"id\": 3,\n      \"options\": {\n    \
    \    \"exemplar\": {\n          \"color\": \"#FF9830\",\n          \"lineOpacity\": 0.3\n        },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.50, sum by (service, le) (rate(traces_spanmetrics_latency_bucket{service=~\\\"$service\\\"}[5m])))\",\n          \"legendFormat\": \"p50 {{service}}\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.90, sum by (service, le) (rate(traces_spanmetrics_latency_bucket{service=~\\\"$service\\\
    \"}[5m])))\",\n          \"legendFormat\": \"p90 {{service}}\",\n          \"refId\": \"B\",\n          \"exemplar\": true\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.99, sum by (service, le) (rate(traces_spanmetrics_latency_bucket{service=~\\\"$service\\\"}[5m])))\",\n          \"legendFormat\": \"p99 {{service}}\",\n          \"refId\": \"C\",\n          \"exemplar\": true\n        }\n      ],\n      \"title\": \"Latency (p50 / p90 / p99)\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 9\n      },\n      \"id\": 101,\n      \"title\": \"Metrics \\u2014 Calypso App (no exemplars: OTel Rust SDK has no exemplar reservoir)\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\"\
    ,\n        \"uid\": \"prometheus\"\n      },\n      \"description\": \"NOTE: App-level exemplars are NOT available \\u2014 the OTel Rust SDK does not implement an exemplar reservoir. These panels have no clickable exemplar dots. For trace correlation, use the spanmetrics panels above or the Traces row below.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisBorderShow\": false,\n            \"axisCenteredZero\": false,\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false\n          },\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 10\n      },\n      \"id\": 4,\n      \"options\"\
    : {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (service) (rate(calypso_control_plane_http_requests_total{service=~\\\"$service\\\"}[5m]))\",\n          \"legendFormat\": \"{{service}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Control Plane HTTP Request Rate\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"description\": \"Control plane HTTP latency histogram (p50, p90, p99). No exemplars available (Rust SDK limitation).\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\"\
    : {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisBorderShow\": false,\n            \"axisCenteredZero\": false,\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false\n          },\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 10\n      },\n      \"id\": 5,\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"\
    expr\": \"histogram_quantile(0.50, sum by (le) (rate(calypso_control_plane_http_request_duration_seconds_bucket{service=~\\\"$service\\\"}[5m])))\",\n          \"legendFormat\": \"p50\",\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.90, sum by (le) (rate(calypso_control_plane_http_request_duration_seconds_bucket{service=~\\\"$service\\\"}[5m])))\",\n          \"legendFormat\": \"p90\",\n          \"refId\": \"B\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(calypso_control_plane_http_request_duration_seconds_bucket{service=~\\\"$service\\\"}[5m])))\",\n          \"legendFormat\": \"p99\",\n          \"refId\": \"C\"\n        }\n      ],\n      \"title\": \"Control\
    \ Plane HTTP Latency (p50 / p90 / p99)\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 18\n      },\n      \"id\": 102,\n      \"title\": \"Traces\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"tempo\",\n        \"uid\": \"tempo\"\n      },\n      \"description\": \"TraceQL search by service. Uses resource.service.name (the OTel resource attribute). Click a trace to open the trace viewer.\",\n      \"gridPos\": {\n        \"h\": 10,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 19\n      },\n      \"id\": 6,\n      \"options\": {\n        \"search\": {\n          \"query\": \"{ resource.service.name =~ \\\"$service\\\" }\",\n          \"serviceMapInclude\": false\n        },\n        \"showTraceIds\": true\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"tempo\"\
    ,\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"search\",\n          \"query\": \"{ resource.service.name =~ \\\"$service\\\" }\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Trace Search (TraceQL)\",\n      \"type\": \"traces\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 29\n      },\n      \"id\": 103,\n      \"title\": \"Logs\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"description\": \"Logs filtered by namespace and container. Loki label mapping (measured 2026-10-10): OTel resource attribute k8s.namespace.name \\u2192 Loki label 'namespace', k8s.pod.name \\u2192 'pod', k8s.container.name \\u2192 'container'. The k8sattributes processor in the OTel Collector adds these attributes to spans, enabling Tempo's tracesToLogsV2 correlation. Only\
    \ control-plane emits JSON logs with trace_id; auth-proxy and git-proxy use text format without trace context.\",\n      \"gridPos\": {\n        \"h\": 12,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 30\n      },\n      \"id\": 7,\n      \"options\": {\n        \"dedupStrategy\": \"none\",\n        \"enableLogDetails\": true,\n        \"prettifyLogMessage\": false,\n        \"showCommonLabels\": false,\n        \"showLabels\": false,\n        \"showTime\": true,\n        \"sortOrder\": \"Descending\",\n        \"wrapLogMessage\": false\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"{namespace=\\\"$namespace\\\", container=~\\\"$container\\\"}\",\n          \"queryType\": \"range\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Logs (namespace=$namespace, container=$container)\",\n      \"type\": \"logs\"\n    },\n    {\n     \
    \ \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"description\": \"Pivot panel: shows logs for a specific trace_id. Set the trace_id variable above to filter. Only control-plane emits trace_id in JSON logs; auth-proxy and git-proxy use text format without trace context.\",\n      \"gridPos\": {\n        \"h\": 10,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 42\n      },\n      \"id\": 8,\n      \"options\": {\n        \"dedupStrategy\": \"none\",\n        \"enableLogDetails\": true,\n        \"prettifyLogMessage\": false,\n        \"showCommonLabels\": false,\n        \"showLabels\": false,\n        \"showTime\": true,\n        \"sortOrder\": \"Descending\",\n        \"wrapLogMessage\": false\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"{namespace=\\\"$namespace\\\"} |= \\\"$trace_id\\\"\",\n          \"\
    queryType\": \"range\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Logs by Trace ID ($trace_id)\",\n      \"type\": \"logs\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 52\n      },\n      \"id\": 104,\n      \"title\": \"Profiles\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"grafana-pyroscope-datasource\",\n        \"uid\": \"pyroscope\"\n      },\n      \"description\": \"CPU flame graph for the selected service. The service_name label maps from span service.name via tracesToProfiles config. After Alloy alignment (cb41d99a), Pyroscope service_name values are calypso-control-plane, calypso-auth-proxy, calypso-git-proxy \\u2014 matching OTel service.name exactly. Profile type: process_cpu:cpu:nanoseconds:cpu:nanoseconds (verified via Pyroscope connect API ProfileTypes endpoint).\",\n      \"fieldConfig\": {\n        \"defaults\"\
    : {},\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 16,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 53\n      },\n      \"id\": 9,\n      \"options\": {\n        \"flameGraph\": {\n          \"maxNodes\": 16384,\n          \"minWidth\": 0\n        }\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"grafana-pyroscope-datasource\",\n            \"uid\": \"pyroscope\"\n          },\n          \"queryType\": \"profile\",\n          \"profileTypeId\": \"process_cpu:cpu:nanoseconds:cpu:nanoseconds\",\n          \"labelName\": \"service_name\",\n          \"serviceName\": \"$serviceName\"\n        }\n      ],\n      \"title\": \"CPU Profile \\u2014 $serviceName\",\n      \"type\": \"flamegraph\"\n    }\n  ],\n  \"schemaVersion\": 39,\n  \"tags\": [\n    \"calypso\",\n    \"observability\",\n    \"red\",\n    \"traces\",\n    \"logs\",\n    \"profiles\"\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n\
    \        \"current\": {\n          \"selected\": false,\n          \"text\": \"calypso\",\n          \"value\": \"calypso\"\n        },\n        \"datasource\": {\n          \"type\": \"loki\",\n          \"uid\": \"loki\"\n        },\n        \"definition\": \"\",\n        \"description\": \"Kubernetes namespace\",\n        \"hide\": 0,\n        \"includeAll\": true,\n        \"label\": \"Namespace\",\n        \"multi\": false,\n        \"name\": \"namespace\",\n        \"options\": [],\n        \"query\": \"label_values(namespace)\",\n        \"refresh\": 2,\n        \"regex\": \"\",\n        \"sort\": 1,\n        \"type\": \"query\"\n      },\n      {\n        \"current\": {\n          \"selected\": false,\n          \"text\": \"calypso-control-plane\",\n          \"value\": \"calypso-control-plane\"\n        },\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"prometheus\"\n        },\n        \"definition\": \"\",\n        \"description\": \"\
    Service name (from spanmetrics 'service' label). Includes both Calypso and infrastructure services with traces. This is the OTel service.name value (e.g. calypso-control-plane, calypso-auth-proxy).\",\n        \"hide\": 0,\n        \"includeAll\": true,\n        \"label\": \"Service\",\n        \"multi\": true,\n        \"name\": \"service\",\n        \"options\": [],\n        \"query\": \"label_values(traces_spanmetrics_calls_total, service)\",\n        \"refresh\": 2,\n        \"regex\": \"\",\n        \"sort\": 1,\n        \"type\": \"query\"\n      },\n      {\n        \"current\": {\n          \"selected\": false,\n          \"text\": \"control-plane\",\n          \"value\": \"control-plane\"\n        },\n        \"datasource\": {\n          \"type\": \"loki\",\n          \"uid\": \"loki\"\n        },\n        \"definition\": \"\",\n        \"description\": \"Loki container label. Maps to OTel service.name: control-plane \\u2192 calypso-control-plane, auth-proxy \\u2192 calypso-auth-proxy,\
    \ git-proxy \\u2192 calypso-git-proxy, runner \\u2192 calypso-runner. Decoupled from the spanmetrics $service variable.\",\n        \"hide\": 0,\n        \"includeAll\": true,\n        \"label\": \"Container\",\n        \"multi\": true,\n        \"name\": \"container\",\n        \"options\": [],\n        \"query\": \"label_values({namespace=\\\"$namespace\\\"}, container)\",\n        \"refresh\": 2,\n        \"regex\": \"\",\n        \"sort\": 1,\n        \"type\": \"query\"\n      },\n      {\n        \"current\": {\n          \"selected\": false,\n          \"text\": \"\",\n          \"value\": \"\"\n        },\n        \"description\": \"Trace ID for pivoting from traces to logs. Paste a trace ID here to filter the logs row.\",\n        \"hide\": 0,\n        \"label\": \"Trace ID\",\n        \"name\": \"trace_id\",\n        \"options\": [\n          {\n            \"selected\": true,\n            \"text\": \"\",\n            \"value\": \"\"\n          }\n        ],\n        \"query\"\
    : \"\",\n        \"type\": \"textbox\"\n      },\n      {\n        \"current\": {\n          \"selected\": false,\n          \"text\": \"calypso-control-plane\",\n          \"value\": \"calypso-control-plane\"\n        },\n        \"datasource\": {\n          \"type\": \"grafana-pyroscope-datasource\",\n          \"uid\": \"pyroscope\"\n        },\n        \"definition\": \"service_name\",\n        \"description\": \"Pyroscope service_name label. After Alloy alignment (cb41d99a), values match OTel service.name: calypso-control-plane, calypso-auth-proxy, calypso-git-proxy.\",\n        \"hide\": 0,\n        \"includeAll\": false,\n        \"label\": \"Profile Service\",\n        \"multi\": false,\n        \"name\": \"serviceName\",\n        \"options\": [],\n        \"query\": \"service_name\",\n        \"refresh\": 2,\n        \"regex\": \"\",\n        \"sort\": 1,\n        \"type\": \"query\"\n      }\n    ]\n  },\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n\
    \  \"timepicker\": {},\n  \"timezone\": \"browser\",\n  \"title\": \"Calypso Observability\",\n  \"uid\": \"calypso-observability\",\n  \"version\": 1\n}"
kind: ConfigMap
metadata:
  annotations:
    grafana.grafana.com/dashboards.target-directory: /tmp/dashboards/calypso
  labels:
    grafana_dashboard: '1'
  name: calypso-observability-dashboard
  namespace: monitoring
