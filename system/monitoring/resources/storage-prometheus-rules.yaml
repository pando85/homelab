apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-prometheus-storage.rules
  labels:
    release: monitoring
spec:
  groups:
    - name: storage.rules
      rules:
        # There is deliberately no local StorageClass. k8s-amd64-1 has no ZFS pool and
        # its only intended local consumer (the CI runner) uses hostPath, so a general
        # purpose provisioner would advertise a capability we do not want: unbacked-up,
        # unquota'd storage on a weak node.
        #
        # The cost of that decision is this footgun: openebs-zfspv is the cluster
        # default and its allowedTopologies cover only grigri and prusik, so a PVC that
        # omits storageClassName and whose pod lands on k8s-amd64-1 hangs Pending
        # forever instead of failing loudly. This alert is the guard that replaces it.
        - alert: PersistentVolumeClaimPending
          annotations:
            summary: PVC stuck in Pending
            description: |
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been
              Pending for more than 10 minutes. Check its storageClassName, and whether
              any node in that class's allowedTopologies can host the pod claiming it.
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
        # A Lost PVC means the backing PersistentVolume is gone, so the data is
        # unreachable and the workload cannot start. Distinct from Pending: this is
        # data loss rather than a scheduling or topology problem.
        - alert: PersistentVolumeClaimLost
          annotations:
            summary: PVC lost its backing volume
            description: |
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is in phase
              Lost: its PersistentVolume no longer exists, so the data is unreachable.
          expr: kube_persistentvolumeclaim_status_phase{phase="Lost"} == 1
          for: 5m
          labels:
            severity: critical
        # openebs-zfspv and fast-zfspv use `reclaimPolicy: Retain`, so deleting a PV
        # never triggers a CSI DeleteVolume call and the backing ZFS dataset is never
        # destroyed. The ZFSVolume CR is left behind too - it has no ownerReference
        # (0/178 in the 2026-10 audit), so nothing garbage-collects it. That makes a
        # ZFSVolume CR with no matching PV the exact signature of a leak, and it is
        # detectable entirely in-cluster: the CR is named identically to its PV
        # (`pvc-<uuid>` for dynamic, the PV name for static provisioning).
        #
        # Retain is deliberate - it is the only backstop against an ArgoCD prune
        # destroying a database, since only 35/88 PVCs carry `Prune=false`. So the
        # fix is detection, not flipping the policy to Delete. 89 volumes / 139.6 GiB
        # accumulated over 9 months before the first manual audit.
        #
        # Aggregated into one alert on purpose: per-volume alerts would fire 89 times
        # simultaneously on first deploy. Run scripts/zfs-orphan-audit for the list.
        - alert: ZFSVolumeOrphaned
          annotations:
            summary: Orphaned ZFS LocalPV volumes are leaking pool space
            description: |
              {{ $value }} ZFSVolume CRs have no matching PersistentVolume, so their
              datasets are unreachable from Kubernetes and will never be reclaimed
              automatically under `reclaimPolicy: Retain`.

              List them read-only with:
                scripts/zfs-orphan-audit --dry-run
              which cross-references CRs against PVs, PVCs, ZFSBackup/Snapshot/Restore
              CRs, and the on-disk dataset state (mounted, snapshots, bytes) before
              proposing anything. Re-run with --apply to reclaim.

              See docs/troubleshooting/cluster-hygiene.md.
          expr: |
            count(
              zfs_localpv_volume_info
              unless on(name)
              label_replace(kube_persistentvolume_info, "name", "$1", "persistentvolume", "(.+)")
            ) > 0
          for: 1h
          labels:
            severity: warning
