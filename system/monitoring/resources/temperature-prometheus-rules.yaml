apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-prometheus-cpu-temperature.rules
  labels:
    release: monitoring
spec:
  groups:
    - name: cpu-temperature.rules
      rules:
        # chip: pci0000:00_0000:00:18_3
        # sensors:
        #   - temp1: Tctl
        #   - temp3: Tccd1
        #   - temp4: Tccd2
        # k8s-amd64-1: GPU chip 0000:00:08_1_0000:04:00_0 runs hot (P95: 74-75°C, max: 76°C)
        - alert: HighTemperature
          annotations:
            description: |
              Chip {{ $labels.chip }} on instance {{ $labels.instance }} has
              a temperature of {{ $value }} celsius degrees.
          expr: node_hwmon_temp_celsius{instance="k8s-amd64-1", chip="0000:00:08_1_0000:04:00_0"} > 80
          for: 5m
          labels:
            severity: warning
        - alert: HighTemperature
          annotations:
            description: |
              Chip {{ $labels.chip }} on instance {{ $labels.instance }} has
              a temperature of {{ $value }} celsius degrees.
          expr: node_hwmon_temp_celsius{instance="k8s-amd64-1", chip="0000:00:08_1_0000:04:00_0"} > 85
          for: 5m
          labels:
            severity: critical
        # Default thresholds for other hosts
        - alert: HighTemperature
          annotations:
            description: |
              Chip {{ $labels.chip }} on instance {{ $labels.instance }} has
              a temperature of {{ $value }} celsius degrees.
          expr: node_hwmon_temp_celsius{instance!="k8s-amd64-1", chip!="pci0000:00_0000:00:18_3", chip!~"nvme.*"} > 70 or node_hwmon_temp_celsius{instance!="k8s-amd64-1", chip="pci0000:00_0000:00:18_3"} > 92
          for: 5m
          labels:
            severity: warning
        - alert: HighTemperature
          annotations:
            description: |
              Chip {{ $labels.chip }} on instance {{ $labels.instance }} has
              a temperature of {{ $value }} celsius degrees.
          expr: node_hwmon_temp_celsius{instance!="k8s-amd64-1", chip!="pci0000:00_0000:00:18_3", chip!~"nvme.*"} > 75 or node_hwmon_temp_celsius{instance!="k8s-amd64-1", chip="pci0000:00_0000:00:18_3"} > 97
          for: 5m
          labels:
            severity: critical
