# Old Grafana hostname (before it moved to grafana.grigri.cloud). external-dns created its A record
# when it was an ingress-nginx Ingress and never deletes records. Defining the name on the internal
# Gateway keeps the record owned by a route, points it at the Gateway address and sends old links to
# the public name (path and query kept).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-internal-redirect
  namespace: monitoring
  annotations:
    external-dns.kubernetes.io/enabled: "true"
spec:
  hostnames:
    - grafana.internal.grigri.cloud
  parentRefs:
    - name: internal
      namespace: envoy-gateway
      sectionName: https-internal-grigri-cloud
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: grafana.grigri.cloud
            statusCode: 301
