oauth2-proxy:
  replicaCount: 2
  # Scale down an old pod before creating the surge one. With hard required
  # anti-affinity and only 2 schedulable nodes, a pure-maxSurge rollout
  # deadlocks (no free node for the new pod while both old pods are Running).
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  ingress:
    enabled: true
    className: nginx-external
    annotations:
      external-dns.kubernetes.io/enabled: "true"
      external-dns.kubernetes.io/target: grigri.cloud
      cert-manager.io/cluster-issuer: letsencrypt-prod-dns
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    path: /oauth2
    hosts:
      - &host auth.grigri.cloud
    tls:
      - hosts:
          - *host
        secretName: oauth2-proxy-tls-certificate

  # Envoy Gateway route (ingress-nginx migration); the Ingress above stays until the switch.
  # Single gatewayRef: external only. Explicit `matches`: the chart default is PathPrefix `/`,
  # the Ingress only exposes `/oauth2`. External-dns annotation as on the other external routes
  # (the record exists already, target comes from the external Gateway).
  gatewayApi:
    enabled: true
    gatewayRef:
      name: external
      namespace: envoy-gateway
      sectionName: https-grigri-cloud
    hostnames:
      - auth.grigri.cloud
    annotations:
      external-dns.kubernetes.io/enabled: "true"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /oauth2

  proxyVarsAsSecrets: true

  deploymentAnnotations:
    secret.reloader.stakater.com/reload: oauth2-proxy

  config:
    existingSecret: oauth2-proxy

  extraArgs:
    provider: oidc
    provider-display-name: Protected by Kanidm
    set-xauthrequest: true
    # Add X-Auth-Request-Access-Token to NginX response
    pass-access-token: true
    set-authorization-header: true
    pass-authorization-header: true
    oidc-issuer-url: https://idm.grigri.cloud/oauth2/openid/k8s-oauth2-proxy
    code-challenge-method: S256
    skip-provider-button: true
    reverse-proxy: true
    email-domain: "*"
    cookie-domain: .grigri.cloud
    whitelist-domain: .grigri.cloud
    cookie-refresh: 24h
    cookie-expire: 168h
    cookie-secure: true
    scope: "openid profile email groups"
    session-store-type: redis
    redis-connection-url: redis://redis:6379
    ## dex needs to support RFC2307bis
    # allowed-groups: wheel

  resources:
    requests:
      cpu: 10m
      memory: 14Mi
    limits:
      memory: 32Mi

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - authentication-proxy
          # Spread only among pods of the SAME ReplicaSet (own pod-template-hash).
          # Without this, rolling updates deadlock: the surge pod cannot coexist
          # with an old-version pod on any schedulable node.
          matchLabelKeys:
            - pod-template-hash
          topologyKey: "kubernetes.io/hostname"

app-template:
  global:
    fullnameOverride: redis
  controllers:
    redis:
      containers:
        redis:
          image:
            repository: redis
            tag: 8.10.3

          command:
            - sh
          args:
            - -c
            - >-
              redis-server
          resources:
            requests:
              cpu: 23m
              memory: 64M
            limits:
              cpu: 500m
              memory: 64M

  defaultPodOptions:

    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - oauth2-proxy
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - authentication-proxy
            topologyKey: kubernetes.io/hostname

  service:
    redis:
      controller: redis
      ports:
        redis:
          enabled: true
          port: 6379
