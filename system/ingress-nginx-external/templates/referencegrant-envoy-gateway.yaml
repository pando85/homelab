# Lets the TLSRoute runners-bridge in envoy-gateway (passthrough bridge of
# *.app.staging.forkline.dev, D4) use the nginx-external controller Service as backend.
# Remove together with the bridge.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: envoy-gateway-runners-bridge
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TLSRoute
      namespace: envoy-gateway
  to:
    - group: ""
      kind: Service
      name: ingress-nginx-external-controller
