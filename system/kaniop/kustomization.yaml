apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kaniop

helmCharts:
  - includeCRDs: true
    name: kaniop
    namespace: kaniop
    releaseName: kaniop
    repo: oci://ghcr.io/pando85/helm-charts
    valuesFile: values.yaml
    version: 0.11.2

# TODO: Remove patch-tmp-volume.yaml after kaniop chart supports custom volumes or
# the image no longer requires /tmp writes (upstream issue pending)
patches:
  - path: patch-tmp-volume.yaml
