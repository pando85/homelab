# WORKAROUND: kaniop v0.11.1 requires writing temporary Kanidm trust anchor files to /tmp
# but the chart enforces readOnlyRootFilesystem: true with no writable /tmp volume.
# This causes all reconciliations to fail with "Read-only file system (os error 30)".
# REMOVE THIS PATCH after upstream fixes the chart to support custom volumes or the image
# no longer requires /tmp writes. Track: https://github.com/pando85/kaniop
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaniop
spec:
  template:
    spec:
      containers:
        - name: kaniop
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
