driver:
  # Pre-installed via Ansible (nvidia-headless-550-server + nvidia-patch for NVENC)
  enabled: false

toolkit:
  # Pre-installed via Ansible (nvidia-container-runtime apt package)
  enabled: false

operator:
  runtimeClass: nvidia

devicePlugin:
  config:
    name: time-slicing-config
    default: any

dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring

gfd:
  enabled: true

validator:
  cuda:
    env:
      # CUDA workload validation crashes on Pascal GPUs (GTX 1060) with driver 580+
      # The vectorAdd binary segfaults (exit 139), blocking ClusterPolicy readiness
      # GPU functionality works fine (device-plugin, dcgm-exporter operational)
      - name: WITH_WORKLOAD
        value: "false"
