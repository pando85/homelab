apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource-config
  namespace: loki
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.loki:3100
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000
          derivedFields:
            # Field names verified against REAL Loki log lines (2026-10-10):
            #   calypso-control-plane JSON: "trace_id":"3f08...95cf6","span_id":"668756d87cf308ce" (snake_case)
            #   nginx-external plain text:  trace_id=2581af41cbf9f7fddff2c2e12b1f414d span_id=9dff7f2e76e4af75
            #   keycloak: no trace_id/traceId observed in 24h of logs — camelCase kept defensively for
            #     other OTel/Java instrumentation that may emit it in future.
            # Each regex is anchored to exactly 32 hex chars (W3C/OTel trace id) with ONE capture group.
            #
            # The `url` field is REMOVED on all three. It previously pointed at
            # http://tempo.tempo:3200 (a cluster-internal DNS name the browser cannot resolve), which
            # made the "View Trace" link fail. With only `datasourceUid: tempo`, Grafana opens the trace
            # in its built-in trace viewer using the Tempo datasource URL.
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"([a-f0-9]{32})"'
              name: trace_id
              urlDisplayLabel: 'View Trace'
            - datasourceUid: tempo
              matcherRegex: '"traceId":"([a-f0-9]{32})"'
              name: traceId
              urlDisplayLabel: 'View Trace'
            - datasourceUid: tempo
              matcherRegex: 'trace_id=([a-f0-9]{32})'
              name: trace_id_plain
              urlDisplayLabel: 'View Trace'
        # VERSION GATING (see commit 006c47a4 for the incident that documented this):
        #   Grafana file provisioning compares the file's `version` against the DB row's
        #   version and only applies the file when file_version >= db_version. Each
        #   successful apply bumps the DB version by 1. If the file's version is below
        #   the DB version, Grafana SILENTLY SKIPS the change — ArgoCD will report Synced,
        #   the sidecar gets HTTP 200 from the reload, but the live datasource never updates.
        #   ALWAYS bump this number above the live DB version whenever you edit the file.
        #   Check the live DB version with:
        #     curl -u <admin>:<pw> https://grafana.grigri.cloud/api/datasources/uid/loki | jq .version
        #   Observed live DB version at time of edit: 11. Bumped file version to 15 to leave room.
        version: 15
