apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource-config
  namespace: loki
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.loki:3100
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000
          derivedFields:
            # Keycloak JSON logs embed the OpenTelemetry trace id as "traceId"
            - datasourceUid: tempo
              matcherRegex: '"traceId":"([a-f0-9]+)"'
              name: traceId
              url: 'http://tempo.tempo:3200/api/traces/test'
              urlDisplayLabel: 'View Trace'
            # isidoro / nginx log formats that use snake_case trace_id
            - datasourceUid: tempo
              matcherRegex: 'trace_id=([a-f0-9]{32})'
              name: trace_id
              url: '${__value.raw}'
              urlDisplayLabel: 'View Trace'
        version: 1
