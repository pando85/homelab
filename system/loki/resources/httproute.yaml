# Envoy Gateway route (ingress-nginx migration). The Ingress in ingress.yaml stays until the switch.
# Internal route: the external-dns annotation publishes its name (the Gateway address).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
  annotations:
    external-dns.kubernetes.io/enabled: "true"
spec:
  hostnames:
    - loki.internal.grigri.cloud
  parentRefs:
    - name: internal
      namespace: envoy-gateway
      sectionName: https-internal-grigri-cloud
  rules:
    - backendRefs:
        - name: loki
          port: 3100
