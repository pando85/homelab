apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource-config
  namespace: tempo
  labels:
    grafana_datasource: "1"
data:
  tempo-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.tempo.svc.cluster.local:3200
      jsonData:
        # Correlation from Tempo traces → Loki logs.
        # Loki label mapping (measured 2026-10-10):
        #   OTel service.name "calypso-control-plane" → Loki container="control-plane", service_name="calypso"
        #   OTel service.name "calypso-auth-proxy"    → Loki container="auth-proxy",    service_name="calypso"
        #   OTel service.name "calypso-git-proxy"     → Loki container="git-proxy",     service_name="git-proxy"
        #   OTel service.name "calypso-runner"        → Loki container="runner",        service_name="runner"
        # Spans carry NO namespace/pod/k8s.* attributes (verified — apps set none), so those mappings are inert.
        # Only service.name → container is useful. filterByTraceID relies on trace_id in log lines (only control-plane emits it).
        # filterBySpanID is disabled: JSON logs contain span_id, but text logs (auth-proxy) do not, so enabling it would over-filter.
        tracesToLogsV2:
          datasourceUid: loki
          tags:
            - key: service.name
              value: container
          filterByTraceID: true
          filterBySpanID: false
        # Correlation from Tempo traces → Pyroscope profiles.
        # Pyroscope service_name label values (after Alloy alignment cb41d99a): calypso-control-plane, calypso-auth-proxy, calypso-git-proxy.
        # These match OTel service.name exactly, so the mapping is correct.
        # profileTypeId format: "name:sample_type:sample_unit:value_type:value_unit" (Pyroscope v2 documented format).
        # NOTE: Pyroscope v2 query API returns empty results as of 2026-10-10 despite ingest (rate ~0.12 profiles/sec).
        # This is a Pyroscope v2 data/query issue, not a config issue. The profileTypeId format is correct per docs.
        tracesToProfiles:
          datasourceUid: pyroscope
          tags:
            - key: service.name
              value: service_name
          profileTypeId: process_cpu_cpu:nanoseconds:cpu:nanoseconds
      isDefault: false
      version: 4
