apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource-config
  namespace: tempo
  labels:
    grafana_datasource: "1"
data:
  tempo-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.tempo.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          tags:
            - key: service.name
              value: service_name
            - key: namespace
            - key: pod
          filterByTraceID: true
          filterBySpanID: true
        tracesToProfiles:
          datasourceUid: pyroscope
          tags:
            - key: service.name
              value: service_name
          profileTypeId: process_cpu_cpu:nanoseconds:cpu:nanoseconds
      isDefault: false
      version: 4
