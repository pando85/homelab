apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource-config
  namespace: tempo
  labels:
    grafana_datasource: "1"
data:
  tempo-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.tempo.svc.cluster.local:3200
      jsonData:
        # Correlation from Tempo traces → Loki logs.
        #
        # Label mapping (measured 2026-10-10):
        #   OTel resource attribute k8s.namespace.name → Loki label "namespace"
        #   OTel resource attribute k8s.pod.name       → Loki label "pod"
        #   OTel resource attribute k8s.container.name → Loki label "container"
        #
        # These attributes are added to spans by the OTel Collector's k8sattributes
        # processor (see system/otel-collector/values.yaml). The collector runs in
        # gateway mode and uses connection-based pod association (source IP = pod IP).
        #
        # filterByTraceID: true — log lines with trace_id field match the trace.
        #   control-plane emits JSON logs with trace_id; auth-proxy/git-proxy emit
        #   text logs without trace_id, so only control-plane logs match.
        # filterBySpanID: false — log lines emitted outside a span have no span_id,
        #   so filtering by span_id would hide valid related logs.
        tracesToLogsV2:
          datasourceUid: loki
          tags:
            - key: k8s.namespace.name
              value: namespace
            - key: k8s.pod.name
              value: pod
            - key: k8s.container.name
              value: container
          filterByTraceID: true
          filterBySpanID: false
        # Correlation from Tempo traces → Pyroscope profiles.
        #
        # Pyroscope service_name label values (after Alloy alignment cb41d99a):
        #   calypso-control-plane, calypso-auth-proxy, calypso-git-proxy
        # These match OTel service.name exactly, so the mapping is correct.
        #
        # profileTypeId format: <name>:<sample-type>:<sample-unit>:<period-type>:<period-unit>
        # Verified via Pyroscope connect API:
        #   POST /querier.v1.QuerierService/ProfileTypes {}
        #   → {"profileTypes":[{"ID":"process_cpu:cpu:nanoseconds:cpu:nanoseconds",...}]}
        tracesToProfiles:
          datasourceUid: pyroscope
          tags:
            - key: service.name
              value: service_name
          profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
      # CRITICAL: Grafana's datasource provisioning compares the file's version
      # against the DB row's version and "only updates data sources with the same
      # or lower version number than the one set in the configuration file"
      # (see https://grafana.com/docs/grafana/latest/administration/provisioning/).
      # Each successful apply increments the DB version by 1. So if the DB row is
      # at version N and the file says version N-1, the update is silently skipped.
      # To ensure changes propagate, bump this version on every content change.
      # Current DB version (2026-10-10): 5. Set to 10 to allow future edits.
      isDefault: false
      version: 10
