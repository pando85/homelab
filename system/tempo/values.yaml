tempo:
  resources:
    # Sized from 14d of measured usage (2026-10-17): CPU peak 0.375 cores during
    # compaction cycles, memory working-set peak 5.3Gi / heap_sys peak 6.3Gi (88-105%
    # of the previous 6Gi limit) driven by block-metadata cache, not WAL I/O.
    # requests.memory raised 1Gi->3Gi to match the observed p95 (~2.9Gi) so kubelet
    # does not evict the pod under node pressure while it is legitimately using that
    # much; limits.memory raised 6Gi->8Gi to leave real headroom above the worst
    # observed compaction spike (~5.3Gi) plus the fixed 1Gi mem-ballast, instead of
    # sitting at 88-105% of the old limit. limits.cpu lowered 4->2 cores since the
    # measured peak is only 0.375 cores - 2 cores is still 5x headroom and reduces
    # burst pressure on prusik, which is memory/latency bound.
    # Re-measure 7d after this change; see sizing queries in the commit message.
    requests:
      cpu: 500m
      memory: 3Gi
    limits:
      cpu: "2"
      memory: 8Gi
  memBallastSizeMbs: 1024
  multitenancyEnabled: false
  reportingEnabled: false
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://monitoring-kube-prometheus-prometheus.monitoring:9090/api/v1/write"
    processor:
      local_blocks:
        flush_to_storage: true
        filter_server_spans: false
        max_block_duration: 1m
      service_graphs:
        wait: 10s
        max_items: 10000
        peer_attributes:
          - peer.service
          - db.name
          - db.system
      span_metrics:
        enable_target_info: true
    # -- Registry configuration for metrics generator (optional)
    registry: {}
    #   collection_interval: 15s
    #   external_labels:
    #     cluster: "primary"
    # -- Storage configuration for metrics generator
    # This section configures the storage path and remote write endpoints
    storage:
      path: "/var/tempo/metrics"
    traces_storage:
      # Must NOT share a path with storage.trace.local.path below. In single-binary
      # (monolithic) mode the metrics-generator's local-blocks WAL and the main
      # trace backend would otherwise write into the same tenant directory, and the
      # blocklist poller fails with "invalid UUID length: 60" when it encounters the
      # generator's <uuid>+<tenant>+<version> WAL directory names.
      # See docs/troubleshooting/tempo-metrics-generator-wal-collision.md
      path: "/var/tempo/generator-traces"
    # NOTE: metrics_ingestion_time_range_slack is NOT rendered by the Helm chart
    # template (tempo-1.24.4). It must be set via the `config` override below.
    # See the `config` section at the end of this file.
  # -- Configuration options for the ingester.
  # Refers to: https://grafana.com/docs/tempo/latest/configuration/#ingester
  ingester:
    flush_check_period: 10s
    trace_idle_period: 10s
    max_block_duration: 30m
    complete_block_timeout: 1h
  querier:
    max_concurrent_queries: 20
  queryFrontend:
    search:
      concurrent_jobs: 500
  retention: 168h
  # -- The standard overrides configuration section. This can include a `defaults` object for applying to all tenants (not to be confused with the `global` property of the same name, which overrides `max_byte_per_trace` for all tenants). For an example on how to enable the metrics generator using the `overrides` object, see the 'Activate metrics generator' section below. Refer to [Standard overrides](https://grafana.com/docs/tempo/latest/configuration/#standard-overrides) for more details.
  overrides:
    # -- Default config values for all tenants, can be overridden by per-tenant overrides. If a tenant's specific overrides are not found in the `per_tenant_overrides` block, the values in this `default` block will be used. Configs inside this block should follow the new overrides indentation format
    defaults:
      metrics_generator:
        processors:
          - local-blocks
          - service-graphs
          - span-metrics

    # -- Path to the per tenant override config file. The values of the `per_tenant_overrides` config below will be written to the default path `/conf/overrides.yaml`. Users can set tenant-specific overrides settings in a separate file and point per_tenant_override_config to it if not using the per_tenant_overrides block below.
    per_tenant_override_config: /conf/overrides.yaml
  # -- The `per tenant` aka `tenant-specific` runtime overrides. This allows overriding values set in the configuration on a per-tenant basis. Note that *all* values must be given for each per-tenant configuration block. Refer to [Runtime overrides](https://grafana.com/docs/tempo/latest/configuration/#runtime-overrides) and [Tenant-Specific overrides](https://grafana.com/docs/tempo/latest/configuration/#tenant-specific-overrides) documentation for more details.
  per_tenant_overrides: {}
    # 'tenant-id':
    #  metrics_generator:
    #    processors:
    #      - service-graphs
    #      - span-metrics
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    jaeger: {}
    opencensus:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

persistence:
  enabled: true
  enableStatefulSetAutoDeletePVC: true
  accessModes:
    - ReadWriteOnce
  size: 30Gi

# Override the chart's default config template to add metrics_ingestion_time_range_slack.
# The tempo-1.24.4 chart template does not render this field (it only renders processor,
# registry, storage, and traces_storage under metrics_generator). This is a copy of the
# chart's default config template with the missing field added.
# MAINTENANCE: If the chart is upgraded, this template must be manually merged with the
# new chart default. The chart is deprecated (as of 1.24.4), so upgrades are unlikely.
config: |
    memberlist:
      cluster_label: "{{ .Release.Name }}.{{ .Release.Namespace }}"
    multitenancy_enabled: {{ .Values.tempo.multitenancyEnabled }}
    usage_report:
      reporting_enabled: {{ .Values.tempo.reportingEnabled }}
    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retention }}
    distributor:
      receivers:
        {{- toYaml .Values.tempo.receivers | nindent 8 }}
    ingester:
      {{- toYaml .Values.tempo.ingester | nindent 6 }}
    server:
      {{- toYaml .Values.tempo.server | nindent 6 }}
    storage:
      {{- toYaml .Values.tempo.storage | nindent 6 }}
    querier:
      {{- toYaml .Values.tempo.querier | nindent 6 }}
    query_frontend:
      {{- toYaml .Values.tempo.queryFrontend | nindent 6 }}
    overrides:
      {{- toYaml .Values.tempo.overrides | nindent 6 }}
      {{- if .Values.tempo.metricsGenerator.enabled }}
    metrics_generator:
      {{- if .Values.tempo.metricsGenerator.processor }}
      processor:
        {{- toYaml .Values.tempo.metricsGenerator.processor | nindent 8 }}
      {{- end }}
      {{- if .Values.tempo.metricsGenerator.registry }}
      registry:
        {{- toYaml .Values.tempo.metricsGenerator.registry | nindent 8 }}
      {{- end }}
      storage:
        path: {{ .Values.tempo.metricsGenerator.storage.path | quote }}
        {{- if .Values.tempo.metricsGenerator.storage.remote_write }}
        remote_write:
          {{- toYaml .Values.tempo.metricsGenerator.storage.remote_write | nindent 10 }}
        {{- else }}
        remote_write:
          - url: {{ .Values.tempo.metricsGenerator.remoteWriteUrl }}
        {{- end }}
      traces_storage:
        path: {{ .Values.tempo.metricsGenerator.traces_storage.path | quote }}
      # Spans with end times older than this are excluded from metrics generation.
      # Pipeline delay: tail_sampling decision_wait (30s default) + batch timeout (5s) +
      # export latency (~5-10s) = ~40-45s. The 60s slack provides ~15-20s margin for
      # application buffering and network jitter while keeping the window tight enough
      # to avoid stale-span memory growth.
      # Ref: https://grafana.com/docs/tempo/latest/configuration/#metrics-generator
      metrics_ingestion_time_range_slack: 60s
      {{- end }}
