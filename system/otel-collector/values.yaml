mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.161.0
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# RBAC: k8sattributes processor needs get/list/watch on pods and namespaces.
# The chart creates a ServiceAccount by default; we add a ClusterRole with the
# minimum permissions required for k8sattributes to enrich spans with k8s metadata.
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces"]
      verbs: ["get", "watch", "list"]

config:
  receivers:
    # Disable unused receivers (chart defaults include jaeger, zipkin)
    jaeger: null
    zipkin: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    # Kubernetes Attributes Processor: adds k8s.namespace.name, k8s.pod.name,
    # k8s.container.name to spans. Uses connection-based pod association (source
    # IP = pod IP, since apps send OTLP directly to the collector service).
    # CRITICAL: must appear BEFORE tail_sampling and batch, because those processors
    # strip the connection metadata that k8sattributes needs for pod association.
    # (Ref: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/k8sattributesprocessor)
    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.container.name
      pod_association:
        - sources:
            - from: connection

    # Transform nginx SERVER spans to CLIENT spans to fix service graph
    transform/nginx:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - set(span.kind.string, "Client") where resource.attributes["service.name"] == "nginx-external"

    # Tail-based sampling: keep errors and slow traces, sample 10% of normal traffic
    tail_sampling:
      policies:
        - name: errors-policy
          type: status_code
          status_code: {status_codes: [ERROR]}
        - name: latency-policy
          type: latency
          latency: {threshold_ms: 5000}
        - name: default-policy
          type: probabilistic
          probabilistic: {sampling_percentage: 10}

    # Batch spans before exporting to reduce load on Tempo
    batch:
      send_batch_size: 1000
      timeout: 5s

  exporters:
    otlp/tempo:
      endpoint: tempo.tempo:4317
      tls:
        insecure: true
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
      sending_queue:
        enabled: true
        num_consumers: 10
        queue_size: 1000

  service:
    telemetry:
      logs:
        level: error
    pipelines:
      traces:
        receivers: [otlp]
        processors: [k8sattributes, transform/nginx, tail_sampling, batch]
        exporters: [otlp/tempo]

service:
  type: ClusterIP

# Port configuration (top-level, not under service)
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
    appProtocol: grpc
  # Disable unused receiver ports
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  # Expose the collector's own Prometheus telemetry endpoint so servicemonitor.yaml
  # can scrape it. The collector already binds its internal metrics exporter to
  # ${env:MY_POD_IP}:8888 (chart default config.service.telemetry.metrics), but the
  # chart ships `ports.metrics.enabled: false`, so the port was never published on
  # the Service and the ServiceMonitor matched nothing (job=otel-collector had no
  # `up` series at all). Chart docs: "you need to enable the port in order to use
  # the ServiceMonitor".
  #
  # Name must stay `metrics`: servicemonitor.yaml selects endpoints by port NAME.
  # ClusterIP only — no hostPort, no ingress, not reachable outside the cluster.
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP
