# Internal Gateway on 192.168.193.13. The listener names are the contract other repos use as
# parentRefs.sectionName: do not rename.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https-internal-grigri-cloud
      port: 443
      protocol: HTTPS
      hostname: "*.internal.grigri.cloud"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: internal-grigri-cloud-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-staging-internal-forkline-dev
      port: 443
      protocol: HTTPS
      hostname: "*.staging.internal.forkline.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: staging-internal-forkline-dev-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-isidoro-grigri-cloud
      port: 443
      protocol: HTTPS
      hostname: "*.isidoro.grigri.cloud"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: isidoro-grigri-cloud-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-rajoy-internal-grigri-cloud
      port: 443
      protocol: HTTPS
      hostname: "*.rajoy.internal.grigri.cloud"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: rajoy-internal-grigri-cloud-tls
      allowedRoutes:
        namespaces:
          from: All
    # Verification listener for calypso runner routes (same name and spec as on the external
    # Gateway): curl --resolve <runner>.app.staging.forkline.dev:443:192.168.193.13 tests a runner
    # through Envoy while public traffic still uses the external path. No DNS points here.
    - name: https-runners-staging-forkline-dev
      port: 443
      protocol: HTTPS
      hostname: "*.app.staging.forkline.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: internal-app-staging-forkline-dev-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: calypso-runners
        kinds:
          - kind: HTTPRoute
