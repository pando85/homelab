---
# Gateway-wide defaults of the internal Gateway, matching ingress-nginx so apps do not notice.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: internal-defaults
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
  tls:
    # Mandatory: hostname-scoped TLS listeners silently drop h2 gateway-wide otherwise
    alpnProtocols:
      - h2
      - http/1.1
  http1:
    http10: {}
  path:
    # nginx forwards %2F untouched; Envoy would redirect by default
    escapedSlashesAction: KeepUnchanged
  # nginx-internal runs with use-forwarded-headers: true (LAN clients and in-cluster proxies)
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  # Idle-based, like nginx (client keepalive_timeout 75s, client_header_timeout 60s). Never set
  # requestReceivedTimeout here: it is a TOTAL upload limit, nginx's client_body_timeout is idle.
  timeout:
    http:
      idleTimeout: 75s
      requestHeadersReceivedTimeout: 60s
      streamIdleTimeout: 60s
  tcpKeepalive:
    idleTime: 300s
    interval: 60s
    probes: 3
  # Exactly what nginx sends: HSTS (replaces an app's own value, like nginx) and no Server header.
  # nginx sends no Referrer-Policy, X-Frame-Options, X-Content-Type-Options or Permissions-Policy
  # (its configuration-snippet key is invalid), so none is set here: gateway-wide values would
  # override the apps' own (Kanidm). Per-app hardening goes on the route, never gateway-wide.
  headers:
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
      remove:
        - Server
---
# nginx proxy-read/send-timeout (60s) are IDLE timeouts between reads and writes, while Envoy's
# route timeout (requestTimeout, default 15s) is a TOTAL limit from request end to the complete
# response: 60s total cuts every download or stream longer than a minute. So the total limit is
# disabled and idleness is bounded by streamIdleTimeout (no bytes in either direction, also for
# websockets and SSE), connect timeout and upstream keepalive match nginx (5s, 60s). Apps whose
# Ingress sets proxy-read/send-timeout override streamIdleTimeout per route with a BackendTrafficPolicy
# mergeType: StrategicMerge (docs/conventions/gateway-api-routes.md). No compressor here on purpose:
# compression is per route only and never on MinIO/S3 hosts (it rewrites the signed Accept-Encoding).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: internal-defaults
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
  timeout:
    tcp:
      connectTimeout: 5s
    http:
      requestTimeout: 0s
      streamIdleTimeout: 60s
      connectionIdleTimeout: 60s
---
# Gateway-wide defaults of the external Gateway, matching ingress-nginx so apps do not notice.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: external-defaults
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  tls:
    # Mandatory: hostname-scoped TLS listeners silently drop h2 gateway-wide otherwise
    alpnProtocols:
      - h2
      - http/1.1
  http1:
    http10: {}
  path:
    # nginx forwards %2F untouched; Envoy would redirect by default
    escapedSlashesAction: KeepUnchanged
  # No clientIPDetection: like nginx-external, trust no X-Forwarded-For. externalTrafficPolicy
  # Local keeps the real client IP on the TCP connection.
  # Idle-based, like nginx (client keepalive_timeout 75s, client_header_timeout 60s). Never set
  # requestReceivedTimeout here: it is a TOTAL upload limit, nginx's client_body_timeout is idle.
  timeout:
    http:
      idleTimeout: 75s
      requestHeadersReceivedTimeout: 60s
      streamIdleTimeout: 60s
  tcpKeepalive:
    idleTime: 300s
    interval: 60s
    probes: 3
  # Exactly what nginx sends: HSTS (replaces an app's own value, like nginx) and no Server header.
  # nginx sends no Referrer-Policy, X-Frame-Options, X-Content-Type-Options or Permissions-Policy
  # (its configuration-snippet key is invalid), so none is set here: gateway-wide values would
  # override the apps' own (Kanidm). Per-app hardening goes on the route, never gateway-wide.
  headers:
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
      remove:
        - Server
---
# nginx proxy-read/send-timeout (60s) are IDLE timeouts between reads and writes, while Envoy's
# route timeout (requestTimeout, default 15s) is a TOTAL limit from request end to the complete
# response: 60s total cuts every download or stream longer than a minute. So the total limit is
# disabled and idleness is bounded by streamIdleTimeout (no bytes in either direction, also for
# websockets and SSE), connect timeout and upstream keepalive match nginx (5s, 60s). Apps whose
# Ingress sets proxy-read/send-timeout override streamIdleTimeout per route with a BackendTrafficPolicy
# mergeType: StrategicMerge (docs/conventions/gateway-api-routes.md). No compressor here on purpose:
# compression is per route only and never on MinIO/S3 hosts (it rewrites the signed Accept-Encoding).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: external-defaults
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  timeout:
    tcp:
      connectTimeout: 5s
    http:
      requestTimeout: 0s
      streamIdleTimeout: 60s
      connectionIdleTimeout: 60s
---
# Port 80 only redirects to https. nginx sends HSTS only over https, so this listener gets its own
# policy WITHOUT the response headers (a listener policy replaces the gateway one for that
# listener, it does not merge): keep the settings below in step with internal-defaults.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: internal-http-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      sectionName: http
  http1:
    http10: {}
  path:
    escapedSlashesAction: KeepUnchanged
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  timeout:
    http:
      idleTimeout: 75s
      requestHeadersReceivedTimeout: 60s
      streamIdleTimeout: 60s
  tcpKeepalive:
    idleTime: 300s
    interval: 60s
    probes: 3
---
# Same as internal-http-redirect, without clientIPDetection (like the external gateway policy).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: external-http-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      sectionName: http
  http1:
    http10: {}
  path:
    escapedSlashesAction: KeepUnchanged
  timeout:
    http:
      idleTimeout: 75s
      requestHeadersReceivedTimeout: 60s
      streamIdleTimeout: 60s
  tcpKeepalive:
    idleTime: 300s
    interval: 60s
    probes: 3
