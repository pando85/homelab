---
# Data plane of the "external" Gateway: own Deployment, PDB, LB Service (192.168.193.14), 2 replicas.
# Placement: prefer prusik, then amd64 (as the former ingress-nginx). No tolerations on
# purpose: the CI node k8s-amd64-1 (dedicated=ci:NoSchedule) must never run these pods.
# Cilium BGP advertises every LoadBalancer Service without the cilium.io/bgp-skip label
# (system/kube-system/resources/cilium/bgp-advertisement.yaml), so no extra label is needed.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  telemetry:
    # Same as nginx-external: every request traced (nginx otel-sampler AlwaysOn), incoming
    # traceparent trusted. Spans go to the otel-collector (cross-namespace backendRef, allowed by
    # the ReferenceGrant in system/otel-collector). The collector special-cases the service name
    # (full tail sampling, SERVER to CLIENT span kind), see system/otel-collector/values.yaml.
    # The internal gateway is not traced, like nginx-internal.
    tracing:
      samplingRate: 100
      provider:
        type: OpenTelemetry
        serviceName: envoy-external
        backendRefs:
          - name: otel-collector-opentelemetry-collector
            namespace: otel-collector
            port: 4317
      tags:
        http.host: "%REQ(:AUTHORITY)%"
        upstream.cluster: "%UPSTREAM_CLUSTER%"
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
              user_agent: "%REQ(USER-AGENT)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              authority: "%REQ(:AUTHORITY)%"
              client_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              traceID: "%TRACE_ID%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          # eMudhra CA fix: same pin as global.images.envoyProxy in values.yaml (this field replaces it)
          # renovate: datasource=docker versioning=regex:^distroless-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          image: docker.io/envoyproxy/envoy:distroless-v1.39.6
          resources:
            requests:
              cpu: 40m
              memory: 150Mi
            limits:
              memory: 328Mi
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        pod:
          annotations:
            # Pod template marker with no runtime effect. Changing it rolls the external proxies
            # (planning/ingress-nginx-to-envoy-gateway.md, Gate 1 roll test): the tracing block
            # is dynamic xDS config and does not roll pods. Safe to remove with the next real
            # change to this pod template.
            homelab.grigri.cloud/roll-test: gate1-2026-11-09
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - prusik
                - weight: 50
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                          - amd64
          topologySpreadConstraints:
            - maxSkew: 4
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  app.kubernetes.io/component: proxy
                  app.kubernetes.io/managed-by: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
                  gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway
      envoyPDB:
        minAvailable: 1
      envoyService:
        type: LoadBalancer
        loadBalancerClass: io.cilium/bgp-control-plane
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: "192.168.193.14"
