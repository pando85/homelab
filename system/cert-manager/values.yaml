cert-manager:
  installCRDs: true


  resources:
    requests:
      cpu: 10m
      memory: 36Mi
    limits:
      memory: 128Mi

  extraArgs:
    # When this flag is enabled, secrets will be automatically removed when the certificate resource is deleted
    - --enable-certificate-owner-ref=true
    - --dns01-recursive-nameservers-only
    - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53

  # Controller options that have no flag in the chart. gatewayAPI.enabled turns on the Gateway API
  # support the ACME `gatewayHTTPRoute` HTTP-01 solver needs (cert-manager v1.21: the chart renders
  # `config` into the controller's ControllerConfiguration ConfigMap; the old --enable-gateway-api flag
  # is the same switch). Used by the zerossl-forkline-io ClusterIssuer for the Forkline Remote hosts.
  # The chart's ClusterRole already allows httproutes.
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    gatewayAPI:
      enabled: true
  global:
    leaderElection:
      namespace: cert-manager

  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      labels:
        release: monitoring

  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 18Mi
      limits:
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 20m
        memory: 72Mi
      limits:
        memory: 172Mi
