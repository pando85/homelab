# ZeroSSL for forkline.io (Forkline Remote: per-machine certificates under remote.forkline.io and
# remote.staging.forkline.io). letsencrypt-prod-dns stays the documented fallback CA. The EAB key ID
# is not a secret and must be literal here (cert-manager has no secret reference for it); the HMAC key
# comes from the zerossl-eab Secret (ExternalSecret zerossl-eab, Vault /cert-manager/zerossl).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zerossl-forkline-io
spec:
  acme:
    server: https://acme.zerossl.com/v2/DV90
    privateKeySecretRef:
      name: zerossl-forkline-io
    externalAccountBinding:
      keyID: e9uWmY9Soo6-3mEDHe3W3Q
      keySecretRef:
        name: zerossl-eab
        key: eab_hmac_key
    solvers:
    - selector:
        dnsZones:
        - forkline.io
      dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
