apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zerossl-eab
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: zerossl-eab
  data:
    - secretKey: eab_kid
      remoteRef:
        key: /cert-manager/zerossl
        property: eab_kid
    - secretKey: eab_hmac_key
      remoteRef:
        key: /cert-manager/zerossl
        property: eab_hmac_key
