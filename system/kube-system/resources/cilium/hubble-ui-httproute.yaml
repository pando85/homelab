# Envoy Gateway route (ingress-nginx migration). The chart Ingress (hubble.ui.ingress in
# cilium-values.yaml) stays until the switch. Internal route: no external-dns annotation until the
# internal switch.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
spec:
  hostnames:
    - hubble.internal.grigri.cloud
  parentRefs:
    - name: internal
      namespace: envoy-gateway
      sectionName: https-internal-grigri-cloud
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
