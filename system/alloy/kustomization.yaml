# Alloy eBPF profiler — ACTIVE staging profiling collector (Phase 6c validated path).
#
# STATUS: ACTIVE (deployed via ArgoCD auto-discovery of system/alloy/).
#
# WHY ALLOY INSTEAD OF OTel eBPF PROFILER:
# - OTel eBPF profiler (0.162.0) generates OTLP profiles with an empty-key resource
#   attribute from its process context. Pyroscope's OTLP ingest (/v1development/profiles)
#   converts resource attributes → Prometheus-style labels without sanitization,
#   rejecting ALL profiles with HTTP 400: invalid label name ''.
# - Alloy's pyroscope.ebpf → pyroscope.write uses Pyroscope's NATIVE /ingest protocol,
#   where labels are constructed explicitly from Alloy's discovery pipeline (pprof-based).
#   The OTLP attribute→label conversion path that triggers the empty-name bug is never
#   exercised. Structurally immune to this class of issue.
# - Verdict: research_notes/Calypso OTel profiling feasibility/empty-label-verdict.md
# - Rollback / stop-collection procedure: docs/troubleshooting/profiling-collector-rollback.md
#   (rollback = exclude BOTH collectors; do NOT re-enable the OTel path)
#
# REVISIT OTel-first path when upstream fixes:
# - otelcol-ebpf-profiler: suppress/normalize empty-key resource attributes, OR
# - Pyroscope OTLP ingest: sanitize/reject empty label names without dropping the profile
#
# CHART PIN: grafana/alloy chart 1.13.1 (app v1.20.1)
#   - Verified via Artifact Hub (2026-10-08)
#   - App >=1.15.0 required: pyroscope.ebpf comm/pid labels (#5769), metric registration (#5774)
#   - App 1.20.1 includes: pyroscope.ebpf pprof sample count fix (#7119)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alloy
# NOTE: dedicated namespace — NOT the same as otel-ebpf-profiler.
# Both are auto-discovered by the ApplicationSet; the otel-ebpf-profiler is
# excluded via bootstrap/root/values.yaml so the two won't run simultaneously.

helmCharts:
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.13.1
    releaseName: alloy
    namespace: alloy
    valuesFile: values.yaml

resources:
  - config/rbac.yaml
