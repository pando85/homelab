# Alloy eBPF profiler — staging profiling collector (Phase 6c validated path).
#
# Uses pyroscope.ebpf → pyroscope.write (Pyroscope-native /ingest), avoiding the
# OTLP profiles /v1development path where the empty-label-name rejection occurs
# in Pyroscope 2.3.2. See kustomization.yaml header and:
#   research_notes/Calypso OTel profiling feasibility/empty-label-verdict.md
#
# CHART PIN: grafana/alloy 1.13.1 / app v1.20.1
#   App >=1.15.0 required for pyroscope.ebpf comm/pid labels + metric exposure.

controller:
  type: daemonset
  nodeSelector:
    kubernetes.io/os: linux
  # eBPF profiler needs host PID namespace for process discovery
  hostPID: true
  # /sys for BTF (/sys/kernel/btf/vmlinux), /proc for process maps/symbolization
  volumes:
    extra:
      - name: host-sys
        hostPath:
          path: /sys
      - name: host-proc
        hostPath:
          path: /proc

alloy:
  configMap:
    create: true
    content: |-
      // Discovery: find pods on THIS node in the calypso namespace (3 runc Rust services).
      // The eBPF profiler can only profile processes on the local node, so we filter
      // by spec.nodeName to discover only pods scheduled on this Alloy instance's node.
      // Runner pods live in calypso-runners and are excluded by the namespace filter —
      // the negative control for gVisor: even if a runner pod were scheduled,
      // it would not appear as a target.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
        selectors {
          role  = "pod"
          field = "metadata.namespace=calypso"
        }
      }

      // Relabel: build service_name as ebpf/<namespace>/<container> and keep only
      // the 3 runc Rust services. NOTE: container names are control-plane,
      // git-proxy, auth-proxy — NOT the Deployment names (which have a
      // calypso- prefix). Filtering on the wrong value drops every target.
      //
      // CARDINALITY/PRIVACY: only bounded, non-identifying labels are carried.
      // Deliberately NOT carried:
      // - pod (random rollout suffix → new series on every deploy)
      // - __meta_kubernetes_pod_label_* via labelmap (arbitrary user labels)
      // - pid / comm (pinned off in pyroscope.ebpf below)
      // Target matching does not need them: the engine matches by container ID.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Drop pods that are not in a running phase (avoid stale targets).
        rule {
          action        = "drop"
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Succeeded|Failed"
        }

        // service_name = ebpf/<namespace>/<container_name>
        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "@"
          regex         = "(.*)@(.*)"
          replacement   = "ebpf/${1}/${2}"
          target_label  = "service_name"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        // Keep only the 3 runc Rust services (container names, not Deployment names).
        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_container_name"]
          regex         = "control-plane|git-proxy|auth-proxy"
        }
      }

      // eBPF profiling: whole-system CPU profiling via the embedded OTel eBPF
      // engine, reporting only profiles matching the discovered targets.
      //
      // Interpreter unwinders are DISABLED except where they add value:
      // - python_enabled = false: the `perf_unwind_python` perf eBPF program
      //   fails to load on the k8s-amd64-1 node (kernel 7.0.0-34-generic), which
      //   made the whole component exit and lose ALL profiling on that node.
      //   Our targets (calypso control-plane / auth-proxy / git-proxy) are Rust
      //   static binaries profiled by the *native* unwinder, so dropping the
      //   Python unwinder costs nothing for this workload and restores coverage.
      //   This is the documented per-interpreter flag (not a global syscall
      //   disable): see pyroscope.ebpf "Arguments" in the Alloy reference docs.
      // - ruby/dotnet/perl/php/v8/hotspot stay at their documented defaults
      //   (true) — they load fine on all three nodes; only Python failed.
      //   Revisit here if a future kernel makes another unwinder fail to load.
      //
      // PRIVACY: keep per-process identity out of stored profiles. These match
      // the documented defaults, pinned explicitly so a chart/app bump cannot
      // silently start persisting unbounded-cardinality labels:
      // - pid_label = false  → do not attach the process PID as a `pid` label
      // - comm = "none"      → do not attach the process command name
      pyroscope.ebpf "profiles" {
        targets        = discovery.relabel.pods.output
        forward_to     = [pyroscope.write.default.receiver]
        python_enabled = false
        pid_label      = false
        comm           = "none"
      }

      // Write profiles to Pyroscope via native /ingest (pprof-based, not OTLP)
      pyroscope.write "default" {
        endpoint {
          url = "http://pyroscope.pyroscope.svc.cluster.local:4040"
        }
      }

  # pyroscope.ebpf needs privileged access to load eBPF programs, read
  # /sys/kernel/btf/vmlinux, and symbolize process memory maps.
  securityContext:
    privileged: true
    runAsUser: 0

  mounts:
    extra:
      - name: host-sys
        mountPath: /sys
        readOnly: true
      - name: host-proc
        mountPath: /host/proc
        readOnly: true

  # pyroscope.ebpf is exposed at public-preview in this app version
  stabilityLevel: "public-preview"

# The config-reloader sidecar must stay DISABLED so the chart emits the
# `checksum/config` pod-template annotation.
#
# Why it matters: templates/controllers/_pod.yaml gates the checksum on
# `and (not .Values.configReloader.enabled) ...`, i.e. with the reloader on,
# a ConfigMap-only change produces NO pod-template diff, so the DaemonSet never
# rolls. Several pyroscope.ebpf settings (python_enabled, pid_label, comm,
# sample_rate, demangle) are read once when the component is built — a /-/reload
# does NOT re-apply them. That gap forced a manual `kubectl delete pods` to
# land the python_enabled fix, which is exactly what GitOps is supposed to avoid.
#
# With the reloader off, editing alloy.configMap.content changes the checksum,
# rolls the pods, and the new flags take effect with no cluster-side action.
# Hot-reload of purely dynamic settings (targets, relabel rules) is lost, which
# is an acceptable trade: a rollout is ~seconds and keeps one mechanism for all
# config changes.
configReloader:
  enabled: false

  # Resource budget (trial starting point) — chart path is alloy.resources
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 300Mi

# ClusterIP Service exposing the Alloy HTTP port (12345) as `http-metrics`.
# Verified against the live pod: containerPort 12345 named `http-metrics`,
# launched with `--server.http.listen-addr=0.0.0.0:12345`, and /metrics serves
# the self-telemetry used by the rules/dashboards below.
# Internal only: no ingress, no hostPort, NodePort/LoadBalancer not used.
service:
  enabled: true
  type: ClusterIP

# Requires service.enabled (chart template gates on both). Port name
# `http-metrics` is hardcoded by the chart service and matches it.
# `release: monitoring` is REQUIRED: the Prometheus CR sets
# serviceMonitorSelector.matchLabels={release: monitoring}, so without this
# label the ServiceMonitor is created but never scraped.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
  interval: 30s
  scrapeTimeout: 10s
  relabelings:
    - action: replace
      replacement: alloy
      targetLabel: cluster
    # pyroscope_ebpf_* carries no node label by default (ServiceMonitor targets
    # get namespace/pod/service/job/instance/endpoint/container only). Alloy is a
    # DaemonSet, so carrying the pod's node lets rules/dashboards attribute
    # coverage per node.
    # CRD field is camelCase `sourceLabels` — writing the Prometheus-native
    # `source_labels` is an unknown field that the API server silently prunes.
    - action: replace
      sourceLabels:
        - __meta_kubernetes_pod_node_name
      targetLabel: node

# Disable the chart's built-in RBAC/SA — we provide explicit ClusterRole
# via config/rbac.yaml (chart's default Role is namespaced and insufficient
# for cross-namespace pod discovery).
rbac:
  create: false

serviceAccount:
  create: false
  name: alloy
