# RBAC for the Alloy eBPF profiler (discovery.kubernetes needs pod listing
# across namespaces; chart-managed RBAC covers same-namespace only).
# ClusterRole is required because Alloy runs in `alloy` namespace but discovers
# pods in `calypso` namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-ebpf-profiler
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-ebpf-profiler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-ebpf-profiler
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: alloy
