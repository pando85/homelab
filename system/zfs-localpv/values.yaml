zfs-localpv:
  # Pin to PR #777 fix image for runPipe deadlock (openebs/zfs-localpv#773).
  # Remove this override and revert tag to chart default once upstream ships the fix.
  zfsPlugin:
    image:
      registry: ghcr.io/
      repository: linkvt/zfs-driver
      tag: runpipe-773
  zfsNode:
    resources: {}
    # limits:
    #   cpu: 10m
    #   memory: 32Mi
    # requests:
    #   cpu: 10m
    #   memory: 32Mi
    # Selects the nodes that actually have a ZFS pool, labelled from
    # metal/inventory/host_vars. Not arch: k8s-amd64-1 is amd64 but has no pool,
    # and its node plugin reports 2/2 Running regardless. Those labels must exist
    # before this is applied, or zfsNode has no eligible node.
    nodeSelector:
      storage.zfspv: "true"
  zfsController:
    resources: {}
    # limits:
    #   cpu: 10m
    #   memory: 32Mi
    # requests:
    #   cpu: 10m
    #   memory: 32Mi
    snapshotter:
      extraArgs:
        - -v=1
    snapshotController:
      extraArgs:
        - -v=1

  backupGC:
    enabled: true
