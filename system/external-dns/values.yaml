external-dns:
  interval: 2m
  # logLevel: debug
  provider:
    name: cloudflare
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: external-dns-cloudflare
          key: token
  extraArgs:
    - --annotation-filter=external-dns.kubernetes.io/enabled=true
  # policy sync for fully handle the domain
  policy: upsert-only

  sources:
    - service
    - ingress
    # gateway-httproute reads Gateway API HTTPRoutes (target from the Gateway, annotation filter
    # applies to the route); crd reads DNSEndpoint objects. Not gateway-tcproute: v1alpha2 only.
    - gateway-httproute
    - crd
  domainFilters:
    - grigri.cloud
    - forkline.dev
    - forkline.io
    - mintpsicologia.es
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
  resources:
    requests:
      cpu: 10m
      memory: 14Mi
    limits:
      memory: 64Mi
