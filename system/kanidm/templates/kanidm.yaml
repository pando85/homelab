apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
    # Argo does not diff a field that was removed from git (server-side apply keeps no last-applied
    # annotation), so dropping `spec.ingress` alone never reached the cluster. This annotation
    # forced one apply that pruned the fields Argo owned. The remaining `spec.ingress` fields
    # belong to older managers and need a manual `remove /spec/ingress` patch before the
    # operator deletes its Ingress.
    homelab.grigri.cloud/spec-ingress-removed: "2026-11-10"
spec:
  domain: idm.grigri.cloud
  replicaGroups:
    - name: default
      replicas: 2
      role: write_replica
      primaryNode: true
      # reload TLS certs automatically
      statefulSetAnnotations:
        reloader.stakater.com/auto: 'true'

      resources:
        requests:
          cpu: 10m
          memory: 90Mi
        limits:
          memory: 2Gi
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              kanidm.kaniop.rs/cluster: kanidm
              kanidm.kaniop.rs/replica-group: default
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule

  # renovate: datasource=docker
  image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
  logLevel: info

  env:
    - name: KANIDM_TRUST_X_FORWARD_FOR
      value: "true"
    - name: KANIDM_DB_FS_TYPE
      value: "zfs"

  oauth2ClientNamespaceSelector: {}
  groupNamespaceSelector: {}
  personNamespaceSelector: {}
  serviceAccountNamespaceSelector: {}
  storage:
    volumeClaimTemplate:
      metadata:
        labels:
          app.kubernetes.io/instance: kanidm
          app.kubernetes.io/name: kanidm
          backup: kanidm-zfs
          backup/retain: quaterly
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi

  ldapPortName: ldaps

  # The pods serve HTTPS and LDAPS from `kanidm-tls` (see certificate-tls.yaml).
  tlsSecretName: kanidm-tls

  # Envoy Gateway route.
  gateway:
    annotations:
      # the target (grigri.cloud) comes from the external Gateway
      external-dns.kubernetes.io/enabled: "true"
    parentRefs:
      - name: external
        namespace: envoy-gateway
        sectionName: https-grigri-cloud
    # Kanidm serves the Let's Encrypt certificate for idm.grigri.cloud on 8443
    backendTlsPolicy:
      validation:
        hostname: idm.grigri.cloud
        wellKnownCaCertificates: System

  securityContext:
    runAsUser: 389
    runAsGroup: 389
    fsGroup: 389
    fsGroupChangePolicy: "OnRootMismatch"
