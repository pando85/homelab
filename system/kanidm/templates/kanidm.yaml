apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  domain: idm.grigri.cloud
  replicaGroups:
    - name: default
      replicas: 2
      role: write_replica
      primaryNode: true
      # reload TLS certs automatically
      statefulSetAnnotations:
        reloader.stakater.com/auto: 'true'

      resources:
        requests:
          cpu: 10m
          memory: 90Mi
        limits:
          memory: 2Gi
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              kanidm.kaniop.rs/cluster: kanidm
              kanidm.kaniop.rs/replica-group: default
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule

  # renovate: datasource=docker
  image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
  logLevel: info

  env:
    - name: KANIDM_TRUST_X_FORWARD_FOR
      value: "true"
    - name: KANIDM_DB_FS_TYPE
      value: "zfs"

  oauth2ClientNamespaceSelector: {}
  groupNamespaceSelector: {}
  personNamespaceSelector: {}
  serviceAccountNamespaceSelector: {}
  storage:
    volumeClaimTemplate:
      metadata:
        labels:
          app.kubernetes.io/instance: kanidm
          app.kubernetes.io/name: kanidm
          backup: kanidm-zfs
          backup/retain: quaterly
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi

  ldapPortName: ldaps

  ingress:
    annotations:
      external-dns.kubernetes.io/enabled: "true"
      external-dns.kubernetes.io/hostname: idm.grigri.cloud
      external-dns.kubernetes.io/ingress-hostname-source: annotation-only
      external-dns.kubernetes.io/target: grigri.cloud
      cert-manager.io/cluster-issuer: letsencrypt-prod-dns
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      # Enable source IP-based load balancing for consistent routing
      nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    ingressClassName: nginx-external
    tlsSecretName: idm-external-tls-certificate
    extraTlsHosts:
      - ldaps.idm.internal.grigri.cloud

  # Envoy Gateway route (ingress-nginx migration). `spec.ingress` above stays: it owns the
  # `idm-external-tls-certificate` the pods mount (also the ldaps SAN). Before removing it, set
  # `spec.tlsSecretName: idm-external-tls-certificate` and add an explicit Certificate.
  gateway:
    annotations:
      # the target (grigri.cloud) comes from the external Gateway
      external-dns.kubernetes.io/enabled: "true"
    parentRefs:
      - name: external
        namespace: envoy-gateway
        sectionName: https-grigri-cloud
    # Kanidm serves the Let's Encrypt certificate for idm.grigri.cloud on 8443
    backendTlsPolicy:
      validation:
        hostname: idm.grigri.cloud
        wellKnownCaCertificates: System

  securityContext:
    runAsUser: 389
    runAsGroup: 389
    fsGroup: 389
    fsGroupChangePolicy: "OnRootMismatch"
