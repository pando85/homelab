{{- if .Values.restore.enabled }}
apiVersion: kaniop.rs/v1beta1
kind: KanidmRestore
metadata:
  name: {{ .Release.Name }}-restore
spec:
  restoreImage: {{ .Values.image.repository }}:{{ .Values.image.tag }}
  source:
    local:
      fileName: {{ .Values.restore.fileName | quote }}
  safetyBackup:
    repositoryRef:
      name: kanidm
  targetRef:
    name: kanidm
    uid: {{ .Values.restore.targetUid | quote }}
{{- end }}
