app-template:
  controllers:
    bazarr:
      labels:
        backup/retain: weekly
      type: statefulset
      pod:
        nodeSelector:
          kubernetes.io/hostname: prusik
      containers:
        bazarr:
          image:
            repository: ghcr.io/home-operations/bazarr
            tag: 1.6.2@sha256:b8434a7339ebd9c2bfe4464c28db79944e0f52f47da85345fc7e0563c19f83ac

          env:
            TZ: Europe/Madrid
          resources:
            requests:
              cpu: 10m
              memory: 250Mi
            limits:
              cpu: 1
              memory: 1Gi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5

        subcleaner:
          image:
            repository: registry.k8s.io/git-sync/git-sync
            tag: v4.8.0
          args:
            - --repo=https://github.com/KBlixt/subcleaner.git
            - --branch=master
            - --depth=1
            - --period=6h
            - --root=/add-ons/subcleaner
  service:
    bazarr:
      controller: bazarr
      ports:
        http:
          port: 6767

  # Envoy Gateway routes.
  # The internal route carries the external-dns annotation (the Gateway address is published in DNS). The external
  # route is behind the OIDC SecurityPolicy (templates/security-policy.yaml).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      forceRename: bazarr-internal
      hostnames:
        - bazarr.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: bazarr
              port: 6767
    external:
      kind: HTTPRoute
      # stable name: the SecurityPolicy targets it
      forceRename: bazarr-external
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - bazarr.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: bazarr
              port: 6767
    # PWA manifest: browsers fetch it without credentials (no login redirect)
    external-manifest:
      kind: HTTPRoute
      forceRename: bazarr-external-manifest
      hostnames:
        - bazarr.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - matches:
            - path:
                type: Exact
                value: /manifest.webmanifest
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                remove:
                  # bypass routes carry no SecurityPolicy: never let a client choose the user
                  - X-Auth-Request-User
                  - X-Auth-Request-Email
                  - X-Auth-Request-Preferred-Username
                  - X-Auth-Request-Groups
                  - X-Auth-Request-Access-Token
          backendRefs:
            - identifier: bazarr
              port: 6767
  defaultPodOptions:
    securityContext:
      runAsUser: 995
      runAsGroup: 501
      fsGroup: 501
      fsGroupChangePolicy: "OnRootMismatch"

  persistence:
    config:
      enabled: true
      existingClaim: config-bazarr
      advancedMounts:
        bazarr:
          bazarr:
            - path: /config
    series:
      enabled: true
      type: hostPath
      hostPath: /datasets/series
      advancedMounts:
        bazarr:
          bazarr:
            - path: /datasets/series
    peliculas:
      enabled: true
      type: hostPath
      hostPath: /datasets/peliculas
      advancedMounts:
        bazarr:
          bazarr:
            - path: /datasets/peliculas
    add-ons:
      enabled: true
      type: emptyDir
      advancedMounts:
        bazarr:
          bazarr:
            - path: /add-ons
          subcleaner:
            - path: /add-ons
