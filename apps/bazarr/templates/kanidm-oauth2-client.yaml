---
# OIDC client for the Envoy Gateway SecurityPolicy (external route; replaces the shared oauth2-proxy
# client for this app). Kanidm only issues tokens to the scope map group below.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: bazarr
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: bazarr
  origin: https://bazarr.grigri.cloud/
  redirectUrl:
    - https://bazarr.grigri.cloud/oauth2/callback
  # same group nginx allows today (`allowed_groups=bazarr-users@idm.grigri.cloud`)
  scopeMap:
    - group: bazarr-users
      scopes: [openid, profile, email, groups]
  preferShortUsername: true
  strictRedirectUrl: true
  # Envoy Gateway reads the client secret from the `client-secret` key
  secretKeyAliases:
    clientSecret:
      - client-secret
