app-template:
  controllers:
    wallabag:
      labels:
        backup/retain: quaterly
      replicas: 1
      # HA is not supported
      strategy: Recreate
      containers:
        wallabag:
          image:
            repository: wallabag/wallabag
            tag: 2.6.15.1

          envFrom:
            - secretRef:
                name: wallabag-secret
          env:
            POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: wallabag.wallabag-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            SYMFONY__ENV__DATABASE_USER:
              valueFrom:
                secretKeyRef:
                  name: wallabag.wallabag-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: wallabag.wallabag-postgres.credentials.postgresql.acid.zalan.do
                  key: password
            SYMFONY__ENV__DATABASE_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: wallabag.wallabag-postgres.credentials.postgresql.acid.zalan.do
                  key: password
            SYMFONY__ENV__DATABASE_DRIVER: pdo_pgsql
            SYMFONY__ENV__DATABASE_HOST: wallabag-postgres
            SYMFONY__ENV__DATABASE_PORT: 5432
            SYMFONY__ENV__DATABASE_NAME: wallabag
            SYMFONY__ENV__DOMAIN_NAME: https://wallabag.grigri.cloud
            SYMFONY__ENV__FOSUSER_REGISTRATION: false

          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                initialDelaySeconds: 30
                failureThreshold: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 145Mi
            limits:
              memory: 5Gi

          securityContext:
            runAsUser: 0

  defaultPodOptions:
    enableServiceLinks: false
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: wallabag
            app.kubernetes.io/name: wallabag
  service:
    wallabag:
      controller: wallabag
      ports:
        http:
          port: 80
  # Envoy Gateway route.
  # The PHP_SESSION_UPLOAD_PROGRESS block is an EnvoyExtensionPolicy (templates/envoy-extension-policy.yaml).
  route:
    external:
      kind: HTTPRoute
      forceRename: wallabag-external
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - wallabag.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: wallabag
              port: 80

  configMaps:
    php-cve-mitigation:
      enabled: true
      data:
        99-cve.ini: |
          memory_limit=-1
          session.upload_progress.enabled=0

  persistence:
    images:
      enabled: true
      globalMounts:
        - path: /var/www/wallabag/web/assets/images
      existingClaim: wallabag-images
    php-cve-mitigation:
      enabled: true
      type: configMap
      name: wallabag
      globalMounts:
        - path: /etc/php81/conf.d/99-cve.ini
          subPath: 99-cve.ini
          readOnly: true
