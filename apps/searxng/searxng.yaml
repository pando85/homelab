# renovate: datasource=docker depName=searxng/searxng
controllers:
  searxng:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: docker.io/searxng/searxng
          tag: 2026.8.29-d226b78bc
        env:
          SEARXNG_BASE_URL: https://searxng.internal.grigri.cloud/
          SEARXNG_SECRET:
            valueFrom:
              secretKeyRef:
                name: searxng-secret
                key: SEARXNG_SECRET
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - "ALL"
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi

defaultPodOptions:
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 977
    runAsGroup: 977
    fsGroup: 977
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

service:
  app:
    controller: searxng
    ports:
      http:
        port: 8080

ingress:
  searxng:
    enabled: true
    className: nginx-internal
    annotations:
      external-dns.alpha.kubernetes.io/enabled: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    hosts:
      - host: &host searxng.internal.grigri.cloud
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - hosts:
          - *host
        secretName: searxng-tls-certificate
  searxng-external:
    enabled: true
    className: nginx-external
    annotations:
      external-dns.alpha.kubernetes.io/enabled: "true"
      external-dns.alpha.kubernetes.io/target: grigri.cloud
      cert-manager.io/cluster-issuer: letsencrypt-prod-dns
      nginx.ingress.kubernetes.io/auth-url: https://auth.grigri.cloud/oauth2/auth?allowed_groups=searxng-users@idm.grigri.cloud
      nginx.ingress.kubernetes.io/auth-signin: https://auth.grigri.cloud/oauth2/start
      nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User, X-Auth-Request-Email
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    hosts:
      - host: &hostext searxng.grigri.cloud
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - hosts:
          - *hostext
        secretName: searxng-external-tls-certificate

persistence:
  settings:
    enabled: true
    type: configMap
    name: searxng-settings
    globalMounts:
      - path: /etc/searxng/settings.yml
        subPath: settings.yml
        readOnly: true
