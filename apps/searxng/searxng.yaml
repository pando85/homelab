# renovate: datasource=docker depName=searxng/searxng
controllers:
  searxng:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: docker.io/searxng/searxng
          tag: 2026.8.29-d226b78bc
        env:
          SEARXNG_BASE_URL: https://searxng.internal.grigri.cloud/
          SEARXNG_SECRET:
            valueFrom:
              secretKeyRef:
                name: searxng-secret
                key: SEARXNG_SECRET
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - "ALL"
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi

defaultPodOptions:
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 977
    runAsGroup: 977
    fsGroup: 977
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

service:
  app:
    controller: searxng
    ports:
      http:
        port: 8080

persistence:
  settings:
    enabled: true
    type: configMap
    name: searxng-settings
    globalMounts:
      - path: /etc/searxng/settings.yml
        subPath: settings.yml
        readOnly: true
