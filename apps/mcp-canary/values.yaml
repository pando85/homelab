# Diagnostic canary for the MCP gateway foundation. Faithful agentgateway v1.7.0
# pod with no identity, no backends, no routes, no Ingress - only the listening
# shape and the NetworkPolicy. Used to isolate which policy type (ingress vs
# egress) caused kubelet startup-probe timeouts on prusik.
#
# `policyMode` controls which NetworkPolicy is rendered:
#   - none:    no NetworkPolicy at all (baseline)
#   - ingress: ingress-only policy (TCP3000 from ingress-nginx-external, TCP15020
#              from monitoring/prometheus; NO 15021 rule, mirroring the foundation)
#   - egress:  egress-only policy (DNS UDP+TCP53, TCP443 to ingress-nginx-external,
#              TCP8443 to kanidm; no backend peers)
# One policy type per mode, never both.
#
# `rolloutNonce` is a string rendered as a pod annotation. Every phase change
# (policyMode flip) MUST bump the nonce so the pod is recreated with the policy
# ALREADY present - applying a NetworkPolicy to a running pod does not reproduce
# the startup-probe timeout the foundation saw.
policyMode: none
rolloutNonce: "1"

app-template:
  controllers:
    agentgateway:
      type: deployment
      strategy: RollingUpdate
      replicas: 1
      pod:
        enableServiceLinks: false
        automountServiceAccountToken: false
        # rolloutNonce as an annotation: bumping it recreates the pod, so the
        # NetworkPolicy is present before the first probe.
        annotations:
          mcp-canary.grigri.cloud/rollout-nonce: "0"
        nodeSelector:
          kubernetes.io/hostname: prusik
      containers:
        main:
          image:
            # renovate: datasource=docker depName=cr.agentgateway.dev/agentgateway
            repository: cr.agentgateway.dev/agentgateway
            tag: v1.7.0
          args:
            - -f
            - /config/config.yaml
          env:
            TZ: Europe/Madrid
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet: &httpGet
                  path: /healthz/ready
                  port: &healthzPort 15021
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet: *httpGet
                failureThreshold: 30
                periodSeconds: 10

  persistence:
    config:
      enabled: true
      type: configMap
      name: "{{ .Release.Name }}-config"
      advancedMounts:
        agentgateway:
          main:
            - path: /config/config.yaml
              subPath: config.yaml
              readOnly: true
    tmp:
      enabled: true
      type: emptyDir
      sizeLimit: 64Mi
      advancedMounts:
        agentgateway:
          main:
            - path: /tmp

  service:
    agentgateway:
      controller: agentgateway
      type: ClusterIP
      ports:
        http:
          port: &httpPort 3000
          protocol: TCP

# Gateway port (the MCP endpoint port; no route answers here).
gateway:
  port: 3000
