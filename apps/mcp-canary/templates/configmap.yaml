apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    config:
      # adminAddr off: no admin surface reachable.
      # The canary has no identity, no backends, no routes - it only needs
      # to listen on the gateway port and answer /healthz/ready on 15021.
      adminAddr: "off"
      # NOTE: No session.key is configured. agentgateway will generate a
      # session key at startup and attempt to write it back to this config
      # file (which is read-only). This will log a warning:
      #   "failed to write generated session key: Read-only file system"
      # The binary then falls back to unencrypted MCP session IDs and boots
      # successfully. This is acceptable for the canary because:
      #   - No routes/sessions are tested (routes: [])
      #   - No identity or backends are configured
      #   - The readiness endpoint still responds
      # This is a canary-specific fixture security decision, NOT a production
      # pattern. Production deployments should use SESSION_KEY from
      # ExternalSecret (as in the foundation charts).
      logging:
        format: json
        level: info

    gateways:
      default:
        port: {{ .Values.gateway.port }}

    # No routes: the canary has no identity, no backends, no auth surface.
    # Every request answers 404; the canary only proves the pod can start
    # and the probes can pass under each NetworkPolicy mode.
    routes: []
