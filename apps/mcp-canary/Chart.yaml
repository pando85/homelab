apiVersion: v2
name: mcp-canary
description: >
  Diagnostic canary for the MCP gateway foundation. Isolates which NetworkPolicy
  type (ingress vs egress) caused kubelet startup-probe timeouts on prusik. Faithful
  agentgateway v1.7.0 pod with no identity, no backends, no routes, no Ingress -
  only the listening shape and the policy. One extra empty namespace may remain after
  cleanup (harmless, never kubectl delete).
type: application
version: 0.1.0
appVersion: "1.7.0"
dependencies:
  - name: app-template
    version: 5.3.0
    repository: https://bjw-s-labs.github.io/helm-charts/
