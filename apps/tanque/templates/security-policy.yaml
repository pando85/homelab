---
# Envoy Gateway native OIDC against Kanidm + JWT authorization on the `access` claim.
# Pattern: docs/conventions/gateway-api-routes.md ("Authentication")
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tanque-external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tanque-external
  oidc:
    provider:
      issuer: https://idm.grigri.cloud/oauth2/openid/tanque-envoy
      # explicit endpoints: no OIDC discovery at translation time
      authorizationEndpoint: https://idm.grigri.cloud/ui/oauth2
      tokenEndpoint: https://idm.grigri.cloud/oauth2/token
    clientID: tanque-envoy
    clientSecret:
      name: tanque-envoy-kanidm-oauth2-credentials
    redirectURL: https://tanque.grigri.cloud/oauth2/callback
    # the default `/logout` would shadow the app's own path
    logoutPath: /oauth2/logout
    scopes: [openid, profile, email]
    cookieNames:
      accessToken: oidc-access-token
      idToken: oidc-id-token
  jwt:
    providers:
      - name: kanidm
        issuer: https://idm.grigri.cloud/oauth2/openid/tanque-envoy
        audiences: [tanque-envoy]
        extractFrom:
          cookies: [oidc-id-token]
        remoteJWKS:
          uri: https://idm.grigri.cloud/oauth2/openid/tanque-envoy/public_key.jwk
        # nginx passes no identity headers to tanque: no claimToHeaders
  authorization:
    defaultAction: Deny
    rules:
      - name: allowed-access
        action: Allow
        principal:
          jwt:
            provider: kanidm
            claims:
              # claim map of the tanque-envoy client (members of tanque-users)
              - name: access
                valueType: StringArray
                values:
                  - tanque-envoy
---
