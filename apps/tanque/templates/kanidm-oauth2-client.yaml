---
# OIDC client for the Envoy Gateway SecurityPolicies (external routes; replaces the shared
# oauth2-proxy client for this app). Kanidm only issues tokens to the scope map group below.
# Named tanque-envoy: the first client, `tanque`, was created during a Kanidm replica race and its
# Kubernetes Secret is not the secret Kanidm holds (token exchange: "Invalid OAuth2 client_id
# secret"). A fresh client under another name avoids deleting the Secret by hand.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: tanque-envoy
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: tanque-envoy
  origin: https://tanque.grigri.cloud/
  redirectUrl:
    - https://tanque.grigri.cloud/oauth2/callback
    - https://tanque-stream.grigri.cloud/oauth2/callback
  # same group nginx allows today (`allowed_groups=tanque-users@idm.grigri.cloud`)
  scopeMap:
    - group: tanque-users
      scopes: [openid, profile, email]
  # per-app claim for the SecurityPolicy authorization: small, unlike the `groups` scope, which
  # lists every group of the person and overflowed the 4096 B `oidc-id-token` cookie
  claimMap:
    - name: access
      joinStrategy: array
      valuesMap:
        - group: tanque-users
          values: [tanque-envoy]
  preferShortUsername: true
  strictRedirectUrl: true
  # Envoy Gateway reads the client secret from the `client-secret` key
  secretKeyAliases:
    clientSecret:
      - client-secret
