---
# OIDC client for the Envoy Gateway SecurityPolicy (external routes; replaces the shared oauth2-proxy
# client for this app). Kanidm only issues tokens to the scope map group below.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: tanque
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: tanque
  origin: https://tanque.grigri.cloud/
  redirectUrl:
    - https://tanque.grigri.cloud/oauth2/callback
    - https://tanque-stream.grigri.cloud/oauth2/callback
  # same group nginx allows today (`allowed_groups=tanque-users@idm.grigri.cloud`)
  scopeMap:
    - group: tanque-users
      scopes: [openid, profile, email, groups]
  preferShortUsername: true
  strictRedirectUrl: true
  # Envoy Gateway reads the client secret from the `client-secret` key
  secretKeyAliases:
    clientSecret:
      - client-secret
