# Egress-only on purpose. The shadow service must not be able to reach anything but Home Assistant
# (read-only API), the long-term Prometheus and DNS - in particular no Modbus (tcp/502) path to the
# battery or inverter. There is deliberately NO Ingress section and no `Ingress` in policyTypes:
# ingress isolation would put kubelet probes and Prometheus scrapes under policy, and that is what
# the Cilium stale-datapath bug breaks (docs/troubleshooting/cilium-stale-bpf-egress.md).
# podSelector {} covers the resident service and the pipeline CronJob pods, which need the same
# egress. Cilium matches in-cluster peers by identity, so pod/namespace selectors are used for
# them (an ipBlock never matches a pod IP); ipBlock is kept only for the nodelocaldns address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: battery-optimizer-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS: pods query the kube-dns ClusterIP, which Cilium redirects (LRP) to nodelocaldns; cache
    # misses go to CoreDNS. Both pod identities, plus the nodelocaldns link-local address.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
        - ipBlock:
            cidr: 169.254.25.10/32
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Home Assistant (REST + WebSocket, read-only token)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-assistant
          podSelector:
            matchLabels:
              app.kubernetes.io/name: home-assistant
              app.kubernetes.io/controller: hass
      ports:
        - port: 8123
          protocol: TCP
    # Long-term Prometheus (history queries)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: long-term-prometheus
      ports:
        - port: 9090
          protocol: TCP
