apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: battery-optimizer-home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: battery-optimizer-home-assistant
  data:
    - secretKey: BATTERY_OPTIMIZER_HA_TOKEN
      remoteRef:
        key: /battery-optimizer/home-assistant
        property: token
