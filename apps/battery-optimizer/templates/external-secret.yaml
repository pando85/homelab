apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: battery-optimizer-home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: battery-optimizer-home-assistant
  data:
    - secretKey: BATTERY_OPTIMIZER_HA_TOKEN
      remoteRef:
        key: /battery-optimizer/home-assistant
        property: token
{{- $overrides := .Files.Get "files/service-overrides.yaml" | fromYaml }}
{{- if not (hasKey $overrides "mode") }}
{{- fail "files/service-overrides.yaml has no mode key: the operating mode (shadow, dry_run or live) must be explicit there" }}
{{- end }}
{{- if and (eq $overrides.mode "live") (not .Values.global.liveHomeAssistantToken) }}
{{- fail "files/service-overrides.yaml has mode: live but global.liveHomeAssistantToken is false: live must use the battery-optimizer-live user's token" }}
{{- end }}
{{- if .Values.global.liveHomeAssistantToken }}
---
# Live control token (ADR-0007): the non-admin `battery-optimizer-live` user. Same key as the
# read-only secret, so BATTERY_OPTIMIZER_HA_TOKEN_FILE does not change. Service only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: battery-optimizer-home-assistant-live
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: battery-optimizer-home-assistant-live
  data:
    - secretKey: BATTERY_OPTIMIZER_HA_TOKEN
      remoteRef:
        key: /battery-optimizer/home-assistant-live
        property: token
{{- end }}
