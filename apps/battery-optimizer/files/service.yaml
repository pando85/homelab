---
# Resident shadow service configuration (ADR-0004, plan §16 Phase C).
#
# Entity IDs are configuration, not data: committing them is fine, committing their
# values or history is not.  Endpoints and the token never live here — they come from
# BATTERY_OPTIMIZER_HA_URL, BATTERY_OPTIMIZER_HA_TOKEN (or ..._HA_TOKEN_FILE) and
# BATTERY_OPTIMIZER_PROMETHEUS_URL.  Override this whole file with
# BATTERY_OPTIMIZER_SERVICE_CONFIG.
#
# mode: shadow (default) has no actuation path.  Its Home Assistant adapter refuses
# every WebSocket message type outside a read-only allowlist and every REST method but
# GET, so nothing in this file can make it write a state.  The one service call it can
# make is the non-mutating `weather.get_forecasts` query (see `archive:` below); every
# other service call is refused in code, whatever this file says.
#
# mode: dry_run computes and records (service/v1/actuation/) every Omnibattery write the
# `actuation:` section below would make, and sends nothing.  mode: live sends them, and only
# them: the guard admits switch.turn_on/off, number.set_value and input_datetime.set_datetime
# on exactly the entities of `actuation.entities` (never the kill switch), with bounded values
# (ADR-0007).  REST stays GET-only in every mode.  live uses the separate token of the non-admin
# HA user battery-optimizer-live (own Vault KV path); shadow/dry_run the read-only one.
version: 1
mode: live
timezone: Europe/Madrid

home_assistant:
  request_timeout_s: 15
  reconnect:
    initial_delay_s: 1
    max_delay_s: 60
    jitter_frac: 0.2
  heartbeat:
    interval_s: 30
    timeout_s: 10
  # REST GET refresh of the planning entities.  HA fires no state_changed event while a
  # sensor keeps reporting the same value, so an idle SOC would look stale without it;
  # the poll reads last_reported, which HA refreshes on every report.
  poll_interval_s: 60

prometheus:
  timeout_s: 60
  history_days: 28

# Role -> entity ID.  Shelly meter and PVPC sensor verified against the live registry with
# a read-only token on 2026-10-25; the battery roles (Marstek Venus E V3 behind Omnibattery,
# device name `venus`) mapped at commissioning on 2026-11-03 (docs/components/regime-log.md).
entities:
  # Signed net-grid power, positive = import.  Sign verified 2026-11-03: it went negative
  # (-10..-94 W) during a brief export of the commissioning discharge test.
  grid_power: sensor.shellyem_main_channel_1_power
  # Whole-home import counter (kWh); slot energy comes from its deltas.
  grid_energy: sensor.shellyem_main_channel_1_energy
  # PVPC (pvpc_updated): price_HHh today, price_next_day_HHh after publication,
  # "_d" suffix on the repeated fall-back hour.
  price: sensor.esios_pvpc
  battery_soc: sensor.venus_battery_soc   # %
  # Signed, + charge.  Not mapped: sensor.venus_ac_power is + while DISCHARGING (the
  # actuator corrects that with actuation.battery_ac_power_sign; this role has no sign
  # setting), and the counters below carry the energy.
  battery_power: null
  battery_charge_power: null
  battery_discharge_power: null
  # Cumulative kWh, AC side (verified 2026-11-03: a supervised charge read 0.180 kWh against
  # 0.182 kWh of integrated AC power and 0.165 kWh DC; the discharge agreed with AC within the
  # 0.01 kWh resolution).  The discharge counter includes what the battery supplies to the
  # backup (EPS) port (measured 2026-11-03, docs/components/data-pipeline.md).  The live
  # service history and the offline `build` (gross = grid - charge + discharge) read these two.
  battery_charge_energy: sensor.venus_total_charging_energy
  battery_discharge_energy: sensor.venus_total_discharging_energy
  # Read-only context recorded with each slot (never written).  The Omnibattery control
  # surface can be added here, e.g. number.omnibattery_pd_target_grid_power,
  # switch.*_battery_allow_charge, switch.*_battery_allow_discharge,
  # switch.omnibattery_system_power_limits, number.omnibattery_system_max_charge_power,
  # number.omnibattery_system_max_discharge_power (0 = UNLIMITED, not zero output),
  # sensor.omnibattery_integration_status.
  observed:
    - sensor.shellyem_main_channel_2_power

# Read by the offline dataset build, by `extract --entities` and by the `serve` load history.
# Not in config/tariff.yaml: that file's hash is part of every dataset_id (ADR-0006).
battery:
  # First instant at which the battery may exchange energy, ISO-8601 WITH a UTC offset.
  # From this instant on `build` and the service history refuse the no-battery assumption:
  # gross load = grid - charge + discharge, or the interval is unusable.  A slot that ends
  # at or before it is the grid counter alone, exactly as before.  Commissioned 2026-11-03:
  # the battery's AC input was first energised at 20:14:32 local (regime log).
  commissioned_at: "2026-11-03T19:14:32.572Z"

# Maximum source age (seconds since HA last_reported) before an input is stale.
freshness_s:
  grid_power: 300
  grid_energy: 900
  # null (the default): availability only, no age test, as actuation.freshness_s.battery_soc.
  # Omnibattery reports the SOC only on change (last_reported is not refreshed for an unchanged
  # value, verified 2026-11-03), so an idle battery's SOC looks hours old while healthy; it keeps
  # its last value when Modbus fails, which actuation.entities.battery_liveness catches instead.
  # A number restores the age test.
  battery_soc: null
  # The battery AC energy counters: null (the default) for the same reason, verified at go-live
  # on 2026-11-03 (an idle battery's counters never re-report, so the former inherited 900 s of
  # grid_energy marked them stale in /status and battery_optimizer_input_stale).  They gate
  # neither planning nor actuation.  A number restores the age test.
  battery_charge_energy: null
  battery_discharge_energy: null
  battery_power: 300

planning:
  # entity:    plan from the live battery SOC entity (refuses to plan when it is missing,
  #            unavailable, out of range, older than freshness_s.battery_soc when that is set,
  #            or while actuation.entities.battery_liveness is not exactly `None`).
  # simulated: a virtual battery whose SOC evolves by applying the service's own decisions
  #            against the measured load.
  soc_source: entity
  interval_seconds: 900
  # Plans start at the next slot boundary and are solved this long before it.
  solve_lead_s: 120
  solve_timeout_s: 60
  solver_time_limit_s: 20
  # A plan stays the authority for this many slots after its first one, then expires.
  plan_ttl_slots: 2
  min_horizon_slots: 4
  max_horizon_slots: 192
  forecast_window_days: 28
  # Registered load forecaster (battery_optimizer.load_forecast). Oracles such as
  # `perfect` are offline-only and refused here.
  load_forecaster: trailing_mean
  # EUR/DC-kWh on end-of-horizon SOC: `trailing_mean` = mean PVPC over the history
  # window (the benchmark's default rule), or an explicit number.
  terminal_value: trailing_mean
  # Wear convention: EUR per AC kWh charged and per AC kWh discharged (planning only, never in
  # reported cost).  0.01 is the knee of the rolling-horizon sweep (largest value that keeps the
  # saving within 5% of the 0-cost saving in S2 winter, S3 winter and summer);
  # see docs/components/battery-model.md.  Re-run hack/throughput_sweep.py on real battery data.
  throughput_cost_eur_per_kwh: 0.01
  # High-SOC dwell cost: EUR per kWh of SOC above high_soc_threshold_frac, per hour held (planning
  # only, never in reported cost; LFP calendar aging is worse at high SOC).  0 = off, today's
  # behaviour.  Applies on a full-charge day too, so the 100% checkpoint finishes close to the
  # discharge.  Value chosen by hack/high_soc_dwell_sweep.py, see docs/planning/high-soc-dwell-cost.md.
  high_soc_threshold_frac: 0.90
  high_soc_cost_eur_per_kwh_h: 0.0
  # Thermal soft cap on charge power: EUR per AC kWh charged above charge_soft_cap_kw in a slot
  # (planning only, never in reported cost; the battery's internal temperature rises with charge
  # power and LFP ageing is worse hot).  0 = off, today's behaviour.  Composes with the dwell cost and
  # the full-charge checkpoint.  Value chosen by hack/charge_soft_cap_sweep.py, see
  # docs/planning/thermal-charge-soft-cap.md.
  charge_soft_cap_kw: 1.5
  charge_soft_cap_eur_per_kwh: 0.0
  # Bound each slot's planned discharge by forecast load - actuation.discharge_margin_w (floored
  # at 0), the most the live actuator can deliver because it keeps that much grid import.  false =
  # off, today's plan (discharge bounded by the load alone).  See docs/known-issues.md, "Planned
  # discharge is not delivered".
  discharge_margin_bound: false
  # Read-only thermal state and derate prediction (docs/planning/thermal-derate-aware-planning.md,
  # docs/service.md "Thermal shadow").  off (default): nothing is read, recorded or exposed, today's
  # service byte for byte.  shadow: reads Omnibattery's Temperature Charge Limit entities and the
  # battery temperature and AC power, keeps a first-order thermal model (daily guarded refit,
  # persisted under service/v1/state/), and records beside every plan the predicted temperature and
  # achievable charge power per slot, scored when the slot closes.  Observability only: no plan, hash
  # or actuation changes in either mode, and no entity here is ever written (nothing joins the
  # ha_guard allowlist).  Needs actuation.entities.battery_ac_power and its sign.
  thermal:
    mode: "off"                  # off | shadow (quote it: bare YAML off is a boolean)
    entities:
      # Shared with battery_health.entities.temperature (they must agree; either may be omitted).
      temperature: sensor.venus_internal_temperature
      limit_switch: switch.omnibattery_temp_charge_limit
      # Optional: without it the discharge side is never derated in the prediction.
      discharge_switch: switch.omnibattery_temp_charge_limit_discharge
      limit_c: number.omnibattery_temp_charge_limit_c
      band_c: number.omnibattery_temp_charge_limit_band_c
      floor_pct: number.omnibattery_temp_charge_limit_floor_pct
      # Optional: the curve scales with min(system cap, Venus cap); without them charge_limit_kw.
      system_max_charge_power: number.omnibattery_system_max_charge_power
      venus_max_charge_power: number.venus_max_charge_power
    charge_limit_kw: 2.5         # min(system cap, Venus cap) when the cap entities are not read
    driver_min_kw: 0.8           # Omnibattery never derates below the driver minimum
    # The model before any accepted refit (docs/components/battery-thermal.md): tau in minutes, the
    # idle level in degC, the charge and discharge gains in degC per kW.
    prior: {tau_min: 44.0, t_amb_c: 32.6, k_c: 11.0, k_d: 6.9}
    refit_hour_local: 4          # the daily refit runs at (or after) this local hour, and at start-up
  replan:
    soc_change_frac: 0.05
    debounce_s: 30
    min_interval_s: 120

observation:
  # How long after a slot ends late events may still land in it.
  slot_close_grace_s: 20

# Passive, append-only data collection under <data_dir>/service/v1/.  Never read by the
# planner; a failure is counted (battery_optimizer_*) and never affects readiness.
# There is no retention yet: the files grow until pruned by hand.  When this section is
# absent both archives are OFF, so a deployed config must carry it.
archive:
  # One record per state change of entities.price (plus the first state after a start):
  # HA timestamps, state and the raw attributes verbatim, whether price_next_day_* is
  # present.  Measures when the next day's PVPC prices are really published.
  pvpc_snapshots:
    enabled: true
  # weather.get_forecasts for one weather entity, on a fixed UTC grid
  # (offset_minutes past every interval_minutes; interval_minutes must divide 1440).
  # Archives the real forecast HA holds so a forecast temperature can be evaluated later.
  weather_forecast:
    enabled: true
    entity_id: weather.forecast_home
    type: hourly            # hourly | daily | twice_daily
    interval_minutes: 60
    offset_minutes: 5

# Live battery control through Omnibattery (ADR-0007).  Read only in dry_run / live; shadow
# ignores it (it is still validated), except entities.battery_liveness, which every mode reads
# with planning.soc_source: entity.  mode: live also needs planning.soc_source: entity.
actuation:
  entities:
    # Owner's kill switch (HA helper, created by hand; only read).  Nothing is written while
    # it is not `on`; its on -> off edge sets safe idle once.
    kill_switch: input_boolean.battery_optimizer_live
    # Heartbeat helper (has_date + has_time) the HA watchdog automation checks (live only).
    heartbeat: input_datetime.battery_optimizer_heartbeat
    allow_charge: switch.venus_battery_allow_charge
    allow_discharge: switch.venus_battery_allow_discharge
    pd_target: number.omnibattery_pd_target_grid_power         # + = grid import target (W)
    power_limits: switch.omnibattery_system_power_limits
    max_discharge_power: number.omnibattery_system_max_discharge_power  # 0 = UNLIMITED
    integration_status: sensor.omnibattery_integration_status
    battery_ac_power: sensor.venus_ac_power
    battery_soc: sensor.venus_battery_soc                       # %
    # Optional: its state must be exactly `None` (Omnibattery's healthy text); anything else,
    # missing or unavailable holds safe idle (guard reason battery_unresponsive).
    battery_liveness: sensor.omnibattery_non_responsive_batteries
  # +1 when sensor.venus_ac_power is positive while CHARGING, -1 when positive while
  # discharging.  Measured 2026-11-03: -797 W while charging, +797 W while discharging, so
  # -1 (the actuator's house load is grid - sign * ac_power, charge positive).
  battery_ac_power_sign: -1
  tick_interval_s: 30             # <= 120: well inside the 5-minute heartbeat watchdog
  # Highest grid-import target ever written: contracted import 5.0 kW and the meter trips
  # instantly on overload.  The guard refuses any number.set_value above it.  Omnibattery
  # bounds the PD target to its entity min/max, read live: +-2500 W (the batteries' limits)
  # with the system power limits off, [-system max discharge, +system max charge] with them
  # on (-800..+1000 on 2026-11-03).  The written target is min(house load + P, import_cap_w,
  # entity max), so with the limits on the charge is at most system max charge - house load.
  import_cap_w: 4500
  # Measured import above import_cap_w + this while charging: charge off at once, and charge
  # intents refused for import_trip_hold_s.  import_cap_w + this must stay below 5000.
  import_guard_margin_w: 200
  import_trip_hold_s: 300
  neutral_pd_target_w: 0          # PD grid target in a planned idle
  # > 0: small import while discharging, never export.  Omnibattery's PD loop swings about
  # +-150..200 W on a ~2 s period; 50 W gave brief exports (-10..-94 W) on 2026-11-03.  200 W until
  # 2026-11-05 (median import 192-195 W, rarely below 0 W); 100 W since, see docs/known-issues.md.
  discharge_margin_w: 100
  min_discharge_cap_w: 100        # the discharge cap is never written below this (0 = unlimited)
  # Venus E V3 limit: its own max charge/discharge is 2500 W (number.venus_max_charge_power /
  # number.venus_max_discharge_power, min 800, never written here).  Separate from import_cap_w.
  # Go-live: the system caps are 2500/2500 W and Premium mode is on in the Marstek app; without
  # Premium the firmware limits discharge to 800 W, below what this cap and the planner assume.
  max_discharge_cap_w: 2500       # <= 2500
  # Load-following discharge (ADR-0007 amendment 2026-11-07), OFF by default.  In a planned
  # discharge slot, while the measured SOC is at or above the plan's end-of-slot SOC, the discharge
  # cap above is raised from the plan's power to max_w, so the battery covers the real load (an
  # evening heat-pump hot-water cycle the forecast placed an hour off) instead of the forecast
  # one; the PD target stays discharge_margin_w, so no export.  It engages at plan SOC +
  # soc_hysteresis_pct and releases below the plan SOC.  max_w: null = max_discharge_cap_w; it
  # must lie in [min_discharge_cap_w, max_discharge_cap_w], the guard's bound on the cap.
  load_following:
    enabled: false
    max_w: null
    soc_hysteresis_pct: 1
  # Reserve protection (ADR-0007 amendment 2026-11-08).  While the MEASURED SOC sits at or below
  # the tariff's floor, a tick the plan maps to idle or discharge becomes a bounded recovery charge
  # of this many W through the existing charge row (the PD target is house load + this, inside
  # min(import_cap_w, entity max)); a planned charge at or above it is kept, a weaker one is raised
  # to it.  Forcing idle is not enough: the measured residual drain continues in idle (about 26 W on
  # 2026-11-08).  The floor is NOT set here: it is battery.soc_window_min of config/tariff.yaml, the
  # value the planner clamps to.  Hysteresis: engages at the floor, releases at floor + this many SOC
  # points (0 < soc_floor_hysteresis_pct <= 10).  No enable flag: inert in shadow (no actuator),
  # recorded in dry_run, sent in live under the kill switch; the guard and the settle hold keep
  # priority.  During the import trip's import_trip_hold_s above the recovery sends no charge AND
  # refuses the planned discharge (the guard scopes that refusal to charge intents): the tick holds
  # idle with both directions off.  Likewise it does not raise the setpoint to the ceiling when the
  # headroom above the house load is below this power.  Must be <= import_cap_w.
  soc_floor_recovery_w: 200
  soc_floor_hysteresis_pct: 1
  # Omnibattery integration_status values in which the intent may be applied; any other
  # (manual, grid_charging, backup_mode, initializing, a competing strategy...) holds safe idle.
  healthy_states: [balanced, charging, discharging]
  command_policy:
    max_attempts: 3               # sends per write, the first included
    min_setpoint_change_w: 100    # smaller numeric changes within one mode are not sent
    min_command_interval_s: 30    # nor a numeric rewrite of the same entity within this
  readback_timeout_s: 10          # per send: the entity must read back the new value
  shutdown_timeout_s: 15          # safe idle at SIGTERM (uvicorn grace is 20 s)
  # Maximum age (s since HA last reported) of the guard's inputs; null = availability only
  # (present, not unavailable/unknown, numeric; SOC within 0-100), no age test.
  freshness_s:
    grid_power: 30
    # null: Omnibattery's coordinator entities report only on change (last_reported is not
    # refreshed for an unchanged value, verified 2026-11-03), so an idle battery's SOC and AC
    # power look hours old while healthy; they turn `unavailable` when Modbus polling fails.
    battery_soc: null
    battery_ac_power: null

# Periodic full charge for cell balancing (docs/planning/periodic-full-charge.md).  OFF by
# default: false means no decision, no state and no read or write of the entities below.  It
# works in every mode (shadow: decisions only; dry_run: plus the would-be writes; live: sends).
# Only in `mode: live` with `enabled: true` does the guard admit switch.turn_on/off on
# `entities.enable_switch` and select.select_option (the seven weekdays) on
# `entities.day_select`: Omnibattery's own weekly full charge is the self-limiting enabler
# (ADR-0007 amendment 2026-11-04).  Needs planning.soc_source: entity.
full_charge:
  enabled: false
  # The feature's own switch.  shadow (default): decides and records with the simulated writer and a
  # simulated state file; beside a live service nothing about the real control path changes (the
  # regular plan stays the plan of record, the actuator hears nothing, the two weekly entities stay
  # refused by the guard).  live: arms Omnibattery's weekly full charge; needs the service mode: live.
  mode: shadow
  # Days since the last full charge, by the class of the latest valid balance readings (worst
  # class first): unknown also means fewer than min_comparable_readings; green needs that many
  # green readings and a trend that is not rising; yellow also covers a single orange or red;
  # alert is orange or red on alert_consecutive readings in a row (and an owner alert).
  cadence:
    unknown: {min_days: 10, max_days: 14}
    green: {min_days: 14, max_days: 28}
    yellow: {min_days: 7, max_days: 14}
    alert: {min_days: 5, max_days: 7}
  min_comparable_readings: 4
  alert_consecutive: 2
  settle_timeout_s: 300               # idle hold after completion, waiting for the balance reading
  threshold_min_eur: 0.01             # threshold at the row's min_days, EUR per run (pre-tax, objective unit)
  threshold_scale_eur: 0.01           # hyperbolic growth towards the row's max_days
  fixed_cost_eur: 0.0                 # added to the forcing cost (wear / time at 100%)
  target_soc_frac: 1.0
  reached_soc_pct: 99                 # SOC at or above: "reached" (only a new balance reading counts as done)
  shortfall_penalty_eur_per_kwh: 10.0
  completion_margin_slots: 2          # checkpoint at least this many slots before local midnight
  arm_lead_slots: 1
  arm_before_soc_frac: 0.93
  ack_timeout_s: 90
  top_hold_timeout_min: 120
  taper: {start_soc_frac: 0.90, power_kw: 0.2}   # provisional; start_soc_frac: null disables it
  max_consecutive_failures: 3
  failure_pause_days: 5
  bootstrap_last_full: null           # ISO date, explicit override; null: eligible as soon as enabled
  entities:                           # required when enabled
    enable_switch: switch.omnibattery_weekly_full_charge_enabled   # written (live only)
    day_select: select.omnibattery_weekly_full_charge_day          # written (live only)
    delay_switch: switch.omnibattery_weekly_full_charge_delay      # read only, must be off
    charge_delay_switch: switch.omnibattery_charge_delay           # read only, logged
    last_balance_read: sensor.venus_last_balance_read              # read only, a new value = success
    balancing_mode: binary_sensor.venus_balancing_mode             # read only, evidence
    cell_delta: sensor.venus_cell_delta                            # read only, evidence
    balance_status: sensor.venus_balance_status                    # read only, selects the cadence row
    delta_trend: sensor.venus_delta_trend                          # read only: rising | stable | falling
    delta_avg_4w: sensor.venus_delta_avg_4w                        # read only, evidence

# Read-only battery health telemetry (docs/service.md): temperature exposure, charge sessions,
# cell voltages and Omnibattery's balance monitor, in /status and battery_optimizer_battery_*
# metrics.  Reads only (the existing GET / state_changed path); every entity is optional and the
# whole block is off while none is named.  Charge sessions use actuation.entities.battery_ac_power
# and actuation.battery_ac_power_sign (charge = positive after the sign), so they work in shadow.
# The balance sensors read `unknown` until the first full charge; that is None, never 0.
battery_health:
  entities:
    temperature: sensor.venus_internal_temperature       # degC
    cell_voltage_max: sensor.venus_max_cell_voltage      # V
    cell_voltage_min: sensor.venus_min_cell_voltage      # V
    cell_delta: sensor.venus_cell_delta                  # mV, last comparable settled top-of-charge
    balance_status: sensor.venus_balance_status          # green | yellow | orange | red | unknown
    last_balance_read: sensor.venus_last_balance_read    # timestamp of the last valid measurement
    delta_trend: sensor.venus_delta_trend
    delta_avg_4w: sensor.venus_delta_avg_4w              # mV, average of the last four readings
    balancing_mode: binary_sensor.venus_balancing_mode
  hot_thresholds_c: [35, 40]      # seconds strictly above each are counted
  charge_threshold_w: 100         # sign-corrected AC power above this = charging
  session_end_hold_s: 300         # at or below it this long ends a session (the taper is one)
  max_gap_s: 300                  # most one clock advance credits to the held temperature

# Climate shadow (track B2): B0's thermal model and the price-blind comfort MPC on live data,
# every `replan_every_minutes` of the MPC config (hourly), `offset_minutes` after the boundary.
# Records decisions, scores and the preregistered gates under <data_dir>/service/v1/climate_*;
# plans are NEVER sent anywhere.  Needs BATTERY_OPTIMIZER_PROMETHEUS_URL, the prior written by
# hack/climate_shadow_prior.py in <data_dir>/analysis/v1/climate-shadow/priors/<prior>/ and the
# private <data_dir>/climate/site.yaml.  The weather forecast is the archive above (hourly).
#
# ⚠️  DEPLOYMENT OVERRIDES (do not copy from app repo template):
#   - enabled: true (production deployment, not the template default of false)
#   - prior: "2311c010392f" (site-specific prior ID, not null)
#   - optimizer_mode: "shadow" (advisory mode, not the template default of "off")
# When re-vendoring from ~/home-energy-optimizer/config/service.yaml, preserve these values.
climate_shadow:
  enabled: true  # PRODUCTION: do not revert to template default (false)
  climate_config: climate.yaml        # relative to this file's directory
  mpc_config: climate-mpc.yaml        # horizon, cadence, schedule, refit: as in the B1 replay
  prior: "2311c010392f"  # PRODUCTION: site-specific prior, do not revert to null
  offset_minutes: 10                  # after the weather fetch at :05
  forecast_max_age_minutes: 180       # older archive records: the last outdoor reading is held
  score_lookback_days: 7              # unscored decisions older than this are dropped
  # Local day of the comfort controller's go-live.  REQUIRED for any new-window verdict: while
  # null, the first `comfort` record is only reported as a provisional date (preregistration
  # amendment 2026-10-31).  The new window starts 7 days later.  The gate room-mean is fixed by
  # the preregistration: comfort.rooms of climate.yaml (bedroom, hall_kitchen, office_t).
  go_live: null
  # Advisory ClimatePlan export (docs/climate-plan-contract.md, ADR-0008 proposed): GET /climate/plan.
  # The owner's control is the HA select entities.mode below ("off" / "shadow" / "live"); this is the
  # FALLBACK used while that helper is missing, unavailable or holds anything else.  QUOTE it: a bare
  # YAML off is a boolean.  "off" (default): /climate/plan answers 404, nothing is published.
  # "shadow": the plan is published (advisory; nothing in the optimizer acts on it, it stays
  # read-only toward Home Assistant).  "live" is only a request: the effective mode is never live in
  # this code version (live_locked).  The shadow's own hourly run and scoring are unaffected.
  optimizer_mode: "shadow"  # PRODUCTION: advisory mode, do not revert to template default ("off")
  plan_ttl_minutes: 90                # a plan is absent for consumers this long after its decision t0
  # Read-only Home Assistant helpers of the homelab comfort controller
  # (config/integrations/appdaemon_comfort.yaml); each may be absent until it is deployed.
  entities:
    # on = comfort controller in charge (regime `comfort`); absent = `legacy`.
    regime: input_boolean.comfort_control_enable
    # JSON written by comfort_control.py: {"day", "start", "end", "forced", "target_written",
    # "done"} for today only (start/end null once the window is over), or {"done"} alone.
    # Today's slots follow it; other slots, a stale or unreadable plan: yesterday's DHW slots.
    dhw_plan: input_text.comfort_dhw_plan
    # Away (design section 5): every room at 21.5 degC.
    away: input_boolean.comfort_away
    # The owner's mode select, options exactly off / shadow / live (input_select, created by the
    # homelab).  Read only, like the battery kill switch; absent or unreadable: optimizer_mode.
    mode: input_select.climate_optimizer_mode
