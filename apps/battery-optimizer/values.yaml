app-template:
  # Two controllers sharing one image, one PVC and one ConfigMap:
  #   pipeline - batch data pipeline CronJob: extract (HA history + Prometheus) -> validate -> build
  #   service  - resident Phase C shadow service (no actuation path; read-only HA token)
  # `forceRename` keeps the CronJob name stable (alerts depend on it).
  controllers:
    pipeline:
      type: cronjob
      forceRename: battery-optimizer-pipeline
      cronjob:
        # Daily at 03:30 UTC. The binding constraint is "no more than the 10 days of HA recorder
        # retention between two successful runs"; daily tolerates a week of missed runs.
        schedule: "30 3 * * *"
        timeZone: UTC
        concurrencyPolicy: Forbid
        # Late starts are still useful (the extraction window is 10 days deep): allow 6 h.
        startingDeadlineSeconds: 21600
        successfulJobsHistory: 3
        failedJobsHistory: 3
        # Three attempts (transient HA/Prometheus errors); the pipeline is idempotent.
        backoffLimit: 2
        # Bound hangs. The first run backfills ~2.8 years of Prometheus history.
        activeDeadlineSeconds: 3600
        ttlSecondsAfterFinished: 604800
      pod:
        restartPolicy: Never
        automountServiceAccountToken: false
      initContainers:
        # A fresh ZFS dataset mounts root:root 0755 and there is no fsGroup (slow startup on
        # openebs-zfspv), so chown the volume ROOT once. Recursive only if the owner is wrong
        # (e.g. data copied in as root), which keeps the steady-state run O(1).
        fix-permissions: &fix-permissions
          image:
            # renovate: datasource=docker depName=busybox
            repository: busybox
            tag: 1.38
          command:
            - sh
            - -ec
            - |
              if [ "$(stat -c %u /data)" != "65532" ]; then
                chown -R 65532:65532 /data
              fi
              chmod 0700 /data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        pipeline:
          image: &image
            # renovate: datasource=docker depName=ghcr.io/pando85/battery-optimizer
            repository: ghcr.io/pando85/battery-optimizer
            tag: 0.3.0@sha256:48ed4f67de96af7ae432a26e17011b08d31164f41726e239f7217c2455de7e1d
          env:
            TZ: UTC
            BATTERY_OPTIMIZER_DATA_DIR: /data
            BATTERY_OPTIMIZER_CONFIG: /config/tariff.yaml
            BATTERY_OPTIMIZER_HA_URL: http://home-assistant-hass.home-assistant.svc:8123
            BATTERY_OPTIMIZER_PROMETHEUS_URL: http://prometheus-long-term.monitoring:9090
            # Pipeline knobs (read by the script below).
            # The HA recorder keeps 10 days (purge_keep_days default, nothing overrides it) and
            # purges nightly, so the oldest day of a 10-day window is partly or wholly gone and
            # `extract` (exit 3 on a coverage gap) would fail every night. 8 days keeps the oldest
            # chunk safely inside retention while still healing 7 missed daily runs; row-level dedup
            # makes the overlap free. Do not opt out with --allow-coverage-gaps: a real gap must fail
            # the Job (BatteryOptimizerJobFailed). Chunk width stays at the CLI default (86400 s).
            HA_LOOKBACK_DAYS: "8"
            # Prometheus extraction is NOT deduplicated across runs, so keep the overlap small.
            PROM_LOOKBACK_DAYS: "3"
            # Used only while the store has no finished Prometheus extraction (first run on an empty PVC).
            PROM_BOOTSTRAP_START: "2024-01-01T00:00:00+00:00"
            # build covers complete calendar months [BUILD_START, first of this month), and only on
            # these UTC days of the month (see the script).
            BUILD_START: "2024-01-01T00:00:00+00:00"
            BUILD_ON_DAYS: "01 02"
          envFrom:
            - secretRef:
                name: battery-optimizer-home-assistant
          command:
            - /bin/sh
            - -ec
          args:
            - |
              log() { echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"; }

              log "step 1/4: extract ha-history (lookback ${HA_LOOKBACK_DAYS}d)"
              battery-optimizer extract --source ha-history --lookback-days "${HA_LOOKBACK_DAYS}"

              # A manifest is written only by a finished run, so orphaned parts from an interrupted
              # bootstrap do not count as coverage and the retry bootstraps again.
              if grep -qs '"source": "prometheus"' /data/manifests/*.json; then
                log "step 2/4: extract prometheus (lookback ${PROM_LOOKBACK_DAYS}d)"
                battery-optimizer extract --source prometheus --lookback-days "${PROM_LOOKBACK_DAYS}"
              else
                log "step 2/4: extract prometheus (empty store: bootstrap from ${PROM_BOOTSTRAP_START})"
                # The 2024 archive has known holes (series started later, outages), which `extract`
                # reports as coverage gaps (exit 3). Accept them for this one historical backfill only.
                battery-optimizer extract --source prometheus --start "${PROM_BOOTSTRAP_START}" --allow-coverage-gaps
              fi

              log "step 3/4: validate"
              battery-optimizer validate --source all

              # The analysis store is write-once and every new extraction changes the dataset id
              # (measured: +4.2 MB per run, ~1.5 GB/yr when built daily) while nothing consumes it
              # yet, so build only on the first days of the month (two chances in case a run is
              # missed). The window is the complete months up to the first of this month.
              BUILD_END="$(date -u +%Y-%m-01T00:00:00+00:00)"
              case " ${BUILD_ON_DAYS} " in
                *" $(date -u +%d) "*)
                  log "step 4/4: build ${BUILD_START} -> ${BUILD_END}"
                  battery-optimizer build --start "${BUILD_START}" --end "${BUILD_END}"
                  ;;
                *)
                  log "step 4/4: build skipped (runs on UTC days of month: ${BUILD_ON_DAYS})"
                  ;;
              esac

              log "done"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2Gi

    service:
      type: deployment
      replicas: 1
      # One writer on the RWO PVC and on the shadow store: never two pods at once.
      strategy: Recreate
      pod:
        automountServiceAccountToken: false
      initContainers:
        fix-permissions: *fix-permissions
      containers:
        service:
          image: *image
          args:
            - serve
          env:
            TZ: UTC
            BATTERY_OPTIMIZER_PORT: "8080"
            BATTERY_OPTIMIZER_DATA_DIR: /data
            BATTERY_OPTIMIZER_CONFIG: /config/tariff.yaml
            BATTERY_OPTIMIZER_SERVICE_CONFIG: /config/service.yaml
            BATTERY_OPTIMIZER_HA_URL: http://home-assistant-hass.home-assistant.svc:8123
            # The existing read-only, non-admin token, mounted as a file (never an env value).
            BATTERY_OPTIMIZER_HA_TOKEN_FILE: /secrets/home-assistant/BATTERY_OPTIMIZER_HA_TOKEN
            BATTERY_OPTIMIZER_PROMETHEUS_URL: http://prometheus-long-term.monitoring:9090
          probes:
            # Readiness deliberately uses /health/live too: /health/ready answers 503 whenever an
            # input is stale, which would drop the pod from the Service endpoints and stop the
            # scrape exactly when the metrics matter. Alert on battery_optimizer_ready instead.
            liveness: &probe
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/live
                  port: &port 8080
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
            readiness: *probe
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/live
                  port: *port
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

  service:
    service:
      controller: service
      ports:
        http:
          port: *port

  serviceMonitor:
    service:
      serviceName: battery-optimizer
      enabled: true
      # The battery_optimizer_* series are kept in the long-term Prometheus for the multi-week
      # shadow-vs-native comparison (same pattern as github-exporter).
      labels:
        operator.prometheus.io/instance: prometheus-long-term
      endpoints:
        - port: http
          scheme: http
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s

  defaultPodOptions:
    enableServiceLinks: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    # openebs-zfspv volumes are node-local.
    nodeSelector:
      kubernetes.io/hostname: prusik

  persistence:
    data:
      enabled: true
      existingClaim: battery-optimizer-data
      globalMounts:
        - path: /data
    tmp:
      enabled: true
      type: emptyDir
      advancedMounts:
        pipeline:
          pipeline:
            - path: /tmp
    config:
      enabled: true
      type: configMap
      name: battery-optimizer-config
      advancedMounts:
        pipeline:
          pipeline:
            - path: /config
              readOnly: true
        service:
          service:
            - path: /config
              readOnly: true
    home-assistant-token:
      enabled: true
      type: secret
      name: battery-optimizer-home-assistant
      advancedMounts:
        service:
          service:
            - path: /secrets/home-assistant
              readOnly: true
