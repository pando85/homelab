app-template:
  controllers:
    special-web:
      labels:
        backup/retain: quaterly
      replicas: 1
      containers:
        nginx:
          image:
            repository: nginx
            tag: 1.31.8-alpine

          securityContext:
            runAsUser: 0

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 64Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
  defaultPodOptions:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: special-web
            app.kubernetes.io/name: special-web
  service:
    special-web:
      controller: special-web
      ports:
        http:
          port: 80

  # Envoy Gateway route.
  route:
    external:
      kind: HTTPRoute
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - regalo.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: special-web
              port: 80

  persistence:
    data:
      enabled: true
      globalMounts:
        - path: /usr/share/nginx/html
      existingClaim: special-web-data

    config:
      enabled: true
      type: configMap
      name: nginx-config
      advancedMounts:
        special-web:
          nginx:
            - path: /etc/nginx/nginx.conf
              subPath: nginx.conf
