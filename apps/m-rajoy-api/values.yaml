app-template:
  controllers:
    m-rajoy-api:
      labels:
        backup/retain: quaterly
      replicas: 1
      containers:
        m-rajoy-api:
          image:
            repository: pando85/quotes-simple-web-api
            tag: 1.0.0

          probes:
            liveness: &probe
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: &port 8080
            readiness: *probe

          env:
            CORS_ALLOW_ORIGIN: https://m.rajoy.grigri.cloud
            AUDIOS_PATH: /data/mariano-rajoy/audios_output
            QUOTES_PATH: /data/mariano-rajoy/quotes_output
            QUOTES_AUTHOR: Mariano Rajoy
            QUOTES_AUDIO_KEY: '["audio"]'
            QUOTES_TRANSCRIPT_KEY: '["quote"]'

          resources:
            requests:
              cpu: 10m
              memory: 22Mi
            limits:
              cpu: 500m
              memory: 128Mi

  service:
    m-rajoy-api:
      controller: m-rajoy-api
      ports:
        http:
          port: *port

  # Envoy Gateway routes.
  # Internal routes carry the external-dns annotation (the Gateway address is published in DNS).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - api.m.rajoy.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-rajoy-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: m-rajoy-api
              port: 8080
    external:
      kind: HTTPRoute
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - api.m.rajoy.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: m-rajoy-api
              port: 8080

  defaultPodOptions:
    securityContext:
      runAsUser: 995
      runAsGroup: 501
      fsGroup: 501

    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: m-rajoy-api
            app.kubernetes.io/name: m-rajoy-api

  persistence:
    data:
      enabled: true
      globalMounts:
        - path: /data/mariano-rajoy
      existingClaim: m-rajoy-api-data
