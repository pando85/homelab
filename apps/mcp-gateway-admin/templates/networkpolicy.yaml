---
# Admin-plane ingress: private by construction.
#   - MCP endpoint reachable only through the INTERNAL ingress controller
#     (ingress-nginx / nginx-internal class), never via ingress-nginx-external.
#   - Metrics port reachable only from Prometheus pods in `monitoring`.
#   - 15021 (readiness) is not exposed, and the admin address is configured
#     "off". Note on `enable-host-firewall=false`: it is an observation about
#     today's Cilium config, NOT a guarantee that a kubelet probe and its reply are
#     unaffected by pod-level policy - see the Firecrawl precedent in
#     docs/troubleshooting/mcp-firecrawl-egress-regression.md. Nothing here assumes
#     replies are exempt, and no blanket host / remote-node allow is added to "fix"
#     a probe path.
#   - Service is ClusterIP only: no NodePort, loadBalancer or hostPort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-admin-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-gateway-admin
      app.kubernetes.io/name: mcp-gateway-admin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 15020
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-admin-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-gateway-admin
      app.kubernetes.io/name: mcp-gateway-admin
  policyTypes:
    - Egress
  egress:
    # DNS. nodelocaldns answers at 169.254.25.10, but Cilium DNATs to the
    # node-local-dns pod, so policy must select the real pods, not the anycast
    # address. Scoped to the two DNS workloads instead of all of kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Token/JWKS validation goes to Kanidm at idm.grigri.cloud, which is
    # published on the EXTERNAL ingress even for the admin plane: the issuer
    # URL is the same for both planes, so a token issued for
    # oauth2/openid/mcp-gateway-admin validates against that endpoint.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-external
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 443
    # Direct Kanidm server path (label verified live: app.kubernetes.io/name=kanidm
    # in the kanidm namespace), used if the JWKS URL is switched to the pod
    # service instead of the public hostname.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanidm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kanidm
      ports:
        - protocol: TCP
          port: 8443
    # MCP backends: one rule per ENABLED backend, derived from values, so opening a
    # route and widening egress is the same edit and a disabled route is unreachable
    # in both directions. `workloadName` is the backend's app.kubernetes.io/name
    # label, which is not the route key (route `grafana` -> release `grafana-mcp`);
    # getting it wrong blocks every tool call with no useful error.
    {{- range $name, $b := .Values.backends }}
    {{- if $b.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $b.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $b.workloadName }}
              app.kubernetes.io/instance: {{ $b.workloadName }}
      ports:
        - protocol: TCP
          port: {{ $b.port }}
    {{- end }}
    {{- end }}
