---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: {{ .Values.kanidm.oauth2Client.name }}
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: {{ .Values.kanidm.oauth2Client.displayname }}
  origin: {{ .Values.kanidm.oauth2Client.origin }}
  # Public + PKCE so native clients can complete the browser flow without
  # shipping a secret. Audience in Kanidm-issued JWT is the OAuth2 client
  # NAME (verified against v1.11.2 source), so this admin client has a
  # distinct audience from the public mcp-gateway client.
  public: true
  allowLocalhostRedirect: true
  redirectUrl:
    {{- toYaml .Values.kanidm.oauth2Client.redirectUrls | nindent 4 }}
  # Empty scopeMap by default (Vault MCP blocker unresolved). When owner
  # enables a scope, entries are { group, scopes[] }. Kanidm writes scopes
  # into a SINGLE space-separated `scope` string claim; gateway CEL must
  # split. Never assume a `groups` claim.
  scopeMap:
    {{- $sm := concat (default (list) .Values.kanidm.oauth2Client.scopeMap) (default (list) .Values.kanidm.oauth2Client.humanScopeMap) }}
    {{- if $sm }}
    {{- toYaml $sm | nindent 4 }}
    {{- else }}
    # Empty: no scope granted. Fail closed.
    []
    {{- end }}
  preferShortUsername: true
  strictRedirectUrl: true
