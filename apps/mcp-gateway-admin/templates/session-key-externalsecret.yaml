---
# Pull the generated session key into a Kubernetes Secret, once.
#
# See templates/session-key-generator.yaml for the full rationale (B1): no Helm
# randomness, no `lookup`, lifecycle governed by the operator's own
# `refreshPolicy: CreatedOnce` (shouldRefresh() only syncs while the status has no
# syncedResourceVersion / refreshTime), plus `target.immutable: true` so no later
# write rewrites the data.
#
# `creationPolicy: Owner` (the default) keeps the Secret owned by this
# ExternalSecret, so `kubectl delete secret` is a real, recoverable operation that
# yields a fresh key on the next sync, invalidating in-flight MCP sessions. That is
# documented behaviour, not a rotation mechanism.
#
# The rendered output of this file is deterministic: it contains no key material at
# all, so repeated `helm template` runs are byte-identical (asserted by
# test/mcp-gateway/chart-checks.py).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-admin-session-key
  labels:
    app.kubernetes.io/name: mcp-gateway-admin
    app.kubernetes.io/instance: mcp-gateway-admin
spec:
  refreshPolicy: {{ .Values.session.refreshPolicy }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-gateway-admin-session-key
  target:
    name: mcp-gateway-admin-session-key
    creationPolicy: Owner
    # never rewrite the key once it exists
    immutable: true
