{{- if .Values.kanidm.workloadGroup.enabled }}
{{- /*
Service-only workload group for the ADMIN plane. See the long warning in
apps/mcp-gateway/templates/kanidm-group.yaml: Kanidm's `spec.members` is
AUTHORITATIVE and removes any member not listed, so this template is only ever
for a new chart-owned service-account group — never an existing human group,
and never with a partial list.

Disabled by default (kanidm.workloadGroup.enabled=false) while the admin
scopeMap is empty: creating a group nobody can use is identity surface without
capability. Enable it in the same change that grants the first admin scope.
*/}}
---
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: {{ .Values.kanidm.workloadGroup.name }}
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  {{- with .Values.kanidm.workloadGroup.serviceMembers }}
  members:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
