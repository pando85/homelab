app-template:
  controllers:
    atuin:
      labels:
        backup/retain: quaterly
      type: statefulset
      containers:
        atuin:
          image:
            repository: ghcr.io/atuinsh/atuin
            tag: 18.24.5
          env:
            ATUIN_HOST: 0.0.0.0
            ATUIN_PORT: &port 8080
            ATUIN_OPEN_REGISTRATION: "false"
            ATUIN_METRICS__ENABLE: "true"
            ATUIN_METRICS__HOST: 0.0.0.0
            ATUIN_METRICS__PORT: &metricsPort 9090
            ATUIN_TLS__ENABLE: "false"
            RUST_LOG: info
          envFrom:
            - secretRef:
                name: atuin-database
          args:
            - start
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet: &httpGet
                  path: /
                  port: *port
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet: *httpGet
                failureThreshold: 30
                periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 64Mi
      pod:
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: cluster-name
                      operator: In
                      values:
                        - atuin-postgres
                topologyKey: kubernetes.io/hostname
  service:
    atuin:
      controller: atuin
      ports:
        http:
          port: *port
        metrics:
          port: *metricsPort

  # Envoy Gateway routes.
  # Internal routes carry the external-dns annotation (the Gateway address is published in DNS).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - atuin.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: atuin
              port: 8080
    external:
      kind: HTTPRoute
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - atuin.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: atuin
              port: 8080

  persistence:
    config:
      type: emptyDir

  serviceMonitor:
    app:
      enabled: true
      serviceName: atuin
      labels:
        release: monitoring
      endpoints:
        - port: metrics
          scheme: http
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s

  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
