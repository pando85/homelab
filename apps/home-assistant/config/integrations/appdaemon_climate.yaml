# Helpers of the retired AppDaemon climate_control app (archived in appdaemon/archive/climate_control/;
# ADR-0009 in pando85/home-energy-optimizer). input_boolean.appdaemon_climate_enable and
# automation.appdaemon_climate_watchdog are gone: the optimizer treats a missing toggle as off, and
# automation climate_optimizer_watchdog (climate_optimizer.yaml) replaced the watchdog. The two helpers
# below are kept because the optimizer's climate shadow still reads min_hours_per_day; heat_mode
# is unused and can go once the revert window has passed.
input_number:
  appdaemon_climate_min_hours_per_day:
    name: AppDaemon Climate Min Hours Per Day
    min: 0
    max: 24
    step: 1

input_select:
  appdaemon_climate_heat_mode:
    name: Set Heat Mode
    options:
      - Heat+DHW
      - Cool+DHW
