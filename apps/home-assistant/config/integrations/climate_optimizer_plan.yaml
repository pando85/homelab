# What the climate optimizer plans, and the owner's mode switch: the Climate optimizer dashboard shows
# the plan next to what the heat pump does, and the select below is the owner's mode switch. Read
# only: GET /climate/plan/summary of the in-cluster optimizer service (battery-optimizer, contract in
# pando85/home-energy-optimizer docs/climate-plan-contract.md), once a minute, same mechanism as
# battery_optimizer_plan.yaml. Nothing in this file writes to a device. The optimizer itself writes
# the heat pump only with climate_actuation.mode: live AND this select at `live` (ADR-0009,
# climate_optimizer.yaml); until the first, `live` is locked in the optimizer (live_locked) whatever
# is selected.
#
# The summary answers 200 in every state, so the sensors can say `mode_off` or `expired`: the plan
# state sensor then shows the state, the values of the plan are unknown (never the last plan's), and
# every sensor is unavailable when the service does not answer (down, non-200, not JSON).
#
# Vacation mode (v1): the same summary carries `vacation` ({phase: none | scheduled | away |
# recovery | ready, start, end, ready_at, recovery_start, guard_c, invalid_reason}) in every state,
# also without a current plan. `sensor.climate_optimizer_vacation_phase` (state: phase) and the
# timestamps `..._vacation_warm_up_start` (recovery_start) and `..._vacation_ready_at` need only that
# mapping, so they stay available without a plan; an optimizer older than vacation mode (no
# `vacation`) leaves them unavailable. The optimizer reads the owner's Leave and Return helpers
# (climate_optimizer.yaml); Home Assistant only shows its decision.
#
# The mode select: `shadow` is first so a fresh helper starts in shadow without a write, and there
# is no `initial:` on purpose, so the owner's choice survives restarts (Reloader, updates). The
# optimizer reads it; with the helper absent or unknown it falls back to its own config. `live` is
# a request the optimizer refuses (live_locked) until climate_actuation.mode is live; `off` stops
# the export, not the optimizer's measurement.
#
# The second template block below polls the full plan, GET /climate/plan (ClimatePlan v1, about
# 4 kB), for the forward view of the dashboard: `sensor.climate_optimizer_plan` (state: when the plan
# was made) with `blocks`, the future 15-minute slots merged while heating on or off and the water
# target stay the same, as the battery plan does. Unlike the summary this endpoint answers 404 while
# no plan is current (mode_off, no_plan, expired), so the sensor is unavailable then.
#
# The third template block below reads the climate actuator's own state from GET /status
# (`climate_actuator`, ADR-0009), same cadence: whether it is in control, what it wants written, why
# it holds back, the safe-state fallback, rooms forced by a floor, and the last confirmed write. The
# block exists only while climate_actuation.mode is dry_run or live, so these sensors are
# unavailable in shadow and when the service does not answer. Read only.
#
# Rooms are those of the plan (bedroom, hall_kitchen, office_t); a room added to the optimizer needs
# its three predicted-temperature sensors below.
input_select:
  climate_optimizer_mode:
    name: Climate optimizer mode
    icon: mdi:home-thermometer-outline
    options:
      - shadow
      - "off"
      - live

rest_command:
  climate_optimizer_summary:
    url: http://battery-optimizer.battery-optimizer.svc:8080/climate/plan/summary
    method: get
    timeout: 10
  climate_optimizer_full_plan:
    url: http://battery-optimizer.battery-optimizer.svc:8080/climate/plan
    method: get
    timeout: 10
  climate_optimizer_status:
    url: http://battery-optimizer.battery-optimizer.svc:8080/status
    method: get
    timeout: 10

template:
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
    actions:
      - action: rest_command.climate_optimizer_summary
        response_variable: plan_response
        continue_on_error: true
    sensor:
      - name: Climate optimizer plan state
        unique_id: climate_optimizer_plan_state
        icon: mdi:calendar-check
        availability: >-
          {{ plan_response is defined and plan_response.status == 200
             and plan_response.content is mapping and plan_response.content.state is string }}
        state: >-
          {% set c = plan_response.content %}
          {{ c.state if c.state is string else none }}
        attributes:
          reason: >-
            {% set c = plan_response.content %}
            {{ c.reason if c.reason is string else none }}
