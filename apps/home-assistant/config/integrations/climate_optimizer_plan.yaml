  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
    actions:
      - action: rest_command.climate_optimizer_full_plan
        response_variable: full_plan_response
        continue_on_error: true
    sensor:
      # `blocks` is the plan from now on: consecutive 15-minute slots whose end is after now, merged
      # while `heating` and `water_c` are equal. Each block: from, until (UTC ISO), heating (bool),
      # water_c (null when off), dhw (true when any slot of the block is hot water production in the
      # plan's assumption), rooms_end (room: predicted degC at the end of the block). The run starts
      # are found in one pass over the slots, the blocks are then built from slices, so the cost is
      # linear in the 96 slots. Slot arrays are columnar, so no per-slot datetime parsing.
      - name: Climate optimizer plan
        unique_id: climate_optimizer_plan
        device_class: timestamp
        icon: mdi:calendar-clock
        availability: >-
          {{ full_plan_response is defined and full_plan_response.status == 200
             and full_plan_response.content is mapping
             and full_plan_response.content.version == 1
             and full_plan_response.content.generated_at is string
             and full_plan_response.content.slots is mapping }}
        state: "{{ full_plan_response.content.generated_at }}"
        attributes:
          valid_until: >-
            {% set c = full_plan_response.content %}
            {{ c.valid_until if c.valid_until is string else none }}
          plan_id: >-
            {% set c = full_plan_response.content %}
            {{ c.plan_id if c.plan_id is string else none }}
          blocks: >-
            {% set s = full_plan_response.content.slots %}
            {% set n = s.n | int(0) %}
            {% set step = s.step_minutes | int(15) %}
            {% set t0 = as_datetime(s.start) %}
            {% set first = [(((now() - t0).total_seconds() // (step * 60)) | int), 0] | max %}
            {% set ns = namespace(starts=[], key='') %}
            {% for i in range(first, n) %}
              {% set k = s.heating[i] ~ '/' ~ s.water_c[i] %}
              {% if k != ns.key %}
                {% set ns.starts = ns.starts + [i] %}
                {% set ns.key = k %}
              {% endif %}
            {% endfor %}
            {% set out = namespace(blocks=[]) %}
            {% for a in ns.starts %}
              {% set z = n if loop.last else ns.starts[loop.index] %}
              {% set rooms = namespace(pairs=[]) %}
              {% for room, v in s.predicted_room_c.items() %}
                {% set rooms.pairs = rooms.pairs + [(room, (v[z - 1] | round(1)) if v[z - 1] is number else none)] %}
              {% endfor %}
              {% set out.blocks = out.blocks + [{
                   'from': (t0 + timedelta(minutes=a * step)).isoformat(),
                   'until': (t0 + timedelta(minutes=z * step)).isoformat(),
                   'heating': s.heating[a] == 1,
                   'water_c': s.water_c[a],
                   'dhw': s.dhw[a:z] | sum > 0,
                   'rooms_end': dict(rooms.pairs)}] %}
            {% endfor %}
            {{ out.blocks }}
