# What the climate optimizer plans, in SHADOW mode only: the Climate optimizer dashboard shows the
# plan next to what the heat pump does, and the select below is the owner's mode switch. Read only:
# GET /climate/plan/summary of the in-cluster optimizer service (battery-optimizer, contract in
# pando85/home-energy-optimizer docs/climate-plan-contract.md), once a minute, same mechanism as
# battery_optimizer_plan.yaml. Nothing here writes to a device or reads the plan to control it: the
# plan is advisory and `live` is locked in the optimizer (ADR-0008 proposed), whatever is selected.
#
# The summary answers 200 in every state, so the sensors can say `mode_off` or `expired`: the plan
# state sensor then shows the state, the values of the plan are unknown (never the last plan's), and
# every sensor is unavailable when the service does not answer (down, non-200, not JSON).
#
# The mode select: `shadow` is first so a fresh helper starts in shadow without a write, and there
# is no `initial:` on purpose, so the owner's choice survives restarts (Reloader, updates). The
# optimizer reads it; with the helper absent or unknown it falls back to its own config. `live` is
# a request the optimizer refuses (live_locked); `off` stops the export, not the optimizer's
# measurement.
#
# Rooms are those of the plan (bedroom, hall_kitchen, office_t); a room added to the optimizer needs
# its three predicted-temperature sensors below.
input_select:
  climate_optimizer_mode:
    name: Climate optimizer mode
    icon: mdi:home-thermometer-outline
    options:
      - shadow
      - "off"
      - live

rest_command:
  climate_optimizer_summary:
    url: http://battery-optimizer.battery-optimizer.svc:8080/climate/plan/summary
    method: get
    timeout: 10

template:
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
    actions:
      - action: rest_command.climate_optimizer_summary
        response_variable: plan_response
        continue_on_error: true
    sensor:
      - name: Climate optimizer plan state
        unique_id: climate_optimizer_plan_state
        icon: mdi:calendar-check
        availability: >-
          {{ plan_response is defined and plan_response.status == 200
             and plan_response.content is mapping and plan_response.content.state is string }}
        state: >-
          {% set c = plan_response.content %}
          {{ c.state if c.state is string else none }}
        attributes:
          reason: >-
            {% set c = plan_response.content %}
            {{ c.reason if c.reason is string else none }}
          plan_status: >-
            {% set c = plan_response.content %}
            {{ c.status if c.status is string else none }}
      - name: Climate optimizer requested mode
