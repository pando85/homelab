# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_named integrations

script: !include_dir_merge_named script

# YAML-mode dashboard "Voice assistant" (the other dashboards are UI-managed, see
# docs/troubleshooting/home-assistant-dashboards.md). The file is mounted from the gitops ConfigMap.
# A change to the dashboard file reloads on page refresh; adding or removing this entry needs a restart.
lovelace:
  dashboards:
    voice-assistant:
      mode: yaml
      title: Voice assistant
      icon: mdi:microphone-message
      show_in_sidebar: true
      require_admin: false
      filename: gitops/voice_assistant_dashboard.yaml

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

recorder:
  db_url: !env_var ZZ_DB_URL

# Owner decision 2026-11-05: keep the audio of every pipeline run for 90 days, including the
# wake-stage audio (continuous room audio while a satellite listens). Volume, expiry and rules:
# docs/voice-assistant/data-register.md. Stop: remove this block (needs a Home Assistant restart).
assist_pipeline:
  debug_recording_dir: /voice-recordings

prometheus:
  namespace: hass
  requires_auth: false
