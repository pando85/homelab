# Cache for the custom wake word models that the openwakeword init container fetches from the
# private repository agil/kivi-models (licence-restricted, never committed here). Keeps pod
# restarts independent of git.grigri.cloud: the download only runs when the pinned file is missing
# or its sha256 differs (a version swap). No backup labels: the source of truth is the private
# repository. RWO is fine: the openwakeword Deployment uses the Recreate strategy on one node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-wakeword-models
  labels:
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/name: home-assistant
spec:
  storageClassName: openebs-zfspv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
