# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/external-secrets.io/externalsecret_v1beta1.json
# Read-only Forgejo token (scope read:repository) for the private repository agil/kivi-models.
# Used only by the openwakeword init container that fetches the licence-restricted kivi model,
# which must never be committed here (see docs/voice-assistant/model-registry.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kivi-models-read
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: kivi-models-read
    template:
      engineVersion: v2
      data:
        # A curl header file (curl -H @file), so the token never appears on a command line.
        auth-header: {{`"Authorization: token {{ .token }}"`}}
  data:
    - secretKey: token
      remoteRef:
        key: /home-assistant/kivi-models
        property: read_token
