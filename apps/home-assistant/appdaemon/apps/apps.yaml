# climate_control was retired when the optimizer took over space heating (ADR-0009 in
# pando85/home-energy-optimizer); it is archived in appdaemon/archive/climate_control/, see the
# README there. dhw_control stays: the optimizer never writes DHW.

dhw_control:
  module: dhw_control
  class: DHWControl
  input_boolean:
    enable: input_boolean.appdaemon_dhw_enable
  sensor:
    pvpc_price: sensor.esios_pvpc
  notify:
    enabled: true
    entity_id: notify.agil
  dhw:
    enabled: true
    entity: switch.aquarea_force_dhw_mode
  # interval_hours: How often to trigger DHW (hours). Must be a divisor of 24.
  # 24 = once per day (default), 12 = twice, 8 = 3 times, 6 = 4 times, etc.
  interval_hours: 12
  log_level: INFO

last_connection_sensor:
  module: last_connection_sensor
  class: LastConnectionSensor
