app-template:
  controllers:
    hass:
      labels:
        backup/retain: quaterly
      annotations:
        reloader.stakater.com/auto: "true"
      type: statefulset
      replicas: 1
      containers:
        hass:
          image:
            repository: ghcr.io/home-operations/home-assistant
            tag: 2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
          env:
            TZ: Europe/Madrid
            POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: home-assistant.home-assistant-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: home-assistant.home-assistant-postgres.credentials.postgresql.acid.zalan.do
                  key: password
            ZZ_DB_URL: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@home-assistant-postgres/home_assistant"
            OPENAI_BASE_URL: http://open-webui.open-webui.svc/api/
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5

          resources:
            requests:
              cpu: 10m
              memory: 350Mi
            limits:
              memory: 1Gi

    appdaemon:
      annotations:
        reloader.stakater.com/auto: "true"
      type: deployment
      replicas: 1
      initContainers:
        01-init-config:
          image:
            repository: debian
            tag: 13.7-slim
          command:
            - /bin/sh
            - -c
          args:
            - >
              cp -r /original/conf/* /conf/
      containers:
        appdaemon:
          image:
            repository: acockburn/appdaemon
            tag: 4.5.13
          env:
            HA_URL: http://home-assistant-hass:8123
            DASH_URL: http://0.0.0.0:5050
            TIMEZONE: Europe/Madrid
          envFrom:
            - secretRef:
                name: hass-appdaemon
          resources:
            requests:
              cpu: 30m
              memory: 50Mi
            limits:
              memory: 200Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5
      pod:
        affinity: &affinity
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - home-assistant
                    - key: app.kubernetes.io/controller
                      operator: In
                      values:
                        - hass
                topologyKey: kubernetes.io/hostname

    whisper:
      type: deployment
      replicas: 1
      annotations:
        # Roll the pod when the Home Assistant token Secret changes.
        reloader.stakater.com/auto: "true"
      pod:
        runtimeClassName: nvidia
        labels:
          pod-cleaner.dbcloud.org/watch: "true"
      containers:
        whisper:
          image:
            # Public image, built from https://github.com/pando85/wyoming-whisper (wyoming-faster-whisper 3.8.1).
            # Renovate can track updates; bump tag and digest after a canary.
            repository: ghcr.io/pando85/wyoming-whisper
            tag: 3.8.1.2@sha256:8fd9ead07a7000f230cf20e5b345219175cf1641e9635a7307664f241aeae7ef
          # The image entrypoint (/run.sh) already passes --uri, --data-dir /data and --download-dir /data.
          args:
            - --model
            - large-v3-turbo
            - --language
            - es
            - --device
            - cuda
            - --compute-type
            - int8
            # Static verbs prefix; the server appends the live Home Assistant names after it.
            - --initial-prompt
            - "Enciende, apaga, sube, baja, abre, cierra, para, pausa, reanuda, silencia, quita el silencio, pon, temporizador, minutos, volumen, brillo, por ciento, grados."
            - --hass-api
            - http://home-assistant-hass.home-assistant.svc:8123/api
            - --hass-refresh-seconds
            - "300"
            # 2026-11-07: Silero VAD drops non-speech before decoding, so room noise is not transcribed as words.
            # Rollback: remove this line. Do not add --vad-endpointing (it replaces HA's end-of-command logic).
            - --vad-filter
          env:
            # The value is read from the file and stripped by the server; keeps the token off the command line.
            WYO_WHISPER_HASS_TOKEN_FILE: /secrets/hass_token
            # TEMPORARY (from 2026-11-05): log transcripts for a usage study (Loki global 180 d retention), see
            # docs/voice-assistant/data-register.md. Loads the sitecustomize.py mounted below;
            # remove this variable and the whisper-logging mount to stop.
            PYTHONPATH: /opt/whisper-logging
          resources:
            requests:
              cpu: 15m
              memory: 600Mi
            limits:
              nvidia.com/gpu: "1"
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                # 5 minutes: room for a model (re)download on a cold cache.
                failureThreshold: 60
                periodSeconds: 5
    piper:
      type: deployment
      replicas: 1
      containers:
        piper:
          image:
            repository: rhasspy/wyoming-piper
            tag: 2.5.2
          args:
            - --voice
            #- en_US-amy-medium
            - es_ES-sharvard-medium
          resources:
            requests:
              cpu: 15m
              memory: 80Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5
      pod:
        affinity: *affinity

    openwakeword:
      type: deployment
      replicas: 1
      initContainers:
        # Copies the custom wake words (licence-restricted, never committed here) from a private image
        # into the server's --custom-model-dir: every model of the image's models.lock, one
        # /models/<id>.tflite each (id = file stem: kivi, oye_kivi), checked against /models/SHA256SUMS
        # first. The image is built from the private repository agil/kivi-models (package owner agil,
        # which must stay "limited": packages take their owner's visibility); the nodes pull it with
        # their containerd credential for git.grigri.cloud, like the whisper image.
        # Swap releases by changing the tag and digest (docs/voice-assistant/model-registry.md;
        # scripts/voice-assistant/wakeword/wake_release.py deploy).
        01-copy-wake-words:
          image:
            # No renovate hint: Renovate cannot read the private registry; one tag per release.
            repository: git.grigri.cloud/agil/kivi-models
            tag: v5-oye-kivi-2026-11-08@sha256:3a198f7d49583db9cbbf7337e48db7cabbf838a202763e4aa6fe6ae147ecfb40
          command:
            - sh
            - -ec
            - cd /models && sha256sum -c SHA256SUMS && cp /models/*.tflite /custom/ && cd /custom && sha256sum *.tflite
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        openwakeword:
          image:
            repository: rhasspy/wyoming-openwakeword
            tag: 2.1.0
          args:
            - --preload-model
            - alexa
            # Stock models (alexa, ...) stay available; every *.tflite here is added, id = file stem.
            - --custom-model-dir
            - /custom
          resources:
            requests:
              cpu: 15m
              memory: 80Mi
            limits:
              cpu: 500m
              memory: 1Gi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5
      pod:
        affinity: *affinity

    valetudopng:
      annotations:
        reloader.stakater.com/auto: "true"
      type: deployment
      replicas: 1
      containers:
        valetudopng:
          image:
            repository: ghcr.io/erkexzcx/valetudopng
            tag: v1.0.17
          args:
            - -config
            - /config/config.yml
          resources:
            requests:
              cpu: 15m
              memory: 15Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5
      pod:
        affinity: *affinity

    # 90-day expiry and size guard for the voice audio that Home Assistant writes to the
    # home-assistant-voice-recordings volume (docs/voice-assistant/data-register.md). The ZFS
    # volume is pinned to its node and `shared: yes` lets this pod mount it while Home Assistant
    # runs. Runs as the Home Assistant user (defaultPodOptions), which owns the files.
    # Logs counts and usage only, never paths or contents.
    voice-recordings-cleanup:
      type: cronjob
      cronjob:
        schedule: "15 4 * * *"
        timeZone: Europe/Madrid
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 21600
        successfulJobsHistory: 1
        failedJobsHistory: 3
        backoffLimit: 2
        activeDeadlineSeconds: 3600
        ttlSecondsAfterFinished: 604800
      pod:
        restartPolicy: Never
        automountServiceAccountToken: false
      containers:
        cleanup:
          image:
            # renovate: datasource=docker depName=busybox
            repository: busybox
            tag: 1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -ec
            - |
              ROOT=/recordings
              RETENTION_DAYS=90
              HIGH_PCT=90
              LOW_PCT=85
              [ -d "$ROOT" ] || { echo "missing $ROOT"; exit 1; }
              # 1. Age expiry: -mtime +89 matches files last written at least 90 full days ago.
              n=$(find "$ROOT" -mindepth 1 -type f -mtime +$((RETENTION_DAYS - 1)) -print -delete | wc -l)
              echo "expired files: $n"
              # 2. Size guard: above HIGH_PCT used, delete whole run directories (the parent of
              #    the WAV files), oldest last write first, until usage is back to LOW_PCT.
              #    Directories written in the last 10 minutes (open runs) are never touched.
              set -- $(df -Pk "$ROOT" | awk 'NR == 2 { print $2, $3 }')
              total_k=$1
              used_k=$2
              echo "usage: $((used_k * 100 / total_k))% of $((total_k / 1048576)) GiB"
              if [ $((used_k * 100)) -gt $((total_k * HIGH_PCT)) ]; then
                excess_k=$((used_k - total_k * LOW_PCT / 100))
                now=$(date +%s)
                find "$ROOT" -type f -name '*.wav' -exec stat -c '%Y %s %n' {} + \
                  | awk -v now="$now" '{
                      p = $0; sub(/^[0-9]+ [0-9]+ /, "", p)
                      d = p; sub(/\/[^\/]*$/, "", d)
                      if ($1 > mt[d]) mt[d] = $1
                      sz[d] += $2
                    }
                    END { for (d in mt) if (now - mt[d] > 600) print mt[d], int(sz[d] / 1024), d }' \
                  | sort -n \
                  | {
                      removed=0
                      freed_k=0
                      while read -r mt kb dir; do
                        [ "$freed_k" -lt "$excess_k" ] || break
                        rm -rf -- "$dir"
                        freed_k=$((freed_k + kb))
                        removed=$((removed + 1))
                      done
                      echo "size guard: removed $removed run dirs, $((freed_k / 1024)) MiB"
                    }
              fi
              # 3. Prune empty directories untouched for an hour (Home Assistant recreates the
              #    parents for every run). Directories emptied by step 1 go on the next run.
              n=$(find "$ROOT" -mindepth 1 -depth -type d -empty -mmin +60 -print -delete | wc -l)
              echo "pruned empty dirs: $n"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
  defaultPodOptions:
    terminationGracePeriodSeconds: 1

    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"

  service:
    hass:
      controller: hass
      ports:
        http:
          port: 8123
    appdaemon:
      controller: appdaemon
      ports:
        http:
          port: 5050
    whisper:
      controller: whisper
      ports:
        http:
          port: 10300
    piper:
      controller: piper
      ports:
        http:
          port: 10200
    openwakeword:
      controller: openwakeword
      ports:
        http:
          port: 10400
    valetudopng:
      controller: valetudopng
      ports:
        http:
          port: 3000

  ingress:
    hass:
      enabled: true
      className: nginx-external
      annotations:
        external-dns.kubernetes.io/enabled: "true"
        external-dns.kubernetes.io/target: grigri.cloud
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/server-snippet: |
          location = /api/prometheus {
            deny all;
          }
      hosts:
        - host: &host hass.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: hass
                port: http
      tls:
        - hosts:
            - *host
          secretName: home-assistant-external-tls-certificate
    appdaemon:
      enabled: true
      className: nginx-external
      annotations:
        external-dns.kubernetes.io/enabled: "true"
        external-dns.kubernetes.io/target: grigri.cloud
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/auth-url: https://auth.grigri.cloud/oauth2/auth?allowed_groups=appdaemon-users@idm.grigri.cloud
        nginx.ingress.kubernetes.io/auth-signin: https://auth.grigri.cloud/oauth2/start
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      hosts:
        - host: &host appdaemon.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: appdaemon
                port: http
      tls:
        - hosts:
            - *host
          secretName: hass-appdaemon-tls-certificate
    valetudopng:
      enabled: true
      className: nginx-internal
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        external-dns.kubernetes.io/enabled: "true"
      hosts:
        - host: &host valetudopng.internal.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: valetudopng
                port: http
      tls:
        - hosts:
            - *host
          secretName: hass-valetudopng-tls-certificate

  persistence:
    config:
      enabled: true
      existingClaim: home-assistant-config
      advancedMounts:
        hass:
          hass:
            - path: /config
    # Voice audio (assist_pipeline debug_recording_dir in config/configuration.yaml). Outside
    # /config (backed up) and /media (HA media browser). PVC: templates/pvc-voice-recordings.yaml.
    voice-recordings:
      enabled: true
      existingClaim: home-assistant-voice-recordings
      advancedMounts:
        hass:
          hass:
            - path: /voice-recordings
        voice-recordings-cleanup:
          cleanup:
            - path: /recordings
    configmap:
      enabled: true
      type: configMap
      name: home-assistant-config
      advancedMounts:
        hass:
          hass:
            - path: /config/gitops
    configmap-integrations:
      enabled: true
      type: configMap
      name: home-assistant-config-integrations
      advancedMounts:
        hass:
          hass:
            - path: /config/gitops/integrations
    configmap-script:
      enabled: true
      type: configMap
      name: home-assistant-config-script
      advancedMounts:
        hass:
          hass:
            - path: /config/gitops/script
    appdaemon:
      enabled: true
      type: configMap
      name: hass-appdaemon
      advancedMounts:
        appdaemon:
          01-init-config:
            - path: /original/conf
    appdaemon-apps:
      enabled: true
      type: configMap
      name: hass-appdaemon-apps
      advancedMounts:
        appdaemon:
          01-init-config:
            - path: /original/conf/apps
    appdaemon-cache:
      type: emptyDir
      advancedMounts:
        appdaemon:
          01-init-config:
            - path: /conf
          appdaemon:
            - path: /conf
    whisper:
      enabled: true
      existingClaim: home-assistant-models
      advancedMounts:
        whisper:
          whisper:
            - path: /data
    whisper-hass-token:
      enabled: true
      type: secret
      name: whisper-hass-token
      advancedMounts:
        whisper:
          whisper:
            - path: /secrets
              readOnly: true
    whisper-logging:
      enabled: true
      type: configMap
      name: home-assistant-whisper-logging
      advancedMounts:
        whisper:
          whisper:
            - path: /opt/whisper-logging
              readOnly: true
    kivi-model:
      enabled: true
      type: emptyDir
      sizeLimit: 16Mi
      advancedMounts:
        openwakeword:
          01-copy-wake-words:
            - path: /custom
          openwakeword:
            - path: /custom
              readOnly: true
    piper:
      enabled: true
      type: emptyDir
      sizeLimit: 5Gi
      advancedMounts:
        piper:
          piper:
            - path: /data
    valetudopng:
      enabled: true
      type: secret
      name: valetudopng-config
      advancedMounts:
        valetudopng:
          valetudopng:
            - path: /config
  serviceMonitor:
    hass:
      enabled: true
      # if directory != service name, it will be prefixed to the service name:
      # ${directory}-${service}
      # https://github.com/bjw-s/helm-charts/blob/45ec2d739fc787c95947e0f3d68b05e54fe5f077/charts/library/common/templates/lib/service/_valuesToObject.tpl#L20
      serviceName: home-assistant-hass
      labels:
        operator.prometheus.io/instance: prometheus-long-term
      endpoints:
        - port: http
          scheme: http
          path: /api/prometheus
