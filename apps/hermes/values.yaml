# ---------------------------------------------------------------------------
# Opt-in homelab MCP gateway client integration (Hermes -> apps/mcp-gateway).
#
# OFF BY DEFAULT AND INERT WHILE OFF: with ``enabled: false`` no resource of
# this feature is rendered at all and the Hermes pod is byte-for-byte the
# baseline (verified by apps/hermes/tests/test_render_enable.py, which diffs
# the rendered manifests against ``git show HEAD:apps/hermes/values.yaml``).
#
# WHY THE SWITCH IS ``global.mcpGateway.enabled`` AND NOT A PLAIN KEY
# Every ``enabled`` field of the app-template subchart is locked to a real
# boolean by its ``values.schema.json`` (verified in
# ``charts/app-template-5.3.0.tgz``: ``.controllers.[]initContainers[].enabled``,
# ``.persistence.[]`` and 14 more are ``type: boolean``), so a helper container
# can never be switched on by a templated string. Templating the values tree
# itself is not possible either: a parent template's writes to ``.Values`` do
# not reach a subchart (subchart values are split before rendering), and YAML
# anchors resolve at parse time, so ``--set`` would flip the ConfigMap but not
# the anchored containers. ``global`` is the one path Helm shares with
# subcharts, and it is a plain bool, so a git edit and
# ``--set global.mcpGateway.enabled=true`` take exactly the same path.
#
# WHY NOTHING IS ADDED TO THE HERMES POD
# The helpers need to write Hermes' own config and OAuth token store
# (``$HERMES_HOME/config.yaml``, ``$HERMES_HOME/mcp-tokens/`` on the
# ``hermes-data`` PVC), so they run as a second pod mounting that same claim.
# Conditional pod contents are not expressible in app-template without leaving
# a trace in the disabled render (empty-valued annotations render as
# ``key: ""``, templated-empty keys as ``"": "true"`` - both verified), and an
# always-present helper container would mean an always-present
# ``hermes-data`` mount.
#
# CUTEOVER (2026-11-10): the legacy ``grafana-mcp`` sidecar, its refresher and
# the ``grafana-mcp-token-init`` init container have been removed. Hermes now
# reaches Grafana through the central MCP gateway at
# ``https://mcp.grigri.cloud/grafana/mcp`` using OAuth (server name
# ``homelab-grafana``, scope ``mcp_grafana``), with caller-preserving
# delegation. The gateway path is validated by
# ``test/mcp-gateway/hermes-live-acceptance.py``. The workload identity
# (``grafana-mcp`` Kanidm service account, ``grafana-mcp-token`` Secret) is
# retained because the gateway helper pod still reads it.
#
# WHAT STILL NEEDS A HUMAN AFTER THE FIRST MERGE
# Hermes re-reads ``mcp_servers`` at gateway startup, from the interactive CLI
# file watcher, or from the ``/reload-mcp`` chat command
# (``cli.py:13113``/``19038`` are the watcher and its only call site, both in
# the CLI loop; ``gateway/run.py:17123`` is the chat command;
# ``tools/mcp_tool.py:7385`` re-reads config inside ``discover_mcp_tools()``).
# ``gateway run`` has no config watcher, so a newly merged server appears at
# the next pod restart or after ``/reload-mcp``. Tokens, in contrast, are
# picked up live: ``tools/mcp_oauth_manager.py`` reloads
# ``mcp-tokens/<server>.json`` by ``st_mtime_ns`` per request, which is why the
# refresher only has to keep those files fresher than their expiry.
global:
  mcpGateway:
    enabled: true

    # One entry per gateway route (``/<target>/mcp``). The gateway has no
    # aggregate endpoint, so each route gets its own token file, its own scope
    # and its own Hermes ``mcp_servers`` entry. MVP: Grafana (per-user JWT
    # propagation) and Context7 (library docs) - two distinct servers, not two
    # tools of one server.
    servers:
      homelab-grafana:
        url: https://mcp.grigri.cloud/grafana/mcp
        scope: mcp_grafana
        timeout: 120
        connectTimeout: 60
      homelab-context7:
        url: https://mcp.grigri.cloud/context7/mcp
        scope: mcp_context7
        timeout: 120
        connectTimeout: 60
      # Firecrawl backend has no per-caller identity: every caller's fetches
      # run under one shared upstream identity. The gateway audit still records
      # the caller, so caller attribution lives in the gateway logs, not in the
      # upstream request.
      homelab-firecrawl:
        url: https://mcp.grigri.cloud/firecrawl/mcp
        scope: mcp_firecrawl
        timeout: 120
        connectTimeout: 60

    exchange:
      url: https://idm.grigri.cloud/oauth2/token
      clientId: mcp-gateway
      audience: mcp-gateway
      # Refresh this many seconds before expiry, and never write a token that
      # is already past it: the file's mtime is what makes the running gateway
      # pick the credential up, so it must never be seen expired.
      marginSeconds: 300
      minIntervalSeconds: 60
      maxIntervalSeconds: 900
      httpTimeoutSeconds: 15
      # Consecutive failures after which the refresher exits instead of serving
      # a stale credential, so the pod restarts and re-reads the Secret.
      maxFailures: 3

    # Written as ``<server>.client.json`` in the RFC 7591 shape Hermes itself
    # would have stored after dynamic registration. Optional; no refresh token
    # is ever written, so Hermes cannot start an unauthorized refresh.
    oauthClientId: mcp-gateway

    identity:
      # Workload identity, never a person's session: the Kanidm service-account
      # API token is read from this Secret and passed to the exchange request
      # in process memory only (no curl, no argv - argv is readable by any
      # process in the container via /proc/<pid>/cmdline).
      subjectTokenSecret: grafana-mcp-token
      subjectTokenKey: token

    serviceAccount:
      # Disabled: ``grafana-mcp`` already has the Grafana native RBAC and the
      # JWT alias, so the routes reuse it. Kept for the day a separate
      # per-instance identity is actually wanted.
      enabled: false
      name: hermes-mcp
      displayname: Hermes homelab MCP gateway
      tokenSecretName: hermes-mcp-token
      tokenRotationDays: 90

    helper:
      # No ``nodeSelector`` or ``runtimeClassName`` is pinned here: the Deployment
      # reads both from the agent's own configuration
      # (``app-template.defaultPodOptions.nodeSelector`` and
      # ``app-template.controllers.hermes.pod.runtimeClassName``), because
      # ``hermes-data`` is ReadWriteOnce and the two pods must stay on the same
      # node/runtime. A duplicated literal here would be a second thing to move
      # when the node moves, and drift means a pod that cannot attach its volume.
      # No command-line secrets, no interactive shell, no service-account token
      # mount: the pod only needs the PVC, the scripts and its own Secret.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Hermes itself runs as uid 0 in this namespace (``runAsUser: 0`` on the
      # agent container) and ``$HERMES_HOME`` on the PVC is root-owned, so the
      # helper writes with the SAME uid the agent already uses. Alternatives
      # were rejected deliberately: ``fsGroup: 10000`` would recursively chown
      # the agent's user data, and a uid-10000 helper cannot write a
      # root-owned 0755 directory (reproduced offline in
      # tests/test_helper_container_runtime.py). The trade-off is explicit:
      # this pod runs as root, so it is capped with a read-only root
      # filesystem, all capabilities dropped, no privilege escalation and no
      # Kubernetes API access at all.
      runAsUser: 0
      runAsGroup: 0

app-template:
  controllers:
    hermes:
      labels:
        backup/retain: quaterly
      type: statefulset
      pod:
        enableServiceLinks: false
        runtimeClassName: kata
        automountServiceAccountToken: false
      serviceAccount:
        name: hermes-agent
      initContainers:
        fix-sa-token:
          image:
            repository: public.ecr.aws/docker/library/busybox
            tag: "1.38"
          command:
            - sh
            - -c
          args:
            - cp -L /var/run/secrets/kubernetes.io/serviceaccount/* /sa-token/ && find /sa-token -type d -exec chmod 0755 {} \; && find /sa-token -type f -exec chmod 0644 {} \;
      containers:
        hermes:
          image:
            # renovate: datasource=docker depName=nousresearch/hermes-agent
            repository: nousresearch/hermes-agent
            tag: v2026.8.16.2
          args: ["gateway", "run"]
          securityContext:
            runAsUser: 0
          env:
            - name: TZ
              value: Europe/Madrid
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.internal.grigri.cloud
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://idm.grigri.cloud/oauth2/openid/hermes
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-kanidm-oauth2-credentials
                  key: CLIENT_ID
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-kanidm-oauth2-credentials
                  key: CLIENT_SECRET
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 4Gi
  defaultPodOptions:
    securityContext: {}
    nodeSelector:
      kubernetes.io/hostname: prusik
  service:
    dashboard:
      ports:
        http:
          port: 9119
  ingress:
    dashboard:
      enabled: true
      className: nginx-internal
      annotations:
        external-dns.kubernetes.io/enabled: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/auth-url: https://auth.grigri.cloud/oauth2/auth?allowed_groups=hermes-users@idm.grigri.cloud
        nginx.ingress.kubernetes.io/auth-signin: https://auth.grigri.cloud/oauth2/start
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      hosts:
        - host: hermes.internal.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: dashboard
                port: http
      tls:
        - hosts:
            - hermes.internal.grigri.cloud
          secretName: hermes-dashboard-tls-certificate
  # Envoy Gateway route (ingress-nginx migration). The Ingress above stays until the switch.
  # The external-dns annotation publishes the name (the Gateway address). Behind the OIDC SecurityPolicy
  # (templates/security-policy.yaml); the dashboard keeps its own OIDC login on top, as with nginx.
  route:
    dashboard:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      # stable name: the SecurityPolicy targets it
      forceRename: hermes-internal
      hostnames:
        - hermes.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: dashboard
              port: 9119
  persistence:
    data:
      enabled: true
      globalMounts:
        - path: /opt/data
      existingClaim: hermes-data
    sa-token-source:
      type: custom
      volumeSpec:
        projected:
          defaultMode: 0644
          sources:
            - serviceAccountToken:
                path: token
                audience: https://kubernetes.default.svc.cluster.local
                expirationSeconds: 7776000
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - fieldRef:
                      fieldPath: metadata.namespace
                    path: namespace
      advancedMounts:
        hermes:
          fix-sa-token:
            - path: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
    sa-token:
      type: emptyDir
      advancedMounts:
        hermes:
          fix-sa-token:
            - path: /sa-token
          hermes:
            - path: /var/run/secrets/hermes-k8s
              readOnly: true
