app-template:
  controllers:
    hermes:
      labels:
        backup/retain: quaterly
      type: statefulset
      pod:
        enableServiceLinks: false
        runtimeClassName: kata
        automountServiceAccountToken: false
      serviceAccount:
        name: hermes-agent
      initContainers:
        fix-sa-token:
          image:
            repository: public.ecr.aws/docker/library/busybox
            tag: "1.38"
          command:
            - sh
            - -c
          args:
            - mkdir -p /shared/serviceaccount && cp -L /var/run/secrets/kubernetes.io/serviceaccount/* /shared/serviceaccount/ && find /shared/serviceaccount -type d -exec chmod 0755 {} \; && find /shared/serviceaccount -type f -exec chmod 0644 {} \;
        grafana-mcp-token-init:
          image:
            repository: curlimages/curl
            tag: 8.11.0
          env:
            KANIDM_TOKEN:
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-token
                  key: token
          command: ["/bin/sh", "-c"]
          args:
            - |
              RESPONSE=$(curl -sf -X POST "https://idm.grigri.cloud/oauth2/token" \
                -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
                -d "client_id=grafana" \
                -d "subject_token=${KANIDM_TOKEN}" \
                -d "subject_token_type=urn:ietf:params:oauth:token-type:access_token" \
                -d "audience=grafana" \
                -d "scope=openid email profile")
              JWT=$(echo "$RESPONSE" | grep -o '"id_token":"[^"]*"' | cut -d'"' -f4)
              echo -n "$JWT" > /shared/grafana-jwt
              chmod 666 /shared/grafana-jwt
      containers:
        hermes:
          image:
            # renovate: datasource=docker depName=nousresearch/hermes-agent
            repository: nousresearch/hermes-agent
            tag: v2026.8.16.2
          args: ["gateway", "run"]
          securityContext:
            runAsUser: 0
          env:
            - name: TZ
              value: Europe/Madrid
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.internal.grigri.cloud
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://idm.grigri.cloud/oauth2/openid/hermes
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-kanidm-oauth2-credentials
                  key: CLIENT_ID
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-kanidm-oauth2-credentials
                  key: CLIENT_SECRET
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 4Gi
        grafana-mcp:
          image:
            repository: docker.io/grafana/mcp-grafana
            tag: "1.5.1"
          args:
            - -enabled-tools=datasource,prometheus,loki,alerting,dashboard
            - -transport=sse
            - -address=0.0.0.0:8080
          env:
            GRAFANA_URL: "http://monitoring-grafana.monitoring.svc.cluster.local"
            GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: "/shared/grafana-jwt"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        grafana-mcp-refresher:
          image:
            repository: curlimages/curl
            tag: 8.11.0
          env:
            KANIDM_TOKEN:
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-token
                  key: token
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                sleep 600
                RESPONSE=$(curl -sf -X POST "https://idm.grigri.cloud/oauth2/token" \
                  -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
                  -d "client_id=grafana" \
                  -d "subject_token=${KANIDM_TOKEN}" \
                  -d "subject_token_type=urn:ietf:params:oauth:token-type:access_token" \
                  -d "audience=grafana" \
                  -d "scope=openid email profile")
                JWT=$(echo "$RESPONSE" | grep -o '"id_token":"[^"]*"' | cut -d'"' -f4)
                echo -n "$JWT" > /shared/grafana-jwt
              done
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
  defaultPodOptions:
    securityContext: {}
    nodeSelector:
      kubernetes.io/hostname: prusik
  service:
    dashboard:
      ports:
        http:
          port: 9119
  ingress:
    dashboard:
      enabled: true
      className: nginx-internal
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/auth-url: https://auth.grigri.cloud/oauth2/auth?allowed_groups=hermes-users@idm.grigri.cloud
        nginx.ingress.kubernetes.io/auth-signin: https://auth.grigri.cloud/oauth2/start
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      hosts:
        - host: hermes.internal.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: dashboard
                port: http
      tls:
        - hosts:
            - hermes.internal.grigri.cloud
          secretName: hermes-dashboard-tls-certificate
  persistence:
    data:
      enabled: true
      globalMounts:
        - path: /opt/data
      existingClaim: hermes-data
    grafana-mcp-shared:
      type: emptyDir
      sizeLimit: 1Mi
      advancedMounts:
        hermes:
          fix-sa-token:
            - path: /shared
          grafana-mcp-token-init:
            - path: /shared
          grafana-mcp:
            - path: /shared
              readOnly: true
          grafana-mcp-refresher:
            - path: /shared
    sa-token-source:
      type: custom
      volumeSpec:
        projected:
          defaultMode: 0644
          sources:
            - serviceAccountToken:
                path: token
                audience: https://kubernetes.default.svc.cluster.local
                expirationSeconds: 7776000
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - fieldRef:
                      fieldPath: metadata.namespace
                    path: namespace
      advancedMounts:
        hermes:
          fix-sa-token:
            - path: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
    sa-token:
      type: emptyDir
      advancedMounts:
        hermes:
          fix-sa-token:
            - path: /shared/serviceaccount
          hermes:
            - path: /var/run/secrets/hermes-k8s
              readOnly: true
