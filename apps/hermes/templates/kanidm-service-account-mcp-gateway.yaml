{{- $gw := dig "mcpGateway" dict .Values.global }}
{{- if and (eq (include "hermes.mcpGateway.enabled" .) "true") (dig "serviceAccount" "enabled" false $gw) }}
{{- $sa := dig "serviceAccount" dict $gw }}
---
# Optional dedicated workload identity for this Hermes instance's gateway access.
#
# Rendered only when the feature is on AND ``serviceAccount.enabled`` is true.
# It is off by default: ``grafana-mcp`` (``templates/kanidm-service-account.yaml``,
# whose ``grafana-mcp-token`` Secret the helper pod reads) carries the
# Grafana native RBAC and the JWT alias, so the gateway routes reuse it rather
# than adding a second identity with its own grants.
#
# The service-only group this account is managed by must already exist in the
# gateway chart and must hold service accounts only, never people - person
# membership stays manual in Kanidm. Kaniop materialises the API token as a
# Secret in this namespace for the helper to read.
apiVersion: kaniop.rs/v1beta1
kind: KanidmServiceAccount
metadata:
  name: {{ $sa.name }}
  labels:
    app.kubernetes.io/component: mcp-gateway-client
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm

  serviceAccountAttributes:
    displayname: {{ $sa.displayname }}
    entryManagedBy: grafana-mcp-users

  apiTokens:
    - label: token
      purpose: readonly
      secretName: {{ $sa.tokenSecretName }}

  apiTokenRotation:
    enabled: true
    periodDays: {{ int $sa.tokenRotationDays }}
{{- end }}
