---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana-mcp-token
  data:
    - secretKey: token
      remoteRef:
        key: /hermes/grafana-mcp
        property: kanidm-token
