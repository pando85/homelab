apiVersion: kaniop.rs/v1beta1
kind: KanidmServiceAccount
metadata:
  name: grafana-mcp
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  serviceAccountAttributes:
    displayname: Hermes Grafana MCP
    entryManagedBy: grafana-mcp-users
  apiTokens:
    - label: token
      purpose: readonly
      secretName: grafana-mcp-token
  apiTokenRotation:
    enabled: true
    periodDays: 90
