minio:
  image:
    # renovate: datasource=docker depName=pgsty/silo versioning=regex:^RELEASE\.(?<major>\d{4})-(?<minor>\d{2})-(?<patch>\d{2})T(?<build>\d{2})-(?<revision>\d{2})-(?<patch2>\d{2})Z$
    repository: pgsty/silo
    tag: RELEASE.2026-10-26T00-00-00Z

  mode: standalone

  drivesPerNode: 1
  # Number of MinIO containers running
  replicas: 1

  existingSecret: cross-backups-users

  persistence:
    enabled: true
    existingClaim: cross-backups

  podAnnotations:
    # Cilium ingress-bandwidth only works for inter-node traffic, not same-node.
    # The Envoy proxies and MinIO both prefer prusik, so this is a no-op.
    # Ingress rate limiting is done via tc-limiter DaemonSet (system/tc-limiter/).
    # kubernetes.io/ingress-bandwidth: "50M"

  resources:
    requests:
      memory: 768Mi

  policies:
    - name: millaReadWritePolicy
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::milla/*'
          actions:
            - "s3:AbortMultipartUpload"
            - "s3:GetObject"
            - "s3:DeleteObject"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
        - resources:
            - 'arn:aws:s3:::milla/'
          actions:
            - "s3:CreateBucket"
            - "s3:DeleteBucket"
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketMultipartUploads"
    - name: dabolReadWritePolicy
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::dabol/*'
          actions:
            - "s3:AbortMultipartUpload"
            - "s3:GetObject"
            - "s3:DeleteObject"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
        - resources:
            - 'arn:aws:s3:::dabol/'
          actions:
            - "s3:CreateBucket"
            - "s3:DeleteBucket"
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketMultipartUploads"
    - name: sdelrioReadWritePolicy
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::sdelrio/*'
          actions:
            - "s3:AbortMultipartUpload"
            - "s3:GetObject"
            - "s3:DeleteObject"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
        - resources:
            - 'arn:aws:s3:::sdelrio/'
          actions:
            - "s3:CreateBucket"
            - "s3:DeleteBucket"
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketMultipartUploads"
    - name: nbg1C01VeleroReadWritePolicy
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::nbg1-c01-velero/*'
          actions:
            - "s3:AbortMultipartUpload"
            - "s3:GetObject"
            - "s3:DeleteObject"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
        - resources:
            - 'arn:aws:s3:::nbg1-c01-velero/'
          actions:
            - "s3:CreateBucket"
            - "s3:DeleteBucket"
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketMultipartUploads"
    - name: nbg1C01PostgresReadWritePolicy
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::nbg1-c01-postgres-backups/*'
          actions:
            - "s3:AbortMultipartUpload"
            - "s3:GetObject"
            - "s3:DeleteObject"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
        - resources:
            - 'arn:aws:s3:::nbg1-c01-postgres-backups/'
          actions:
            - "s3:CreateBucket"
            - "s3:DeleteBucket"
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketMultipartUploads"
    - name: nbg1C01VaultReadWritePolicy
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::nbg1-c01-vault-backups/*'
          actions:
            - "s3:AbortMultipartUpload"
            - "s3:GetObject"
            - "s3:DeleteObject"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
        - resources:
            - 'arn:aws:s3:::nbg1-c01-vault-backups/'
          actions:
            - "s3:CreateBucket"
            - "s3:DeleteBucket"
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketMultipartUploads"
  users:
    - accessKey: milla
      existingSecret: cross-backups-users
      existingSecretKey: millaPassword
      policy: millaReadWritePolicy
    - accessKey: dabol
      existingSecret: cross-backups-users
      existingSecretKey: dabolPassword
      policy: dabolReadWritePolicy
    - accessKey: sdelrio
      existingSecret: cross-backups-users
      existingSecretKey: sdelrioPassword
      policy: sdelrioReadWritePolicy
    - accessKey: nbg1-c01-velero
      existingSecret: cross-backups-users
      existingSecretKey: nbg1C01VeleroPassword
      policy: nbg1C01VeleroReadWritePolicy
    - accessKey: nbg1-c01-postgres-backups
      existingSecret: cross-backups-users
      existingSecretKey: nbg1C01PostgresBackupsPassword
      policy: nbg1C01PostgresReadWritePolicy
    - accessKey: nbg1-c01-vault-backups
      existingSecret: cross-backups-users
      existingSecretKey: nbg1C01VaultBackupsPassword
      policy: nbg1C01VaultReadWritePolicy
    ## Username, password and policy to be assigned to the user
    ## Default policies are [readonly|readwrite|writeonly|consoleAdmin|diagnostics]
    ## Add new policies as explained here https://min.io/docs/minio/kubernetes/upstream/administration/identity-access-management.html#access-management
    ## NOTE: this will fail if LDAP is enabled in your MinIO deployment
    ## make sure to disable this if you are using LDAP.
    #- accessKey: console
    #  secretKey: console123
    #  policy: consoleAdmin
    # Or you can refer to specific secret
    #- accessKey: externalSecret
    #  existingSecret: my-secret
    #  existingSecretKey: password
    #  policy: readonly

  buckets:
    - name: milla
      # Policy to be set on the
      # bucket [none|download|upload|public]
      policy: none
      # Purge if bucket exists already
      purge: false
      versioning: false
      objectlocking: false
    - name: dabol
      policy: none
      purge: false
      versioning: false
      objectlocking: false
    - name: sdelrio
      policy: none
      purge: false
      versioning: false
      objectlocking: false
    - name: nbg1-c01-velero
      policy: none
      purge: false
      versioning: false
      objectlocking: false
    - name: nbg1-c01-postgres-backups
      policy: none
      purge: false
      versioning: false
      objectlocking: false
    - name: nbg1-c01-vault-backups
      policy: none
      purge: false
      versioning: false
      objectlocking: false
    #   # Name of the bucket
    # - name: bucket1
    #   # Policy to be set on the
    #   # bucket [none|download|upload|public]
    #   policy: none
    #   # Purge if bucket exists already
    #   purge: false
    #   # set versioning for
    #   # bucket [true|false]
    #   versioning: false # remove this key if you do not want versioning feature
    #   # set objectlocking for
    #   # bucket [true|false] NOTE: versioning is enabled by default if you use locking
    #   objectlocking: false
    # - name: bucket2
    #   policy: none
    #   purge: false
    #   versioning: true
    #   # set objectlocking for
    #   # bucket [true|false] NOTE: versioning is enabled by default if you use locking
    #   objectlocking: false

  customCommands:
    - command: "quota set myminio/dabol --size 3TB"

  metrics:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
