# Envoy Gateway route.
# Internal route: the external-dns annotation publishes its name (the Gateway address).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rsshub
  annotations:
    external-dns.kubernetes.io/enabled: "true"
spec:
  hostnames:
    - rsshub.internal.grigri.cloud
  parentRefs:
    - name: internal
      namespace: envoy-gateway
      sectionName: https-internal-grigri-cloud
  rules:
    - backendRefs:
        - name: rsshub
          port: 80
