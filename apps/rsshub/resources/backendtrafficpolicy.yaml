# Temporary proof of the per-route timeout override pattern (Phase 3), reverted right after.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rsshub-timeouts
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rsshub
  mergeType: StrategicMerge
  timeout:
    tcp:
      connectTimeout: 60s
    http:
      streamIdleTimeout: 3600s
