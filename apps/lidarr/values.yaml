app-template:
  controllers:
    lidarr:
      labels:
        backup/retain: quaterly
      type: statefulset
      containers:
        lidarr:
          image:
            repository: ghcr.io/crutonjohn/lidarr-plugins
            tag: "2.14.5.4825"
          env:
            TZ: Europe/Madrid
          resources:
            requests:
              cpu: 10m
              memory: 180Mi
            limits:
              memory: 400Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5

  service:
    lidarr:
      controller: lidarr
      ports:
        http:
          port: 8686

  # Envoy Gateway routes.
  # The internal route carries the external-dns annotation (the Gateway address is published in DNS). The external
  # route is behind the OIDC SecurityPolicy (templates/security-policy.yaml).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      forceRename: lidarr-internal
      hostnames:
        - lidarr.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: lidarr
              port: 8686
    external:
      kind: HTTPRoute
      # stable name: the SecurityPolicy targets it
      forceRename: lidarr-external
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - lidarr.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: lidarr
              port: 8686
  defaultPodOptions:
    securityContext:
      runAsUser: 995
      runAsGroup: 501
      fsGroup: 501
      fsGroupChangePolicy: "OnRootMismatch"

    nodeSelector:
      kubernetes.io/hostname: prusik

  persistence:
    config:
      enabled: true
      globalMounts:
        - path: /config
      existingClaim: config-lidarr
    musica:
      enabled: true
      type: hostPath
      hostPath: /datasets/musica
      globalMounts:
        - path: /datasets/musica
