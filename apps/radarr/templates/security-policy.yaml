---
# Envoy Gateway native OIDC against Kanidm + JWT authorization on the `groups` claim, on the
# protected external routes (the `radarr-external-apikey*` routes have none).
# Pattern: docs/conventions/envoy-gateway-auth.md
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: radarr-external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radarr-external
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radarr-external-movie-list
  oidc:
    provider:
      issuer: https://idm.grigri.cloud/oauth2/openid/radarr
      # explicit endpoints: no OIDC discovery at translation time
      authorizationEndpoint: https://idm.grigri.cloud/ui/oauth2
      tokenEndpoint: https://idm.grigri.cloud/oauth2/token
    clientID: radarr
    clientSecret:
      name: radarr-kanidm-oauth2-credentials
    redirectURL: https://radarr.grigri.cloud/oauth2/callback
    # the default `/logout` would shadow the app's own path
    logoutPath: /oauth2/logout
    scopes: [openid, profile, email, groups]
    cookieNames:
      accessToken: oidc-access-token
      idToken: oidc-id-token
  jwt:
    providers:
      - name: kanidm
        issuer: https://idm.grigri.cloud/oauth2/openid/radarr
        audiences: [radarr]
        extractFrom:
          cookies: [oidc-id-token]
        remoteJWKS:
          uri: https://idm.grigri.cloud/oauth2/openid/radarr/public_key.jwk
        # nginx passes no identity headers to radarr: no claimToHeaders
  authorization:
    defaultAction: Deny
    rules:
      - name: allowed-groups
        action: Allow
        principal:
          jwt:
            provider: kanidm
            claims:
              # nginx `allowed_groups=radarr-users@idm.grigri.cloud` (SPN form)
              - name: groups
                valueType: StringArray
                values:
                  - radarr-users@idm.grigri.cloud
              # BEGIN parity (a): nginx also required a group of the oauth2-proxy client scope map
              # (k8s-oauth2-proxy-users, navidrome-users, hermes-users). Claims are ANDed, values ORed.
              # Drop this block to allow every member of radarr-users@idm.grigri.cloud.
              - name: groups
                valueType: StringArray
                values:
                  - k8s-oauth2-proxy-users@idm.grigri.cloud
                  - navidrome-users@idm.grigri.cloud
                  - hermes-users@idm.grigri.cloud
              # END parity
