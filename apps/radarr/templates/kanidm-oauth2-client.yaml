---
# OIDC client for the Envoy Gateway SecurityPolicy on the external routes (replaces the shared
# oauth2-proxy client for this app). Kanidm only issues tokens to the scope map group below.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: radarr
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: radarr
  origin: https://radarr.grigri.cloud/
  redirectUrl:
    - https://radarr.grigri.cloud/oauth2/callback
  # same group nginx allows today (`allowed_groups=radarr-users@idm.grigri.cloud`)
  scopeMap:
    - group: radarr-users
      scopes: [openid, profile, email]
  # per-app claim for the SecurityPolicy authorization: small, unlike the `groups` scope, which
  # lists every group of the person and overflowed the 4096 B `oidc-id-token` cookie
  claimMap:
    - name: access
      joinStrategy: array
      valuesMap:
        - group: radarr-users
          values: [radarr]
  preferShortUsername: true
  strictRedirectUrl: true
  # Envoy Gateway reads the client secret from the `client-secret` key
  secretKeyAliases:
    clientSecret:
      - client-secret
