app-template:
  controllers:
    radarr:
      labels:
        backup/retain: quaterly
      type: statefulset
      containers:
        radarr:
          image:
            repository: ghcr.io/home-operations/radarr
            tag: 7.0.2.10888@sha256:69ea515df6e2a3ea1490cfa127ffaaf9597a9db84fffa2fa150a6fae98fe04cb

          env:
            TZ: Europe/Madrid
            RADARR__POSTGRES__HOST: radarr-postgres
            RADARR__POSTGRES__PORT: "5432"
            RADARR__POSTGRES__MAINDB: radarr-main
            RADARR__POSTGRES__LOGDB: radarr-log
            RADARR__POSTGRES__USER:
              valueFrom:
                secretKeyRef:
                  name: radarr.radarr-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            RADARR__POSTGRES__PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: radarr.radarr-postgres.credentials.postgresql.acid.zalan.do
                  key: password

          resources:
            requests:
              cpu: 10m
              memory: 180Mi
            limits:
              memory: 1Gi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5

  service:
    radarr:
      controller: radarr
      ports:
        http:
          port: 7878

  defaultPodOptions:
    securityContext:
      runAsUser: 995
      runAsGroup: 501
      fsGroup: 501
      fsGroupChangePolicy: "OnRootMismatch"

    nodeSelector:
      kubernetes.io/hostname: prusik

  persistence:
    config:
      enabled: true
      globalMounts:
        - path: /config
      existingClaim: config-radarr
    peliculas:
      enabled: true
      type: hostPath
      hostPath: /datasets/peliculas
      globalMounts:
        - path: /datasets/peliculas
