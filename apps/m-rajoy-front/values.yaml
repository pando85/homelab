app-template:
  controllers:
    m-rajoy-front:
      replicas: 2
      containers:
        m-rajoy-front:
          image:
            repository: pando85/quotes-simple-web-front
            tag: 1.0.0

          env:
            VUE_APP_API_URL: https://api.m.rajoy.grigri.cloud

          securityContext:
            runAsUser: 0

          resources:
            requests:
              cpu: 10m
              memory: 4Mi
            limits:
              cpu: 500m
              memory: 32Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5
  service:
    m-rajoy-front:
      controller: m-rajoy-front
      ports:
        http:
          port: 80

  # Envoy Gateway routes.
  # Internal routes carry the external-dns annotation (the Gateway address is published in DNS).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - m.rajoy.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-rajoy-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: m-rajoy-front
              port: 80
    external:
      kind: HTTPRoute
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - m.rajoy.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: m-rajoy-front
              port: 80

  defaultPodOptions:
    enableServiceLinks: false

    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: m-rajoy-front
            app.kubernetes.io/name: m-rajoy-front
