---
# Envoy Gateway native OIDC against Kanidm + JWT authorization on the `groups` claim.
# Pattern: docs/conventions/gateway-api-routes.md ("Authentication")
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prowlarr-external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prowlarr-external
  oidc:
    provider:
      issuer: https://idm.grigri.cloud/oauth2/openid/prowlarr
      # explicit endpoints: no OIDC discovery at translation time
      authorizationEndpoint: https://idm.grigri.cloud/ui/oauth2
      tokenEndpoint: https://idm.grigri.cloud/oauth2/token
    clientID: prowlarr
    clientSecret:
      name: prowlarr-kanidm-oauth2-credentials
    redirectURL: https://prowlarr.grigri.cloud/oauth2/callback
    # the default `/logout` would shadow the app's own path
    logoutPath: /oauth2/logout
    scopes: [openid, profile, email, groups]
    cookieNames:
      accessToken: oidc-access-token
      idToken: oidc-id-token
  jwt:
    providers:
      - name: kanidm
        issuer: https://idm.grigri.cloud/oauth2/openid/prowlarr
        audiences: [prowlarr]
        extractFrom:
          cookies: [oidc-id-token]
        remoteJWKS:
          uri: https://idm.grigri.cloud/oauth2/openid/prowlarr/public_key.jwk
        # nginx passes no identity headers to prowlarr: no claimToHeaders
  authorization:
    defaultAction: Deny
    rules:
      - name: allowed-groups
        action: Allow
        principal:
          jwt:
            provider: kanidm
            claims:
              # nginx `allowed_groups=prowlarr-users@idm.grigri.cloud` (SPN form)
              - name: groups
                valueType: StringArray
                values:
                  - prowlarr-users@idm.grigri.cloud
