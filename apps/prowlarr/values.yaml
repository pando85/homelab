app-template:
  controllers:
    prowlarr:
      labels:
        backup/retain: weekly
      replicas: 1
      # HA is not supported
      strategy: Recreate
      containers:
        prowlarr:
          image:
            repository: ghcr.io/home-operations/prowlarr
            tag: 2.7.0.5723@sha256:fcf7498692f97698ea8b8f7078a0f81120a16e7354e4c232b5e3810e3e783dff

          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: &port 9696
                initialDelaySeconds: 0
                periodSeconds: 30
                timeoutSeconds: 3
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true

          env:
            TZ: Europe/Madrid
            PROWLARR__INSTANCE_NAME: Prowlarr
            PROWLARR__PORT: *port
            PROWLARR__LOG_LEVEL: info

          resources:
            requests:
              cpu: 10m
              memory: 200Mi
            limits:
              memory: 400Mi

  service:
    prowlarr:
      controller: prowlarr
      ports:
        http:
          port: *port

  # Envoy Gateway routes.
  # The internal route carries the external-dns annotation (the Gateway address is published in DNS). The external
  # route is behind the OIDC SecurityPolicy (templates/security-policy.yaml).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      forceRename: prowlarr-internal
      hostnames:
        - prowlarr.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: prowlarr
              port: 9696
    external:
      kind: HTTPRoute
      # stable name: the SecurityPolicy targets it
      forceRename: prowlarr-external
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - prowlarr.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: prowlarr
              port: 9696

  defaultPodOptions:
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"

  persistence:
    config:
      enabled: true
      globalMounts:
        - path: /config
      existingClaim: prowlarr-config
