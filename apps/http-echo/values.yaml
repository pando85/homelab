app-template:
  controllers:
    http-echo:
      replicas: 1
      containers:
        http-echo:
          image:
            repository: mendhak/http-https-echo
            tag: 43

          securityContext:
            runAsUser: 1000

          resources:
            requests:
              cpu: 10m
              memory: 14Mi
            limits:
              cpu: 200m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5

  defaultPodOptions:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: http-echo
            app.kubernetes.io/name: http-echo

  service:
    http-echo:
      controller: http-echo
      ports:
        http:
          port: 8080

  # Envoy Gateway routes.
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - http-echo.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: http-echo
              port: 8080
    external:
      kind: HTTPRoute
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - http-echo.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: http-echo
              port: 8080
