---
# Envoy Gateway native OIDC against Kanidm + JWT authorization on the per-app `access` claim.
# No `groups` scope: every group in the ID token pushed the `oidc-id-token` cookie over 4096 B.
# Pattern: docs/conventions/envoy-gateway-auth.md
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: http-echo-external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: http-echo-external
  oidc:
    provider:
      issuer: https://idm.grigri.cloud/oauth2/openid/http-echo
      # explicit endpoints: no OIDC discovery at translation time
      authorizationEndpoint: https://idm.grigri.cloud/ui/oauth2
      tokenEndpoint: https://idm.grigri.cloud/oauth2/token
    clientID: http-echo
    clientSecret:
      name: http-echo-kanidm-oauth2-credentials
    redirectURL: https://http-echo.grigri.cloud/oauth2/callback
    # the default `/logout` would shadow the app's own path
    logoutPath: /oauth2/logout
    scopes: [openid, profile, email]
    cookieNames:
      accessToken: oidc-access-token
      idToken: oidc-id-token
  jwt:
    providers:
      - name: kanidm
        issuer: https://idm.grigri.cloud/oauth2/openid/http-echo
        audiences: [http-echo]
        extractFrom:
          cookies: [oidc-id-token]
        remoteJWKS:
          uri: https://idm.grigri.cloud/oauth2/openid/http-echo/public_key.jwk
        # jwt_authn removes client-sent copies of these headers before it adds them
        claimToHeaders:
          - header: X-Auth-Request-User
            claim: email
          - header: X-Auth-Request-Email
            claim: email
          - header: X-Auth-Request-Preferred-Username
            claim: preferred_username
  authorization:
    defaultAction: Deny
    rules:
      - name: allowed-access
        action: Allow
        principal:
          jwt:
            provider: kanidm
            claims:
              # claim map of the http-echo client (members of http-echo-users)
              - name: access
                valueType: StringArray
                values:
                  - http-echo
