---
# OIDC client for the Envoy Gateway SecurityPolicy on the external route (replaces the shared
# oauth2-proxy client for this app). Kanidm only issues tokens to the scope map group below.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: http-echo
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: http-echo
  origin: https://http-echo.grigri.cloud/
  redirectUrl:
    - https://http-echo.grigri.cloud/oauth2/callback
  # per-app group: Kanidm only issues tokens to its members (members are added by hand)
  scopeMap:
    - group: http-echo-users
      scopes: [openid, profile, email, groups]
  preferShortUsername: true
  strictRedirectUrl: true
  # Envoy Gateway reads the client secret from the `client-secret` key
  secretKeyAliases:
    clientSecret:
      - client-secret
