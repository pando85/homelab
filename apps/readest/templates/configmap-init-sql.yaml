apiVersion: v1
kind: ConfigMap
metadata:
  name: readest-init-sql
data:
  expected-version: {{ index .Values "app-template" "controllers" "client" "initContainers" "patch-oauth" "image" "tag" | quote }}
  expected-app-version: {{ index .Values "app-template" "controllers" "client" "containers" "client" "image" "tag" | quote }}
  vendored-version: {{ .Files.Get "files/sql/VERSION" | trim | quote }}
  schema.sql: |
{{ .Files.Get "files/sql/schema.sql" | indent 4 }}
{{- range $path, $_ := .Files.Glob "files/sql/[0-9]*_*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
  migrate.sh: |
    #!/bin/sh
    set -eu

    EXPECTED_VERSION=$(cat /db-init/expected-version)
    EXPECTED_APP_VERSION=$(cat /db-init/expected-app-version)
    VENDORED_VERSION=$(cat /db-init/vendored-version)

    if [ -z "$EXPECTED_VERSION" ]; then
      echo "ERROR: expected-version is empty in ConfigMap"
      exit 1
    fi
    if [ -z "$EXPECTED_APP_VERSION" ]; then
      echo "ERROR: expected-app-version is empty in ConfigMap"
      exit 1
    fi
    if [ -z "$VENDORED_VERSION" ]; then
      echo "ERROR: vendored-version is empty in ConfigMap"
      exit 1
    fi
    if [ "$EXPECTED_VERSION" != "$VENDORED_VERSION" ]; then
      echo "ERROR: patch-oauth image tag ($EXPECTED_VERSION) does not match vendored SQL ($VENDORED_VERSION)"
      echo "Run: apps/readest/hack/vendor-sql-migrations.py $EXPECTED_VERSION"
      exit 1
    fi
    if [ "$EXPECTED_APP_VERSION" != "$VENDORED_VERSION" ]; then
      echo "ERROR: client image tag ($EXPECTED_APP_VERSION) does not match vendored SQL ($VENDORED_VERSION)"
      echo "Run: apps/readest/hack/vendor-sql-migrations.py $EXPECTED_APP_VERSION"
      exit 1
    fi
    echo "Version check passed: Readest v${VENDORED_VERSION} (patch-oauth=$EXPECTED_VERSION, client=$EXPECTED_APP_VERSION)"

    export PGPASSWORD="$DB_PASSWORD"
    export PGHOST=readest-postgres
    export PGPORT=5432
    export PGDATABASE=readest
    export PGUSER=readest

    echo "Waiting for PostgreSQL..."
    until pg_isready -q -t 5; do
      sleep 2
    done

    echo "Ensuring required roles exist..."
    psql -v ON_ERROR_STOP=1 -c "SET search_path TO public, auth;" \
      -c "CREATE SCHEMA IF NOT EXISTS extensions;" \
      -c "CREATE SCHEMA IF NOT EXISTS auth;" \
      -c "CREATE SCHEMA IF NOT EXISTS graphql_public;" \
      -c "CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;" \
      -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; ELSE ALTER ROLE service_role BYPASSRLS; END IF; END \$\$;" \
      -c "GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;" \
      -c "GRANT USAGE ON SCHEMA extensions TO anon, authenticated, service_role;" \
      -c "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA extensions TO authenticated;" \
      -c "GRANT anon, authenticated, service_role TO authenticator;"

    echo "Creating migration ledger..."
    psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS readest_meta;" \
      -c "CREATE TABLE IF NOT EXISTS readest_meta.migrations (name text PRIMARY KEY, applied_at timestamptz DEFAULT now());"

    APPLIED=$(psql -tAc "SELECT string_agg(name, ' ') FROM readest_meta.migrations;")
    APPLIED_COUNT=$(psql -tAc "SELECT count(*) FROM readest_meta.migrations;")
    echo "Ledger has $APPLIED_COUNT applied entries."

    is_applied() {
      case " $APPLIED " in *" $1 "*) return 0;; *) return 1;; esac
    }

    if is_applied "schema.sql"; then
      echo "Skipping schema.sql — already applied."
    else
      echo "Applying schema.sql..."
      psql -v ON_ERROR_STOP=1 -f /db-init/schema.sql
      psql -v ON_ERROR_STOP=1 -c "INSERT INTO readest_meta.migrations(name) VALUES ('schema.sql') ON CONFLICT (name) DO NOTHING;"
      APPLIED="$APPLIED schema.sql"
      echo "Base schema applied."
    fi

    MIGRATION_COUNT=0
    PENDING=0
    PENDING_LIST=""
    for f in /db-init/[0-9]*_*.sql; do
      [ -f "$f" ] || continue
      name=$(basename "$f")
      MIGRATION_COUNT=$((MIGRATION_COUNT + 1))
      if ! is_applied "$name"; then
        PENDING=$((PENDING + 1))
        PENDING_LIST="$PENDING_LIST $name"
      fi
    done

    if [ "$MIGRATION_COUNT" -eq 0 ]; then
      echo "ERROR: no migration files found in /db-init/"
      exit 1
    fi
    echo "Found $MIGRATION_COUNT migration file(s), $PENDING pending."

    if [ "$PENDING" -eq 0 ]; then
      echo "All migrations already applied — skipping."
    else
      echo "$PENDING migration(s) pending — applying..."
      for name in $PENDING_LIST; do
        echo "  Applying $name..."
        psql -v ON_ERROR_STOP=1 -f "/db-init/$name"
        psql -v ON_ERROR_STOP=1 -c "INSERT INTO readest_meta.migrations(name) VALUES ('$name') ON CONFLICT (name) DO NOTHING;"
        APPLIED="$APPLIED $name"
        echo "  Migration $name applied."
      done
    fi

    echo "Granting permissions..."
    psql -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA auth TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO anon, authenticated, service_role;"

    echo "Setting default privileges for future tables..."
    psql -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA auth GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;"

    echo "Ensuring custom OAuth provider (Kanidm) exists..."
    escape_sql() {
      printf '%s' "$1" | sed "s/'/''/g"
    }
    KANIDM_ID_ESCAPED=$(escape_sql "$KANIDM_CLIENT_ID")
    KANIDM_SECRET_ESCAPED=$(escape_sql "$KANIDM_CLIENT_SECRET")
    psql -v ON_ERROR_STOP=1 -c "INSERT INTO auth.custom_oauth_providers (provider_type, identifier, name, client_id, client_secret, authorization_url, token_url, userinfo_url, scopes, pkce_enabled, enabled) VALUES ('oauth2', 'custom:kanidm', 'Kanidm', '${KANIDM_ID_ESCAPED}', '${KANIDM_SECRET_ESCAPED}', 'https://idm.grigri.cloud/ui/oauth2', 'https://idm.grigri.cloud/oauth2/token', 'https://idm.grigri.cloud/oauth2/openid/readest/userinfo', ARRAY['openid','profile','email'], true, true) ON CONFLICT (identifier) DO UPDATE SET client_id = '${KANIDM_ID_ESCAPED}', client_secret = '${KANIDM_SECRET_ESCAPED}', enabled = true;"

    echo "Running post-migration health check..."
    HEALTH_ERRORS=0

    SCHEMAS=$(psql -tAc "SELECT count(*) FROM pg_namespace WHERE nspname IN ('auth','extensions','graphql_public');")
    if [ "$SCHEMAS" -lt 3 ]; then
      echo "FAIL: Expected 3 schemas (auth, extensions, graphql_public), found $SCHEMAS"
      HEALTH_ERRORS=$((HEALTH_ERRORS + 1))
    else
      echo "OK: All 3 required schemas present"
    fi

    OAUTH_ENABLED=$(psql -tAc "SELECT enabled FROM auth.custom_oauth_providers WHERE identifier='custom:kanidm';")
    if [ "$OAUTH_ENABLED" != "t" ]; then
      echo "FAIL: custom:kanidm OAuth provider missing or disabled"
      HEALTH_ERRORS=$((HEALTH_ERRORS + 1))
    else
      echo "OK: custom:kanidm OAuth provider enabled"
    fi

    for ROLE in anon authenticated service_role; do
      EXISTS=$(psql -tAc "SELECT count(*) FROM pg_roles WHERE rolname='$ROLE';")
      if [ "$EXISTS" -eq 0 ]; then
        echo "FAIL: Role $ROLE missing"
        HEALTH_ERRORS=$((HEALTH_ERRORS + 1))
      fi
    done
    echo "OK: All required roles exist"

    BYPASSRLS=$(psql -tAc "SELECT rolbypassrls FROM pg_roles WHERE rolname='service_role';")
    if [ "$BYPASSRLS" != "t" ]; then
      echo "FAIL: service_role missing BYPASSRLS"
      HEALTH_ERRORS=$((HEALTH_ERRORS + 1))
    else
      echo "OK: service_role has BYPASSRLS"
    fi

    CRITICAL_TABLES=$(psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('books','files','reading_sessions');")
    if [ "$CRITICAL_TABLES" -lt 2 ]; then
      echo "WARN: Expected critical tables (books, files, reading_sessions), found $CRITICAL_TABLES — may be fresh DB"
    else
      echo "OK: $CRITICAL_TABLES critical tables present"
    fi

    if [ "$HEALTH_ERRORS" -gt 0 ]; then
      echo "HEALTH CHECK FAILED: $HEALTH_ERRORS error(s) detected"
      exit 1
    fi
    echo "Health check passed."

    echo "Notifying PostgREST to reload schema cache..."
    psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"

    echo "Database migration complete for Readest v${EXPECTED_VERSION}."
