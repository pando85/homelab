apiVersion: v1
kind: ConfigMap
metadata:
  name: readest-init-sql
data:
  migrate.sh: |
    #!/bin/sh
    set -eu

    export PGPASSWORD="$DB_PASSWORD"
    export PGHOST=readest-postgres
    export PGPORT=5432
    export PGDATABASE=readest
    export PGUSER=readest

    READEST_VERSION="${DB_SCHEMA_VERSION}"
    BASE_URL="https://raw.githubusercontent.com/readest/readest/v${READEST_VERSION}/docker/volumes/db"
    SQL_DIR="/tmp/readest-sql"

    echo "Waiting for PostgreSQL..."
    until pg_isready -q -t 5; do
      sleep 2
    done

    echo "Ensuring required roles exist..."
    psql -v ON_ERROR_STOP=1 -c "SET search_path TO public, auth;" \
      -c "CREATE SCHEMA IF NOT EXISTS extensions;" \
      -c "CREATE SCHEMA IF NOT EXISTS auth;" \
      -c "CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;" \
      -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; ELSE ALTER ROLE service_role BYPASSRLS; END IF; END \$\$;" \
      -c "GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;" \
      -c "GRANT USAGE ON SCHEMA extensions TO anon, authenticated, service_role;" \
      -c "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA extensions TO authenticated;" \
      -c "GRANT anon, authenticated, service_role TO authenticator;"

    echo "Creating migration ledger..."
    psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS readest_meta;" \
      -c "CREATE TABLE IF NOT EXISTS readest_meta.migrations (name text PRIMARY KEY, applied_at timestamptz DEFAULT now());"

    echo "Acquiring advisory lock..."
    psql -v ON_ERROR_STOP=1 -c "SELECT pg_advisory_lock(hashtext('readest-migrations')::bigint);"

    cleanup() {
      psql -v ON_ERROR_STOP=1 -c "SELECT pg_advisory_unlock(hashtext('readest-migrations')::bigint);" 2>/dev/null || true
    }
    trap cleanup EXIT

    APPLIED=$(psql -tAc "SELECT string_agg(name, ' ') FROM readest_meta.migrations;")
    APPLIED_COUNT=$(psql -tAc "SELECT count(*) FROM readest_meta.migrations;")
    echo "Ledger has $APPLIED_COUNT applied entries."

    is_applied() {
      case " $APPLIED " in *" $1 "*) return 0;; *) return 1;; esac
    }

    if is_applied "schema.sql"; then
      echo "Skipping schema.sql — already applied."
    else
      echo "Downloading and applying schema.sql..."
      mkdir -p "$SQL_DIR/init"
      wget -q -O "$SQL_DIR/init/schema.sql" "${BASE_URL}/init/schema.sql"
      psql -v ON_ERROR_STOP=1 -f "$SQL_DIR/init/schema.sql"
      psql -v ON_ERROR_STOP=1 -c "INSERT INTO readest_meta.migrations(name) VALUES ('schema.sql')"
      APPLIED="$APPLIED schema.sql"
      echo "Base schema applied."
    fi

    echo "Fetching migration list from GitHub API..."
    mkdir -p "$SQL_DIR/migrations"
    wget -q -O "$SQL_DIR/migrations/api.json" "https://api.github.com/repos/readest/readest/contents/docker/volumes/db/migrations?ref=v${READEST_VERSION}"
    REMOTE_MIGRATIONS=$(sed -n 's/.*"name": *"\([0-9][0-9]*_[^"]*\.sql\)".*/\1/p' "$SQL_DIR/migrations/api.json" | sort)
    rm -f "$SQL_DIR/migrations/api.json"

    PENDING=0
    PENDING_LIST=""
    for name in $REMOTE_MIGRATIONS; do
      if ! is_applied "$name"; then
        PENDING=$((PENDING + 1))
        PENDING_LIST="$PENDING_LIST $name"
      fi
    done

    if [ "$PENDING" -eq 0 ]; then
      echo "All migrations already applied — skipping downloads."
    else
      echo "$PENDING migration(s) pending — downloading and applying..."
      for name in $PENDING_LIST; do
        echo "  Downloading $name..."
        wget -q -O "$SQL_DIR/migrations/$name" "${BASE_URL}/migrations/$name"
        echo "  Applying $name..."
        psql -v ON_ERROR_STOP=1 -f "$SQL_DIR/migrations/$name"
        psql -v ON_ERROR_STOP=1 -c "INSERT INTO readest_meta.migrations(name) VALUES ('$name')"
        APPLIED="$APPLIED $name"
        echo "  Migration $name applied."
      done
    fi

    echo "Granting permissions..."
    psql -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA auth TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO anon, authenticated, service_role;"

    echo "Setting default privileges for future tables..."
    psql -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO anon, authenticated, service_role;"
    psql -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA auth GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;"

    echo "Notifying PostgREST to reload schema cache..."
    psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"

    echo "Database migration complete."
