apiVersion: apps/v1
kind: Deployment
metadata:
  name: readest-kanidm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readest-kanidm-proxy
  template:
    metadata:
      labels:
        app: readest-kanidm-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: readest-kanidm-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: readest-kanidm-proxy
spec:
  selector:
    app: readest-kanidm-proxy
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: readest-kanidm-proxy-config
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 8080;
        
        # Keycloak auth endpoint -> Kanidm auth endpoint
        location /protocol/openid-connect/auth {
          return 302 https://idm.grigri.cloud/ui/oauth2?$args;
        }
        
        # Keycloak token endpoint -> Kanidm token endpoint
        location /protocol/openid-connect/token {
          proxy_pass https://idm.grigri.cloud/oauth2/token;
          proxy_set_header Host idm.grigri.cloud;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_ssl_server_name on;
        }
        
        # Keycloak userinfo endpoint -> Kanidm userinfo endpoint
        location /protocol/openid-connect/userinfo {
          proxy_pass https://idm.grigri.cloud/oauth2/openid/readest/userinfo;
          proxy_set_header Host idm.grigri.cloud;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_ssl_server_name on;
        }
      }
    }
