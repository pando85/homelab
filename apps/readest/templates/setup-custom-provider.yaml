apiVersion: batch/v1
kind: Job
metadata:
  name: readest-setup-custom-provider
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -e

              CLIENT_ID="$(cat /var/run/secrets/readest/kanidm_client_id)"
              CLIENT_SECRET="$(cat /var/run/secrets/readest/kanidm_client_secret)"

              echo "Checking if custom:kanidm provider exists..."
              EXISTING=$(psql -h readest-postgres -U postgres -d readest -tAc "SELECT identifier FROM auth.custom_oauth_providers WHERE identifier = 'custom:kanidm'")

              if [ "$EXISTING" = "custom:kanidm" ]; then
                echo "Provider exists, updating..."
                psql -h readest-postgres -U postgres -d readest -c "
                  UPDATE auth.custom_oauth_providers
                  SET
                    name = 'Kanidm',
                    client_id = '${CLIENT_ID}',
                    client_secret = '${CLIENT_SECRET}',
                    authorization_url = 'https://idm.grigri.cloud/ui/oauth2',
                    token_url = 'https://idm.grigri.cloud/oauth2/token',
                    userinfo_url = 'https://idm.grigri.cloud/oauth2/openid/readest/userinfo',
                    scopes = ARRAY['openid', 'profile', 'email'],
                    pkce_enabled = true,
                    enabled = true,
                    updated_at = now()
                  WHERE identifier = 'custom:kanidm'
                "
              else
                echo "Creating custom:kanidm provider..."
                psql -h readest-postgres -U postgres -d readest -c "
                  INSERT INTO auth.custom_oauth_providers (
                    provider_type,
                    identifier,
                    name,
                    client_id,
                    client_secret,
                    authorization_url,
                    token_url,
                    userinfo_url,
                    scopes,
                    pkce_enabled,
                    enabled
                  ) VALUES (
                    'oauth2',
                    'custom:kanidm',
                    'Kanidm',
                    '${CLIENT_ID}',
                    '${CLIENT_SECRET}',
                    'https://idm.grigri.cloud/ui/oauth2',
                    'https://idm.grigri.cloud/oauth2/token',
                    'https://idm.grigri.cloud/oauth2/openid/readest/userinfo',
                    ARRAY['openid', 'profile', 'email'],
                    true,
                    true
                  )
                "
              fi

              echo "Done!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: readest.postgresql.readest.credentials.postgresql.acid.zalan.do
                  key: password
          volumeMounts:
            - name: readest-secrets
              mountPath: /var/run/secrets/readest
              readOnly: true
      volumes:
        - name: readest-secrets
          projected:
            sources:
              - secret:
                  name: readest-kanidm-oauth2-credentials
                  items:
                    - key: CLIENT_ID
                      path: kanidm_client_id
                    - key: CLIENT_SECRET
                      path: kanidm_client_secret
