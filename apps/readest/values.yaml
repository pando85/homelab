app-template:
  controllers:
    client:
      labels:
        backup/retain: weekly
      initContainers:
        patch-oauth:
          image:
            # renovate: datasource=docker depName=ghcr.io/readest/readest
            repository: ghcr.io/readest/readest
            tag: 0.12.6
          env:
            SUPABASE_PUBLIC_URL: https://readest.grigri.cloud
            SUPABASE_ANON_KEY:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: anon_key
            API_BASE_URL: https://readest.grigri.cloud
          command:
            - /bin/sh
            - -c
            - |
              set -e
              STATIC_DIR="/app/apps/readest-app/.next/static"
              PATCHED_DIR="/patched-static"

              echo "Copying static assets..."
              cp -r "${STATIC_DIR}/." "${PATCHED_DIR}/"

              echo "Patching OAuth provider..."
              PATCHED=0
              for f in $(find "${PATCHED_DIR}" -name "*.js" -type f); do
                if grep -q 'provider:"discord"' "$f" 2>/dev/null || grep -q '"Discord"' "$f" 2>/dev/null; then
                  echo "Patching $f"
                  sed -i 's/provider:"discord"/provider:"custom:kanidm"/g' "$f"
                  sed -i 's/"Discord"/"Kanidm"/g' "$f"
                  sed -i 's/(0,i\.jsx)(R,{provider:"google",handleSignIn:n,Icon:U,label:r("Sign in with {{provider}}",{provider:"Google"})}),//g' "$f"
                  sed -i 's/(0,i\.jsx)(R,{provider:"apple",handleSignIn:n,Icon:O\.FaApple,label:r("Sign in with {{provider}}",{provider:"Apple"})}),//g' "$f"
                  sed -i 's/(0,i\.jsx)(R,{provider:"github",handleSignIn:n,Icon:O\.FaGithub,label:r("Sign in with {{provider}}",{provider:"GitHub"})}),//g' "$f"
                  PATCHED=$((PATCHED + 1))
                fi
              done

              if [ "$PATCHED" -eq 0 ]; then
                echo "ERROR: Could not find OAuth provider to patch"
                exit 1
              fi

              echo "Patched $PATCHED file(s)"

              echo "Generating client discovery configs..."
              PUBLIC_DIR="/next-public"
              mkdir -p "${PUBLIC_DIR}/.well-known" "${PUBLIC_DIR}/api/public"
              printf '{"apiBaseUrl":"%s","supabaseUrl":"%s","supabaseAnonKey":"%s"}\n' \
                "$API_BASE_URL" "$SUPABASE_PUBLIC_URL" "$SUPABASE_ANON_KEY" \
                > "${PUBLIC_DIR}/.well-known/readest-client-config.json"
              cp "${PUBLIC_DIR}/.well-known/readest-client-config.json" "${PUBLIC_DIR}/api/public/runtime-config"
              echo "Done."
      containers:
        client:
          image:
            # renovate: datasource=docker depName=ghcr.io/readest/readest
            repository: ghcr.io/readest/readest
            tag: 0.12.6
          env:
            SUPABASE_URL: https://readest.grigri.cloud
            SUPABASE_PUBLIC_URL: https://readest.grigri.cloud
            SUPABASE_ANON_KEY:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: anon_key
            SUPABASE_ADMIN_KEY:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: service_role_key
            API_BASE_URL: https://readest.grigri.cloud
            S3_ENDPOINT: http://minio.minio.svc:9000
            S3_PUBLIC_ENDPOINT: https://s3.internal.grigri.cloud
            S3_REGION: us-east-1
            S3_BUCKET_NAME: readest-files
            S3_ACCESS_KEY_ID: readest
            S3_SECRET_ACCESS_KEY:
              valueFrom:
                secretKeyRef:
                  name: readest-minio-secret
                  key: readestPassword
            OBJECT_STORAGE_TYPE: s3
            SELF_HOSTED: "true"
            STORAGE_FIXED_QUOTA: "21474836480"
            TRANSLATION_FIXED_QUOTA: "500000"
            FONT_BASE_URL: ""
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 3000
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 3000
                failureThreshold: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi

    auth:
      containers:
        auth:
          image:
            # renovate: datasource=docker depName=supabase/gotrue
            repository: supabase/gotrue
            tag: v2.196.0
          env:
            GOTRUE_API_HOST: 0.0.0.0
            GOTRUE_API_PORT: 9999
            API_EXTERNAL_URL: https://readest.grigri.cloud
            GOTRUE_DB_DRIVER: postgres
            GOTRUE_DB_NAMESPACE: auth
            GOTRUE_DB_DATABASE_URL:
              valueFrom:
                secretKeyRef:
                  name: readest-db-urls
                  key: auth_url
            GOTRUE_SITE_URL: https://readest.grigri.cloud
            GOTRUE_URI_ALLOW_LIST: https://readest.grigri.cloud/**,https://readest.internal.grigri.cloud/**,readest://auth-callback
            GOTRUE_DISABLE_SIGNUP: "false"
            GOTRUE_JWT_ADMIN_ROLES: service_role
            GOTRUE_JWT_AUD: authenticated
            GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
            GOTRUE_JWT_EXP: 3600
            GOTRUE_JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: secret
            GOTRUE_CUSTOM_OAUTH_ENABLED: "true"
            GOTRUE_CUSTOM_OAUTH_PRIVATE_HOSTS: idm.grigri.cloud
            GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
            GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
            GOTRUE_MAILER_AUTOCONFIRM: "true"
            GOTRUE_EXTERNAL_GOOGLE_ENABLED: "false"
            GOTRUE_EXTERNAL_APPLE_ENABLED: "false"
            GOTRUE_EXTERNAL_GITHUB_ENABLED: "false"
            GOTRUE_EXTERNAL_DISCORD_ENABLED: "false"
          probes:
            liveness: &authProbes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 9999
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *authProbes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 9999
                failureThreshold: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

    rest:
      containers:
        rest:
          image:
            # renovate: datasource=docker depName=postgrest/postgrest
            repository: postgrest/postgrest
            tag: v14.3
          env:
            PGRST_DB_URI:
              valueFrom:
                secretKeyRef:
                  name: readest-db-urls
                  key: rest_url
            PGRST_DB_SCHEMAS: public,graphql_public
            PGRST_DB_ANON_ROLE: anon
            PGRST_JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: secret
            PGRST_DB_USE_LEGACY_GUCS: "false"
            PGRST_APP_SETTINGS_JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: secret
            PGRST_APP_SETTINGS_JWT_EXP: "3600"
          probes:
            liveness: &restProbes
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 3000
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *restProbes
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 3000
                failureThreshold: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

  service:
    client:
      controller: client
      ports:
        http:
          port: 3000
    auth:
      controller: auth
      ports:
        http:
          port: 9999
    rest:
      controller: rest
      ports:
        http:
          port: 3000

  ingress:
    readest-api:
      enabled: true
      className: nginx-internal
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
        nginx.ingress.kubernetes.io/configuration-snippet: |
          set $readest_redirect_to "https://readest.grigri.cloud/auth/callback";
          if ($arg_redirect_to != "") {
            set $readest_redirect_to $arg_redirect_to;
          }
          set $readest_authorize "no";
          if ($uri ~* "^/auth/v1/authorize$") {
            set $readest_authorize "yes";
          }
          set $readest_rewrite "no";
          if ($args ~* "provider=(google|apple|github|discord)") {
            set $readest_rewrite "yes";
          }
          if ($args = "") {
            set $readest_rewrite "yes";
          }
          set $readest_gate "$readest_authorize:$readest_rewrite";
          if ($readest_gate = "yes:yes") {
            return 302 $uri?provider=custom:kanidm&redirect_to=$readest_redirect_to;
          }
      hosts:
        - host: &host readest.internal.grigri.cloud
          paths:
            - path: /auth/v1(/|$)(.*)
              pathType: ImplementationSpecific
              service:
                identifier: auth
                port: http
            - path: /rest/v1(/|$)(.*)
              pathType: ImplementationSpecific
              service:
                identifier: rest
                port: http
      tls:
        - hosts:
            - *host
          secretName: readest-tls-certificate

    readest-client:
      enabled: true
      className: nginx-internal
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/server-snippet: |
          location = /callback {
            return 301 /auth/v1/callback$is_args$args;
          }
      hosts:
        - host: *host
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: client
                port: http
      tls:
        - hosts:
            - *host
          secretName: readest-tls-certificate

    external-api:
      enabled: true
      className: nginx-external
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        external-dns.alpha.kubernetes.io/target: grigri.cloud
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
        nginx.ingress.kubernetes.io/configuration-snippet: |
          set $readest_redirect_to "https://readest.grigri.cloud/auth/callback";
          if ($arg_redirect_to != "") {
            set $readest_redirect_to $arg_redirect_to;
          }
          set $readest_authorize "no";
          if ($uri ~* "^/auth/v1/authorize$") {
            set $readest_authorize "yes";
          }
          set $readest_rewrite "no";
          if ($args ~* "provider=(google|apple|github|discord)") {
            set $readest_rewrite "yes";
          }
          if ($args = "") {
            set $readest_rewrite "yes";
          }
          set $readest_gate "$readest_authorize:$readest_rewrite";
          if ($readest_gate = "yes:yes") {
            return 302 $uri?provider=custom:kanidm&redirect_to=$readest_redirect_to;
          }
      hosts:
        - host: &externalHost readest.grigri.cloud
          paths:
            - path: /auth/v1(/|$)(.*)
              pathType: ImplementationSpecific
              service:
                identifier: auth
                port: http
            - path: /rest/v1(/|$)(.*)
              pathType: ImplementationSpecific
              service:
                identifier: rest
                port: http
      tls:
        - hosts:
            - *externalHost
          secretName: readest-external-tls-certificate

    external-client:
      enabled: true
      className: nginx-external
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        external-dns.alpha.kubernetes.io/target: grigri.cloud
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/server-snippet: |
          location = /callback {
            return 301 /auth/v1/callback$is_args$args;
          }
      hosts:
        - host: *externalHost
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: client
                port: http
      tls:
        - hosts:
            - *externalHost
          secretName: readest-external-tls-certificate

  defaultPodOptions:
    enableServiceLinks: false

  persistence:
    patched-static:
      type: emptyDir
      sizeLimit: 500Mi
      advancedMounts:
        client:
          patch-oauth:
            - path: /patched-static
          client:
            - path: /app/apps/readest-app/.next/static
    next-public:
      type: emptyDir
      sizeLimit: 1Mi
      advancedMounts:
        client:
          patch-oauth:
            - path: /next-public
          client:
            - path: /app/apps/readest-app/public
