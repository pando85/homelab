app-template:
  controllers:
    client:
      labels:
        backup/retain: weekly
      initContainers:
        patch-oauth:
          image:
            # renovate: datasource=docker depName=ghcr.io/readest/readest
            repository: ghcr.io/readest/readest
            tag: 0.12.6
          command:
            - /bin/sh
            - -c
            - |
              set -e
              STATIC_DIR="/app/apps/readest-app/.next/static"
              PATCHED_DIR="/patched-static"
              
              echo "Copying static assets..."
              cp -r "${STATIC_DIR}/." "${PATCHED_DIR}/"
              
              echo "Patching OAuth provider..."
              PATCHED=0
              for f in $(find "${PATCHED_DIR}" -name "*.js" -type f); do
                if grep -q 'provider:"discord"' "$f" 2>/dev/null || grep -q '"Discord"' "$f" 2>/dev/null; then
                  echo "Patching $f"
                  sed -i 's/provider:"discord"/provider:"keycloak"/g' "$f"
                  sed -i 's/"Discord"/"Kanidm"/g' "$f"
                  sed -i 's/(0,i\.jsx)(R,{provider:"google",handleSignIn:n,Icon:U,label:r("Sign in with {{provider}}",{provider:"Google"})}),//g' "$f"
                  sed -i 's/(0,i\.jsx)(R,{provider:"apple",handleSignIn:n,Icon:O\.FaApple,label:r("Sign in with {{provider}}",{provider:"Apple"})}),//g' "$f"
                  sed -i 's/(0,i\.jsx)(R,{provider:"github",handleSignIn:n,Icon:O\.FaGithub,label:r("Sign in with {{provider}}",{provider:"GitHub"})}),//g' "$f"
                  PATCHED=$((PATCHED + 1))
                fi
              done
              
              if [ "$PATCHED" -eq 0 ]; then
                echo "ERROR: Could not find OAuth provider to patch"
                exit 1
              fi
              
              echo "Patched $PATCHED file(s)"
      containers:
        client:
          image:
            # renovate: datasource=docker depName=ghcr.io/readest/readest
            repository: ghcr.io/readest/readest
            tag: 0.12.6
          env:
            SUPABASE_URL: https://readest.grigri.cloud
            SUPABASE_PUBLIC_URL: https://readest.grigri.cloud
            SUPABASE_ANON_KEY:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: anon_key
            SUPABASE_ADMIN_KEY:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: service_role_key
            API_BASE_URL: https://readest.grigri.cloud
            S3_ENDPOINT: http://minio.minio.svc:9000
            S3_PUBLIC_ENDPOINT: https://s3.internal.grigri.cloud
            S3_REGION: us-east-1
            S3_BUCKET_NAME: readest-files
            S3_ACCESS_KEY_ID: readest
            S3_SECRET_ACCESS_KEY:
              valueFrom:
                secretKeyRef:
                  name: readest-minio-secret
                  key: readestPassword
            OBJECT_STORAGE_TYPE: s3
            SELF_HOSTED: "true"
            STORAGE_FIXED_QUOTA: "1073741824"
            TRANSLATION_FIXED_QUOTA: "50000"
            FONT_BASE_URL: ""
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 3000
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 3000
                failureThreshold: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi

    auth:
      containers:
        auth:
          image:
            # renovate: datasource=docker depName=supabase/gotrue
            repository: supabase/gotrue
            tag: v2.185.0
          env:
            GOTRUE_API_HOST: 0.0.0.0
            GOTRUE_API_PORT: 9999
            API_EXTERNAL_URL: https://readest.grigri.cloud
            GOTRUE_DB_DRIVER: postgres
            GOTRUE_DB_DATABASE_URL:
              valueFrom:
                secretKeyRef:
                  name: readest-db-urls
                  key: auth_url
            GOTRUE_SITE_URL: https://readest.grigri.cloud
            GOTRUE_URI_ALLOW_LIST: https://readest.grigri.cloud/**,https://readest.internal.grigri.cloud/**
            GOTRUE_DISABLE_SIGNUP: "false"
            GOTRUE_JWT_ADMIN_ROLES: service_role
            GOTRUE_JWT_AUD: authenticated
            GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
            GOTRUE_JWT_EXP: 3600
            GOTRUE_JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: secret
            GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
            GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
            GOTRUE_MAILER_AUTOCONFIRM: "true"
            GOTRUE_EXTERNAL_GOOGLE_ENABLED: "false"
            GOTRUE_EXTERNAL_APPLE_ENABLED: "false"
            GOTRUE_EXTERNAL_GITHUB_ENABLED: "false"
            GOTRUE_EXTERNAL_DISCORD_ENABLED: "false"
            GOTRUE_EXTERNAL_KEYCLOAK_ENABLED: "true"
            GOTRUE_EXTERNAL_KEYCLOAK_NAME: Kanidm
            GOTRUE_EXTERNAL_KEYCLOAK_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: readest-kanidm-oauth2-credentials
                  key: CLIENT_ID
            GOTRUE_EXTERNAL_KEYCLOAK_SECRET:
              valueFrom:
                secretKeyRef:
                  name: readest-kanidm-oauth2-credentials
                  key: CLIENT_SECRET
            GOTRUE_EXTERNAL_KEYCLOAK_URL: https://idm.grigri.cloud/oauth2/openid/readest
            GOTRUE_EXTERNAL_KEYCLOAK_REDIRECT_URI: https://readest.grigri.cloud/auth/v1/callback
          probes:
            liveness: &authProbes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 9999
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *authProbes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 9999
                failureThreshold: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

    rest:
      containers:
        rest:
          image:
            # renovate: datasource=docker depName=postgrest/postgrest
            repository: postgrest/postgrest
            tag: v14.3
          env:
            PGRST_DB_URI:
              valueFrom:
                secretKeyRef:
                  name: readest-db-urls
                  key: rest_url
            PGRST_DB_SCHEMAS: public,graphql_public
            PGRST_DB_ANON_ROLE: anon
            PGRST_JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: secret
            PGRST_DB_USE_LEGACY_GUCS: "false"
            PGRST_APP_SETTINGS_JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: readest-secrets
                  key: secret
            PGRST_APP_SETTINGS_JWT_EXP: "3600"
          probes:
            liveness: &restProbes
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 3000
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *restProbes
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 3000
                failureThreshold: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

  service:
    client:
      controller: client
      ports:
        http:
          port: 3000
    auth:
      controller: auth
      ports:
        http:
          port: 9999
    rest:
      controller: rest
      ports:
        http:
          port: 3000

  ingress:
    readest-api:
      enabled: true
      className: nginx-internal
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      hosts:
        - host: &host readest.internal.grigri.cloud
          paths:
            - path: /auth/v1(/|$)(.*)
              pathType: ImplementationSpecific
              service:
                identifier: auth
                port: http
            - path: /rest/v1(/|$)(.*)
              pathType: ImplementationSpecific
              service:
                identifier: rest
                port: http
      tls:
        - hosts:
            - *host
          secretName: readest-tls-certificate

    readest-client:
      enabled: true
      className: nginx-internal
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/configuration-snippet: |
          more_set_headers "Cache-Control: no-cache, no-store, must-revalidate";
          more_set_headers "Pragma: no-cache";
          more_set_headers "Expires: 0";
      hosts:
        - host: *host
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: client
                port: http
      tls:
        - hosts:
            - *host
          secretName: readest-tls-certificate

    external-api:
      enabled: true
      className: nginx-external
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        external-dns.alpha.kubernetes.io/target: grigri.cloud
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      hosts:
        - host: &externalHost readest.grigri.cloud
          paths:
            - path: /auth/v1(/|$)(.*)
              pathType: ImplementationSpecific
              service:
                identifier: auth
                port: http
            - path: /rest/v1(/|$)(.*)
              pathType: ImplementationSpecific
              service:
                identifier: rest
                port: http
      tls:
        - hosts:
            - *externalHost
          secretName: readest-external-tls-certificate

    external-client:
      enabled: true
      className: nginx-external
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        external-dns.alpha.kubernetes.io/target: grigri.cloud
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/configuration-snippet: |
          more_set_headers "Cache-Control: no-cache, no-store, must-revalidate";
          more_set_headers "Pragma: no-cache";
          more_set_headers "Expires: 0";
      hosts:
        - host: *externalHost
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: client
                port: http
      tls:
        - hosts:
            - *externalHost
          secretName: readest-external-tls-certificate

  defaultPodOptions:
    enableServiceLinks: false

  persistence:
    patched-static:
      type: emptyDir
      sizeLimit: 500Mi
      advancedMounts:
        client:
          patch-oauth:
            - path: /patched-static
          client:
            - path: /app/apps/readest-app/.next/static
