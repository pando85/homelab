<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
<title id="title">With Athom: permanent mains supply to relay, isolated two-way switches on S1 and S2</title>
<desc id="desc">The Athom receives permanent live and neutral. Its L-OUT and N-OUT feed the light. Two conmutator switches retain their travellers but the commons connect only to dry contact terminals S1 and S2. Diagram is conceptual, not a literal cable-routing plan.</desc>
