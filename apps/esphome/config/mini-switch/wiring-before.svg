    <text x="297" y="533" font-size="11" fill="#64748B" text-anchor="middle">COM</text><text x="337" y="533" font-size="11" fill="#64748B" text-anchor="middle">1</text><text x="377" y="533" font-size="11" fill="#64748B" text-anchor="middle">2</text>
