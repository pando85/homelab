<circle cx="1120" cy="233" r="31" fill="#FEF3C7" stroke="#E0AE45" stroke-width="2.5"/>
<path d="M1104 217 L1136 249 M1136 217 L1104 249" fill="none" stroke="#B7791F" stroke-width="2.5"/>
<text x="1120" y="297" font-size="17" fill="#23344D" font-weight="800" text-anchor="middle">LUMINAIRE</text>
<text x="1056" y="210" font-size="12" fill="#2975BC" font-weight="700">N</text><text x="1056" y="266" font-size="12" fill="#9C4D9B" font-weight="700">L</text>
<rect x="239" y="507" width="188" height="130" rx="14" fill="#fff" stroke="#B8C8D9" stroke-width="2"/>
