<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
<title id="title">Before: conventional two-way lighting circuit</title>
<desc id="desc">The live conductor feeds the common of switch A, two travellers link the two switches, the common of switch B feeds the lamp and neutral goes directly to the lamp. Diagram is conceptual, not a literal cable-routing plan.</desc>
<rect width="1200" height="700" rx="20" fill="#F8FAFC"/>
<rect x="20" y="20" width="1160" height="58" rx="13" fill="#EEF2F7"/>
<rect x="36" y="35" width="7" height="28" rx="3" fill="#A45D2A"/>
<text x="58" y="58" font-size="25" fill="#23344D" font-weight="800">BEFORE  /  Conventional two-way switching</text>
<rect x="190" y="99" width="837" height="386" rx="19" fill="#FFFFFF" stroke="#98ADC6" stroke-dasharray="9 7" stroke-width="2"/>
<text x="210" y="126" font-size="16" fill="#64748B" font-weight="650">JUNCTION BOX  ·  conceptual conductor connections</text>
<rect x="21" y="161" width="140" height="175" rx="16" fill="#FFFFFF" stroke="#BECBDD" stroke-width="2"/>
<text x="91" y="185" font-size="18" fill="#23344D" font-weight="800" text-anchor="middle">230 V AC</text>
<text x="91" y="199" font-size="12" fill="#64748B" text-anchor="middle">supply</text>
<text x="42" y="220" font-size="15" fill="#2975BC" font-weight="750">N</text><text x="42" y="270" font-size="15" fill="#A45D2A" font-weight="750">L</text>
<text x="91" y="316" font-size="11" fill="#64748B" text-anchor="middle">PE not shown</text>
