<text x="602" y="377" font-size="15" fill="#C18A16" text-anchor="middle" font-weight="650">Traveller 1  /  unchanged</text>
<text x="602" y="427" font-size="15" fill="#E2AD25" text-anchor="middle" font-weight="650">Traveller 2  /  unchanged</text>
    <text x="520" y="200" font-size="14" fill="#2975BC" text-anchor="middle" font-weight="650">Neutral goes directly to the lamp</text>
    <text x="235" y="476" font-size="14" fill="#A45D2A" font-weight="750">L → COM A</text>
    <text x="894" y="476" font-size="14" fill="#9C4D9B" font-weight="750">COM B → lamp</text>
  <rect x="21" y="649" width="1159" height="36" rx="9" fill="#E9EFF5"/>
