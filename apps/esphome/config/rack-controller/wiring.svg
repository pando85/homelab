<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc"><title id="title">Rack controller reference electrical wiring</title><desc id="desc">12-volt supply feeds two PWM fans and an LM2596 buck converter. The converter provides 5 volts to an ESP32 DevKit. The ESP32 supplies 3.3 volts to a DHT22 and SSD1306 OLED, controls fan PWM on GPIO16, and reads fan 1 tachometer on GPIO17.</desc><rect width="1500" height="950" fill="#f8fafc"/>
