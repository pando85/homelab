<text x="651" y="362" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#162334">D-SUN MP1584EN (green)</text>
<text x="651" y="391" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#162334">IN+/IN− = 12 V / GND</text>
<text x="651" y="420" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#162334">OUT+/OUT− = 3.30 V / GND</text>
<text x="651" y="453" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526275">Adjust + measure first</text>
