<text x="1025" y="420" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#162334">OUT+/OUT− = 9.0 V / GND</text>
<text x="1025" y="453" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526275">Fixed voltage; not PWM</text>
<text x="659" y="561" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#d38a21">3.3 V</text>
