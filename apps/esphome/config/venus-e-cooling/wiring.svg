<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" role="img" aria-labelledby="title desc">
<title id="title">Venus E V3 cooling controller electrical wiring</title>
<desc id="desc">A 12-volt DC jack feeds the MP1584 buck regulator at 3.3 volts for an ESP8266MOD with boot resistors, and an LM2596 buck set to 9 volts for two 3-pin Noctua FLX fans via a Y cable. One fan tachometer wire goes to GPIO14 with a 3.3-volt pull-up. Fan speed is fixed rather than GPIO PWM controlled.</desc>
<rect width="1600" height="990" fill="#f8fafc"/>
<text x="60" y="60" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#162334">VENUS E V3 · COOLING CONTROLLER WIRING</text>
<text x="60" y="90" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526275">12 V barrel jack · two adjustable buck converters · bare ESP8266MOD · 2 × Noctua FLX (3-pin)</text>
