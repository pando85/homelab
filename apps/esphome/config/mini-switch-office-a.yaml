substitutions:
  name: "mini-switch-office-a"
  friendly_name: "Mini Switch Office A"
  project_name: "athom.mini-switch-office-a"
  project_version: "1.1"
  light_restore_mode: RESTORE_DEFAULT_OFF

packages:
  connection: !include ./packages/connection.yaml
  mini-switch: !include ./packages/mini-switch.yaml

# Device-only Wi-Fi/API overrides, merged with `wifi:` and `api:` of packages/connection.yaml.
# - The radio stops transmitting a few minutes after power-on while the Wi-Fi stack still thinks
#   it is connected, and a soft reboot does not recover it (stored RF calibration is reused).
#   includes: forces a full RF calibration on every boot (mini-switch-office-a/rf_calibration.h).
# - api reboot_timeout 2min reboots once Home Assistant loses contact, even if Wi-Fi looks up.
# - phy_mode 11G (802.11g) works around a suspected Wi-Fi radio hang on this ESP8266.
# - output_power 17dB lowers the TX current draw.
# - post_connect_roaming is off: it runs a full channel scan every 5 min while connected, and
#   ESPHome's own source notes the off-channel time can cause beacon-timeout disconnects. Office A
#   hears hundreds of neighbour BSSIDs, so that scan is long.
# - fast_connect connects without a scan at boot.
# - reboot_timeout 5min reboots quickly when Wi-Fi stays down, instead of waiting 24 h.
# See docs/troubleshooting/office-iot-wifi-flapping.md.
esphome:
  includes:
    - mini-switch-office-a/rf_calibration.h

api:
  reboot_timeout: 2min

wifi:
  phy_mode: 11G
  output_power: 17dB
  post_connect_roaming: false
  fast_connect: true
  reboot_timeout: 5min

# Record why the device reboots (see docs/troubleshooting/office-iot-wifi-flapping.md).
# Only the cheap options: no `fragmentation` sensor, nothing that allocates on the heap.
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "${friendly_name} Reset Reason"
      entity_category: diagnostic
    device:
      name: "${friendly_name} Device Info"
      entity_category: diagnostic

sensor:
  - platform: debug
    free:
      name: "${friendly_name} Heap Free"
      entity_category: diagnostic
    block:
      name: "${friendly_name} Heap Max Block"
      entity_category: diagnostic
    loop_time:
      name: "${friendly_name} Loop Time"
      entity_category: diagnostic
