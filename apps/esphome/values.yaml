app-template:
  controllers:
    esphome:
      annotations:
        reloader.stakater.com/auto: "true"
      type: statefulset
      # hack to make devices show as online
      initContainers:
        config:
          image:
            repository: debian
            tag: 13.7-slim
          command:
            - /bin/sh
            - -c
          args:
            - >
              cp -r --dereference /original/config/* /config
      containers:
        esphome:
          image:
            repository: ghcr.io/esphome/esphome
            tag: 2026.10.2@sha256:4a918585150e95e7675be84a347384ff308fde1bd32d0e4472666e1252cc0e8f
          env:
            ESPHOME_DASHBOARD_USE_PING: "true"
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "10"
              memory: 8Gi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5
  service:
    esphome:
      controller: esphome
      ports:
        http:
          port: 6052

  # Envoy Gateway route.
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      # stable name: the SecurityPolicy targets it
      forceRename: esphome-internal
      hostnames:
        - esphome.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: esphome
              port: 6052

  defaultPodOptions:
    nodeSelector:
      # Required
      kubernetes.io/arch: amd64
      # Speed up builds
      kubernetes.io/hostname: prusik

  persistence:
    config:
      enabled: true
      type: custom
      globalMounts:
        - path: /original/config
      volumeSpec:
        name: all-in-one
        projected:
          sources:
            - configMap:
                name: esphome-config
            - secret:
                name: esphome-secrets
    config-packages:
      enabled: true
      type: custom
      globalMounts:
        - path: /original/config/packages
      volumeSpec:
        name: all-in-one
        projected:
          sources:
            - configMap:
                name: esphome-config-packages
    esphome-cache:
      type: emptyDir
      globalMounts:
        - path: /config
