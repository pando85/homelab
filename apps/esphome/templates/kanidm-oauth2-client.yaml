---
# OIDC client for the Envoy Gateway SecurityPolicy (replaces the shared oauth2-proxy client for
# this app). Kanidm only issues tokens to the scope map group below.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: esphome
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: esphome
  origin: https://esphome.internal.grigri.cloud/
  redirectUrl:
    - https://esphome.internal.grigri.cloud/oauth2/callback
  # same group nginx allows today (`allowed_groups=esphome-users@idm.grigri.cloud`)
  scopeMap:
    - group: esphome-users
      scopes: [openid, profile, email]
  # per-app claim for the SecurityPolicy authorization: small, unlike the `groups` scope, which
  # lists every group of the person and overflowed the 4096 B `oidc-id-token` cookie
  claimMap:
    - name: access
      joinStrategy: array
      valuesMap:
        - group: esphome-users
          values: [esphome]
  preferShortUsername: true
  strictRedirectUrl: true
  # Envoy Gateway reads the client secret from the `client-secret` key
  secretKeyAliases:
    clientSecret:
      - client-secret
