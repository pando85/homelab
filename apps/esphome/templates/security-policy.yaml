---
# Envoy Gateway native OIDC against Kanidm + JWT authorization on the `groups` claim.
# Pattern: docs/conventions/envoy-gateway-auth.md
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: esphome-internal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: esphome-internal
  oidc:
    provider:
      issuer: https://idm.grigri.cloud/oauth2/openid/esphome
      # explicit endpoints: no OIDC discovery at translation time
      authorizationEndpoint: https://idm.grigri.cloud/ui/oauth2
      tokenEndpoint: https://idm.grigri.cloud/oauth2/token
    clientID: esphome
    clientSecret:
      name: esphome-kanidm-oauth2-credentials
    redirectURL: https://esphome.internal.grigri.cloud/oauth2/callback
    # the default `/logout` would shadow the app's own path
    logoutPath: /oauth2/logout
    scopes: [openid, profile, email, groups]
    cookieNames:
      accessToken: oidc-access-token
      idToken: oidc-id-token
  jwt:
    providers:
      - name: kanidm
        issuer: https://idm.grigri.cloud/oauth2/openid/esphome
        audiences: [esphome]
        extractFrom:
          cookies: [oidc-id-token]
        remoteJWKS:
          uri: https://idm.grigri.cloud/oauth2/openid/esphome/public_key.jwk
        # nginx passes no identity headers to esphome: no claimToHeaders
  authorization:
    defaultAction: Deny
    rules:
      - name: allowed-groups
        action: Allow
        principal:
          jwt:
            provider: kanidm
            claims:
              # nginx `allowed_groups=esphome-users@idm.grigri.cloud` (SPN form)
              - name: groups
                valueType: StringArray
                values:
                  - esphome-users@idm.grigri.cloud
