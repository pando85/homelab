---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: s3-public
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm

  displayname: s3-public

  origin: https://mc-s3.grigri.cloud/

  redirectUrl:
    - https://mc-s3.grigri.cloud/oauth_callback

  scopeMap:
    - group: s3-public-users
      scopes:
        - openid
        - profile
        - email

  preferShortUsername: true
  strictRedirectUrl: true
  allowInsecureClientDisablePkce: true
