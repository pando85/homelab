---
# Context7's upstream API key, pulled from Vault into a cluster Secret for the gateway.
#
# WHY A SECRET VOLUME AND NOT THE CONFIG FILE. agentgateway v1.7.0 takes a static upstream
# credential as `backendAuth.key`, whose `value` is a `FileOrInline`: either a file path or an
# inline string (crates/core/src/serdes.rs `enum FileOrInline { File { file: PathBuf }, Inline
# (String) }`). The inline half is unusable here for two independent reasons: the official chart
# renders `Values.config` verbatim (`toYaml .Values.config`), so an inline value would have to be
# committed to git; and it would then sit in the gateway's ConfigMap, readable by anyone who can
# read a ConfigMap. So the committed config carries only a PATH and this Secret supplies the
# bytes. The credential is referenced end to end: Vault -> ExternalSecret -> Secret -> secret
# volume -> `backendAuth.key.value.file`.
#
# VAULT CONSUMER. Same ClusterSecretStore (`vault`, live: server https://vault.vault:8200, path
# `secret`, version v2) and kubernetes-auth role `allow-secrets` / policy `allow_secrets` that
# every other ExternalSecret in this repo uses, and the same `/<app>/<provider>` + `property`
# shape as apps/dawarich/templates/external-secrets.yaml (`/dawarich/geoapify`, `api-key`).
#
# DELIBERATELY MUTABLE, UNLIKE THE SESSION KEY. templates/session-key-*.yaml is
# `CreatedOnce` + `target.immutable: true` because a rotated AES key invalidates live sessions.
# This value is a per-request upstream credential, so a Vault rotation must propagate:
# ESO rewrites the Secret, kubelet re-points the secret volume's symlink, and agentgateway
# reloads the watched file. Measured locally on the pinned v1.7.0 binary: replacing the file's
# contents changed the header the upstream saw, with no restart. So do NOT add `immutable: true`
# here - it would freeze a credential that is meant to roll.
#
# FAIL CLOSED, IN THE RIGHT ORDER. The volume is `optional: false`, so kubelet will not start a
# gateway container before this Secret exists. That matters because the alternative was
# measured: with `backendAuth.key.value.file` pointing at a path that does not exist, the pinned
# binary aborts at startup ("failed to read from file ... No such file or directory"), it does
# not serve the route without a credential. A pending pod that ArgoCD shows as degraded is the
# correct outcome; an unauthenticated call to Context7 is not.
#
# NOTHING HERE IS SECRET. This file renders no key material: `helm template` output is
# byte-identical across runs, the value never appears in the ConfigMap, in git, in a test, or in
# the gateway's own serialized config (crates/agentgateway/src/http/auth/mod.rs marks the parsed
# value `Static(#[serde(serialize_with = "ser_redact")] SecretString)`).
#
# WHY THIS FILE NAME. Helm renders templates in alphabetical file order, and
# test/mcp-gateway/foundation-checks.py and route-checks.py read the session-key ExternalSecret
# with a kind-only lookup (`find(docs, "ExternalSecret")` -> the FIRST match), not by name. A
# `context7-*.yaml` name would sort first and silently hijack those checks (measured: refreshPolicy
# and target.immutable failed / KeyError'd against this ExternalSecret). So this file is deliberately
# named to sort AFTER session-key-externalsecret.yaml. The real fix belongs in those two suites -
# select by `metadata.name == "mcp-gateway-session-key"` - and once that lands, this file can be
# renamed to the plainly-ordered `context7-key-externalsecret.yaml`. Until then, do not rename it
# without also fixing `find()`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-context7
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: mcp-gateway
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: mcp-gateway-context7
  data:
    - secretKey: api-key
      remoteRef:
        key: /mcp-gateway/context7
        property: api-key
