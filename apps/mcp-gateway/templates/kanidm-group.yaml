{{- /*
Service-only workload group. Members are Kanidm service accounts (NOT persons).
Person memberships are added manually outside Git and are never declared here.
See docs/user-guide/kanidm.md "Group membership rules".

WARNING — Kanidm CRD `spec.members` is AUTHORITATIVE, not additive. Per the
live CRD schema (kaniop.rs/v1beta1, storage version):

  "Name or SPN of group members. Set the exact list of members that this
   group should contain, removing any not listed in the set operation.
   If you want to manage members from the database, do not set them here."

Therefore:
  - This template is ONLY for a new, service-account-only group owned by this
    chart. Never point `kanidm.workloadGroup.name` at an existing human or
    mixed group: declaring members would remove every person/group the owner
    added in the Kanidm database.
  - When members are declared, the list must be COMPLETE — every SA that
    should belong must appear, or it gets removed on the next reconcile.
  - `members` is omitted entirely when the list is empty, so the group is
    created with no assertion on membership (owner-managed).
  - Members that do not exist in Kanidm yet (e.g. service accounts another
    chart is still creating) reconcile eventually; the operator does not
    block rollout on them, but the group will not resolve those SPNs until
    the SAs exist.

Human-facing groups (kanidm.humanGroups) are rendered below with NO `members`
field. Membership is managed manually with `kanidm group add-members` and
deleting the CR destroys manual memberships.
*/ -}}
---
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: {{ .Values.kanidm.workloadGroup.name }}
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  {{- with .Values.kanidm.workloadGroup.serviceMembers }}
  # Authoritative full list of service-account members. Service accounts only:
  # adding a person here would violate the project rule and, worse, overwrite
  # database-managed membership. Do not do it.
  members:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- range .Values.kanidm.humanGroups }}
---
# Human-membership group: membership is managed manually with
# `kanidm group add-members` and is NEVER encoded in this CRD.
# WARNING: deleting this KanidmGroup CR destroys the group in Kanidm
# together with all its manual memberships.
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: {{ . }}
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
{{- end }}
