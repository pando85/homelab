---
# Session-protection key material for agentgateway's MCP session IDs.
#
# WHY A KEY IS NEEDED (agentgateway v1.7.0, read in source then measured locally):
#   crates/agentgateway/src/http/sessionpersistence.rs
#       hex::decode(key) must yield exactly 32 bytes -> AES-256-GCM
#       "invalid AES-256-GCM key length: expected 32 bytes (64 hex characters)"
#   crates/agentgateway/src/config.rs (ensure_session_key / persist_session_key)
#       SESSION_KEY env or session.key -> AES; "disabled"/unset -> base64; an
#       auto-generated key is only ever written back to a *writable* config file,
#       and the chart mounts /config read-only from a ConfigMap, so without a key
#       the cluster pods run base64 session IDs.
#   Measured both modes in test/mcp-gateway/session-isolation-probe.py: AES ids are
#   208 chars with no warning; base64 ids are 104 chars plus the
#   "MCP session IDs are not encrypted" warning.
#
# WHAT THE KEY DOES NOT BUY: it binds a session to the issuing BACKEND, not to the
# CALLER. A second caller replaying someone else's session id is still accepted at
# the edge; harmless when the route carries a per-request credential, a cross-user
# failure when the backend caches a credential per session (measured in
# test/mcp-gateway/session-binding-probe.py; see the Vault notes in values.yaml).
#
# WHY THIS SHAPE (B1): an earlier revision generated the key in the template with
# `randAlphaNum` + `lookup`. That is non-deterministic - `helm template` under
# ArgoCD sees an empty `lookup`, so every render produced a different SESSION_KEY,
# and `helm.sh/resource-policy: keep` only orphaned the stale Secret instead of
# solving the lifecycle. No Helm-side randomness or lookup is used here.
#
# Lifecycle is delegated to the External Secrets Operator, which is already the
# repo convention for secret material, using its own native generator:
#   * `Password` with `encoding: hex` hex-encodes the generated characters
#     (generators/v1/password/password.go: `encodePassword([]byte(pass), encoding)`),
#     so `length: 32` -> 64 hex characters -> exactly 32 bytes for agentgateway.
#     Verified against the installed CRD (ESO v2.14.0, `passwords.generators...`).
#   * `secretKeys: [SESSION_KEY]` names the output key directly
#     (`validateSecretKeys` defaults to `password` when unset).
#   * `refreshPolicy: CreatedOnce` + `target.immutable: true`:
#     shouldRefresh() (pkg/controllers/externalsecret/externalsecret_controller.go)
#     refreshes a CreatedOnce ExternalSecret only while
#     `status.syncedResourceVersion` is empty or `status.refreshTime` is zero, so
#     periodic ticks, `refreshInterval` changes and spec updates do NOT regenerate
#     the value, and `immutable` stops any later data rewrite. The key is therefore
#     created once and stays stable across reconciles and pod restarts.
#   * Deleting the Secret (or the ExternalSecret) legitimately produces a new key on
#     the next sync, which invalidates in-flight MCP sessions. That is the intended,
#     documented behaviour - sessions are not a durable store - and is not a
#     periodic rotation or a self-healing rewrite.
#
# ENTROPY, stated honestly rather than rounded up: the generator produces `length`
# characters of go-password output (letters by default here) and then hex-encodes
# them, so the key block is a full 32 bytes but its entropy is that of 32 generated
# characters (~180 bits), not 256 bits of independent randomness. That is ample for
# session-ID confidentiality/integrity, which is what this protects. If the owner
# later wants a full-entropy key, the alternative is a Vault-held value provisioned
# by committed management (`openssl rand -hex 32`) referenced by an ExternalSecret
# with a store `remoteRef` - deliberately NOT done here, because no such key exists
# in Vault today and creating one ad-hoc would be exactly the drift this repo avoids.
#
# FAIL-CLOSED: the workload reads this through a required `secretKeyRef`
# (values.yaml `SESSION_KEY`), so the pod cannot start before the Secret exists -
# no plaintext fallback, no silent base64 downgrade.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-gateway-session-key
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: mcp-gateway
spec:
  length: {{ .Values.session.length }}
  encoding: {{ .Values.session.encoding }}
  secretKeys:
    - SESSION_KEY
  digits: 0
  symbols: 0
  noUpper: false
  allowRepeat: true
