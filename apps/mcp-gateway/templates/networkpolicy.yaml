{{- if .Values.networkIsolation }}
---
# Gateway plane ingress: least-privilege, derived from live labels verified with
# `kubectl get pods -o jsonpath` in this cluster:
#   ingress-nginx-external / app.kubernetes.io/name=ingress-nginx
#   ingress-nginx          / app.kubernetes.io/name=ingress-nginx
#   monitoring             / app.kubernetes.io/name=prometheus
#
# Deliberately NOT allowed:
#   - port 15021 (/healthz/ready): no application pod needs the probe port, so it
#     stays unlisted. NOTE: Cilium currently runs with `enable-host-firewall=false`,
#     which is an observation about today's config, NOT a guarantee that a kubelet
#     probe and its reply are unaffected by pod-level policy. The Firecrawl egress
#     incident (docs/troubleshooting/mcp-firecrawl-egress-regression.md) is a
#     precedent where egress-only policies were associated with kubelet probe
#     timeouts, but the mechanism was never established. So nothing here assumes
#     replies are exempt, and no blanket host / remote-node allow is added.
#     IMPORTANT: networkIsolation is currently false (owner authorized policy-free
#     baseline first). Do not enable until this legacy K8s NetworkPolicy is replaced
#     with a reviewed CiliumNetworkPolicy that properly handles node-sourced probes.
#   - the agentgateway admin address: bound to "off" in the config, so there is
#     nothing to reach.
#   - NodePort / loadBalancer / hostPort: the Service is ClusterIP only.
# Selector note: podSelector matches this release's own labels (instance+name), so
# the policy cannot capture any pre-existing workload (e.g. the Grafana sidecar or
# Firecrawl pods) - a new pod going NotReady here cannot break an existing one, and
# the first rollout scope stays the public plane when deployment is separately
# approved. No rollout is authorised by this change.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-gateway
      app.kubernetes.io/name: mcp-gateway
  policyTypes:
    - Ingress
  ingress:
    # MCP endpoint: only through the EXTERNAL ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-external
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    # Prometheus scrapes the metrics port (L3/4 separation: ops access is a
    # distinct port, not a path on the MCP port).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 15020
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-gateway
      app.kubernetes.io/name: mcp-gateway
  policyTypes:
    - Egress
  egress:
    # DNS. nodelocaldns answers at 169.254.25.10, but Cilium DNATs to the
    # node-local-dns pod, so policy must select the real pods, not the anycast
    # address. Scoped to the two DNS workloads instead of all of kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Cluster DNS fallback (CoreDNS) for lookups that reach the Service instead.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # JWKS fetch for mcpAuthentication. idm.grigri.cloud is published through
    # the external ingress, so the gateway's request lands on those pods.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-external
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 443
    # Same path, in case Kanidm is reached directly by service instead of URL.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanidm
      ports:
        - protocol: TCP
          port: 8443
    # MCP backends: one explicit rule per enabled backend, derived from values,
    # so enabling a route and widening egress are the same edit. Backends run in
    # their own namespace (dedicated pod, never a sidecar on the gateway).
    # `workloadName` is the backend's app.kubernetes.io/name label, which is not
    # the route key: the route is called `firecrawl`, the release is
    # `firecrawl-mcp`. Getting this wrong silently blocks every tool call.
    {{- range $name, $b := .Values.backends }}
    {{- if $b.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $b.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $b.workloadName }}
              app.kubernetes.io/instance: {{ $b.workloadName }}
      ports:
        - protocol: TCP
          port: {{ $b.port }}
    {{- end }}
    {{- end }}
{{- end }}
