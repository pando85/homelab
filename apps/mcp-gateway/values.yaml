# MCP Gateway Public Plane - Official agentgateway-standalone chart
# Architecture: docs/design/mcp-gateway-architecture.md
# Implementation: planning/mcp-gateway-implementation.md

# All official chart values nested under dependency name
agentgateway-standalone:
  # CRITICAL: Use NEW name to avoid immutable Deployment selector conflict
  # Old Deployment: mcp-gateway with selector controller=agentgateway
  # New Deployment: mcp-gateway-standalone with selector component=standalone
  # ArgoCD will create new Deployment/Service, then prune old ones
  # Service DNS changes: mcp-gateway -> mcp-gateway-standalone
  fullnameOverride: mcp-gateway-standalone

  # Single replica - session state not yet verified for multi-replica
  replicaCount: 1

  # Pin to prusik node for initial rollout
  nodeSelector:
    kubernetes.io/hostname: prusik

  # Image pinned to v1.7.0 (matches chart appVersion)
  image:
    registry: cr.agentgateway.dev
    repository: agentgateway
    tag: "" # Empty = use chart appVersion (1.7.0 -> v1.7.0)
    pullPolicy: IfNotPresent

  # ServiceAccount - let chart create it
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Pod annotations for Prometheus scraping (chart default)
  podAnnotations:
    prometheus.io/path: "/metrics"
    prometheus.io/port: "15020"
    prometheus.io/scrape: "true"

  # Pod labels - none extra
  podLabels: {}

  # Security context - match existing hardened settings
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  # Resources - match existing
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  # No tolerations/affinity
  tolerations: []
  affinity: {}

  # Gateway service - ClusterIP with 3 ports (http, metrics, healthz)
  # Service name: mcp-gateway-standalone (DNS changes from mcp-gateway)
  gateway:
    service:
      enabled: true
      type: ClusterIP
      annotations: {}
      extraLabels: {}
      ports:
        - name: http
          port: 3000
          targetPort: 3000
          protocol: TCP
        - name: metrics
          port: 15020
          targetPort: 15020
          protocol: TCP
        - name: healthz
          port: 15021
          targetPort: 15021
          protocol: TCP

  # Monitoring - PodMonitor (replaces ServiceMonitor from app-template)
  monitoring:
    enabled: true
    extraLabels:
      release: monitoring
    podMonitor:
      enabled: true
      interval: 1m
      scrapeNativeHistograms: false
      scrapeClassicHistograms: true

  # CRITICAL: Leave session.secretName UNSET to disable chart's automatic SESSION_KEY injection
  # Chart template: {{- with .Values.session.secretName }} injects SESSION_KEY only if set
  # We use extraEnv below to inject SESSION_KEY from the EXISTING immutable ESO secret
  # This preserves the existing secret with key "SESSION_KEY" (no deletion/rotation needed)
  session:
    secretName: ""

  # CRITICAL: Inject SESSION_KEY from existing ESO secret via extraEnv
  # Existing secret: mcp-gateway-session-key with key SESSION_KEY (immutable, CreatedOnce)
  # This avoids creating new ESO resources or deleting/changing the existing secret
  # extraEnv is rendered AFTER chart's native env vars, so no duplicate SESSION_KEY
  extraEnv:
    - name: SESSION_KEY
      valueFrom:
        secretKeyRef:
          name: mcp-gateway-session-key
          key: SESSION_KEY

  # No OIDC (admin UI disabled)
  oidc:
    enabled: false

  # Readonly mode - no database, static config from ConfigMap
  mode: readonly

  # Database not needed for readonly mode
  database:
    postgres:
      url: ""

  # Agentgateway configuration (rendered directly into configmap config.yaml)
  # Chart adds config.storage.mode: file automatically in readonly mode
  # All routes disabled - fail closed
  config:
    adminAddr: "off"
    logging:
      format: json
      level: info
    gateways:
      default:
        port: 3000
    mcp:
      targets: []

# ---------------------------------------------------------------------------
# Values below are NOT consumed by the official chart. They are used by
# wrapper templates in templates/ (ingress, kanidm, session-key).
# ---------------------------------------------------------------------------

# Network isolation - DISABLED for initial rollout
# Previous deployment with NetworkPolicy blocked kubelet probes
# Will re-enable after CiliumNetworkPolicy design reviewed
networkIsolation: false

# Kanidm OAuth2 client configuration (used by templates/kanidm-*.yaml)
# These resources keep their original names (not affected by fullnameOverride)
kanidm:
  workloadGroup:
    name: mcp-gateway-agents
    serviceMembers: []
  oauth2Client:
    name: mcp-gateway
    displayname: MCP Gateway
    origin: https://mcp.grigri.cloud/
    redirectUrls:
      - http://127.0.0.1:15000/callback
    scopeMap:
      - group: mcp-gateway-agents
        scopes:
          - openid
          - email
          - profile
          - mcp_firecrawl
    humanScopeMap: []

# Auth configuration (for future routes, used by wrapper templates)
auth:
  issuer: https://idm.grigri.cloud/oauth2/openid/mcp-gateway
  audience: mcp-gateway
  jwksUrl: https://idm.grigri.cloud/oauth2/openid/mcp-gateway/public_key.jwk

# Backend routes - ALL DISABLED for foundation
# Enable individually after backend chart deployed + Kanidm scope granted
backends:
  grafana:
    enabled: false
    path: /grafana/mcp
    url: http://grafana-mcp.grafana-mcp.svc.cluster.local:8000/mcp
    resource: https://mcp.grigri.cloud/grafana/mcp
    hostHeader: grafana-mcp.grafana-mcp.svc.cluster.local
    namespace: grafana-mcp
    workloadName: grafana-mcp
    port: 8000
    scope: mcp_grafana
    credential: accessToken
    stripRequestHeaders: []

  context7:
    enabled: false
    path: /context7/mcp
    url: https://mcp.context7.com/mcp
    resource: https://mcp.grigri.cloud/context7/mcp
    scope: mcp_context7
    credential: none
    stripRequestHeaders:
      - Authorization

# Session key generation (ESO) - used by templates/session-key-*.yaml
# These values are consumed by wrapper templates, NOT by the official chart
# EXISTING ESO resources remain UNCHANGED (immutable, CreatedOnce, key SESSION_KEY)
session:
  length: 32
  encoding: hex
  refreshPolicy: CreatedOnce
