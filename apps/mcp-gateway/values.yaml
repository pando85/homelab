# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json

# MCP Gateway (public plane). `mcp.grigri.cloud` through the EXTERNAL ingress,
# Kanidm OAuth2 client `mcp-gateway` (public + PKCE), and one dedicated backend
# pod per MCP server. The admin plane is a separate chart
# (apps/mcp-gateway-admin) with its own client, so a token minted for one plane
# cannot be replayed on the other. See planning/mcp-gateway-implementation.md.
# agentgateway log verbosity: trace | debug | info | warn | error. `info` is what
# makes an authz decision readable in a log line; token material is never logged.
logLevel: info

# Network isolation guard. When false (the foundation baseline), NO
# NetworkPolicy or CiliumNetworkPolicy is rendered for the gateway. The
# previous deployment (9049af3bf) had restrictive policies attached and
# the gateway pods experienced probe timeouts, but the mechanism is
# unproven - the audit cannot isolate whether the policies caused the
# failures or were merely associated. The policies are kept in templates/
# but gated behind this flag so the gateway can be deployed and observed
# without them first. Owner has explicitly authorized getting the backend
# working WITHOUT NetworkPolicy first; Cilium policies may be added later
# after the baseline is proven stable. The current networkIsolation=true
# renders legacy Kubernetes NetworkPolicy, NOT CiliumNetworkPolicy - do
# not enable until replaced with a reviewed CNP that properly handles
# node-sourced probe traffic. See
# docs/troubleshooting/mcp-firecrawl-egress-regression.md and
# planning/mcp-gateway-implementation.md Task 1.3.
networkIsolation: false

# MCP session-protection key (agentgateway AES-256-GCM session IDs). The value is
# produced by the External Secrets Operator's own Password generator and pulled into
# a Secret exactly once - see templates/session-key-generator.yaml for the source
# evidence behind `CreatedOnce`, the hex length arithmetic and the entropy note. The
# chart itself renders NO key material, so renders are deterministic.
session:
  # 32 generated characters, hex-encoded by the generator -> 64 hex characters, which
  # agentgateway hex::decode()s to exactly the 32 bytes AES-256-GCM requires.
  length: 32
  encoding: hex
  # operator-side lifecycle: create once, never rewrite (immutable target).
  refreshPolicy: CreatedOnce

app-template:
  controllers:
    agentgateway:
      type: deployment
      strategy: RollingUpdate
      replicas: 1
      pod:
        enableServiceLinks: false
        automountServiceAccountToken: false
        nodeSelector:
          kubernetes.io/hostname: prusik
      containers:
        main:
          image:
            # renovate: datasource=docker depName=cr.agentgateway.dev/agentgateway
            repository: cr.agentgateway.dev/agentgateway
            tag: v1.7.0
          args:
            - -f
            - /config/config.yaml
          env:
            TZ: Europe/Madrid
            # MCP session protection key. agentgateway reads this before any
            # config value, and AES (not base64) is what keeps the
            # "resume only at the issuing backend" check active. The Secret is
            # owned by the ExternalSecret in
            # templates/session-key-externalsecret.yaml (ESO `CreatedOnce` +
            # immutable target), never rendered by Helm. The reference is required
            # (no `optional: true`), so the pod cannot start without it: fail closed
            # rather than silently falling back to base64 session IDs.
            SESSION_KEY:
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-session-key
                  key: SESSION_KEY
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet: &httpGet
                  path: /healthz/ready
                  port: &healthzPort 15021
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet: *httpGet
                failureThreshold: 30
                periodSeconds: 10

  service:
    agentgateway:
      controller: agentgateway
      ports:
        http:
          port: &httpPort 3000
          protocol: TCP
        metrics:
          port: 15020
          protocol: TCP
        healthz:
          port: *healthzPort
          protocol: TCP

  ingress:
    mcp:
      enabled: true
      className: nginx-external
      annotations:
        external-dns.kubernetes.io/enabled: "true"
        external-dns.kubernetes.io/target: grigri.cloud
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
      hosts:
        - host: &host mcp.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: agentgateway
                port: http
      tls:
        - hosts:
            - *host
          secretName: mcp-gateway-tls-certificate

  persistence:
    config:
      type: configMap
      name: mcp-gateway-config
      globalMounts:
        - path: /config
          readOnly: true
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp

  serviceMonitor:
    agentgateway:
      enabled: true
      serviceName: mcp-gateway
      labels:
        release: monitoring
      endpoints:
        - port: metrics
          scheme: http
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s

# Gateway data plane
gateway:
  # agentgateway binds the MCP listener on this port; the Service and the
  # NetworkPolicy both refer to it.
  port: 3000

# Token validation for every enabled route. Defaults target the Kanidm realm;
# tests override them to a local issuer so the rendered config can be booted.
auth:
  issuer: https://idm.grigri.cloud/oauth2/openid/mcp-gateway
  # The OAuth2 CLIENT NAME, which is what Kanidm puts in `aud`.
  audience: mcp-gateway
  jwksUrl: https://idm.grigri.cloud/oauth2/openid/mcp-gateway/public_key.jwk

# One entry per MCP backend. Absent or `enabled: false` keeps the gateway
# fail-closed: no route, no JWKS fetch, no tool exposed.
# Enabling an entry requires, in the same change:
#   1. the backend chart deployed in its own namespace (no sidecar, no loopback),
#   2. a Kanidm scopeMap entry granting `scope` to a group (see kanidm.oauth2Client),
#   3. the gateway egress NetworkPolicy rule that reaches it.
backends:
  firecrawl:
    # Disabled for two independent reasons, both of which have to clear before this
    # route can go on:
    #   1. the fetcher egress/SSRF gate is unresolved. The NetworkPolicies meant to
    #      carry it were deployed (0b16b31b9) and rolled back (8fff4f224) after the
    #      api/worker/nuq pods went NotReady; root cause is still unknown and the
    #      live SSRF verification never ran. See
    #      docs/troubleshooting/mcp-firecrawl-egress-regression.md. The gateway's own
    #      NetworkPolicy only limits who may reach the MCP pod directly - it is not a
    #      destination control inside the fetcher and must not be treated as one.
    #   2. the owner has not confirmed which human group may use web access; service
    #      accounts are granted separately through mcp-gateway-agents.
    # Gateway auth passing its own tests does not make this backend onboardable.
    enabled: false
    path: /firecrawl/mcp
    url: http://firecrawl-mcp.firecrawl-mcp.svc.cluster.local:3000/mcp
    resource: https://mcp.grigri.cloud/firecrawl/mcp
    # Host header the gateway pins on upstream requests. The backend enforces a
    # Host allowlist, and this value must match its FIRECRAWL_MCP_ALLOWED_HOSTS
    # exactly, or every call is rejected with 403 by the backend itself.
    hostHeader: firecrawl-mcp.firecrawl-mcp.svc.cluster.local
    # Used by templates/networkpolicy.yaml to open exactly this path.
    namespace: firecrawl-mcp
    # The backend's app.kubernetes.io/name label. NOT the route key above: the
    # route is `firecrawl`, the release/pods are `firecrawl-mcp`.
    workloadName: firecrawl-mcp
    port: 3000
    # Whole-backend grant. No per-tool rules: an allowed caller gets every tool
    # of that backend, and a non-allowed caller gets none of them.
    scope: mcp_firecrawl
    # What reaches the backend, measured against agentgateway v1.7.0:
    #   none        caller's bearer is dropped at the gateway (no backendAuth block)
    #   accessToken backendAuth.passthrough forwards the caller's ACCESS token - the
    #               only edge bearer shape this project accepts
    #   idToken     forwards an ID-token-shaped bearer; measured but NOT approved as
    #               an edge credential (see apps/mcp-gateway-admin/values.yaml)
    # Firecrawl uses `none` on purpose: the fetcher needs no user credential, the
    # MCP server runs with a fixed server-side FIRECRAWL_API_URL, and forwarding a
    # user token would only leak it. The delegation route in
    # apps/mcp-gateway-admin/values.yaml uses `accessToken`, never `idToken`.
    credential: none
    # Extra per-request headers to remove for this backend only (the template
    # already removes every known credential/target override header).
    stripRequestHeaders: []

  grafana:
    # Caller-preserving Grafana delegation, as a CANDIDATE ONLY: disabled. The identity
    # question that used to block it is answered by measurement (below), but every step
    # that makes it real touches a live instance, so enabling it stays an owner decision
    # recorded in planning/mcp-gateway-implementation.md (Task 2) - never a default.
    #
    # PLANE: Grafana is a PUBLIC-plane backend (`mcp.grigri.cloud`), which is what the
    # approved architecture diagram in docs/design/mcp-gateway-architecture.md has always
    # said; only Vault belongs to the admin plane. Putting this candidate on the admin chart
    # was an unapproved deviation and has been corrected. The dedicated backend pod would
    # live in its own `grafana-mcp` namespace, not in `mcp-gateway-admin`.
    #
    # Scope grant: none ships in the foundation (kanidm.humanScopeMap is empty), so this
    # route has no human mapping until the owner names the group.
    #
    # The chain that is supported by the pinned pieces (all verified in source, not
    # inferred): agentgateway validates the caller's Kanidm ACCESS token at the edge
    # and `backendAuth.passthrough` forwards it; mcp-grafana 2.1.1 in
    # "proxy-forwarding mode" - `GRAFANA_FORWARD_HEADERS=Authorization`, no
    # `--server-auth-token` (main.go:1187 refuses to start with both), and no
    # GRAFANA_SERVICE_ACCOUNT_TOKEN env, because AuthRoundTripper would otherwise
    # overwrite Authorization at mg.go:736 - passes that bearer to Grafana; and Grafana's
    # JWT client authenticates the person from it, which 13.3.0 only does when
    # `[auth.jwt] header_name = Authorization` is set explicitly (see the last bullet).
    # Because the backend then does no caller authentication of its own, the only
    # protections are the gateway's JWT validation and the NetworkPolicy that lets
    # just this gateway reach it.
    #
    # MAPPING BLOCKER - RESOLVED LOCALLY, STILL OWNER-GATED. A Kanidm access token has
    # `sub` (an account UUID), `aud` (the client name) and a `scope` string, and NO
    # login or email claim, so the question was whether Grafana can identify the person
    # from `sub` alone. Measured on the pinned 13.3.0 image with a real generic-OAuth
    # session (grafana-sub-alias-probe.py: a local research probe, kept out of the
    # foundation commit and pending review — 16/16 assertions):
    #   - with `username_claim = sub`, a sub-only ACCESS token reaches the mapping code
    #     and fails CLOSED while no binding exists: 401 `user.sync.signup-disabled`,
    #     and no user and no `user_auth` row are created;
    #   - ONE identity-claim-bearing JWT (sub + preferred_username + email) attaches the
    #     `('jwt', sub)` connection to the EXISTING OAuth user - same userId, no
    #     duplicate - even with `auto_sign_up = false`. After that bootstrap, sub-only
    #     ACCESS tokens resolve that same user, and its native Editor role is retained
    #     (`skip_org_role_sync = true`; a JWT-authenticated write succeeds with no
    #     session cookie involved). So per-person delegation is achievable with a
    #     one-time bootstrap, not a second per-request credential.
    # Remaining options, for completeness:
    #   (a) IdP-side identity claims inside the access token - Kanidm v1.11.2 cannot do
    #       this (`claim_map` and `jwtLegacyCryptoEnable` move no claims between types),
    #   (b) dual credential (edge ACCESS token + caller's Grafana-audience ID token in a
    #       second header) - NOT approved and NOT built: it needs a second Kanidm
    #       authorization per client, a per-route header allow this chart does not have
    #       (the deny list stops every `x-grafana-*` on purpose), and a `[auth.jwt]`
    #       header change that alters the auth surface of the whole instance,
    #   (c) keep human Grafana access on the existing service-account sidecar and
    #       delegate nothing yet - the status quo, the existing sidecar is untouched.
    # Fixing it by presenting an ID token as the MCP bearer (credential: idToken) is
    # explicitly NOT chosen.
    #
    # What is settled by measurement, whichever option is picked:
    #   - Grafana 13.3.0 trusts exactly ONE JWT client: per-client JWKS plus exact `iss`/`aud`.
    #     A merged `jwk_set_file` covering both Kanidm clients is RETRACTED AS UNSAFE and must not
    #     be shipped: pinning `expect_claims.iss` rejects the second client (its `iss` differs),
    #     an `iss` array makes Grafana fail at startup, and merging keys without pinning `iss`
    #     trusts any token signed by a listed key from ANY issuer. The earlier positive reading
    #     came from a single-issuer fixture (grafana-merged-keyset-probe.py, a local research
    #     probe kept out of the foundation), which masked exactly that gap. Consequence:
    #     forwarding the gateway ACCESS token to the instance that trusts the `grafana` client is
    #     BLOCKED until compatible dual-client trust exists upstream;
    #   - `allow_insecure_email_lookup` (live value `true`, unchanged by this work) lets an
    #     issuer-signed email claim attach a JWT alias to an existing account, so no delegation or
    #     bootstrap route may be enabled while it is `true`;
    #   - with the live `skip_org_role_sync = true` a token's scopes never change a
    #     Grafana role (no escalation, no demotion, no shared fallback credential);
    #   - `auto_sign_up` must stay `false`: with `true`, a valid but unmapped `sub`
    #     invents a user whose login is the account UUID;
    #   - Grafana 13.3.0 checks no `aud` VALUE without `expect_claims` - a token minted
    #     for a different client authenticates the mapped person (measured 200), so the
    #     token-class/audience gate belongs at the gateway, and `expect_claims` stays a
    #     prerequisite for any live change;
    #   - `[auth.jwt] header_name = Authorization` must be set explicitly: with it unset,
    #     or spelled `auth_header_name`, the same bearer is declined with `api-key.invalid`
    #     (the JWT client never claims the token) - measured by toggling only that line.
    #     Before any live change, confirm the running instance's own `[auth.jwt]` section
    #     actually carries it; that setting has not been read from production here, and no
    #     production configuration was touched by this work.
    enabled: false
    path: /grafana/mcp
    url: http://grafana-mcp.grafana-mcp.svc.cluster.local:8000/mcp
    resource: https://mcp.grigri.cloud/grafana/mcp
    hostHeader: grafana-mcp.grafana-mcp.svc.cluster.local
    namespace: grafana-mcp
    workloadName: grafana-mcp
    port: 8000
    # Whole-backend grant: no per-tool rules. Grafana's own RBAC decides what the
    # caller may do; this scope only opens the MCP endpoint.
    scope: mcp_grafana
    # Measured precondition (Grafana 13.3.0): this shape is NOT reachable on the live
    # instance. Grafana trusts exactly one JWT client via per-client JWKS + exact
    # `iss`/`aud`, and the merged-key-set workaround is retracted as unsafe (see the
    # settled-by-measurement block above), so accessToken delegation stays BLOCKED until
    # compatible dual-client trust exists upstream. Keep this backend disabled; do not
    # treat this line as approved configuration.
    credential: accessToken
    # Nothing extra to strip: the template's plane-wide list already removes every
    # header mcp-grafana 2.1.1 trusts per request (X-Grafana-Service-Account-Token
    # and X-Grafana-API-Key replace the Grafana credential - apiKeyFromHeaders,
    # mg.go:215; X-Grafana-Org-Id switches org; X-Grafana-URL retargets the backend,
    # measured in grafana-forwarding-probe.py, a local research probe kept out of
    # this commit and pending review). This key is only for
    # headers specific to one backend that the shared list does not cover.
    stripRequestHeaders: []

# ---------------------------------------------------------------------------
# Kanidm resources (rendered via ./templates/kanidm-*.yaml)
# ---------------------------------------------------------------------------
kanidm:
  # Service-only workload group (no persons; person membership is
  # manual per docs/user-guide/kanidm.md "Group membership rules").
  # Members are populated by hermes chart owner. Foundation ships empty.
  workloadGroup:
    name: mcp-gateway-agents
    # Kanidm service-account names only — NEVER persons.
    # IMPORTANT: `spec.members` is AUTHORITATIVE. Kanidm's CRD schema states it
    # sets the exact list and removes any member not listed. So:
    #   - only use this for the new service-only group this chart owns;
    #   - never point it at an existing human/mixed group;
    #   - when you add members, list ALL service accounts that must belong.
    # An empty list omits `spec.members` entirely, creating the group with no
    # membership assertion.
    serviceMembers: []

  # Public Kanidm OAuth2 client used by MCP clients (OpenCode PKCE, Hermes
  # service-account token exchange). Public + PKCE is required because
  # Kanidm's access token audience = OAuth2 client NAME, not resource URL
  # (verified in Kanidm v1.11.2 oauth2.rs generate_access_token_response).
  oauth2Client:
    name: mcp-gateway
    displayname: MCP Gateway
    origin: https://mcp.grigri.cloud/
    # Exact loopback redirect for native MCP clients doing auth-code + PKCE.
    # OpenCode listens on 127.0.0.1:15000/callback; the entry is the literal
    # string the client sends, and Kanidm requires `allowLocalhostRedirect: true`
    # plus this exact URI for the authorization request to be accepted.
    redirectUrls:
      - http://127.0.0.1:15000/callback
    # scopeMap: each entry is { group, scopes[] }. Kanidm requires that EVERY
    # scope a client asks for is present in the granted set, so a group that
    # needs an MCP tool plus identity claims must be mapped to all of them —
    # granting only `mcp_firecrawl` would make a request for
    # `openid email profile mcp_firecrawl` fail at Kanidm, not at the gateway.
    # Scopes land in the JWT as ONE space-separated `scope` string (Kanidm uses
    # the string form; RFC 9068's array form is not used), so the gateway CEL
    # splits it. Per-target whole-MCP grant, never per-tool.
    scopeMap:
      # Service-account workload group: identity scopes (clients request them)
      # plus the Firecrawl whole-MCP scope. Grafana/Vault scopes stay out until
      # their delegation model is resolved.
      - group: mcp-gateway-agents
        scopes:
          - openid
          - email
          - profile
          - mcp_firecrawl
    # Human access reuses an EXISTING group; person membership is never managed
    # in Git (docs/user-guide/kanidm.md), and nothing here adds or removes a
    # person. `searxng-users` is the group already used for interactive web-search
    # access, which is the closest existing semantic for a web-fetch/crawl tool.
    # Flip `backends.firecrawl.enabled` only together with this mapping.
    # No human grant ships in the foundation. Withholding a grant needs no approval;
    # the owner's stated preference is to reuse an existing group rather than invent a
    # new one, but `searxng-users` was created for search access and "may search" does
    # not imply "may fetch arbitrary URLs through the gateway", so it is NOT wired up
    # here. Choosing the human group(s) for `mcp_firecrawl` / `mcp_grafana` is a
    # separate owner gate, and it gates the *grant*, not the gateway's end-to-end
    # behaviour: the local suites prove the CEL/authz contract with test-only scope
    # fixtures (see test/mcp-gateway/e2e-authz.py), never by granting a real group.
    # Person membership stays manual (never CRD-managed) per docs/user-guide/kanidm.md.
    humanScopeMap: []
