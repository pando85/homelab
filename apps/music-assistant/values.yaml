# Music Assistant relies on LAN discovery (mDNS/UPnP) and direct player sockets.
# The hostNetwork placement is intentional; see README.md before deployment.
app-template:
  controllers:
    main:
      type: statefulset
      replicas: 1
      pod:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        nodeSelector:
          kubernetes.io/hostname: prusik
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 45
      containers:
        main:
          image:
            repository: ghcr.io/music-assistant/server
            # Stable release, immutable image digest (2026-10-30).
            tag: 2.10.9@sha256:4ac0d5844363fbbefd6a61251df09d96cd546e05e01b8c1cc1a28803f0935e07
          env:
            TZ: Europe/Madrid
            LOG_LEVEL: info
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8095
                periodSeconds: 5
                failureThreshold: 60
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8095
                periodSeconds: 10
                timeoutSeconds: 5
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8095
                periodSeconds: 30
                timeoutSeconds: 5

  service:
    main:
      controller: main
      ports:
        http:
          port: 8095
        stream:
          port: 8097

  # Web UI only. Players MUST reach the host's IP on 8097 (and often 8095)
  # directly, NOT through this OAuth2-protected HTTP ingress.
  ingress:
    main:
      enabled: true
      className: nginx-internal
      annotations:
        external-dns.kubernetes.io/enabled: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/auth-url: https://auth.grigri.cloud/oauth2/auth?allowed_groups=navidrome-users@idm.grigri.cloud
        nginx.ingress.kubernetes.io/auth-signin: https://auth.grigri.cloud/oauth2/start
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      hosts:
        - host: &host music-assistant.internal.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - *host
          secretName: music-assistant-tls-certificate

  persistence:
    data:
      enabled: true
      existingClaim: music-assistant-data
      globalMounts:
        - path: /data
