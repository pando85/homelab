app-template:
  controllers:
    qbittorrent:
      labels:
        backup/retain: quaterly
      replicas: 1
      type: statefulset
      containers:
        qbittorrent:
          image:
            repository: ghcr.io/home-operations/qbittorrent
            tag: 5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8

          command:
            - /bin/sh
            - -c
            - |
              exec ionice -c 3 /entrypoint.sh

          env:
            UMASK: "022"
            QBT_TORRENTING_PORT: &torrent_port 50413
            QBT_WEBUI_PORT: &port 8080

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 10Gi
              cpu: "2"

          securityContext:
            capabilities:
              add:
                - SYS_NICE

          probes:
            liveness: &probe
              enabled: true
              custom: true
              spec:
                failureThreshold: 3
                periodSeconds: 10
                tcpSocket:
                  port: *port
                timeoutSeconds: 1
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: *port
                failureThreshold: 60
                periodSeconds: 10
            readiness: *probe
        metrics:
          image:
            repository: ghcr.io/esanchezm/prometheus-qbittorrent-exporter
            tag: latest@sha256:f27cc3b38a7383353ccdd8517f6b57187cc90ad9e6504049630c25e111f590e9
          env:
            QBITTORRENT_HOST: localhost
            QBITTORRENT_PORT: *port
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              memory: 100Mi

          ports:
            - name: metrics
              containerPort: &metrics_port 8000
              protocol: TCP

          probes:
            liveness: &metrics_probe
              enabled: true
              custom: true
              spec:
                failureThreshold: 3
                periodSeconds: 30
                tcpSocket:
                  port: *metrics_port
                timeoutSeconds: 1
            readiness: *metrics_probe

      initContainers:
        config-patch:
          image:
            repository: busybox
            tag: 1.38
          command:
            - sh
            - -c
            - |
              CONFIG_FILE=/config/qBittorrent/qBittorrent.conf
              rm -f /config/qBittorrent/lockfile
              if [ -f "$CONFIG_FILE" ]; then
                sed -i 's/^MemoryWorkingSetLimit=.*/MemoryWorkingSetLimit=9000/' "$CONFIG_FILE"
                sed -i 's/^Session\\MaxConnections=.*/Session\\MaxConnections=5000/' "$CONFIG_FILE"
                sed -i 's/^Session\\MaxConnectionsPerTorrent=.*/Session\\MaxConnectionsPerTorrent=25/' "$CONFIG_FILE"
                sed -i 's/^Session\\MaxActiveTorrents=.*/Session\\MaxActiveTorrents=3000/' "$CONFIG_FILE"
                sed -i 's/^Session\\MaxActiveUploads=.*/Session\\MaxActiveUploads=2800/' "$CONFIG_FILE"
                sed -i 's/^Session\\MaxUploads=.*/Session\\MaxUploads=100/' "$CONFIG_FILE"
                sed -i 's/^Session\\MaxUploadsPerTorrent=.*/Session\\MaxUploadsPerTorrent=6/' "$CONFIG_FILE"
                sed -i 's/^Session\\MaxConcurrentHTTPAnnounces=.*/Session\\MaxConcurrentHTTPAnnounces=10/' "$CONFIG_FILE"
                sed -i 's/^Session\\RequestQueueSize=.*/Session\\RequestQueueSize=200/' "$CONFIG_FILE"
                sed -i 's/^Session\\GlobalUPSpeedLimit=.*/Session\\GlobalUPSpeedLimit=5000/' "$CONFIG_FILE"
                sed -i 's/^Session\\GlobalDLSpeedLimit=.*/Session\\GlobalDLSpeedLimit=8000/' "$CONFIG_FILE"
                sed -i 's/^Session\\PeerTurnover=.*/Session\\PeerTurnover=4/' "$CONFIG_FILE"
                sed -i 's/^Session\\SendBufferWatermark=.*/Session\\SendBufferWatermark=512/' "$CONFIG_FILE"
                sed -i 's/^Session\\ConnectionSpeed=.*/Session\\ConnectionSpeed=30/' "$CONFIG_FILE"
                sed -i 's/^Session\\PeerTurnoverInterval=.*/Session\\PeerTurnoverInterval=300/' "$CONFIG_FILE"
                sed -i 's/^Session\\PeerTurnoverCutoff=.*/Session\\PeerTurnoverCutoff=90/' "$CONFIG_FILE"
                sed -i 's/^Session\\SocketBacklogSize=.*/Session\\SocketBacklogSize=30/' "$CONFIG_FILE"
                sed -i 's/^Session\\DHTEnabled=.*/Session\\DHTEnabled=true/' "$CONFIG_FILE"
                sed -i 's/^Session\\PeXEnabled=.*/Session\\PeXEnabled=true/' "$CONFIG_FILE"
                sed -i 's/^Session\\LSDEnabled=.*/Session\\LSDEnabled=true/' "$CONFIG_FILE"
                sed -i 's/^Session\\AnonymousModeEnabled=.*/Session\\AnonymousModeEnabled=false/' "$CONFIG_FILE"
              fi

  defaultPodOptions:
    securityContext:
      runAsUser: 995
      runAsGroup: 501
      fsGroup: 501
      fsGroupChangePolicy: "OnRootMismatch"

    hostname: qbittorrent

    # uncomment after restore:
    #nodeSelector:
    #  kubernetes.io/hostname: prusik

  service:
    qbittorrent:
      controller: qbittorrent
      ports:
        http:
          port: *port
        metrics:
          port: *metrics_port

    bittorrent:
      controller: qbittorrent
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "192.168.193.7"
        external-dns.kubernetes.io/enabled: "true"
      externalTrafficPolicy: Local
      ports:
        bittorrent:
          enabled: true
          port: *torrent_port
          protocol: TCP
          targetPort: *torrent_port

  serviceMonitor:
    qbittorrent:
      enabled: true
      serviceName: qbittorrent
      labels:
        release: monitoring
      endpoints:
        - port: metrics
          scheme: http
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s

  # Envoy Gateway routes.
  # The internal route carries the external-dns annotation (the Gateway address is published in DNS). The external
  # route is behind the OIDC SecurityPolicy (templates/security-policy.yaml).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      forceRename: qbittorrent-internal
      hostnames:
        - qbittorrent.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: qbittorrent
              port: 8080
    external:
      kind: HTTPRoute
      # stable name: the SecurityPolicy targets it
      forceRename: qbittorrent-external
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - qbittorrent.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: qbittorrent
              port: 8080

  persistence:
    config:
      enabled: true
      globalMounts:
        - path: /config
      existingClaim: config-qbittorrent

    series:
      enabled: true
      type: hostPath
      hostPath: /datasets/series/download
      globalMounts:
        - path: /datasets/series/download

    peliculas:
      enabled: true
      type: hostPath
      hostPath: /datasets/peliculas/download
      globalMounts:
        - path: /datasets/peliculas/download

    musica:
      enabled: true
      type: hostPath
      hostPath: /datasets/musica/download
      globalMounts:
        - path: /datasets/musica/download
