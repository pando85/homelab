---
# OIDC client for the Envoy Gateway SecurityPolicies (replaces the shared oauth2-proxy client for
# this app). Kanidm only issues tokens to the scope map group below.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: navidrome
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: navidrome
  origin: https://navidrome.grigri.cloud/
  redirectUrl:
    - https://navidrome.grigri.cloud/oauth2/callback
    - https://navidrome.internal.grigri.cloud/oauth2/callback
  # same group nginx allows today (`allowed_groups=navidrome-users@idm.grigri.cloud`)
  scopeMap:
    - group: navidrome-users
      scopes: [openid, profile, email, groups]
  # short `preferred_username`: navidrome maps it to its own user (ND_REVERSEPROXYUSERHEADER)
  preferShortUsername: true
  strictRedirectUrl: true
  # Envoy Gateway reads the client secret from the `client-secret` key
  secretKeyAliases:
    clientSecret:
      - client-secret
