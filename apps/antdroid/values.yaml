app-template:
  controllers:
    antdroid:
      labels:
        backup/retain: quaterly
      replicas: 1
      containers:
        nginx:
          image:
            repository: nginx
            tag: 1.31.8-alpine

          securityContext:
            runAsUser: 0

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 64Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
  defaultPodOptions:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: antdroid
            app.kubernetes.io/name: antdroid
  service:
    antdroid:
      controller: antdroid
      ports:
        http:
          port: 80

  ingress:
    antdroid:
      enabled: true
      className: nginx-internal
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        external-dns.kubernetes.io/enabled: "true"
      hosts:
        - host: &host antdroid.internal.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: antdroid
                port: http
      tls:
        - hosts:
            - *host
          secretName: antdroid-tls-certificate
    external:
      enabled: true
      className: nginx-external
      annotations:
        external-dns.kubernetes.io/enabled: "true"
        external-dns.kubernetes.io/target: grigri.cloud
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
      hosts:
        - host: &host antdroid.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: antdroid
                port: http
      tls:
        - hosts:
            - *host
          secretName: antdroid-external-tls-certificate

  # Envoy Gateway routes (ingress-nginx migration). The Ingresses above stay until the switch.
  # Internal routes carry the external-dns annotation (the Gateway address is published in DNS).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - antdroid.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: antdroid
              port: 80
    external:
      kind: HTTPRoute
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - antdroid.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: antdroid
              port: 80

  persistence:
    data:
      enabled: true
      globalMounts:
        - path: /usr/share/nginx/html
      existingClaim: antdroid-data

    config:
      enabled: true
      type: configMap
      name: nginx-config
      advancedMounts:
        antdroid:
          nginx:
            - path: /etc/nginx/nginx.conf
              subPath: nginx.conf
