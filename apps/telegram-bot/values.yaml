app-template:
  controllers:
    telegram-bot:
      labels:
        backup/retain: quaterly
      replicas: 2
      containers:
        telegram-bot:
          image:
            repository: pando85/troll-bot
            tag: 1.0.1

          env:
            BOT_URL: https://telegram.grigri.cloud

          envFrom:
            - secretRef:
                name: telegram-bot-secret

          securityContext:
            runAsUser: 0

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5

  service:
    telegram-bot:
      controller: telegram-bot
      ports:
        http:
          port: 5000

  # Envoy Gateway routes.
  # Internal routes carry the external-dns annotation (the Gateway address is published in DNS).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - telegram.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: telegram-bot
              port: 5000
    external:
      kind: HTTPRoute
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - telegram.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: telegram-bot
              port: 5000

  defaultPodOptions:
    enableServiceLinks: false

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: telegram-bot
            app.kubernetes.io/name: telegram-bot
