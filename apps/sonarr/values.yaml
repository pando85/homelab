app-template:
  controllers:
    sonarr:
      labels:
        backup/retain: quaterly
      type: statefulset
      containers:
        sonarr:
          image:
            repository: ghcr.io/home-operations/sonarr
            tag: 5.0.0.2941@sha256:93b0923dd12afd43247739e19dac59d74c52a15ea12e036b7ced264cffb42574

          env:
            TZ: Europe/Madrid
            SONARR__POSTGRES__HOST: sonarr-postgres
            SONARR__POSTGRES__PORT: "5432"
            SONARR__POSTGRES__MAINDB: sonarr-main
            SONARR__POSTGRES__LOGDB: sonarr-log
            SONARR__POSTGRES__USER:
              valueFrom:
                secretKeyRef:
                  name: sonarr.sonarr-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            SONARR__POSTGRES__PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: sonarr.sonarr-postgres.credentials.postgresql.acid.zalan.do
                  key: password

          resources:
            requests:
              cpu: 150m
              memory: 170Mi
            limits:
              memory: 1Gi

          probes:
            liveness: &probe
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: &port 8989
            readiness: *probe
            startup:
              enabled: true
              spec:
                failureThreshold: 60
                periodSeconds: 10
  service:
    sonarr:
      controller: sonarr
      ports:
        http:
          port: *port

  # Envoy Gateway routes.
  # The internal route carries the external-dns annotation (the Gateway address is published in DNS). The external
  # route is behind the OIDC SecurityPolicy (templates/security-policy.yaml).
  route:
    internal:
      kind: HTTPRoute
      annotations:
        # internal names are published in DNS by external-dns (the Gateway address)
        external-dns.kubernetes.io/enabled: "true"
      forceRename: sonarr-internal
      hostnames:
        - sonarr.internal.grigri.cloud
      parentRefs:
        - name: internal
          namespace: envoy-gateway
          sectionName: https-internal-grigri-cloud
      rules:
        - backendRefs:
            - identifier: sonarr
              port: 8989
    external:
      kind: HTTPRoute
      # stable name: the SecurityPolicy targets it
      forceRename: sonarr-external
      annotations:
        # the target (grigri.cloud) comes from the external Gateway
        external-dns.kubernetes.io/enabled: "true"
      hostnames:
        - sonarr.grigri.cloud
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https-grigri-cloud
      rules:
        - backendRefs:
            - identifier: sonarr
              port: 8989
  defaultPodOptions:
    securityContext:
      runAsUser: 995
      runAsGroup: 501
      fsGroup: 501
      fsGroupChangePolicy: "OnRootMismatch"

    nodeSelector:
      kubernetes.io/hostname: prusik

  persistence:
    config:
      enabled: true
      globalMounts:
        - path: /config
      existingClaim: config-sonarr
    series:
      enabled: true
      type: hostPath
      hostPath: /datasets/series
      globalMounts:
        - path: /datasets/series
