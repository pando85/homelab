---
# OIDC client for the Envoy Gateway SecurityPolicy (replaces the shared oauth2-proxy client for the
# dashboard route). Separate from the `hermes-3` client, which is the dashboard's own login
# (redirect `/auth/callback`). Kanidm only issues tokens to the scope map group below.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: hermes-3-envoy
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: hermes-3-envoy
  origin: https://hermes-3.internal.grigri.cloud/
  redirectUrl:
    - https://hermes-3.internal.grigri.cloud/oauth2/callback
  # same group nginx allows today (`allowed_groups=hermes-users@idm.grigri.cloud`)
  scopeMap:
    - group: hermes-users
      scopes: [openid, profile, email, groups]
  preferShortUsername: true
  strictRedirectUrl: true
  # Envoy Gateway reads the client secret from the `client-secret` key
  secretKeyAliases:
    clientSecret:
      - client-secret
