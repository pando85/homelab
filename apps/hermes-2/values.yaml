app-template:
  controllers:
    hermes-2:
      labels:
        backup/retain: quaterly
      type: statefulset
      pod:
        enableServiceLinks: false
        runtimeClassName: kata
      containers:
        hermes-2:
          image:
            # renovate: datasource=docker depName=nousresearch/hermes-agent
            repository: nousresearch/hermes-agent
            tag: v2026.8.16.2
          args: ["gateway", "run"]
          securityContext:
            runAsUser: 0
          env:
            - name: TZ
              value: Europe/Madrid
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes-2.internal.grigri.cloud
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://idm.grigri.cloud/oauth2/openid/hermes-2
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-2-kanidm-oauth2-credentials
                  key: CLIENT_ID
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-2-kanidm-oauth2-credentials
                  key: CLIENT_SECRET
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 4Gi
  defaultPodOptions:
    securityContext: {}
    nodeSelector:
      kubernetes.io/hostname: prusik
  service:
    dashboard:
      ports:
        http:
          port: 9119
  ingress:
    dashboard:
      enabled: true
      className: nginx-internal
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        nginx.ingress.kubernetes.io/auth-url: https://auth.grigri.cloud/oauth2/auth?allowed_groups=hermes-users@idm.grigri.cloud
        nginx.ingress.kubernetes.io/auth-signin: https://auth.grigri.cloud/oauth2/start
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      hosts:
        - host: hermes-2.internal.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: dashboard
                port: http
      tls:
        - hosts:
            - hermes-2.internal.grigri.cloud
          secretName: hermes-2-dashboard-tls-certificate
  persistence:
    data:
      enabled: true
      globalMounts:
        - path: /opt/data
      existingClaim: hermes-2-data
