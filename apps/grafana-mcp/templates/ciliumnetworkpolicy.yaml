{{- if .Values.networkIsolation }}
---
# CiliumNetworkPolicy for the Grafana MCP backend (release `grafana-mcp`).
#
# This SUPERSEDES 838031375 (rolled back by 1c28157e2). That version allowed :8081 from
# `fromEntities: [host, remote-node]`; with `enable-host-firewall: false` neither entity
# matches the kubelet probe source, so the policy denied its own probes and the
# container restart-looped. The shape below is the one measured safe on this cluster -
# `docs/conventions/cilium.md`, section "Kubelet probes under enforced policies"
# (rows S2/S3/S5). Native NetworkPolicy cannot express it: no entities, and a node
# ipBlock does not match the probe source.
#
# PORTS - read off the rendered subchart output, not assumed
# ---------------------------------------------------------
#   8000  MCP app listener (`--address 0.0.0.0:8000`, the only containerPort, Service
#         `mcp-http`). Also serves /metrics (the binary always exposes metrics on the
#         main listener; serviceMonitor scrapes this port).
#   8081  health listener (`--healthz-address :8081`), readiness + liveness on
#         `/healthz` - DEDICATED, so allowing it exposes nothing else
#
# `world` on 8081 is owner-accepted residual exposure: that listener serves the health
# body only, pod IPs are not routable from outside the cluster, and unlike the app
# listener it has no Host/Origin validation to trip over (`--healthz-address` is exempt
# - measured). `world` matches whichever node probes it, which `host`/`remote-node`
# did not (measured restart-loop on 838031375).
#
# NEW MEASURED FACT: with `world` on the health port, an in-cluster pod that is NOT
# named in `fromEndpoints` is DENIED on the health port as well. So `world` does not
# admit cluster-identity pods; the residual exposure is only world-identity traffic
# reaching a readiness body on a non-routable pod IP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: grafana-mcp
spec:
  # Rendered pod labels, identical to the live pod and to the Service selector:
  # app.kubernetes.io/name=grafana-mcp, instance=grafana-mcp, component=mcp-server.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
      app.kubernetes.io/instance: grafana-mcp
      app.kubernetes.io/component: mcp-server
  ingress:
    # (1) Kubelet probes on the dedicated healthz side listener. `world` only, and
    # `cluster` deliberately stays off this port - a rule list containing `cluster`
    # leaked the app port in an earlier measured stage.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # (2) The MCP listener is reachable from the gateway plane and Prometheus (for
    # metrics scraping). One shared process forwards each caller's own bearer, so the
    # network path is what makes "no direct backend access" true: a pod outside this
    # allowlist cannot even open the connection, let alone present a credential.
    # Labels are the gateway's rendered + live pod labels; the service name the
    # gateway dials is grafana-mcp.grafana-mcp.svc.cluster.local:8000, matching
    # --allowed-hosts. Metrics are served on the same port (8000) at /metrics.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentgateway-standalone
            app.kubernetes.io/instance: mcp-gateway
            app.kubernetes.io/component: standalone
            io.kubernetes.pod.namespace: mcp-gateway
        - matchLabels:
            app.kubernetes.io/name: prometheus
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # Proven baseline. Covers Grafana (reached by cluster Service in `monitoring`) and
    # both DNS workloads. Bare `cluster`, no toPorts - ports on this rule would restrict
    # all cluster egress to them.
    - toEntities:
        - cluster
    # Guard for the DNS anycast path (nodelocaldns answers at 169.254.25.10 and Cilium
    # DNATs to the node-local-dns pod, so the real pods are named, not the cidr).
    # Redundant with `cluster`; harmless, rules are unioned.
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            k8s-app: node-local-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # NO `world` egress rule, and that is deliberate: the only upstream is the in-cluster
    # Grafana and telemetry is off (GRAFANA_USAGE_STATS=disabled), so this plane has no
    # reason to reach outside. If a future change adds an external target, it must add an
    # explicit, narrow egress rule here rather than widening `cluster`.
{{- end }}
