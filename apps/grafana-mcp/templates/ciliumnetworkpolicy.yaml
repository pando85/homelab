{{- if .Values.networkIsolation }}
---
# CiliumNetworkPolicy for the Grafana MCP backend.
#
# Applies to the mcp-grafana pods created by the subchart (rendered pod labels
# verified live: app.kubernetes.io/name=grafana-mcp,
# app.kubernetes.io/instance=grafana-mcp, app.kubernetes.io/component=mcp-server).
#
# Health-first rollout: this policy is only added AFTER the backend baseline was
# proven healthy without network isolation (2026-11-09, 180s Ready window,
# zero restarts). If it breaks probes or health, set values.networkIsolation
# back to false (template-only rollback; no Deployment nonce needed).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: grafana-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
      app.kubernetes.io/instance: grafana-mcp
      app.kubernetes.io/component: mcp-server
  ingress:
    # MCP traffic arrives ONLY from the public gateway plane pods.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentgateway-standalone
            app.kubernetes.io/instance: mcp-gateway
            app.kubernetes.io/component: standalone
            io.kubernetes.pod.namespace: mcp-gateway
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Kubelet liveness/readiness hit the --healthz-address side listener on
    # :8081. Probe sources are the node's kubelet (host) and, if the pod moves,
    # a remote-node kubelet; both are explicit entities here. This is NOT the
    # main :8000 listener (Host/Origin validation would refuse kubelet's
    # Host: <pod-ip> anyway - measured: 403 "forbidden: host not allowed").
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    # Grafana itself: the exact pods behind monitoring-grafana (svc port 80
    # targets container port 3000; selectors verified live via
    # kubectl -n monitoring get svc monitoring-grafana).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
            app.kubernetes.io/instance: monitoring
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # DNS via the kube-dns service backends and the node-local DNS pods
    # (LRP-steered). Selectors verified live: k8s-app=kube-dns and
    # k8s-app=node-local-dns in kube-system, both serving port 53.
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            k8s-app: node-local-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
{{- end }}
