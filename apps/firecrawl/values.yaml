# Firecrawl API - Main service
app-template:
  controllers:
    # API Service
    api:
      labels:
        backup/retain: weekly
      containers:
        app:
          image:
            # renovate: datasource=docker depName=ghcr.io/firecrawl/firecrawl
            repository: ghcr.io/firecrawl/firecrawl
            tag: v2.11.448
          command: ["node"]
          args: ["--max-old-space-size=2048", "dist/src/index.js"]
          env:
            FLY_PROCESS_GROUP: "app"
            PORT: "3002"
            HOST: "0.0.0.0"
            # Redis connection
            REDIS_URL: "redis://firecrawl-redis:6379"
            REDIS_RATE_LIMIT_URL: "redis://firecrawl-redis:6379"
            # Playwright service
            PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000"
            # Database (PostgreSQL)
            DATABASE_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: firecrawl.firecrawl-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            DATABASE_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: firecrawl.firecrawl-postgres.credentials.postgresql.acid.zalan.do
                  key: password
            DATABASE_HOST: firecrawl-postgres
            DATABASE_PORT: "5432"
            DATABASE_NAME: firecrawl
            NUQ_DATABASE_URL: "postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            # SearXNG integration
            SEARXNG_ENDPOINT: "http://searxng.searxng.svc.cluster.local:8080"
            SEARXNG_ENGINES: "google,bing,duckduckgo"
            SEARXNG_CATEGORIES: "general"
            # Configuration
            USE_DB_AUTHENTICATION: "false"
            ENV: "production"
            LOGGING_LEVEL: "INFO"
            IS_KUBERNETES: "true"
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v0/health/liveness
                  port: 3002
                initialDelaySeconds: 60
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              <<: *probes
              spec:
                httpGet:
                  path: /v0/health/readiness
                  port: 3002
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v0/health/readiness
                  port: 3002
                failureThreshold: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi

    # Queue Worker
    worker:
      containers:
        app:
          image:
            # renovate: datasource=docker depName=ghcr.io/firecrawl/firecrawl
            repository: ghcr.io/firecrawl/firecrawl
            tag: v2.11.448
          command: ["node"]
          args: ["--max-old-space-size=2048", "dist/src/services/queue-worker.js"]
          env:
            FLY_PROCESS_GROUP: "worker"
            PORT: "3005"
            HOST: "0.0.0.0"
            REDIS_URL: "redis://firecrawl-redis:6379"
            REDIS_RATE_LIMIT_URL: "redis://firecrawl-redis:6379"
            PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000"
            NUQ_DATABASE_URL: "postgresql://postgres:postgres@firecrawl-postgres:5432/postgres"
            USE_DB_AUTHENTICATION: "false"
            ENV: "production"
            LOGGING_LEVEL: "INFO"
            IS_KUBERNETES: "true"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /liveness
                  port: 3005
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi

    # NuQ Workers (specialized for NuQ backend)
    nuq-worker:
      replicas: 2
      containers:
        app:
          image:
            # renovate: datasource=docker depName=ghcr.io/firecrawl/firecrawl
            repository: ghcr.io/firecrawl/firecrawl
            tag: v2.11.448
          command: ["node"]
          args: ["--max-old-space-size=2048", "dist/src/services/worker/nuq-worker.js"]
          env:
            FLY_PROCESS_GROUP: "nuq-worker"
            NUQ_WORKER_PORT: "3006"
            HOST: "0.0.0.0"
            REDIS_URL: "redis://firecrawl-redis:6379"
            REDIS_RATE_LIMIT_URL: "redis://firecrawl-redis:6379"
            PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000"
            DATABASE_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: firecrawl.firecrawl-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            DATABASE_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: firecrawl.firecrawl-postgres.credentials.postgresql.acid.zalan.do
                  key: password
            DATABASE_HOST: firecrawl-postgres
            DATABASE_PORT: "5432"
            DATABASE_NAME: firecrawl
            NUQ_DATABASE_URL: "postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            USE_DB_AUTHENTICATION: "false"
            ENV: "production"
            LOGGING_LEVEL: "INFO"
            IS_KUBERNETES: "true"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3006
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3006
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi

    # Playwright Service (browser for scraping)
    playwright:
      containers:
        app:
          image:
            # renovate: datasource=docker depName=ghcr.io/firecrawl/playwright-service
            repository: ghcr.io/firecrawl/playwright-service
            tag: v2.11.448
          env:
            PORT: "3000"
            ALLOW_LOCAL_WEBHOOKS: "false"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3000
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

    # Redis (rate limiting and cache)
    redis:
      type: deployment
      containers:
        app:
          image:
            # renovate: datasource=docker depName=redis
            repository: docker.io/library/redis
            tag: 7.4-alpine
          command: ["redis-server"]
          args: ["--bind", "0.0.0.0"]
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["redis-cli", "ping"]
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

  # Services
  service:
    api:
      controller: api
      ports:
        http:
          port: 3002
    worker:
      controller: worker
      ports:
        http:
          port: 3005
    nuq-worker:
      controller: nuq-worker
      ports:
        http:
          port: 3006
    playwright:
      controller: playwright
      ports:
        http:
          port: 3000
    redis:
      controller: redis
      ports:
        http:
          port: 6379

  # Ingress
  ingress:
    api:
      enabled: true
      className: nginx-internal
      annotations:
        external-dns.kubernetes.io/enabled: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
      hosts:
        - host: &host firecrawl.internal.grigri.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: api
                port: http
      tls:
        - hosts:
            - *host
          secretName: firecrawl-tls-certificate

  # Pod options
  defaultPodOptions:
    enableServiceLinks: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
