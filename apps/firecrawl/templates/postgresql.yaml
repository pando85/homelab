apiVersion: postgresql.acid.zalan.do/v1
kind: postgresql
metadata:
  name: firecrawl-postgres
  namespace: firecrawl
spec:
  teamId: firecrawl
  numberOfInstances: 1
  users:
    postgres:
      - superuser
      - createdb
  databases:
    postgres: postgres
  postgresql:
    version: "15"
    parameters:
      shared_buffers: "256MB"
      max_connections: "100"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi
  volume:
    size: 5Gi
    storageClass: openebs-zfspv
  backup:
    schedule: "0 1 * * *"
    retention:
      maxCount: 7
