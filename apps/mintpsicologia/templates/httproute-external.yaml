# External Envoy Gateway routes. The internal route is the chart-native `wordpress.httpRoute`
# (values.yaml).
# No external-dns annotation on purpose: the records for mintpsicologia.es and www already exist
# (external-dns runs upsert-only), the routes must not change them.
# No request body limit and larger header limits on the Gateway (the old Ingress set 100m / 16k).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mintpsicologia-external
spec:
  hostnames:
    - mintpsicologia.es
  parentRefs:
    - name: external
      namespace: envoy-gateway
      sectionName: https-mintpsicologia-es
  rules:
    - backendRefs:
        - name: mintpsicologia-wordpress
          port: 80
---
# 301 redirect to the apex, path and query kept.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mintpsicologia-www-redirect
spec:
  hostnames:
    - www.mintpsicologia.es
  parentRefs:
    - name: external
      namespace: envoy-gateway
      sectionName: https-mintpsicologia-es-www
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: mintpsicologia.es
            statusCode: 301
