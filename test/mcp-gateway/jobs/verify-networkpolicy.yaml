# Committed GitOps verification job: proves the gateway's CiliumNetworkPolicy actually
# denies reachability from an unrelated namespace.
#
# NOT synced by ArgoCD (test/ is outside apps/ and system/).
# Owner applies explicitly after the foundation is deployed, then deletes.
#
# RE-RUN 2026-11-10: Previous run failed because the blocked-detection parsing was wrong.
# The probe() function did `curl ... || echo 000`, which concatenated curl's http_code `000`
# (emitted on connection failure) with the fallback `echo 000`, producing `000000`. The case
# statement expected `000` and classified `000000` as "NOT blocked". Fixed: capture curl's
# exit code separately; non-zero exit OR http_code 000 means blocked.
#
# Why a separate namespace: a 404 from the gateway would prove nothing about the
# policy (empty routes already 404 on the admin plane). A blocked TCP connect proves
# the policy is enforcing, so this Job must observe a TIMEOUT or REFUSED, not an HTTP status.
#
# Scope of the policy under test (apps/mcp-gateway/templates/ciliumnetworkpolicy.yaml):
#   ingress 15021 <- fromEntities: [world] (kubelet probes; `world` does NOT admit
#                     cluster-identity pods, so cross-namespace pods are still denied)
#   ingress 3000  <- fromEndpoints: Envoy Gateway `external` proxy pods
#   ingress 15020 <- fromEndpoints: prometheus pods in monitoring namespace
#   egress: toEntities: [cluster] + DNS pod rules + world:443 (context7 backend)
#   everything else denied
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-gateway-netpol-verify
  namespace: default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway-netpol-verify
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      containers:
        - name: curl
          # Digest re-verified against Docker Hub API on 2026-11-10 (previous digest did not resolve)
          image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              fail() { echo "FAIL: $*" >&2; exit 1; }
              ok() { echo "  ok ($*)"; }
              GW=mcp-gateway-standalone.mcp-gateway.svc.cluster.local
              pass=0

              # probe URL -> sets _code (http_code) and _rc (curl exit code).
              # curl always emits a 3-digit http_code (000 on connect failure);
              # the exit code is non-zero when curl could not complete the request.
              probe() {
                _rc=0
                _code=$(curl -s -o /dev/null -w '%{http_code}' \
                  --connect-timeout 3 --max-time 5 "$1" 2>/dev/null) || _rc=$?
                : "${_code:=000}"
              }

              assert_blocked() { # label url
                probe "$2"
                if [ "$_rc" -ne 0 ] || [ "$_code" = "000" ]; then
                  ok "$1 blocked (exit=$_rc code=$_code)"
                  pass=$((pass + 1))
                else
                  fail "$1 NOT blocked: exit=$_rc code=$_code"
                fi
              }

              echo "[1] cross-namespace -> gateway:3000 must be DENIED"
              assert_blocked "MCP port" "http://${GW}:3000/mcp"

              echo "[2] cross-namespace -> gateway:15020 metrics must be DENIED"
              assert_blocked "metrics port" "http://${GW}:15020/metrics"

              echo "[3] cross-namespace -> gateway:15021 healthz must be DENIED"
              assert_blocked "healthz port" "http://${GW}:15021/healthz/ready"

              echo "NETPOL_VERIFY_PASS ($pass/3 assertions passed)"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
