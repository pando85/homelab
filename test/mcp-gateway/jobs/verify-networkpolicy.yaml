# Committed GitOps verification job: proves the gateway's CiliumNetworkPolicy actually
# denies reachability from an unrelated namespace.
#
# NOT synced by ArgoCD (test/ is outside apps/ and system/).
# Owner applies explicitly after the foundation is deployed, then deletes.
#
# NOTE: This Job has NOT been applied since the CNP replaced the native NetworkPolicy.
# This run is its first re-verification against the current CNP shape.
#
# Why a separate namespace: a 404 from the gateway would prove nothing about the
# policy (empty routes already 404 on the admin plane). A blocked TCP connect proves
# the policy is enforcing, so this Job must observe a TIMEOUT, not an HTTP status.
#
# Scope of the policy under test (apps/mcp-gateway/templates/ciliumnetworkpolicy.yaml):
#   ingress 15021 <- fromEntities: [world] (kubelet probes; `world` does NOT admit
#                     cluster-identity pods, so cross-namespace pods are still denied)
#   ingress 3000  <- fromEndpoints: ingress-nginx-external controller pods OR
#                    Envoy Gateway `external` proxy pods (serving path)
#   ingress 15020 <- fromEndpoints: prometheus pods in monitoring namespace
#   egress: toEntities: [cluster] + DNS pod rules + world:443 (context7 backend)
#   everything else denied
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-gateway-netpol-verify
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway-netpol-verify
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      containers:
        - name: curl
          # Digest re-verified against Docker Hub API on 2026-11-10 (previous digest did not resolve)
          image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              fail() { echo "FAIL: $*" >&2; exit 1; }
              ok() { echo "  ok ($*)"; }
              GW=mcp-gateway.mcp-gateway.svc.cluster.local

              probe() { # url -> prints http_code, or 000 on connect timeout/refusal
                curl -s -o /dev/null -w '%{http_code}' --max-time 4 "$1" 2>/dev/null || echo 000
              }

              echo "[1] cross-namespace -> gateway:3000 must be DENIED"
              code=$(probe "http://${GW}:3000/mcp")
              case "$code" in
                000) ok "blocked as expected" ;;
                404) fail "NOT blocked: reached the gateway (policy gap)" ;;
                *)   fail "NOT blocked: got HTTP $code" ;;
              esac

              echo "[2] cross-namespace -> gateway:15020 metrics must be DENIED"
              code=$(probe "http://${GW}:15020/metrics")
              case "$code" in
                000) ok "blocked as expected" ;;
                200) fail "metrics reachable from another namespace" ;;
                *)   fail "unexpected HTTP $code" ;;
              esac

              echo "[3] cross-namespace -> gateway:15021 healthz must be DENIED"
              code=$(probe "http://${GW}:15021/healthz/ready")
              case "$code" in
                000) ok "blocked as expected" ;;
                200) fail "healthz reachable from another namespace" ;;
                *)   fail "unexpected HTTP $code" ;;
              esac

              echo "ALL PASS: default-deny for the gateway plane holds"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
