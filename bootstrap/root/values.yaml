gitops:
  repo: https://github.com/pando85/homelab
  revision: master
stacks:
  - name: bootstrap
    namespace: argocd
  - name: system
    excludes:
      - alloy  # Fallback profiler — not deployed by default (see system/alloy/SWAP-PROCEDURE)
    ignoreDifferences:
      - group: '*'
        kind: CustomResourceDefinition
        name: 'addresspools.metallb.io'
        jsonPointers:
          - /spec/conversion/webhook/clientConfig/caBundle
      - group: '*'
        kind: CustomResourceDefinition
        name: 'bgppeers.metallb.io'
        jsonPointers:
          - /spec/conversion/webhook/clientConfig/caBundle
      - group: '*'
        kind: Secret
        jsonPointers:
          - /data/ca.crt
          - /data/ca.key
          - /data/tls.crt
          - /data/tls.key
  - name: platform
  - name: apps
    ignoreDifferences:
      - group: ''
        kind: PersistentVolumeClaim
        name: config-stump
        jsonPointers:
          - /spec/storageClassName
          - /spec/volumeMode
          - /spec/volumeName
          - /metadata/annotations

multivara:
  gitops:
    repo: https://git.grigri.cloud/multivara/gitops
    revision: main
  stacks:
    - name: apps
    - name: platform

kiais:
  gitops:
    repo: https://tea.millaguie.net/kiais/gitops
    revision: main
  stacks:
    - name: apps
