apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ci-runner-amd64
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      # Distinct from `ci-runner` on purpose: two StatefulSets in one namespace
      # must not have overlapping selectors.
      app.kubernetes.io/name: ci-runner-amd64
  serviceName: ci-runner-amd64
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-runner-amd64
    spec:
      containers:
        - name: runner
          # renovate: sha256: datasource=docker
          image: ghcr.io/pando85/forgejo-runner-gc:rolling@sha256:1ddb43499f4df3e89e484683e22dc40a8e7521ea10b2b2c0615487d06d7c2b83
          command:
            - sh
            - -c
            - |
              # One-shot removal of the legacy single-daemon sccache directory. Unused
              # since 2026-11-06, when the Calypso sccache action moved to leased slots
              # under /cache/sccache-slots (nothing in it was modified after that date on
              # either runner; the owner approved deleting it). Idempotent: a no-op once
              # the directory is gone. The exact path is used on purpose, no globs:
              # /cache/sccache-slots, /cache/sccache-daemon and /cache/cargo* must stay.
              # REMOVE THIS BLOCK once both runners have rolled past 2026-11-10.
              if [ -d /cache/sccache ]; then
                legacy_kib=$(du -sk /cache/sccache 2>/dev/null | cut -f1)
                echo "removing legacy /cache/sccache (${legacy_kib:-unknown} KiB)"
                rm -rf /cache/sccache
                echo "legacy /cache/sccache removed"
              fi

              retries=0
              max_retries=10
              while [ ! -S /sock/docker.sock ]; do
                echo "waiting for docker daemon... ($retries/$max_retries)"
                sleep 5
                retries=$((retries+1))
                if [ "$retries" -ge "$max_retries" ]; then
                  echo "docker daemon not available after $max_retries attempts, restarting container"
                  exit 1
                fi
              done

              # Identity comes from `server.connections` in registration.yaml
              # (uuid + token_url), so there is no `.runner` file to copy in.
              exec forgejo-runner -c /registration/registration.yaml daemon
          resources:
            requests:
              memory: "4Gi"
              # 1 core of weight under contention (was 200m): the node's CPU
              # requests are ~5% allocated, so this costs nothing at admission
              # but stops the runner losing CPU shares to other pods when two
              # Rust jobs compete for the cores.
              cpu: "1"
            limits:
              # 12Gi gives the runner headroom for moderate concurrent loads. At
              # capacity 2 the aggregate peak is bounded by concurrency as well as
              # by this limit, but jobs can still demand ~17.4GiB individually
              # (measured on prusik), so OOM kills remain possible. The pod's total
              # limits (12Gi + 4Gi + 128Mi = 16.1Gi) still exceed the node's
              # 12.53Gi allocatable, so the "pod dies before node" property is
              # gone - if every container peaks simultaneously, the node itself
              # will pressure. Accepted trade-off: more runner headroom at the
              # cost of losing the strict OOM boundary.
              #
              # Memory stays at 12Gi: memory is the binding constraint on this node
              # (MemAvailable minimum 1.0-2.6 GB, MemoryPressure ~30 min in 14d),
              # the runner's 7d working-set peak is ~11.2-12.0Gi, and a node-level
              # OOM evicts unrelated pods. The daemon's share went back up to 4Gi
              # (see the `daemon` container), so the overcommit grows there, not
              # here; the runner is not the side that can absorb more.
              memory: "12Gi"
              # 8 cores = 2 concurrent jobs x CARGO_BUILD_JOBS/-j4. Was 5: over
              # 2026-11-03..10 the runner sat on that limit (peak 5.0 cores, mean
              # 0.92) and was CFS-throttled in 15.6% of periods while the node
              # averaged ~10% CPU (peak ~58%), so the cap, not the node, was the
              # bottleneck. The node has 11 allocatable cores.
              cpu: "8"
          securityContext:
            privileged: true
            runAsUser: 1001
          env:
            - name: DOCKER_HOST
              value: unix:///sock/docker.sock
            # Caps Rust/make parallelism so peak RSS stays under the 12Gi limit:
            # cargo defaults to one linker/rustc job per core, so per-job RSS
            # multiplies with the CPU count and blows the cgroup ceiling. Same
            # rationale as the prusik runner; these are the build-throughput knobs
            # to tune against this node's 12.53Gi allocatable.
            - name: CARGO_BUILD_JOBS
              value: "4"
            - name: MAKEFLAGS
              value: "-j4"
          volumeMounts:
            - name: runner-data
              mountPath: /workspace
            - name: runner-registration
              mountPath: /registration
            - name: runner-config
              mountPath: /config
            - name: ci-runner-cache
              mountPath: /cache
            - name: docker-run
              mountPath: /sock
            - name: sccache-s3-credentials
              mountPath: /sccache-credentials
              readOnly: true
        - name: daemon
          # renovate: datasource=docker
          image: docker:29.9.3
          env:
            - name: TINI_SUBREAPER
              value: "1"
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            - name: DOCKER_HOST
              value: tcp://0.0.0.0:2376
          command:
            - sh
            - -c
            - |
              exec /usr/local/bin/docker-init -- sh -c '
                cleanup() {
                  echo "Received termination signal, stopping docker daemon..."
                  pkill -TERM dockerd 2>/dev/null || true
                  pkill -TERM containerd 2>/dev/null || true
                  sleep 2
                  exit 0
                }

                trap cleanup TERM INT

                dockerd-entrypoint.sh --host=unix:///sock/docker.sock --host=tcp://0.0.0.0:2376 2>&1 &
                  DOCKERD_PID=$!

                  while [ ! -S /sock/docker.sock ]; do
                    sleep 1
                  done

                  chgrp 1001 /sock/docker.sock
                  chmod 660 /sock/docker.sock

                  RUNNER_STARTED=false
                  while kill -0 $DOCKERD_PID 2>/dev/null; do
                    if pgrep forgejo-runner > /dev/null; then
                      RUNNER_STARTED=true
                    elif [ "$RUNNER_STARTED" = true ]; then
                      echo "forgejo-runner exited, stopping dind"
                      break
                    fi
                    sleep 5
                  done

                  cleanup
              '
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: docker-daemon-config
              mountPath: /etc/docker/daemon.json
              subPath: daemon.json
              readOnly: true
            - name: ci-runner-docker
              mountPath: /var/lib/docker
            - name: runner-data
              mountPath: /workspace
            - name: ci-runner-cache
              mountPath: /cache
            - name: docker-run
              mountPath: /sock
            - name: sccache-s3-credentials
              mountPath: /sccache-credentials
              readOnly: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              # `docker`-label jobs are sibling containers created by dockerd, so
              # they land in THIS container's cgroup - this limit bounds them, not
              # the runner's. Under-sizing it silently caps docker jobs below the
              # runner's own budget and OOM-kills them inside DinD.
              #
              # Raised back from the 2Gi set on 2026-11-10 (`a4806f45a`), which
              # OOM-killed a `docker`-label job. That cut was justified by a 0.78Gi
              # working-set peak, but that series is the *parent's* own usage: the
              # job containers dockerd spawns are only visible in this cgroup's
              # hierarchical high-water mark, and the parent's
              # `container_oom_events_total` stayed 0 over the same window. Measured
              # `container_memory_max_usage_bytes` (memory.peak, children included)
              # never read below whatever ceiling was configured - 2.01-2.02GiB under
              # 2Gi (from ~13:50Z) and 4.50-4.54GiB under 4608Mi before it.
              #
              # Caveat for the next person resizing this: that peak includes
              # reclaimable page cache from image pulls and build layers, so it is an
              # upper bound on pressure, not an RSS demand figure. What it does prove
              # is that the ceiling, not the workload, is the binding number here.
              #
              # 4Gi is what is left of the node budget next to the runner's 12Gi:
              # pod limits sum to 16.1Gi against 12.53Gi allocatable, while the
              # observed concurrent working set stays near 11Gi (runner 7d peak
              # ~10Gi, daemon 0.1-0.85Gi). If docker jobs need more than this, the
              # fix is moving them off DinD or rebalancing against the runner, not
              # raising this ceiling further. CPU stays at 2 cores.
              memory: "4Gi"
              cpu: "2"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - test -S /sock/docker.sock
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep dockerd >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -S /sock/docker.sock
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "pkill -TERM dockerd 2>/dev/null || true; sleep 2"
        - name: docker-gc
          # renovate: datasource=docker
          image: docker:29.9.3
          env:
            - name: HOME
              value: /tmp
            - name: DOCKER_HOST
              value: unix:///sock/docker.sock
            # Low/medium tiers are keyed on Docker's own footprint (the summed Size
            # column of `docker system df`) against DOCKER_BUDGET_GB, NOT on the
            # filesystem. `df -P /var/lib/docker` measures the node's 113.8 GiB root
            # fs, shared with k3s, /srv/ci-runner/{workspace,cache} and the OS
            # (2026-11-10: Docker ~12 GiB of 78 GiB used), so a df trigger pruned
            # Docker to fight growth Docker had not caused and reclaimed 0 B.
            # Budget 25 GB: with ~22 GiB cache, ~18 GiB workspace and ~22 GiB
            # k3s/OS the node then peaks near 70%, below the 78% emergency line.
            # LOW/MED are percentages of the budget (15 GB / 20 GB).
            #
            # Image and build cache prunes in low/medium run only while the runner is
            # idle (see runner_busy): a prune racing an image pull made jobs fail with
            # `No such image` right after `docker pull` (dockerd: `lease does not
            # exist`). Stopped-container and anonymous-volume prunes cannot race a
            # pull and run even while busy. Each interval logs one `gc summary` line
            # with what ran and what was skipped.
            #
            # The emergency tier (THRESHOLD_HIGH) still uses the filesystem
            # percentage and runs regardless of activity: this loop is the only
            # thing keeping CI below kubelet's DiskPressure eviction line
            # (host_vars/k8s-amd64-1.yml `nodefs.available`). Whatever else fills
            # the root fs (cache, workspace, OS) is not Docker's to free, but
            # emptying Docker is the one lever this container has. DinD is the
            # dominant consumer when builds burst: calypso builds leave ~7 GiB
            # images per commit that no container references after the push.
            #
            # Retention is NOT age-based above MED: `docker image prune --filter
            # until=` compares against the image's *creation* time, so freshly
            # built images are always "too young" exactly when they are what
            # fills the disk (2026-11-01: the 6h tier reclaimed 0 B at 89% and the
            # node evicted every pod 1 minute later). HIGH removes every image no
            # container uses; the cost is re-pulling base images.
            #
            # 120s because a CI burst grew usage ~4.5 GiB per 10 minutes, i.e.
            # 600s could cross a whole tier unobserved.
            - name: CHECK_INTERVAL
              value: "120"
            - name: DOCKER_BUDGET_GB
              value: "25"
            - name: THRESHOLD_LOW
              value: "60"
            - name: THRESHOLD_MED
              value: "80"
            - name: THRESHOLD_HIGH
              value: "78"
          command:
            - sh
            - -c
            - |
              CHECK_INTERVAL="${CHECK_INTERVAL:-120}"
              DOCKER_BUDGET_GB="${DOCKER_BUDGET_GB:-25}"
              THRESHOLD_LOW="${THRESHOLD_LOW:-60}"
              THRESHOLD_MED="${THRESHOLD_MED:-80}"
              THRESHOLD_HIGH="${THRESHOLD_HIGH:-78}"
              DOCKER_QUIET_SECONDS="${DOCKER_QUIET_SECONDS:-180}"
              DOCKER_BUSY_CONTAINER_AGE="${DOCKER_BUSY_CONTAINER_AGE:-10m}"
              DOCKER_STATE_DIR="${DOCKER_STATE_DIR:-/var/lib/docker/containerd/daemon}"
              runner_started=false
              gc_meta_mtime=0
              ops_ran=""
              ops_skipped=""
              busy=false
              busy_reason=""

              cleanup() {
                exit 0
              }

              trap cleanup TERM INT

              # Filesystem usage (%) of the volume holding /var/lib/docker. Only the emergency
              # tiers use it.
              get_disk_usage() {
                df -P /var/lib/docker 2>/dev/null | awk 'NR==2 {print $5}' | tr -d '%' || echo 0
              }

              # Docker's own footprint in MB: the sum of the Size column of `docker system df`
              # (images, containers, volumes, build cache). Exits 1 when the output cannot be
              # parsed, so an unknown size is never mistaken for 0. Docker prints decimal
              # units (B, kB, MB, GB, TB); shared layers can be counted twice, which errs
              # towards pruning earlier.
              get_docker_used_mb() {
                docker system df --format '{{json .}}' 2>/dev/null | awk '
                  function to_mb(s,   n, u) {
                    n = s + 0
                    u = s
                    sub(/^[0-9.]+/, "", u)
                    u = tolower(u)
                    if (u == "b") return n / 1000000
                    if (u == "kb") return n / 1000
                    if (u == "mb") return n
                    if (u == "gb") return n * 1000
                    if (u == "tb") return n * 1000000
                    bad = 1
                    return 0
                  }
                  match($0, /"Size":"[^"]*"/) {
                    total += to_mb(substr($0, RSTART + 8, RLENGTH - 9))
                    rows++
                  }
                  END {
                    if (rows == 0 || bad) exit 1
                    printf "%d\n", total
                  }'
              }

              # Prints why the runner is busy and returns 0, or returns 1 when it is idle.
              # Idle means none of these hold:
              #  - forgejo-runner has a child process (a host-mode job step is running);
              #  - a task container exists (docker-mode job, after the pull);
              #  - an image pull is in flight: a blob is downloading (containerd content
              #    ingest dir not empty) or dockerd's metadata db (leases, images, snapshots,
              #    containers) was written within DOCKER_QUIET_SECONDS. That is the only signal
              #    for the pull and unpack phase of a container job: no container exists yet
              #    and the runner has no child process. A write by our own previous prune does
              #    not count (gc_meta_mtime).
              # Anything that cannot be read counts as busy: pruning during a pull is the
              # failure this guards against.
              runner_busy() {
                rpid=$(pgrep -o forgejo-runner 2>/dev/null)
                if [ -n "$rpid" ] && pgrep -P "$rpid" >/dev/null 2>&1; then
                  echo "job step running"
                  return 0
                fi

                if ! tasks=$(docker ps -q --filter name=FORGEJO-ACTIONS-TASK- 2>/dev/null); then
                  echo "cannot list containers"
                  return 0
                fi
                if [ -n "$tasks" ]; then
                  echo "task container running"
                  return 0
                fi

                if [ ! -d "$DOCKER_STATE_DIR/io.containerd.content.v1.content/ingest" ]; then
                  echo "cannot read containerd ingest dir"
                  return 0
                fi
                if [ -n "$(ls -A "$DOCKER_STATE_DIR/io.containerd.content.v1.content/ingest" 2>/dev/null)" ]; then
                  echo "image pull in progress"
                  return 0
                fi

                if ! meta_mtime=$(stat -c %Y "$DOCKER_STATE_DIR/io.containerd.metadata.v1.bolt/meta.db" 2>/dev/null); then
                  echo "cannot read containerd metadata db"
                  return 0
                fi
                if [ "$meta_mtime" != "$gc_meta_mtime" ]; then
                  meta_age=$(($(date +%s) - meta_mtime))
                  if [ "$meta_age" -lt "$DOCKER_QUIET_SECONDS" ]; then
                    echo "docker active ${meta_age}s ago"
                    return 0
                  fi
                fi

                return 1
              }

              # Remember the metadata db mtime after our own prune so that it is not
              # mistaken for job activity by the next check.
              note_gc_mtime() {
                gc_meta_mtime=$(stat -c %Y "$DOCKER_STATE_DIR/io.containerd.metadata.v1.bolt/meta.db" 2>/dev/null || echo 0)
              }

              # Cleanup is split by what it can break while a job runs.
              #  - Pull-safe: `container prune` (stopped containers) and `volume prune` (anonymous
              #    volumes no container references; named volumes need -a and are not touched, a
              #    created or running container's volumes count as in use). Neither touches images,
              #    layers or leases, so neither can race an image pull. They run whenever a budget
              #    tier fires, busy or not. While busy, container prune only takes containers older
              #    than DOCKER_BUSY_CONTAINER_AGE: a job container exists in state `created` for a
              #    moment before it starts and `container prune` would remove it.
              #  - Pull-unsafe: `image prune` and `builder prune` delete snapshots and content and
              #    trigger containerd GC, which can delete the lease of an image that is being
              #    pulled (`No such image` right after `docker pull`). Idle-gated.
              # Each interval logs one summary line: what ran and what was skipped because busy.
              run_op() {
                op=$1
                shift
                echo "running ${op}"
                "$@" || true
                ops_ran="${ops_ran} ${op}"
              }

              run_idle_op() {
                op=$1
                shift
                if [ "$busy" = true ]; then
                  ops_skipped="${ops_skipped} ${op}"
                else
                  run_op "$op" "$@"
                fi
              }

              prune_containers() {
                if [ "$busy" = true ]; then
                  docker container prune -f --filter "until=${DOCKER_BUSY_CONTAINER_AGE}"
                else
                  docker container prune -f
                fi
              }

              while true; do
                if pgrep forgejo-runner >/dev/null; then
                  runner_started=true
                elif [ "$runner_started" = true ]; then
                  echo "forgejo-runner exited, stopping docker-gc"
                  exit 0
                fi

                until docker info >/dev/null 2>&1; do
                  if [ "$runner_started" = true ] && ! pgrep forgejo-runner >/dev/null; then
                    echo "forgejo-runner exited, stopping docker-gc"
                    exit 0
                  fi

                  echo "waiting for docker daemon..."
                  sleep 10
                done

                usage=$(get_disk_usage)
                echo "docker disk usage: ${usage}%"
                ops_ran=""
                ops_skipped=""
                if busy_reason=$(runner_busy); then
                  busy=true
                else
                  busy=false
                  busy_reason=""
                fi

                if [ "$usage" -ge "$THRESHOLD_HIGH" ]; then
                  # Emergency tier: keyed on the filesystem and run even while a job is
                  # active. In-use images, containers and volumes are protected by dockerd
                  # itself; everything else goes.
                  echo "high disk usage (${usage}%), pruning all unused images, build cache and volumes"
                  run_op container-prune docker container prune -f
                  run_op image-prune docker image prune -af
                  run_op builder-prune docker builder prune -af
                  run_op volume-prune docker volume prune -af
                elif used_mb=$(get_docker_used_mb); then
                  budget_pct=$((used_mb * 100 / (DOCKER_BUDGET_GB * 1000)))
                  echo "docker footprint: ${used_mb} MB, ${budget_pct}% of the ${DOCKER_BUDGET_GB} GB budget"
                  if [ "$budget_pct" -ge "$THRESHOLD_MED" ]; then
                    echo "medium docker footprint (${budget_pct}% of budget), pruning build cache, unused images (24h retention) and anonymous volumes"
                    run_op container-prune prune_containers
                    run_op volume-prune docker volume prune -f
                    run_idle_op image-prune docker image prune -af --filter "until=24h"
                    run_idle_op builder-prune docker builder prune -af --filter "until=24h"
                  elif [ "$budget_pct" -ge "$THRESHOLD_LOW" ]; then
                    echo "low docker footprint (${budget_pct}% of budget), pruning dangling images and containers"
                    run_op container-prune prune_containers
                    run_idle_op image-prune docker image prune -f
                  else
                    echo "docker footprint below budget threshold (${budget_pct}%), skipping cleanup"
                  fi
                else
                  echo "cannot read docker usage, skipping non-emergency cleanup"
                fi

                echo "gc summary: busy=${busy_reason:-no}; ran:${ops_ran:- none}; skipped while busy:${ops_skipped:- none}"
                if [ -n "$ops_ran" ]; then
                  new_usage=$(get_disk_usage)
                  note_gc_mtime
                  echo "cleanup complete, new usage: ${new_usage}%"
                fi

                echo "sleeping for ${CHECK_INTERVAL}s"
                slept_seconds=0
                while [ "$slept_seconds" -lt "$CHECK_INTERVAL" ]; do
                  if ! pgrep forgejo-runner >/dev/null; then
                    echo "forgejo-runner exited, stopping docker-gc"
                    exit 0
                  fi

                  sleep 10
                  slept_seconds=$((slept_seconds + 10))
                done
              done
          # Root, read-only mount: the idle check reads dockerd's containerd state
          # (content ingest dir, metadata db), which is root-only 0700. The volume
          # stays mounted readOnly and the container is not privileged.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: docker-run
              mountPath: /sock
            - name: ci-runner-docker
              mountPath: /var/lib/docker
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              # 250m (was 100m): usage is tiny (7d peak ~6m at 5m averages, ~14m at 1m
              # resolution) but the loop forks `docker system df`, `docker ps`,
              # awk and stat every 120s, and those short multi-process bursts
              # exhausted the 10ms-per-100ms CFS quota: 41% of periods throttled
              # over 7d and still ~45% after the 2026-11-10 rollout, which slows
              # the busy check. 250m raises the per-period quota to 25ms.
              cpu: "250m"
      securityContext:
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups:
          - 1001
        runAsGroup: 1001
        runAsUser: 1001
      # CI is expendable batch work. It used to be high-priority, which meant the
      # runner was deliberately protected from eviction while the control plane was
      # not - backwards for a workload that caused the outage. low-priority (value
      # -1000, preemptionPolicy: Never) puts it first in the eviction queue so the
      # runner dies instead of etcd/apiserver, and it never preempts anything itself.
      priorityClassName: low-priority
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ci"
          effect: "NoSchedule"
      # hostPath volumes are node-local, so this pod must be pinned explicitly -
      # unlike ci-runner, which lands on prusik implicitly through its ZFS volume
      # topology and has no nodeSelector at all.
      nodeSelector:
        kubernetes.io/hostname: k8s-amd64-1
      volumes:
        # hostPath rather than PVCs: this node has no ZFS pool and there is
        # deliberately no local StorageClass (planning/k8s-amd64-1-node-addition.md,
        # TODO-6.3). `type: Directory`, never `DirectoryOrCreate` - the latter
        # silently creates a root-owned directory and the runner is uid 1001,
        # producing a permission error that reads like an app bug. Paths, owners
        # and modes live in metal/inventory/host_vars/k8s-amd64-1.yml because
        # kubelet applies no fsGroup management to hostPath volumes.
        #
        # The workspace moves off `emptyDir: {medium: Memory, sizeLimit: 8Gi}`:
        # an 8 GiB tmpfs would reserve 64% of this node's 12.53 Gi allocatable.
        # hostPath trades tmpfs speed for RAM and survives pod restarts
        # (warm checkouts, persistent .pnpm-store). The runner's native
        # workspace GC removes abandoned host scratch directories only when
        # idle and older than 24h; unlike the old workspace-gc sidecar this
        # provides no disk-pressure size guard. Monitor nodefs usage separately.
        - name: runner-data
          hostPath:
            path: /srv/ci-runner/workspace
            type: Directory
        - name: runner-config
          secret:
            secretName: runner-config-amd64
        - name: runner-registration
          configMap:
            name: runner-registration-amd64
        - name: docker-certs
          emptyDir: {}
        - name: docker-daemon-config
          configMap:
            name: docker-daemon-amd64
        - name: docker-run
          emptyDir: {}
        - name: sccache-s3-credentials
          secret:
            secretName: sccache-s3-credentials
            # uid 1001 must read /sccache-credentials/credentials; no fsGroup applies to this
            # secret, so 0444 (pod-local world-readable) is required. Scoped sccache-ci only.
            defaultMode: 0444
        - name: ci-runner-cache
          hostPath:
            path: /srv/ci-runner/cache
            type: Directory
        - name: ci-runner-docker
          hostPath:
            path: /srv/ci-runner/docker
            type: Directory
      # No pod-level `resources` block. Limits are per-container and sum to
      # ~16.1Gi, which exceeds this node's 12.53Gi allocatable. The runner's
      # 12Gi limit prioritizes headroom for concurrent jobs over the strict
      # "pod dies before node" property. The legacy StatefulSet notes
      # pod-level resources do not work under kata.
      restartPolicy: Always
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
