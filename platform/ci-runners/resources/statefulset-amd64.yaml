apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ci-runner-amd64
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      # Distinct from `ci-runner` on purpose: two StatefulSets in one namespace
      # must not have overlapping selectors.
      app.kubernetes.io/name: ci-runner-amd64
  serviceName: ci-runner-amd64
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-runner-amd64
    spec:
      containers:
        - name: runner
          # renovate: sha256: datasource=docker
          image: ghcr.io/pando85/forgejo-runner:13.2.0
          command:
            - sh
            - -c
            - |
              retries=0
              max_retries=10
              while [ ! -S /sock/docker.sock ]; do
                echo "waiting for docker daemon... ($retries/$max_retries)"
                sleep 5
                retries=$((retries+1))
                if [ "$retries" -ge "$max_retries" ]; then
                  echo "docker daemon not available after $max_retries attempts, restarting container"
                  exit 1
                fi
              done

              # Identity comes from `server.connections` in registration.yaml
              # (uuid + token_url), so there is no `.runner` file to copy in.
              exec forgejo-runner -c /registration/registration.yaml daemon
          resources:
            requests:
              memory: "1Gi"
              cpu: "200m"
            limits:
              # 12Gi gives the runner headroom for moderate concurrent loads. At
              # capacity 5, jobs can still demand ~17.4GiB (measured on prusik),
              # so OOM kills remain possible at full concurrency. The pod's total
              # limits (12Gi + 4.5Gi + 192Mi = 16.7Gi) now exceed the node's
              # 12.53Gi allocatable, so the "pod dies before node" property is
              # gone - if every container peaks simultaneously, the node itself
              # will pressure. Accepted trade-off: more runner headroom at the
              # cost of losing the strict OOM boundary.
              memory: "12Gi"
              cpu: "6"
          securityContext:
            privileged: true
            runAsUser: 1001
          env:
            - name: DOCKER_HOST
              value: unix:///sock/docker.sock
          volumeMounts:
            - name: runner-data
              mountPath: /workspace
            - name: runner-registration
              mountPath: /registration
            - name: runner-config
              mountPath: /config
            - name: ci-runner-cache
              mountPath: /cache
            - name: docker-run
              mountPath: /sock
        - name: daemon
          # renovate: datasource=docker
          image: docker:29.8.1
          env:
            - name: TINI_SUBREAPER
              value: "1"
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            - name: DOCKER_HOST
              value: tcp://0.0.0.0:2376
          command:
            - sh
            - -c
            - |
              exec /usr/local/bin/docker-init -- sh -c '
                cleanup() {
                  echo "Received termination signal, stopping docker daemon..."
                  pkill -TERM dockerd 2>/dev/null || true
                  pkill -TERM containerd 2>/dev/null || true
                  sleep 2
                  exit 0
                }

                trap cleanup TERM INT

                dockerd-entrypoint.sh --host=unix:///sock/docker.sock --host=tcp://0.0.0.0:2376 2>&1 &
                  DOCKERD_PID=$!

                  while [ ! -S /sock/docker.sock ]; do
                    sleep 1
                  done

                  chgrp 1001 /sock/docker.sock
                  chmod 660 /sock/docker.sock

                  RUNNER_STARTED=false
                  while kill -0 $DOCKERD_PID 2>/dev/null; do
                    if pgrep forgejo-runner > /dev/null; then
                      RUNNER_STARTED=true
                    elif [ "$RUNNER_STARTED" = true ]; then
                      echo "forgejo-runner exited, stopping dind"
                      break
                    fi
                    sleep 5
                  done

                  cleanup
              '
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: ci-runner-docker
              mountPath: /var/lib/docker
            - name: runner-data
              mountPath: /workspace
            - name: ci-runner-cache
              mountPath: /cache
            - name: docker-run
              mountPath: /sock
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              # `docker`-label jobs are sibling containers created by dockerd, so
              # they land in THIS container's cgroup - this limit bounds them, not
              # the runner's. Under-sizing it would silently cap docker jobs below
              # the runner's own budget.
              memory: "4608Mi"
              cpu: "3"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - test -S /sock/docker.sock
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep dockerd >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -S /sock/docker.sock
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "pkill -TERM dockerd 2>/dev/null || true; sleep 2"
        - name: docker-gc
          # renovate: datasource=docker
          image: docker:29.8.1
          env:
            - name: HOME
              value: /tmp
            - name: DOCKER_HOST
              value: unix:///sock/docker.sock
            # `df -P /var/lib/docker` now measures the node's 113.8 GiB root
            # filesystem rather than a dedicated 50 GiB volume, so the inherited
            # thresholds land in the wrong place: HIGH=90 coincides exactly with
            # kubelet's nodefs.available<10% eviction trigger (11.4 GiB free) and
            # CRITICAL=95 fires at 5.7 GiB, after the node is already evicting.
            # These keep the most aggressive tier at ~17 GiB free, and the shorter
            # interval matters because a shared disk fills faster than a dedicated
            # one - 30 minutes of a heavy build is a lot of unobserved growth.
            - name: CHECK_INTERVAL
              value: "600"
            - name: THRESHOLD_LOW
              value: "60"
            - name: THRESHOLD_MED
              value: "70"
            - name: THRESHOLD_HIGH
              value: "78"
            - name: THRESHOLD_CRITICAL
              value: "85"
          command:
            - sh
            - -c
            - |
              CHECK_INTERVAL="${CHECK_INTERVAL:-1800}"
              THRESHOLD_LOW="${THRESHOLD_LOW:-80}"
              THRESHOLD_MED="${THRESHOLD_MED:-85}"
              THRESHOLD_HIGH="${THRESHOLD_HIGH:-90}"
              THRESHOLD_CRITICAL="${THRESHOLD_CRITICAL:-95}"
              runner_started=false

              cleanup() {
                exit 0
              }

              trap cleanup TERM INT

              get_disk_usage() {
                df -P /var/lib/docker 2>/dev/null | awk 'NR==2 {print $5}' | tr -d '%' || echo 0
              }

              while true; do
                if pgrep forgejo-runner >/dev/null; then
                  runner_started=true
                elif [ "$runner_started" = true ]; then
                  echo "forgejo-runner exited, stopping docker-gc"
                  exit 0
                fi

                until docker info >/dev/null 2>&1; do
                  if [ "$runner_started" = true ] && ! pgrep forgejo-runner >/dev/null; then
                    echo "forgejo-runner exited, stopping docker-gc"
                    exit 0
                  fi

                  echo "waiting for docker daemon..."
                  sleep 10
                done

                usage=$(get_disk_usage)
                echo "docker disk usage: ${usage}%"

                if [ "$usage" -ge "$THRESHOLD_LOW" ]; then
                  if [ "$usage" -ge "$THRESHOLD_CRITICAL" ]; then
                    echo "critical disk usage (${usage}%), aggressive cleanup (6h retention)"
                    docker image prune -af --filter "until=6h" || true
                    docker builder prune -af --filter "until=6h" || true
                    docker container prune -f || true
                  elif [ "$usage" -ge "$THRESHOLD_HIGH" ]; then
                    echo "high disk usage (${usage}%), pruning unused images (24h retention)"
                    docker image prune -af --filter "until=24h" || true
                    docker builder prune -af --filter "until=24h" || true
                  elif [ "$usage" -ge "$THRESHOLD_MED" ]; then
                    echo "medium disk usage (${usage}%), pruning build cache (24h retention)"
                    docker builder prune -af --filter "until=24h" || true
                  else
                    echo "low disk usage (${usage}%), pruning dangling images and containers"
                    docker image prune -f || true
                    docker container prune -f || true
                  fi

                  new_usage=$(get_disk_usage)
                  echo "cleanup complete, new usage: ${new_usage}%"
                else
                  echo "disk usage below threshold (${usage}%), skipping cleanup"
                fi

                echo "sleeping for ${CHECK_INTERVAL}s"
                slept_seconds=0
                while [ "$slept_seconds" -lt "$CHECK_INTERVAL" ]; do
                  if ! pgrep forgejo-runner >/dev/null; then
                    echo "forgejo-runner exited, stopping docker-gc"
                    exit 0
                  fi

                  sleep 10
                  slept_seconds=$((slept_seconds + 10))
                done
              done
          volumeMounts:
            - name: docker-run
              mountPath: /sock
            - name: ci-runner-docker
              mountPath: /var/lib/docker
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
        - name: workspace-gc
          image: busybox:1.38.0
          command:
            - sh
            - /scripts/cleanup.sh
          volumeMounts:
            - name: runner-data
              mountPath: /workspace
            - name: workspace-gc-script
              mountPath: /scripts
          env:
            # Same reasoning as docker-gc: `df -P /workspace` now reports the
            # node's 113.8 GiB root LV rather than a dedicated volume, so prune
            # ahead of kubelet's nodefs.available<10% eviction trigger instead of
            # at it. The workspace also lost emptyDir's sizeLimit by moving to
            # hostPath, which makes this loop its only size guard.
            - name: THRESHOLD_LOW
              value: "55"
            - name: THRESHOLD_MED
              value: "65"
            - name: THRESHOLD_HIGH
              value: "75"
            - name: THRESHOLD_CRITICAL
              value: "82"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"

      securityContext:
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups:
          - 1001
        runAsGroup: 1001
        runAsUser: 1001
      # hostPath volumes are node-local, so this pod must be pinned explicitly -
      # unlike ci-runner, which lands on prusik implicitly through its ZFS volume
      # topology and has no nodeSelector at all.
      nodeSelector:
        kubernetes.io/hostname: k8s-amd64-1
      volumes:
        # hostPath rather than PVCs: this node has no ZFS pool and there is
        # deliberately no local StorageClass (planning/k8s-amd64-1-node-addition.md,
        # TODO-6.3). `type: Directory`, never `DirectoryOrCreate` - the latter
        # silently creates a root-owned directory and the runner is uid 1001,
        # producing a permission error that reads like an app bug. Paths, owners
        # and modes live in metal/inventory/host_vars/k8s-amd64-1.yml because
        # kubelet applies no fsGroup management to hostPath volumes.
        #
        # The workspace moves off `emptyDir: {medium: Memory, sizeLimit: 8Gi}`:
        # an 8 GiB tmpfs would reserve 64% of this node's 12.53 Gi allocatable.
        # hostPath trades tmpfs speed for that RAM and survives pod restarts
        # (warm checkouts, persistent .pnpm-store) at the cost of stale data,
        # which workspace-gc prunes. It also loses `sizeLimit`, so the retuned
        # workspace-gc thresholds are its only size guard.
        - name: runner-data
          hostPath:
            path: /srv/ci-runner/workspace
            type: Directory
        - name: runner-config
          secret:
            secretName: runner-config-amd64
        - name: runner-registration
          configMap:
            name: runner-registration-amd64
        - name: docker-certs
          emptyDir: {}
        - name: docker-run
          emptyDir: {}
        - name: ci-runner-cache
          hostPath:
            path: /srv/ci-runner/cache
            type: Directory
        - name: ci-runner-docker
          hostPath:
            path: /srv/ci-runner/docker
            type: Directory
        - name: workspace-gc-script
          configMap:
            name: workspace-gc-script
      # No pod-level `resources` block. Limits are per-container and sum to
      # ~16.7Gi, which exceeds this node's 12.53Gi allocatable. The runner's
      # 12Gi limit prioritizes headroom for concurrent jobs over the strict
      # "pod dies before node" property. The legacy StatefulSet notes
      # pod-level resources do not work under kata.
      restartPolicy: Always
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
