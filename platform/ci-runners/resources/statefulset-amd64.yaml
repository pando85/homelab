apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ci-runner-amd64
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      # Distinct from `ci-runner` on purpose: two StatefulSets in one namespace
      # must not have overlapping selectors.
      app.kubernetes.io/name: ci-runner-amd64
  serviceName: ci-runner-amd64
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-runner-amd64
    spec:
      containers:
        - name: runner
          # renovate: sha256: datasource=docker
          image: ghcr.io/pando85/forgejo-runner-gc:rolling@sha256:4cb71736d81dbe71322babc2aa77ae13e3823e972722c35f1ad7f9c311a172f3
          command:
            - sh
            - -c
            - |
              retries=0
              max_retries=10
              while [ ! -S /sock/docker.sock ]; do
                echo "waiting for docker daemon... ($retries/$max_retries)"
                sleep 5
                retries=$((retries+1))
                if [ "$retries" -ge "$max_retries" ]; then
                  echo "docker daemon not available after $max_retries attempts, restarting container"
                  exit 1
                fi
              done

              # Identity comes from `server.connections` in registration.yaml
              # (uuid + token_url), so there is no `.runner` file to copy in.
              exec forgejo-runner -c /registration/registration.yaml daemon
          resources:
            requests:
              memory: "4Gi"
              cpu: "200m"
            limits:
              # 12Gi gives the runner headroom for moderate concurrent loads. At
              # capacity 2 the aggregate peak is bounded by concurrency as well as
              # by this limit, but jobs can still demand ~17.4GiB individually
              # (measured on prusik), so OOM kills remain possible. The pod's total
              # limits (12Gi + 4.5Gi + 192Mi = 16.7Gi) still exceed the node's
              # 12.53Gi allocatable, so the "pod dies before node" property is
              # gone - if every container peaks simultaneously, the node itself
              # will pressure. Accepted trade-off: more runner headroom at the
              # cost of losing the strict OOM boundary.
              memory: "12Gi"
              cpu: "5"
          securityContext:
            privileged: true
            runAsUser: 1001
          env:
            - name: DOCKER_HOST
              value: unix:///sock/docker.sock
            # Caps Rust/make parallelism so peak RSS stays under the 12Gi limit:
            # cargo defaults to one linker/rustc job per core, so per-job RSS
            # multiplies with the CPU count and blows the cgroup ceiling. Same
            # rationale as the prusik runner; these are the build-throughput knobs
            # to tune against this node's 12.53Gi allocatable.
            - name: CARGO_BUILD_JOBS
              value: "4"
            - name: MAKEFLAGS
              value: "-j4"
            # sccache S3 shared cache credentials and configuration.
            # These are exposed to host-mode jobs (which inherit from the runner process).
            # Docker-mode jobs get them from runner.envs in configmap-amd64.yaml via the Secret mount.
            # The Secret is mounted as a volume and individual keys are exposed as env vars.
            # sccache multilevel uses SCCACHE_BUCKET/ENDPOINT/REGION (not SCCACHE_S3_*).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sccache-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sccache-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: SCCACHE_BUCKET
              value: "sccache"
            - name: SCCACHE_ENDPOINT
              value: "s3.internal.grigri.cloud"
            - name: SCCACHE_REGION
              value: "auto"
            - name: SCCACHE_S3_USE_SSL
              value: "true"
          volumeMounts:
            - name: runner-data
              mountPath: /workspace
            - name: runner-registration
              mountPath: /registration
            - name: runner-config
              mountPath: /config
            - name: ci-runner-cache
              mountPath: /cache
            - name: docker-run
              mountPath: /sock
        - name: daemon
          # renovate: datasource=docker
          image: docker:29.9.2
          env:
            - name: TINI_SUBREAPER
              value: "1"
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            - name: DOCKER_HOST
              value: tcp://0.0.0.0:2376
          command:
            - sh
            - -c
            - |
              exec /usr/local/bin/docker-init -- sh -c '
                cleanup() {
                  echo "Received termination signal, stopping docker daemon..."
                  pkill -TERM dockerd 2>/dev/null || true
                  pkill -TERM containerd 2>/dev/null || true
                  sleep 2
                  exit 0
                }

                trap cleanup TERM INT

                dockerd-entrypoint.sh --host=unix:///sock/docker.sock --host=tcp://0.0.0.0:2376 2>&1 &
                  DOCKERD_PID=$!

                  while [ ! -S /sock/docker.sock ]; do
                    sleep 1
                  done

                  chgrp 1001 /sock/docker.sock
                  chmod 660 /sock/docker.sock

                  RUNNER_STARTED=false
                  while kill -0 $DOCKERD_PID 2>/dev/null; do
                    if pgrep forgejo-runner > /dev/null; then
                      RUNNER_STARTED=true
                    elif [ "$RUNNER_STARTED" = true ]; then
                      echo "forgejo-runner exited, stopping dind"
                      break
                    fi
                    sleep 5
                  done

                  cleanup
              '
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: ci-runner-docker
              mountPath: /var/lib/docker
            - name: runner-data
              mountPath: /workspace
            - name: ci-runner-cache
              mountPath: /cache
            - name: docker-run
              mountPath: /sock
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              # `docker`-label jobs are sibling containers created by dockerd, so
              # they land in THIS container's cgroup - this limit bounds them, not
              # the runner's. Under-sizing it would silently cap docker jobs below
              # the runner's own budget.
              memory: "4608Mi"
              cpu: "3"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - test -S /sock/docker.sock
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep dockerd >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -S /sock/docker.sock
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "pkill -TERM dockerd 2>/dev/null || true; sleep 2"
        - name: docker-gc
          # renovate: datasource=docker
          image: docker:29.9.2
          env:
            - name: HOME
              value: /tmp
            - name: DOCKER_HOST
              value: unix:///sock/docker.sock
            # `df -P /var/lib/docker` measures the node's 113.8 GiB root
            # filesystem, shared with k3s itself, so this loop is the only thing
            # keeping CI below kubelet's DiskPressure eviction line
            # (host_vars/k8s-amd64-1.yml `nodefs.available`). DinD is the
            # dominant consumer: calypso builds leave ~7 GiB images per commit
            # that no container references after the push.
            #
            # Retention is NOT age-based above MED: `docker image prune --filter
            # until=` compares against the image's *creation* time, so freshly
            # built images are always "too young" exactly when they are what
            # fills the disk (2026-11-01: the 6h tier reclaimed 0 B at 89% and the
            # node evicted every pod 1 minute later). HIGH removes every image no
            # container uses; the cost is re-pulling base images.
            #
            # 120s because a CI burst grew usage ~4.5 GiB per 10 minutes, i.e.
            # 600s could cross a whole tier unobserved.
            - name: CHECK_INTERVAL
              value: "120"
            - name: THRESHOLD_LOW
              value: "60"
            - name: THRESHOLD_MED
              value: "70"
            - name: THRESHOLD_HIGH
              value: "78"
          command:
            - sh
            - -c
            - |
              CHECK_INTERVAL="${CHECK_INTERVAL:-120}"
              THRESHOLD_LOW="${THRESHOLD_LOW:-60}"
              THRESHOLD_MED="${THRESHOLD_MED:-70}"
              THRESHOLD_HIGH="${THRESHOLD_HIGH:-78}"
              runner_started=false

              cleanup() {
                exit 0
              }

              trap cleanup TERM INT

              get_disk_usage() {
                df -P /var/lib/docker 2>/dev/null | awk 'NR==2 {print $5}' | tr -d '%' || echo 0
              }

              while true; do
                if pgrep forgejo-runner >/dev/null; then
                  runner_started=true
                elif [ "$runner_started" = true ]; then
                  echo "forgejo-runner exited, stopping docker-gc"
                  exit 0
                fi

                until docker info >/dev/null 2>&1; do
                  if [ "$runner_started" = true ] && ! pgrep forgejo-runner >/dev/null; then
                    echo "forgejo-runner exited, stopping docker-gc"
                    exit 0
                  fi

                  echo "waiting for docker daemon..."
                  sleep 10
                done

                usage=$(get_disk_usage)
                echo "docker disk usage: ${usage}%"

                if [ "$usage" -ge "$THRESHOLD_LOW" ]; then
                  if [ "$usage" -ge "$THRESHOLD_HIGH" ]; then
                    # In-use images, containers and volumes are protected by
                    # dockerd itself; everything else goes.
                    echo "high disk usage (${usage}%), pruning all unused images, build cache and volumes"
                    docker container prune -f || true
                    docker image prune -af || true
                    docker builder prune -af || true
                    docker volume prune -af || true
                  elif [ "$usage" -ge "$THRESHOLD_MED" ]; then
                    echo "medium disk usage (${usage}%), pruning build cache and unused images (24h retention)"
                    docker container prune -f || true
                    docker image prune -af --filter "until=24h" || true
                    docker builder prune -af --filter "until=24h" || true
                  else
                    echo "low disk usage (${usage}%), pruning dangling images and containers"
                    docker image prune -f || true
                    docker container prune -f || true
                  fi

                  new_usage=$(get_disk_usage)
                  echo "cleanup complete, new usage: ${new_usage}%"
                else
                  echo "disk usage below threshold (${usage}%), skipping cleanup"
                fi

                echo "sleeping for ${CHECK_INTERVAL}s"
                slept_seconds=0
                while [ "$slept_seconds" -lt "$CHECK_INTERVAL" ]; do
                  if ! pgrep forgejo-runner >/dev/null; then
                    echo "forgejo-runner exited, stopping docker-gc"
                    exit 0
                  fi

                  sleep 10
                  slept_seconds=$((slept_seconds + 10))
                done
              done
          volumeMounts:
            - name: docker-run
              mountPath: /sock
            - name: ci-runner-docker
              mountPath: /var/lib/docker
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      securityContext:
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups:
          - 1001
        runAsGroup: 1001
        runAsUser: 1001
      # CI is expendable batch work. It used to be high-priority, which meant the
      # runner was deliberately protected from eviction while the control plane was
      # not - backwards for a workload that caused the outage. low-priority (value
      # -1000, preemptionPolicy: Never) puts it first in the eviction queue so the
      # runner dies instead of etcd/apiserver, and it never preempts anything itself.
      priorityClassName: low-priority
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ci"
          effect: "NoSchedule"
      # hostPath volumes are node-local, so this pod must be pinned explicitly -
      # unlike ci-runner, which lands on prusik implicitly through its ZFS volume
      # topology and has no nodeSelector at all.
      nodeSelector:
        kubernetes.io/hostname: k8s-amd64-1
      volumes:
        # hostPath rather than PVCs: this node has no ZFS pool and there is
        # deliberately no local StorageClass (planning/k8s-amd64-1-node-addition.md,
        # TODO-6.3). `type: Directory`, never `DirectoryOrCreate` - the latter
        # silently creates a root-owned directory and the runner is uid 1001,
        # producing a permission error that reads like an app bug. Paths, owners
        # and modes live in metal/inventory/host_vars/k8s-amd64-1.yml because
        # kubelet applies no fsGroup management to hostPath volumes.
        #
        # The workspace moves off `emptyDir: {medium: Memory, sizeLimit: 8Gi}`:
        # an 8 GiB tmpfs would reserve 64% of this node's 12.53 Gi allocatable.
        # hostPath trades tmpfs speed for RAM and survives pod restarts
        # (warm checkouts, persistent .pnpm-store). The runner's native
        # workspace GC removes abandoned host scratch directories only when
        # idle and older than 24h; unlike the old workspace-gc sidecar this
        # provides no disk-pressure size guard. Monitor nodefs usage separately.
        - name: runner-data
          hostPath:
            path: /srv/ci-runner/workspace
            type: Directory
        - name: runner-config
          secret:
            secretName: runner-config-amd64
        - name: runner-registration
          configMap:
            name: runner-registration-amd64
        - name: docker-certs
          emptyDir: {}
        - name: docker-run
          emptyDir: {}
        - name: ci-runner-cache
          hostPath:
            path: /srv/ci-runner/cache
            type: Directory
        - name: ci-runner-docker
          hostPath:
            path: /srv/ci-runner/docker
            type: Directory
      # No pod-level `resources` block. Limits are per-container and sum to
      # ~16.7Gi, which exceeds this node's 12.53Gi allocatable. The runner's
      # 12Gi limit prioritizes headroom for concurrent jobs over the strict
      # "pod dies before node" property. The legacy StatefulSet notes
      # pod-level resources do not work under kata.
      restartPolicy: Always
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
