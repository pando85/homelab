apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ci-runner
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-runner
  serviceName: ci-runner
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-runner
    spec:
      # /workspace and /cache are subPath mounts of the ci-runner-data PVC. A
      # freshly provisioned ZFS dataset mounts root:root 0755, and kubelet
      # creates missing subPath dirs root-owned too - it applies no fsGroup
      # ownership to them. fsGroup was deliberately dropped from this pod (see
      # docs/troubleshooting/openebs-zfspv-slow-startup-fsgroup.md: the
      # recursive chown made startup take minutes), so nothing else would give
      # the uid-1001 runner write access and every host-mode job died with
      # `mkdir /workspace/<hash>: permission denied`. Create and chown the two
      # subPaths once, from the volume root, before the main containers mount
      # them. `docker` is left root-owned on purpose: only the daemon container
      # (runAsUser: 0) uses it.
      initContainers:
        - name: fix-volume-ownership
          # renovate: datasource=docker
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              set -eu
              for d in workspace cache; do
                mkdir -p "/data/$d"
                chown 1001:1001 "/data/$d"
                chmod 0775 "/data/$d"
              done
              ls -land /data /data/workspace /data/cache
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: ci-runner-data
              mountPath: /data
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: runner
          # renovate: sha256: datasource=docker
          image: ghcr.io/pando85/forgejo-runner-gc:rolling@sha256:1ddb43499f4df3e89e484683e22dc40a8e7521ea10b2b2c0615487d06d7c2b83
          command:
            - sh
            - -c
            - |
              # One-shot removal of the legacy single-daemon sccache directory. Unused
              # since 2026-11-06, when the Calypso sccache action moved to leased slots
              # under /cache/sccache-slots (nothing in it was modified after that date on
              # either runner; the owner approved deleting it). Idempotent: a no-op once
              # the directory is gone. The exact path is used on purpose, no globs:
              # /cache/sccache-slots, /cache/sccache-daemon and /cache/cargo* must stay.
              # REMOVE THIS BLOCK once both runners have rolled past 2026-11-10.
              if [ -d /cache/sccache ]; then
                legacy_kib=$(du -sk /cache/sccache 2>/dev/null | cut -f1)
                echo "removing legacy /cache/sccache (${legacy_kib:-unknown} KiB)"
                rm -rf /cache/sccache
                echo "legacy /cache/sccache removed"
              fi

              retries=0
              max_retries=10
              while [ ! -S /sock/docker.sock ]; do
                echo "waiting for docker daemon... ($retries/$max_retries)"
                sleep 5
                retries=$((retries+1))
                if [ "$retries" -ge "$max_retries" ]; then
                  echo "docker daemon not available after $max_retries attempts, restarting container"
                  exit 1
                fi
              done

              cp /config/.runner .
              exec forgejo-runner -c /registration/registration.yaml daemon
          resources:
            requests:
              memory: "4Gi"
              cpu: "100m"
            limits:
              # 12Gi sits above the ~10.7Gi peak RSS observed for a Rust build, so
              # normal jobs are not squeezed, but it is far below the node's headroom
              # and bounds the blast radius: the container now OOMs before the kernel
              # runs out of MemAvailable and starts thrashing the root NVMe that etcd
              # and /swapfile share. Tunable - raise it only alongside the parallelism
              # envs below, since cargo defaults to one job per core and the limit has
              # to stay above the resulting peak.
              memory: "12Gi"
              cpu: "14"
          securityContext:
            privileged: true
            runAsUser: 1001
          env:
            - name: DOCKER_HOST
              value: unix:///sock/docker.sock
            # Caps Rust/make parallelism so peak RSS stays under the 12Gi limit:
            # cargo defaults to one linker/rustc job per core, so on 14 CPUs a build
            # multiplies per-job RSS by an order of magnitude and hits the cgroup
            # ceiling (or the node) instead of finishing. These are the primary
            # build-throughput knobs to tune - trade jobs for memory. Host-mode jobs
            # inherit them from this process; docker-mode jobs get the same values
            # from `runner.envs` in resources/configmap.yaml (kept in sync).
            - name: CARGO_BUILD_JOBS
              value: "4"
            - name: MAKEFLAGS
              value: "-j4"
          volumeMounts:
            - name: ci-runner-data
              mountPath: /workspace
              subPath: workspace
            - name: runner-registration
              mountPath: /registration
            - name: runner-config
              mountPath: /config
            - name: ci-runner-data
              mountPath: /cache
              subPath: cache
            - name: docker-run
              mountPath: /sock
            - name: sccache-s3-credentials
              mountPath: /sccache-credentials
              readOnly: true
        - name: daemon
          # renovate: datasource=docker
          image: docker:29.9.3
          env:
            - name: TINI_SUBREAPER
              value: "1"
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            - name: DOCKER_HOST
              value: tcp://0.0.0.0:2376
          command:
            - sh
            - -c
            - |
              exec /usr/local/bin/docker-init -- sh -c '
                cleanup() {
                  echo "Received termination signal, stopping docker daemon..."
                  pkill -TERM dockerd 2>/dev/null || true
                  pkill -TERM containerd 2>/dev/null || true
                  sleep 2
                  exit 0
                }

                trap cleanup TERM INT

                dockerd-entrypoint.sh --host=unix:///sock/docker.sock --host=tcp://0.0.0.0:2376 2>&1 &
                  DOCKERD_PID=$!

                  while [ ! -S /sock/docker.sock ]; do
                    sleep 1
                  done

                  chgrp 1001 /sock/docker.sock
                  chmod 660 /sock/docker.sock

                  RUNNER_STARTED=false
                  while kill -0 $DOCKERD_PID 2>/dev/null; do
                    if pgrep forgejo-runner > /dev/null; then
                      RUNNER_STARTED=true
                    elif [ "$RUNNER_STARTED" = true ]; then
                      echo "forgejo-runner exited, stopping dind"
                      break
                    fi
                    sleep 5
                  done

                  cleanup
              '
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: ci-runner-data
              mountPath: /var/lib/docker
              subPath: docker
            - name: ci-runner-data
              mountPath: /workspace
              subPath: workspace
            - name: ci-runner-data
              mountPath: /cache
              subPath: cache
            - name: docker-run
              mountPath: /sock
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              # FOLLOW-UP: 8Gi is kept as-is for now because there is no usage data
              # for this container's cgroup. Docker-mode jobs run as sibling containers
              # under the runner's dockerd, so their memory is accounted in THIS
              # container's cgroup, not the runner's. Once per-container peak RSS is
              # measured, this is the next limit to cut - it is the second-largest
              # memory limit in the pod.
              memory: "8Gi"
              cpu: "4"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - test -S /sock/docker.sock
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep dockerd >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -S /sock/docker.sock
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "pkill -TERM dockerd 2>/dev/null || true; sleep 2"
        - name: docker-gc
          # renovate: datasource=docker
          image: docker:29.9.3
          env:
            - name: HOME
              value: /tmp
            - name: DOCKER_HOST
              value: unix:///sock/docker.sock
            #
            # Low/medium tiers run only while the runner is idle (see runner_busy
            # in the script). A prune racing an image pull made jobs fail with
            # `No such image` right after `docker pull` (2026-11-10, dockerd:
            # `lease does not exist`). A busy runner skips them with one log line
            # per interval. The emergency tier (THRESHOLD_HIGH) runs regardless.
          command:
            - sh
            - -c
            - |
              CHECK_INTERVAL="${CHECK_INTERVAL:-1800}"
              THRESHOLD_LOW="${THRESHOLD_LOW:-80}"
              THRESHOLD_MED="${THRESHOLD_MED:-85}"
              THRESHOLD_HIGH="${THRESHOLD_HIGH:-90}"
              THRESHOLD_CRITICAL="${THRESHOLD_CRITICAL:-95}"
              DOCKER_QUIET_SECONDS="${DOCKER_QUIET_SECONDS:-180}"
              DOCKER_STATE_DIR="${DOCKER_STATE_DIR:-/var/lib/docker/containerd/daemon}"
              runner_started=false
              gc_meta_mtime=0

              cleanup() {
                exit 0
              }

              trap cleanup TERM INT

              get_disk_usage() {
                df -P /var/lib/docker 2>/dev/null | awk 'NR==2 {print $5}' | tr -d '%' || echo 0
              }

              # Prints why the runner is busy and returns 0, or returns 1 when it is idle.
              # Idle means none of these hold:
              #  - forgejo-runner has a child process (a host-mode job step is running);
              #  - a task container exists (docker-mode job, after the pull);
              #  - an image pull is in flight: a blob is downloading (containerd content
              #    ingest dir not empty) or dockerd's metadata db (leases, images, snapshots,
              #    containers) was written within DOCKER_QUIET_SECONDS. That is the only signal
              #    for the pull and unpack phase of a container job: no container exists yet
              #    and the runner has no child process. A write by our own previous prune does
              #    not count (gc_meta_mtime).
              # Anything that cannot be read counts as busy: pruning during a pull is the
              # failure this guards against.
              runner_busy() {
                rpid=$(pgrep -o forgejo-runner 2>/dev/null)
                if [ -n "$rpid" ] && pgrep -P "$rpid" >/dev/null 2>&1; then
                  echo "job step running"
                  return 0
                fi

                if ! tasks=$(docker ps -q --filter name=FORGEJO-ACTIONS-TASK- 2>/dev/null); then
                  echo "cannot list containers"
                  return 0
                fi
                if [ -n "$tasks" ]; then
                  echo "task container running"
                  return 0
                fi

                if [ ! -d "$DOCKER_STATE_DIR/io.containerd.content.v1.content/ingest" ]; then
                  echo "cannot read containerd ingest dir"
                  return 0
                fi
                if [ -n "$(ls -A "$DOCKER_STATE_DIR/io.containerd.content.v1.content/ingest" 2>/dev/null)" ]; then
                  echo "image pull in progress"
                  return 0
                fi

                if ! meta_mtime=$(stat -c %Y "$DOCKER_STATE_DIR/io.containerd.metadata.v1.bolt/meta.db" 2>/dev/null); then
                  echo "cannot read containerd metadata db"
                  return 0
                fi
                if [ "$meta_mtime" != "$gc_meta_mtime" ]; then
                  meta_age=$(($(date +%s) - meta_mtime))
                  if [ "$meta_age" -lt "$DOCKER_QUIET_SECONDS" ]; then
                    echo "docker active ${meta_age}s ago"
                    return 0
                  fi
                fi

                return 1
              }

              # Remember the metadata db mtime after our own prune so that it is not
              # mistaken for job activity by the next check.
              note_gc_mtime() {
                gc_meta_mtime=$(stat -c %Y "$DOCKER_STATE_DIR/io.containerd.metadata.v1.bolt/meta.db" 2>/dev/null || echo 0)
              }

              while true; do
                if pgrep forgejo-runner >/dev/null; then
                  runner_started=true
                elif [ "$runner_started" = true ]; then
                  echo "forgejo-runner exited, stopping docker-gc"
                  exit 0
                fi

                until docker info >/dev/null 2>&1; do
                  if [ "$runner_started" = true ] && ! pgrep forgejo-runner >/dev/null; then
                    echo "forgejo-runner exited, stopping docker-gc"
                    exit 0
                  fi

                  echo "waiting for docker daemon..."
                  sleep 10
                done

                usage=$(get_disk_usage)
                echo "docker disk usage: ${usage}%"
                ran=false

                if [ "$usage" -ge "$THRESHOLD_LOW" ]; then
                  if [ "$usage" -ge "$THRESHOLD_CRITICAL" ]; then
                    # Emergency tiers (critical, high) run even while a job is active.
                    echo "critical disk usage (${usage}%), aggressive cleanup (6h retention)"
                    docker image prune -af --filter "until=6h" || true
                    docker builder prune -af --filter "until=6h" || true
                    docker container prune -f || true
                    ran=true
                  elif [ "$usage" -ge "$THRESHOLD_HIGH" ]; then
                    echo "high disk usage (${usage}%), pruning unused images (24h retention)"
                    docker image prune -af --filter "until=24h" || true
                    docker builder prune -af --filter "until=24h" || true
                    ran=true
                  elif busy_reason=$(runner_busy); then
                    echo "busy, skipping non-emergency cleanup (${busy_reason})"
                  elif [ "$usage" -ge "$THRESHOLD_MED" ]; then
                    echo "medium disk usage (${usage}%), pruning build cache (24h retention)"
                    docker builder prune -af --filter "until=24h" || true
                    ran=true
                  else
                    echo "low disk usage (${usage}%), pruning dangling images and containers"
                    docker image prune -f || true
                    docker container prune -f || true
                    ran=true
                  fi
                else
                  echo "disk usage below threshold (${usage}%), skipping cleanup"
                fi

                if [ "$ran" = true ]; then
                  new_usage=$(get_disk_usage)
                  note_gc_mtime
                  echo "cleanup complete, new usage: ${new_usage}%"
                fi

                echo "sleeping for ${CHECK_INTERVAL}s"
                slept_seconds=0
                while [ "$slept_seconds" -lt "$CHECK_INTERVAL" ]; do
                  if ! pgrep forgejo-runner >/dev/null; then
                    echo "forgejo-runner exited, stopping docker-gc"
                    exit 0
                  fi

                  sleep 10
                  slept_seconds=$((slept_seconds + 10))
                done
              done
          # Root, read-only mount: the idle check reads dockerd's containerd state
          # (content ingest dir, metadata db), which is root-only 0700. The volume
          # stays mounted readOnly and the container is not privileged.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: docker-run
              mountPath: /sock
            - name: ci-runner-data
              mountPath: /var/lib/docker
              subPath: docker
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      securityContext:
        # No fsGroup: on openebs-zfspv it triggers a recursive chown of the whole
        # volume at every mount and made startup take minutes
        # (docs/troubleshooting/openebs-zfspv-slow-startup-fsgroup.md). Ownership
        # of the subPaths is handled by the fix-volume-ownership initContainer
        # instead. fsGroupChangePolicy is meaningless without fsGroup, so it is
        # not set. supplementalGroups only adds gid 1001 to the process; it
        # changes no file ownership.
        supplementalGroups:
          - 1001
        runAsGroup: 1001
        runAsUser: 1001
      # CI is expendable batch work on the control-plane node. low-priority (value
      # -1000, preemptionPolicy: Never) puts this pod at the FRONT of the eviction
      # queue, so a memory burst kills the runner instead of the apiserver/etcd that
      # had to be restarted after the last incident. Never preempts anything itself.
      priorityClassName: low-priority
      volumes:
        - name: ci-runner-data
          persistentVolumeClaim:
            claimName: ci-runner-data
        - name: runner-config
          secret:
            secretName: runner-config
        - name: runner-registration
          configMap:
            name: runner-registration
        - name: docker-certs
          emptyDir: {}
        - name: docker-run
          emptyDir: {}
        - name: sccache-s3-credentials
          secret:
            secretName: sccache-s3-credentials
            # uid 1001 (the runner) must read /sccache-credentials/credentials. These pods
            # deliberately have no fsGroup (ZFS startup), so 0444 (world-readable inside the
            # pod) is what makes it readable. Content is a single scoped sccache-ci credential,
            # not backup/admin material, so pod-local readability is acceptable.
            defaultMode: 0444
      # not working with kata runtime
      # resources:
      #   requests:
      #     memory: "100Mi"
      #     cpu: "100m"
      #   limits:
      #     memory: "15Gi"
      #     cpu: "8"
      restartPolicy: Always
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
