---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-config-amd64
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: runner-config-amd64
  # No template: the only datum is the runner token, which the daemon reads from
  # the mounted file via `token_url: file:/config/token` in registration.yaml.
  # Unlike the legacy `runner-config` secret there is no `.runner` file, so no
  # runner id or uuid needs to live in git.
  data:
    - secretKey: token
      remoteRef:
        key: /git/runner-k8s-amd64-1
        property: token
