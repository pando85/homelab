---
# Dedicated ExternalSecret for sccache S3 credentials.
# Maps ONLY the sccache-ci credential from Vault, not the shared minio-users secret.
# This avoids exposing velero/kaniop/root credentials to the runner namespace.
# The runner StatefulSet mounts this Secret and exposes the keys as env vars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sccache-s3-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: sccache-s3-credentials
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "sccache-ci"
        AWS_SECRET_ACCESS_KEY: "{{ .sccacheCiPassword }}"
  data:
    - secretKey: sccacheCiPassword
      remoteRef:
        key: /minio/users
        property: sccacheCiPassword
