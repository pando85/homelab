---
# Dedicated ExternalSecret for sccache S3 credentials (CI).
#
# Produces a single Secret key `credentials` containing a standard AWS shared
# credentials INI file, scoped ONLY to the sccache-ci user. It maps only the
# `sccacheCiPassword` property from Vault /minio/users - NOT rootUser/rootPassword/
# veleroPassword/kaniopPassword - so mounting this Secret in the runner namespace
# leaks no backup or admin credentials.
#
# The runner StatefulSet mounts this Secret as a file at /sccache-credentials/credentials
# (defaultMode 0444, world-readable inside the pod so uid 1001 reads it without fsGroup,
# which is deliberately absent on these pods for ZFS startup reasons).
#
# Contract with the Calypso sccache-setup action (host-mode CI):
#   - Do NOT set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SHARED_CREDENTIALS_FILE
#     runner-wide. The action exports AWS_SHARED_CREDENTIALS_FILE=/sccache-credentials/credentials
#     only in the sccache daemon/wrapper invocation context, so unrelated AWS tooling in a
#     job never picks up the cache credential.
#   - The shared sccache daemon started by a cache-mode=disk-s3 job inherits that scoped env at
#     startup; later host-mode jobs reuse it (accepted same-trust-domain model, phase 3).
#   - Bucket/endpoint/region/path-style come from the action's own inputs, not runner env, so a
#     default (cache-mode=disk) job is never accidentally pointed at S3 by a global SCCACHE_BUCKET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sccache-s3-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: sccache-s3-credentials
    template:
      engineVersion: v2
      data:
        credentials: |
          [default]
          aws_access_key_id=sccache-ci
          aws_secret_access_key={{ .sccacheCiPassword }}
  data:
    - secretKey: sccacheCiPassword
      remoteRef:
        key: /minio/users
        property: sccacheCiPassword
