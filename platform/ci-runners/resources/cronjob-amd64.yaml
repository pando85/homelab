apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-runner-amd64-cache-cleanup
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          # Must land on the same node: /cache is a hostPath there, not a PVC.
          nodeSelector:
            kubernetes.io/hostname: k8s-amd64-1
          containers:
            - name: cleanup
              # renovate: datasource=docker
              image: busybox:1.38.0
              command: ["sh", "-c", "find /cache -type f -mtime +7 -print -delete"]
              volumeMounts:
                - name: ci-runner-cache
                  mountPath: /cache
          volumes:
            - name: ci-runner-cache
              hostPath:
                path: /srv/ci-runner/cache
                type: Directory
          restartPolicy: OnFailure
