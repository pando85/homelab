---
# Envoy Gateway route. The chart-native `forgejo.httpRoute` is not used: it would also rewrite
# `server.DOMAIN`, restarting Forgejo. The SSH TCPRoute (`forgejo.tcpRoute`) is chart-native and
# unchanged. Per-route timeouts and body size: see backend-traffic-policy.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-forgejo
  annotations:
    # the target (grigri.cloud) comes from the external Gateway
    external-dns.kubernetes.io/enabled: "true"
spec:
  hostnames:
    - git.grigri.cloud
  parentRefs:
    - name: external
      namespace: envoy-gateway
      sectionName: https-grigri-cloud
  rules:
    - backendRefs:
        - name: git-forgejo-http
          port: 3000
