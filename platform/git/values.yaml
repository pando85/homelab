forgejo:
  image:
    rootless: true
    # renovate: datasource=docker depName=code.forgejo.org/forgejo/forgejo
    tag: "16.0.7"
  labels:
    backup/retain: quaterly
  strategy:
    type: "Recreate"

  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"

  # SSH (29518) through the Envoy Gateway external Gateway (192.168.193.14), next to the nginx tcp
  # passthrough, until the external switch. Renders TCPRoute git-forgejo-ssh -> git-forgejo-ssh:22.
  tcpRoute:
    enabled: true
    parentRefs:
      - name: external
        namespace: envoy-gateway
        sectionName: tcp-forgejo-ssh

  replicaCount: 1

  resources:
    limits:
      memory: 8Gi
    requests:
      cpu: 200m
      memory: 1Gi
  deployment:
    annotations:
      reloader.stakater.com/auto: "true"

  persistence:
    mount: true
    create: false
    claimName: data-gitea-zfs-0

  gitea:
    admin:
      existingSecret: gitea-admin

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring

    config:
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        OPENID_CONNECT_SCOPES: email
      server:
        LANDING_PAGE: explore
        DOMAIN: git.grigri.cloud
        ROOT_URL: https://git.grigri.cloud
        SSH_DOMAIN: git.grigri.cloud
        SSH_PORT: 29518
      database:
        DB_TYPE: postgres
        HOST: gitea-postgres:5432
        NAME: gitea
        SSL_MODE: require
        MAX_OPEN_CONNS: 20
        CONN_MAX_LIFE_TIME: 300s
        LOG_SQL: false
      service:
        DISABLE_REGISTRATION: true
        ENABLE_NOTIFY_MAIL: true
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        ENABLE_INTERNAL_SIGNIN: true
        SHOW_REGISTRATION_BUTTON: false
      webhook:
        ALLOWED_HOST_LIST: '*'
      session:
        PROVIDER: db
        PROVIDER_CONFIG: ""
        SESSION_LIFE_TIME: 2592000
        GC_INTERVAL_TIME: 86400
      security:
        LOGIN_REMEMBER_DAYS: 30
      cache:
        ADAPTER: redis
      queue:
        TYPE: redis
      actions:
        ENABLED: true
      log:
        LEVEL: info
      cron:
        NOTICE_ON_SUCCESS: false
      cron.delete_old_actions:
        ENABLED: true
        RUN_AT_START: false
        SCHEDULE: "@midnight"
        OLDER_THAN: 168h
      mailer:
        ENABLED: true
        SMTP_PORT: 587
      migrations:
        ALLOWED_DOMAINS: "*"

    additionalConfigSources:
      - secret:
          secretName: gitea-app-ini-database
      - secret:
          secretName: gitea-mailer-config
      - secret:
          secretName: gitea-redis

    oauth:
      - name: kanidm
        provider: openidConnect
        existingSecret: oidc-client
        autoDiscoverUrl: https://idm.grigri.cloud/oauth2/openid/git/.well-known/openid-configuration

  postgresql-ha:
    enabled: false

  postgresql:
    enabled: false

  valkey-cluster:
    enabled: false

  valkey:
    enabled: false

app-template:
  global:
    fullnameOverride: redis
    createDefaultServiceAccount: false
  controllers:
    redis:
      containers:
        redis:
          image:
            repository: redis
            tag: 8.10.3

          command:
            - sh
          args:
            - -c
            - >-
              redis-server --requirepass $REDIS_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

          env:
            REDIS_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: password

  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: prusik

    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - forgejo
            topologyKey: kubernetes.io/hostname

  service:
    redis:
      controller: redis
      ports:
        redis:
          enabled: true
          port: 6379
