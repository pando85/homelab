# Envoy Gateway route for the Vault UI/API. Internal route: the external-dns annotation publishes
# its name (the Gateway address).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  annotations:
    external-dns.kubernetes.io/enabled: "true"
spec:
  hostnames:
    - vault.internal.grigri.cloud
  parentRefs:
    - name: internal
      namespace: envoy-gateway
      sectionName: https-internal-grigri-cloud
  rules:
    - backendRefs:
        - name: vault
          port: 8200
---
# Vault listens on TLS with an operator-generated certificate (SANs: vault, vault.vault,
# vault.vault.svc.cluster.local), validated
# against the operator CA (`ca.crt` of the `vault-tls` Secret, rotated by the operator).
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: vault
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: vault
      sectionName: api-port
  validation:
    hostname: vault.vault.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: vault-tls
