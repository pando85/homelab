# Envoy Gateway routes (ingress-nginx migration), alongside the chart Ingresses, which stay until
# the switch (the chart has no route support). S3 API and console, same Services and ports.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio
spec:
  hostnames:
    - s3.internal.grigri.cloud
  parentRefs:
    - name: internal
      namespace: envoy-gateway
      sectionName: https-internal-grigri-cloud
  rules:
    - backendRefs:
        - name: minio
          port: 9000
---
# nginx `proxy-read-timeout` / `proxy-send-timeout` 3601 are idle timeouts: the Envoy equivalent is
# `streamIdleTimeout` (never `timeouts.request`, a total limit, so uploads and downloads of any
# size keep working while data moves). `mergeType: StrategicMerge` keeps the gateway defaults.
# No compression on S3 hosts (it rewrites the signed Accept-Encoding and breaks SigV4); no body
# limit and no request buffering are the Envoy defaults (nginx `proxy-body-size: 0`, buffering off).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: minio-timeouts
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: minio
  mergeType: StrategicMerge
  timeout:
    http:
      streamIdleTimeout: 3601s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
spec:
  hostnames:
    - mc-s3.internal.grigri.cloud
  parentRefs:
    - name: internal
      namespace: envoy-gateway
      sectionName: https-internal-grigri-cloud
  rules:
    - backendRefs:
        - name: minio-console
          port: 9001
