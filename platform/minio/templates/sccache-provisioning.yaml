{{- /*
Deterministic, self-verifying provisioning for the sccache shared-cache bucket.

Why a dedicated hook Job instead of the MinIO chart's `buckets:` + `customCommands:`:
  - The chart runs the make-bucket / make-user / custom-command containers in PARALLEL in one Job,
    so quota/lifecycle work can race ahead of bucket creation.
  - The chart's custom-command script runs under `set -e` with no stdin, so `mc ilm rule import`
    (the only idempotent form) cannot be used there.

Hook style: HELM annotations only, no `argocd.argoproj.io/hook`. Argo CD ignores *all* Helm hooks
as soon as any Argo CD hook is defined (docs/user-guide/helm.md), and the chart's own post-job
(policies/users/buckets) is a Helm hook - adding an Argo hook here would have silently stopped the
chart's users/policies from reconciling. Argo maps Helm post-install/post-upgrade onto its own
PostSync phase and reads helm.sh/hook-weight for ordering (gitops-engine pkg/sync/hook/helm/weight.go,
default 0), so weight "1" runs this Job after the chart's post-job (weight 0).

Desired state it converges to on every sync (all commands verified against a server built from the
same pinned image, RELEASE.2026-10-26T00-00-00Z):
  1. bucket exists          mc mb --ignore-existing                       -> idempotent
  2. hard quota (bytes)     mc quota set --size <SCCACHE_QUOTA_BYTES>b   -> rejects writes past the cap
  3. exactly one lifecycle  mc ilm rule import (replaces the whole config) -> 1 rule, <RULE_ID>, <DAYS>

The quota, expiry, rule ID, endpoint and bucket name are configured in templates/sccache-config.yaml
(currently 100 GiB = 107,374,182,400 bytes and a 14-day expiry), not in this script.
  4. every step is read back and the Job FAILS if the applied state differs, so a green sync means
     the cap and the rule are actually in place (no `|| true` anywhere in this script).

Scope: every mc target below is hard-coded to `myminio/sccache`. The velero and kaniop buckets are
owned by the chart and are never referenced, listed or cleared here.

Credentials: read from the `minio-users` Secret (keys rootUser / rootPassword) and handed to mc as
the MC_HOST_myminio environment variable, so they never appear in a command line, a config file on
disk, or a log line. Anything this script echoes goes through safe(), which withholds output that
contains either credential.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-sccache-provisioning
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: sccache-provisioning
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    # before-hook-creation only (no hook-succeeded): a successful Job stays visible so its
    # assertion output can be read as acceptance evidence instead of being deleted the moment it
    # succeeds. ttlSecondsAfterFinished below still bounds how long it lingers, and the log is
    # archived in Loki either way.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Confirmed root cause of the first failed run (Loki, 10 attempts): "cat: /config/rootUser:
  # Permission denied" - the Secret mounted 0400 root:root was unreadable by uid 1000 because the
  # pod had no fsGroup. Those attempts burned the window in backoff waits, which is what surfaced
  # as "Job was active longer than specified deadline". Fixed below with defaultMode 0440 +
  # fsGroup 1000.
  #
  # The ceiling must stay BELOW argocd-cmd-params-cm controller.sync.timeout.seconds (600), or a
  # slow Job gets reported as "Operation terminated, triggered by controller sync timeout" instead
  # of a clean Job failure with readable logs. Budget: image pull + the bounded API wait
  # (60 x 3s = 180s) + six mc calls, so 420s is generous without racing the controller.
  activeDeadlineSeconds: 420
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: sccache-provisioning
    spec:
      restartPolicy: Never
      # This Job talks to MinIO with credentials from a Secret; it has no use for the Kubernetes
      # API, so no service account token is mounted.
      automountServiceAccountToken: false
      # Secret volumes land as root-owned with the given mode; fsGroup makes the group readable,
      # which is what lets this nonroot container read /config/rootUser and /config/rootPassword.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: provision
          # Reuses the already-pulled server image: it ships mc (symlinked to mcli).
          # quay.io/minio/mc returns 401 after MinIO removed its quay images (2026-11).
          image: "{{ .Values.minio.mcImage.repository }}:{{ .Values.minio.mcImage.tag }}"
          imagePullPolicy: {{ .Values.minio.mcImage.pullPolicy | default "IfNotPresent" }}
          # Desired state comes from templates/sccache-config.yaml, not from constants in this
          # script: the enforced cap and the documented cap cannot drift, and changing that
          # ConfigMap is a real diff that makes Argo CD run the hook again (hook-only edits are
          # excluded from sync comparison and would never converge). Read through envFrom rather
          # than a mounted file because this image has no parser to read a file with.
          envFrom:
            - configMapRef:
                name: minio-sccache-desired
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # Desired state comes from the minio-sccache-desired ConfigMap (envFrom). The ${VAR:?}
              # form aborts with a clear message if a key is missing, so a mis-edited ConfigMap fails
              # the Job loudly instead of provisioning something unintended.
              ENDPOINT="${SCCACHE_S3_ENDPOINT:?ConfigMap key SCCACHE_S3_ENDPOINT is missing}"
              PORT="${SCCACHE_S3_PORT:?ConfigMap key SCCACHE_S3_PORT is missing}"
              BUCKET="${SCCACHE_S3_BUCKET:?ConfigMap key SCCACHE_S3_BUCKET is missing}"
              QUOTA_BYTES="${SCCACHE_QUOTA_BYTES:?ConfigMap key SCCACHE_QUOTA_BYTES is missing}"
              EXPIRY_DAYS="${SCCACHE_EXPIRY_DAYS:?ConfigMap key SCCACHE_EXPIRY_DAYS is missing}"
              RULE_ID="${SCCACHE_RULE_ID:?ConfigMap key SCCACHE_RULE_ID is missing}"
              TARGET="myminio/${BUCKET}"
              # Set early so the helpers below are safe to call before the Secret is read.
              ACCESS=""
              SECRET=""

              # Never echo anything that contains a credential.
              needs_redaction() {
                if [ -n "$ACCESS" ]; then
                  case "$1" in *"$ACCESS"*) return 0 ;; esac
                fi
                if [ -n "$SECRET" ]; then
                  case "$1" in *"$SECRET"*) return 0 ;; esac
                fi
                return 1
              }
              safe() {
                if needs_redaction "$1"; then
                  printf '%s\n' "[withheld: output contained credential material]"
                else
                  printf '%s\n' "$1"
                fi
              }
              fail() {
                printf 'sccache-provisioning: FAILED: %s\n' "$(safe "$*")" >&2
                exit 1
              }
              # Strip whitespace so assertions match compact AND pretty-printed JSON: this mc build
              # prints compact today, but the check must not break if a release changes the format.
              # Default IFS splits on space/tab/newline; set -f stops globbing of the split words.
              normalize() {
                _nold="$IFS"
                set -f
                set -- $1
                IFS=''
                _nres="$*"
                IFS="$_nold"
                set +f
                printf '%s' "$_nres"
              }
              # Count occurrences of a literal needle (POSIX shell only: this image has bash as
              # /bin/sh but no grep/sed/awk/jq/python).
              count_of() {
                _cneedle="$1"
                _ctext="$2"
                _cn=0
                while true; do
                  case "$_ctext" in
                    *"$_cneedle"*) _cn=$((_cn+1)); _ctext="${_ctext#*"$_cneedle"}" ;;
                    *) break ;;
                  esac
                done
                printf '%s' "$_cn"
              }

              # Validate the desired state before touching the object store.
              case "$QUOTA_BYTES" in '' | *[!0-9]*) fail "SCCACHE_QUOTA_BYTES must be a plain byte count, got: $QUOTA_BYTES" ;; esac
              case "$EXPIRY_DAYS" in '' | *[!0-9]*) fail "SCCACHE_EXPIRY_DAYS must be a whole number of days, got: $EXPIRY_DAYS" ;; esac
              # Blast-radius guard: this Job exists to manage the disposable cache bucket. The
              # backup bucket and the application buckets belong to the MinIO chart.
              case "$BUCKET" in
                velero | kaniop) fail "refusing to manage '$BUCKET': backup/application buckets belong to the MinIO chart" ;;
              esac

              # mc's default config dir in this image is /tmp/.mc; use a directory we own inside the
              # /tmp emptyDir instead of depending on that default (and on HOME being writable).
              export MC_CONFIG_DIR=/tmp/mc
              mkdir -p "$MC_CONFIG_DIR"
              chmod 700 "$MC_CONFIG_DIR"

              [ -r /config/rootUser ] || fail "/config/rootUser not readable (needs fsGroup 1000 + mode 0440)"
              [ -r /config/rootPassword ] || fail "/config/rootPassword not readable (needs fsGroup 1000 + mode 0440)"
              ACCESS="$(cat /config/rootUser)"
              SECRET="$(cat /config/rootPassword)"
              [ -n "$ACCESS" ] || fail "/config/rootUser is empty"
              [ -n "$SECRET" ] || fail "/config/rootPassword is empty"
              # Credentials travel as env (this container only), never as mc argv. MC_HOST_<alias> is
              # supported by this mc build; verified to keep '/', '@', '%', '#', '?', '+', '=', '&'
              # literal (it does not percent-decode the userinfo).
              export MC_HOST_myminio="http://${ACCESS}:${SECRET}@${ENDPOINT}:${PORT}"
              echo "sccache-provisioning: target=${TARGET} endpoint=http://${ENDPOINT}:${PORT} (credentials via env, never logged)"

              # Wait for the MinIO API - this post-hook can start while the server pod rolls - but
              # stop immediately on a credential error: signature/access-key failures are permanent
              # and retrying them would burn the deadline (60 x 3s of waiting already looks like a hang).
              i=0
              err=""
              while true; do
                if err="$(mc mb --ignore-existing "$TARGET" 2>&1)"; then
                  echo "sccache-provisioning: bucket ensured"
                  break
                fi
                case "$err" in
                  *ignature* | *AccessKey* | *access*key*) fail "credential rejected by MinIO (not retryable): $(safe "$err")" ;;
                esac
                i=$((i+1))
                [ "$i" -le 60 ] || fail "MinIO API not reachable at ${ENDPOINT}:${PORT} after $i tries: $(safe "$err")"
                sleep 3
              done

              # Hard quota. `mc admin bucket quota` is deprecated and errors in this mc build
              # ("Please use 'mcli quota' instead"); `mc quota set --size` is the supported form.
              # The cap is passed as an explicit byte count with the "b" suffix (mc accepts it), so
              # no unit parser can turn "100gb" (decimal 100,000,000,000) into a surprise: 100 GiB is
              # exactly 107,374,182,400 bytes and that is what the assertion below requires.
              mc quota set "$TARGET" --size "${QUOTA_BYTES}b" >/dev/null || fail "quota set failed"
              Q="$(normalize "$(mc quota info "$TARGET" --json 2>&1)")"
              # The number is a JSON *number*, so it is followed by , or }. Matching that delimiter
              # is what stops a prefix (10737418240 vs 107374182400) from passing. Needles are built
              # as variables so the patterns stay literal - hand-spliced quotes here are error-prone.
              q_needle='"quota":'"$QUOTA_BYTES"
              q_a="${q_needle},"
              q_b="${q_needle}}"
              # NOTE on shell patterns: `*"$x")` means "ends with $x", NOT "contains $x" - the
              # trailing `*` below is load-bearing (tested: omitting it rejects a valid response).
              case "$Q" in
                *"$q_a"* | *"$q_b"*) ;;
                *) fail "quota is not ${QUOTA_BYTES} bytes; got: $(safe "$Q")" ;;
              esac
              t_hard='"type":"hard"'
              case "$Q" in
                *"$t_hard"*) ;;
                *) fail "quota type is not hard (writes would not be rejected); got: $(safe "$Q")" ;;
              esac
              echo "sccache-provisioning: quota verified hard ${QUOTA_BYTES} bytes on ${TARGET}"

              # Lifecycle: import replaces the entire configuration, so re-runs converge on exactly
              # one rule with a stable ID rather than accumulating duplicates, and an out-of-band
              # extra rule is removed by the next sync.
              printf '%s' '{"Rules":[{"ID":"'"$RULE_ID"'","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":'"$EXPIRY_DAYS"'}}]}' >/tmp/lifecycle.json
              mc ilm rule import "$TARGET" </tmp/lifecycle.json >/dev/null || fail "lifecycle import failed"
              L="$(normalize "$(mc ilm rule export "$TARGET" 2>&1)")"
              id_needle='"ID":"'"$RULE_ID"'"'
              case "$L" in
                *"$id_needle"*) ;;
                *) fail "lifecycle rule ${RULE_ID} missing; got: $(safe "$L")" ;;
              esac
              d_needle='"Days":'"$EXPIRY_DAYS"
              d_a="${d_needle},"
              d_b="${d_needle}}"
              case "$L" in
                *"$d_a"* | *"$d_b"*) ;;
                *) fail "lifecycle expiry is not ${EXPIRY_DAYS} days; got: $(safe "$L")" ;;
              esac
              r_needle='"ID":'
              n="$(count_of "$r_needle" "$L")"
              [ "$n" -eq 1 ] || fail "expected exactly 1 lifecycle rule, found $n; got: $(safe "$L")"
              echo "sccache-provisioning: lifecycle verified (${n} rule, ${RULE_ID}, ${EXPIRY_DAYS} days)"
              echo "sccache bucket provisioned: bucket=${BUCKET} quota=${QUOTA_BYTES}b lifecycle=${EXPIRY_DAYS}d rule=${RULE_ID}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: minio-users
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: minio-users
          secret:
            secretName: minio-users
            # 0400 root-owned is unreadable by uid 1000 (confirmed via Loki: 10x Permission denied).
            # 0440 + pod fsGroup 1000 is the minimal fix: group-readable, world-unreadable.
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
