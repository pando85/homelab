minio:
  image:
    # renovate: datasource=docker depName=pgsty/silo versioning=regex:^RELEASE\.(?<major>\d{4})-(?<minor>\d{2})-(?<patch>\d{2})T(?<build>\d{2})-(?<revision>\d{2})-(?<patch2>\d{2})Z$
    repository: pgsty/silo
    tag: RELEASE.2026-10-26T00-00-00Z

  # mc (MinIO client) for post-install hooks (bucket/policy/user provisioning).
  # quay.io/minio/mc images were removed from quay.io (401 UNAUTHORIZED as of 2026-11).
  # The pgsty/silo server image includes mc (symlinked to mcli), so reuse it.
  mcImage:
    repository: pgsty/silo
    tag: RELEASE.2026-10-26T00-00-00Z

  mode: standalone

  drivesPerNode: 1
  # Number of MinIO containers running
  replicas: 1

  existingSecret: minio-users

  persistence:
    enabled: true
    existingClaim: minio-backup

  ingress:
    enabled: true
    ingressClassName: nginx-internal
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod-dns
      external-dns.kubernetes.io/enabled: "true"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3601"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3601"
      # fix timeouts uploading big files disabling proxy buffering
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      # https://min.io/docs/minio/linux/integrations/setup-nginx-proxy-with-minio.html
      nginx.ingress.kubernetes.io/server-snippet: |
        ignore_invalid_headers off;
      nginx.ingress.kubernetes.io/configuration-snippet: |
        chunked_transfer_encoding off;
    hosts:
      - &host s3.internal.grigri.cloud
    tls:
      - hosts:
          - *host
        secretName: s3-tls-certificate

  consoleIngress:
    enabled: true
    ingressClassName: nginx-internal
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod-dns
      external-dns.kubernetes.io/enabled: "true"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        chunked_transfer_encoding off;
    hosts:
      - &hostMC mc-s3.internal.grigri.cloud
    tls:
      - hosts:
          - *hostMC
        secretName: mc-s3-tls-certificate

  resources:
    requests:
      memory: 320Mi

  policies:
    - name: kaniopBackupPolicy
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::kaniop/*'
          actions:
            - "s3:AbortMultipartUpload"
            - "s3:GetObject"
            - "s3:DeleteObject"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
        - resources:
            - 'arn:aws:s3:::kaniop'
          actions:
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketMultipartUploads"
    # sccache CI: read-write access to the sccache bucket only.
    # No access to velero, kaniop or any other bucket. No admin actions.
    # sccache 0.19.0 client only needs GetObject/PutObject for cache operations.
    - name: sccacheCiPolicy
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::sccache/*'
          actions:
            - "s3:AbortMultipartUpload"
            - "s3:GetObject"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
        - effect: Allow
          resources:
            - 'arn:aws:s3:::sccache'
          actions:
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketMultipartUploads"
    # sccache desktop: read-only access to the sccache bucket only.
    # No write, delete, admin or backup-bucket access.
    - name: sccacheDesktopPolicy
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::sccache/*'
          actions:
            - "s3:GetObject"
        - effect: Allow
          resources:
            - 'arn:aws:s3:::sccache'
          actions:
            - "s3:GetBucketLocation"
            - "s3:ListBucket"

  users:
    - accessKey: velero
      existingSecret: minio-users
      existingSecretKey: veleroPassword
      policy: readwrite
    - accessKey: kaniop
      existingSecret: minio-users
      existingSecretKey: kaniopPassword
      policy: kaniopBackupPolicy
    # sccache CI: read-write access to sccache bucket for cache publication
    - accessKey: sccache-ci
      existingSecret: minio-users
      existingSecretKey: sccacheCiPassword
      policy: sccacheCiPolicy
    # sccache desktop: read-only access to sccache bucket for cache consumption
    - accessKey: sccache-desktop
      existingSecret: minio-users
      existingSecretKey: sccacheDesktopPassword
      policy: sccacheDesktopPolicy
    ## Username, password and policy to be assigned to the user
    ## Default policies are [readonly|readwrite|writeonly|consoleAdmin|diagnostics]
    ## Add new policies as explained here https://min.io/docs/minio/kubernetes/upstream/administration/identity-access-management.html#access-management
    ## NOTE: this will fail if LDAP is enabled in your MinIO deployment
    ## make sure to disable this if you are using LDAP.
    #- accessKey: console
    #  secretKey: console123
    #  policy: consoleAdmin
    # Or you can refer to specific secret
    #- accessKey: externalSecret
    #  existingSecret: my-secret
    #  existingSecretKey: password
    #  policy: readonly

  buckets:
    - name: velero
      # Policy to be set on the
      # bucket [none|download|upload|public]
      policy: none
      # Purge if bucket exists already
      purge: false
      versioning: false
      objectlocking: false
    - name: kaniop
      policy: none
      purge: false
      versioning: false
      objectlocking: false
    # sccache shared cache bucket: 14-day object expiry, no versioning or locking.
    # Lifecycle rule is applied via customCommands (mc ilm rule add --id) after bucket creation.
    # Capacity: no hard quota enforced; 14-day expiry bounds growth. Monitor via MinIO metrics.
    # Pool: 4 TB ZFS with ~2.6 TB free; sccache is disposable cache, not backup-critical.
    - name: sccache
      policy: none
      purge: false
      versioning: false
      objectlocking: false
    #   # Name of the bucket
    # - name: bucket1
    #   # Policy to be set on the
    #   # bucket [none|download|upload|public]
    #   policy: none
    #   # Purge if bucket exists already
    #   purge: false
    #   # set versioning for
    #   # bucket [true|false]
    #   versioning: false # remove this key if you do not want versioning feature
    #   # set objectlocking for
    #   # bucket [true|false] NOTE: versioning is enabled by default if you use locking
    #   objectlocking: false
    # - name: bucket2
    #   policy: none
    #   purge: false
    #   versioning: true
    #   # set objectlocking for
    #   # bucket [true|false] NOTE: versioning is enabled by default if you use locking
    #   objectlocking: false

  # Lifecycle rule for sccache bucket: 14-day object expiry.
  # Uses --id for idempotency: re-running the hook updates the rule instead of creating duplicates.
  # Note: bucket creation and custom commands run in parallel containers in the post-install Job.
  # If the bucket doesn't exist yet when this runs, the Job fails and the next ArgoCD sync retries.
  customCommands:
    - command: "ilm rule add --id sccache-expiry --expiry-days 14 myminio/sccache"

  environment:
    MINIO_IDENTITY_OPENID_ROLE_POLICY: consoleAdmin
  ## OpenID Identity Management
  ## The following section documents environment variables for enabling external identity management using an OpenID Connect (OIDC)-compatible provider.
  ## See https://min.io/docs/minio/linux/operations/external-iam/configure-openid-external-identity-management.html for a tutorial on using these variables.
  oidc:
    enabled: true
    configUrl: https://idm.grigri.cloud/oauth2/openid/minio/.well-known/openid-configuration
    existingClientSecretName: minio-kanidm-oauth2-credentials
    existingClientIdKey: CLIENT_ID
    existingClientSecretKey: CLIENT_SECRET
    scopes: openid,profile,email
    redirectUri: https://mc-s3.internal.grigri.cloud/oauth_callback
    displayName: idm.grigri.cloud

  metrics:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
